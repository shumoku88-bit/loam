<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOAM</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOAM GUI · read-only experiment</p>
        <h1 id="month-title">Household desk</h1>
      </div>
      <div class="month-controls" aria-label="Month navigation">
        <button id="previous-month" type="button" aria-label="Previous month">‹</button>
        <button id="today-month" type="button">今月</button>
        <button id="next-month" type="button" aria-label="Next month">›</button>
      </div>
    </header>

    <section class="sourcebar">
      <label for="data-dir">Household data</label>
      <input id="data-dir" type="text" placeholder="LOAM_DATA_DIR / ../loam-data" />
      <button id="reload" type="button">読み直す</button>
      <span id="status" role="status">起動中…</span>
    </section>

    <section id="workspace" class="workspace">
      <aside class="calendar-pane">
        <div class="pane-heading">
          <strong>Calendar</strong>
          <span id="month-count"></span>
        </div>
        <div class="weekday-row" aria-hidden="true">
          <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
        </div>
        <div id="calendar" class="calendar-grid"></div>
      </aside>

      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical"
           aria-label="Resize calendar and Actual panes"></div>

      <section class="ledger-pane">
        <div class="pane-heading">
          <strong>Actual</strong>
          <span>月間の現在レコード</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>内容</th>
                <th>移動</th>
                <th class="amount-column">数量</th>
              </tr>
            </thead>
            <tbody id="actual-body"></tbody>
          </table>
          <div id="empty" class="empty" hidden>この月のCurrent Actualはありません。</div>
        </div>
      </section>
    </section>

    <section class="selected-pane">
      <div class="pane-heading">
        <strong>Selected evidence</strong>
        <span id="selected-date">行を選択してください</span>
      </div>
      <div id="selected-detail" class="selected-detail">
        <p class="muted">Calendarの日付かActualの行をクリックすると、ここに根拠が残ります。</p>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
