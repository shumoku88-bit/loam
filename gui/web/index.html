<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>LOAM — 家計の作業机</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><div><strong>LOAM</strong><span>家計の作業机</span></div></div>
      <div class="month-controls" aria-label="表示する月">
        <button id="previous-month" type="button" aria-label="前の月（Alt＋左矢印）">‹</button>
        <h1 id="month-title"></h1>
        <button id="next-month" type="button" aria-label="次の月（Alt＋右矢印）">›</button>
        <button id="today-month" type="button" class="quiet-button">今月</button>
      </div>
      <div class="topbar-actions">
        <span class="readonly-badge">閲覧専用</span>
        <button id="open-commands" type="button" title="操作を探す（⌘K / Ctrl+K）">操作 <kbd>⌘K</kbd></button>
        <details class="data-source">
          <summary id="data-toggle">データ</summary>
          <div class="data-source-popover">
            <label for="data-dir">家計データの場所</label>
            <input id="data-dir" type="text" placeholder="LOAM_DATA_DIR / ../loam-data" spellcheck="false" />
            <p class="muted">既存の Loam から読み取ります。ここから記録は変更しません。</p>
            <button id="reload" type="button">読み直す</button>
          </div>
        </details>
      </div>
    </header>

    <div id="load-notice" class="load-notice" role="alert" hidden></div>

    <section id="workspace" class="workspace calendar-open" aria-label="記録の作業机">
      <aside id="calendar-pane" class="calendar-pane" aria-label="日付を選ぶ">
        <div class="pane-heading"><strong id="calendar-title">カレンダー</strong><button id="close-calendar" type="button" class="icon-button" aria-label="カレンダーを閉じる">×</button></div>
        <div class="weekday-row" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
        <div id="calendar" class="calendar-grid" role="group" aria-labelledby="calendar-title" aria-describedby="calendar-help"></div>
        <p id="calendar-help" class="calendar-help">←→ 前後の日 · ↑↓ 前後の週<br />Enter 日付を選択 · Esc 戻る</p>
        <div class="calendar-caption"><span class="record-dot" aria-hidden="true"></span>記録のある日</div>
        <div class="day-context"><span>選択した日</span><strong id="selected-day"></strong><span id="selected-day-count"></span></div>
        <p class="sidebar-note">日付を選んでも月の一覧は残ります。「選択日」でその日だけを表示できます。</p>
      </aside>

      <section class="ledger-pane" aria-label="現在の記録の一覧">
        <div class="pane-heading">
          <div class="heading-group"><button id="toggle-calendar" type="button" class="quiet-button" aria-controls="calendar-pane" aria-expanded="true">日付</button><strong>記録</strong><span id="month-count"></span></div>
          <label class="density-control">表示 <select id="density" aria-label="行の表示密度"><option value="compact">コンパクト</option><option value="comfortable">ゆったり</option></select></label>
        </div>
        <div class="ledger-toolbar">
          <label class="search-field"><span class="sr-only">記録を検索</span><input id="search" type="search" placeholder="内容・場所・ID を検索　/" autocomplete="off" /><kbd>/</kbd></label>
          <div class="filter-row">
            <div class="scope-switch" role="group" aria-label="記録の表示範囲"><button id="scope-month" type="button" aria-pressed="true">月全体</button><button id="scope-day" type="button" aria-pressed="false">選択日</button></div>
            <label class="locus-control"><span class="sr-only">移動に含む場所で絞り込む</span><select id="locus-filter"><option value="">すべての場所</option></select></label>
            <select id="sort-order" aria-label="日付の並び順"><option value="asc">古い順</option><option value="desc">新しい順</option></select>
            <button id="clear-filters" class="quiet-button" type="button">解除</button>
          </div>
        </div>
        <div id="table-wrap" class="table-wrap" tabindex="-1" aria-label="記録の一覧" aria-busy="true">
          <table aria-label="月の現在の記録">
            <thead><tr><th scope="col">日付</th><th scope="col">内容</th><th scope="col">移動・内訳</th><th scope="col" class="amount-column">数量（quanta）</th></tr></thead>
            <tbody id="actual-body"></tbody>
          </table>
          <div id="empty" class="empty"></div>
        </div>
        <div class="ledger-foot"><span id="visible-count"></span><span>選択すると根拠を表示</span></div>
      </section>

      <div id="splitter" class="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="一覧と詳細の幅を変更" aria-valuemin="280" aria-valuemax="620" aria-valuenow="360"></div>

      <aside class="inspector-pane" aria-label="選択した記録の詳細">
        <div class="pane-heading"><strong>記録の根拠</strong><span id="selected-date"></span></div>
        <div class="inspector-tabs" role="tablist" aria-label="根拠の表示">
          <button id="tab-evidence" type="button" role="tab" aria-selected="true" aria-controls="evidence-panel">詳細</button>
          <button id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">訂正前後 <span id="history-count"></span></button>
        </div>
        <div class="inspector-scroll">
          <section id="evidence-panel" role="tabpanel" aria-labelledby="tab-evidence" tabindex="0"><div id="selected-detail" class="selected-detail"></div></section>
          <section id="history-panel" role="tabpanel" aria-labelledby="tab-history" tabindex="0" hidden><div id="history-detail" class="history-detail"></div></section>
        </div>
      </aside>
    </section>

    <footer class="statusbar"><span id="status" role="status">起動中…</span><span class="keyboard-hint">Tab 移動 · ↑↓ 記録 · / 検索 · Alt＋←→ 月移動 · ⌘K 操作</span></footer>
  </main>

  <dialog id="commands" aria-labelledby="commands-title">
    <div class="command-heading"><h2 id="commands-title">操作を探す</h2><button id="close-commands" type="button" class="icon-button" aria-label="操作一覧を閉じる">×</button></div>
    <label><span class="sr-only">操作名で絞り込む</span><input id="command-query" type="search" placeholder="検索、今月、カレンダー…" autocomplete="off" /></label>
    <div id="command-list" class="command-list"></div>
    <p class="muted">↑↓ 選択 · Enter 実行 · Esc 閉じる</p>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
