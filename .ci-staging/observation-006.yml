name: Observation 006

on:
  pull_request:
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minikanren:
    name: miniKanren summary search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable

      - name: Install miniKanren
        shell: bash
        run: |
          set -euo pipefail
          raco pkg install --auto --skip-installed minikanren
          raco pkg show minikanren

      - name: Search vocabulary-preserving summaries
        shell: bash
        run: |
          set -euo pipefail
          racket scheme/006_summary_search.rkt 2>&1 | tee /tmp/observation-006.txt
          grep -Fq 'OBSERVATION_006_OK' /tmp/observation-006.txt
