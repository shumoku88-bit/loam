name: Observation 016

on:
  pull_request:
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy commitment vocabulary quotient
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Execute Alloy observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            model/016_commitment_vocabulary_quotient.als
          find /tmp/alloy-output -maxdepth 2 -type f -print -exec sed -n '1,180p' {} \;

      - name: Require expected witnesses and checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected = {
              'sameTotalDifferentPurposeProfile': True,
              'samePurposeProfileDifferentIdentity': True,
              'TotalCountDeterminesTotalMovable': False,
              'TotalCountDeterminesPurposeAnonymousPermission': True,
              'PurposeProfileDeterminesPurposeAnonymousPermission': False,
              'PurposeProfileDeterminesNamedPermission': True,
              'MembershipDeterminesNamedPermission': False,
              'NamedPermissionDeterminesMembership': False,
          }

          wrong = []
          for name, want_sat in expected.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label))

          if wrong:
              raise SystemExit(f'unexpected Alloy results: {wrong}')
          PY

  j:
    name: J quotient geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install J
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/j-linux64.tar.gz \
            https://github.com/jsoftware/jinstall/releases/download/build/linux64.tar.gz
          mkdir -p /tmp/j
          tar -xzf /tmp/j-linux64.tar.gz -C /tmp/j
          JCONSOLE="$(find /tmp/j -type f -name jconsole -print -quit)"
          test -n "$JCONSOLE"
          chmod +x "$JCONSOLE"
          printf 'JCONSOLE=%s\n' "$JCONSOLE" >> "$GITHUB_ENV"

      - name: Execute J observation
        shell: bash
        run: |
          set -euo pipefail
          "$JCONSOLE" j/016_check.ijs | tee /tmp/j-observation.txt
          grep -Fq 'Observation 016 / J vocabulary quotient' /tmp/j-observation.txt
          grep -Fq 'total-count classes:' /tmp/j-observation.txt
          grep -Fq 'purpose-count classes:' /tmp/j-observation.txt
          grep -Fq 'identity classes:' /tmp/j-observation.txt
