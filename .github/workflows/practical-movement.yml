name: Practical Movement

on:
  pull_request:
    paths:
      - 'Loam/ActualDate.lean'
      - 'Loam/ActualValidityPersistence.lean'
      - 'Loam/PrimaryCli.lean'
      - 'Loam/ReviewCli.lean'
      - 'Loam/CompletionPrompt.lean'
      - 'Loam/MovementEntry.lean'
      - 'Loam/MovementCli.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'Loam/Core/**'
      - 'tools/loam'
      - 'tools/loam-movement'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-movement.yml'
  push:
    paths:
      - 'Loam/ActualDate.lean'
      - 'Loam/ActualValidityPersistence.lean'
      - 'Loam/PrimaryCli.lean'
      - 'Loam/ReviewCli.lean'
      - 'Loam/CompletionPrompt.lean'
      - 'Loam/MovementEntry.lean'
      - 'Loam/MovementCli.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'Loam/Core/**'
      - 'tools/loam'
      - 'tools/loam-movement'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-movement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-movement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  movement:
    name: Build and test balanced movement entrance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build movement entrance
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamMovement
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Record and review backdated split payment
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"
          validity="$memory.actual-validity"

          printf 'paypay\n800\npaypay-points\n200\n\ngroceries\n1000\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-09-02 ./tools/loam-movement "$memory" >/tmp/loam-movement.out
          grep -Fq 'Recorded movement: 1000 jpy. Date: 2026-09-02.' /tmp/loam-movement.out

          expected=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\tpaypay\tjpy\t-800\nEFFECT\teffect-2\tpaypay-points\tjpy\t-200\nEFFECT\teffect-3\tgroceries\tjpy\t1000'
          test "$(cat "$memory")" = "$expected"

          expected_validity=$'LOAM-ACTUAL-VALIDITY-MEMORY\t1\nVALIDITY\trecord-1\t2026-09-02'
          test "$(cat "$validity")" = "$expected_validity"

          ./tools/loam review "$memory" >/tmp/loam-review.out
          grep -Fq '2026-09-02  [record-1]' /tmp/loam-review.out
          grep -Fq 'paypay: -800 jpy' /tmp/loam-review.out
          grep -Fq 'groceries: 1000 jpy' /tmp/loam-review.out

      - name: Scripted primary menu defaults to host-local today
        shell: bash
        run: |
          data_dir="$(mktemp -d)"
          today="$(date +%Y-%m-%d)"

          printf '1\npaypay\n800\npaypay-points\n200\n\ngroceries\n1000\n\nq\n' \
            | LOAM_DATA_DIR="$data_dir" ./tools/loam >/tmp/loam-menu.out
          grep -Fq '1. Record movement' /tmp/loam-menu.out
          grep -Fq "Recorded movement: 1000 jpy. Date: $today." /tmp/loam-menu.out

          expected=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\tpaypay\tjpy\t-800\nEFFECT\teffect-2\tpaypay-points\tjpy\t-200\nEFFECT\teffect-3\tgroceries\tjpy\t1000'
          test "$(cat "$data_dir/memory.loam")" = "$expected"

          expected_validity="$(printf 'LOAM-ACTUAL-VALIDITY-MEMORY\t1\nVALIDITY\trecord-1\t%s' "$today")"
          test "$(cat "$data_dir/memory.loam.actual-validity")" = "$expected_validity"

      - name: Older undated records remain visible without guessed dates
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"
          printf 'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\twallet\tjpy\t-1\n' >"$memory"

          ./tools/loam review "$memory" >/tmp/loam-undated-review.out
          grep -Fq 'date unknown  [record-1]' /tmp/loam-undated-review.out

      - name: Refuse invalid scripted calendar date without publication
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"

          if printf 'paypay\n1\n\ncoffee\n1\n\n' \
              | LOAM_OCCURRENCE_DATE=2026-02-29 ./tools/loam-movement "$memory" \
                >/tmp/loam-date.out 2>/tmp/loam-date.err; then
            echo 'expected invalid occurrence date to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'date must be a real calendar date in YYYY-MM-DD form' /tmp/loam-date.err
          test ! -e "$memory"
          test ! -e "$memory.actual-validity"

      - name: Refuse unequal movement without publication
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"

          if printf 'paypay\n800\n\ngroceries\n799\n\n' \
              | LOAM_OCCURRENCE_DATE=2026-09-02 ./tools/loam-movement "$memory" \
                >/tmp/loam-movement.out 2>/tmp/loam-movement.err; then
            echo 'expected unequal movement totals to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'movement totals differ: from 800 jpy, to 799 jpy' /tmp/loam-movement.err
          test ! -e "$memory"
          test ! -e "$memory.actual-validity"

      - name: Avoid repeated cached primary builds
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"
          printf 'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\twallet\tjpy\t-1\n' >"$memory"

          rm -f .lake/build/.loam-wrapper-build-stamp
          ./tools/loam summary "$memory" >/tmp/loam-summary-initial.out 2>/tmp/loam-summary-initial.err
          grep -Fq 'Building LOAM...' /tmp/loam-summary-initial.err

          touch Loam/MovementCli.lean
          ./tools/loam summary "$memory" >/tmp/loam-summary-refresh.out 2>/tmp/loam-summary-refresh.err
          grep -Fq 'Building LOAM...' /tmp/loam-summary-refresh.err

          ./tools/loam summary "$memory" >/tmp/loam-summary-repeat.out 2>/tmp/loam-summary-repeat.err
          if grep -Fq 'Building LOAM...' /tmp/loam-summary-repeat.err; then
            echo 'expected successful cached build to refresh wrapper stamp' >&2
            exit 1
          fi
