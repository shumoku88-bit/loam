name: Shared ActualValidity Publisher

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Publisher/ActualValidityPublisher.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Publisher/CorrectionPublisher.lean'
      - 'Loam/Review/ActualReview.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Core/MovementOperationEvidence.lean'
      - 'Loam/Core/ExchangeEvidence.lean'
      - 'Loam/Application/ExchangeEvidenceFrontier.lean'
      - 'Loam/Core/OriginalAmountEvidence.lean'
      - 'Loam/Application/OriginalAmountFrontier.lean'
      - 'Loam/Tests/NormalizedActualPersistenceTest.lean'
      - 'Loam/Tests/MovementOperationEvidence.lean'
      - 'Loam/Cli/EffectiveCli.lean'
      - 'Loam/Tests/ActualAuthorityDetailed.lean'
      - 'Loam/Tests/HouseholdActualAuthority.lean'
      - 'Loam/Tests/ActualValidityPublisher.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/actual-validity-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Publisher/ActualValidityPublisher.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Publisher/CorrectionPublisher.lean'
      - 'Loam/Review/ActualReview.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Core/MovementOperationEvidence.lean'
      - 'Loam/Core/ExchangeEvidence.lean'
      - 'Loam/Application/ExchangeEvidenceFrontier.lean'
      - 'Loam/Core/OriginalAmountEvidence.lean'
      - 'Loam/Application/OriginalAmountFrontier.lean'
      - 'Loam/Tests/NormalizedActualPersistenceTest.lean'
      - 'Loam/Tests/MovementOperationEvidence.lean'
      - 'Loam/Cli/EffectiveCli.lean'
      - 'Loam/Tests/ActualAuthorityDetailed.lean'
      - 'Loam/Tests/HouseholdActualAuthority.lean'
      - 'Loam/Tests/ActualValidityPublisher.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/actual-validity-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Build and test Actual-backed date publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean and build shared publisher test dependencies
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Publisher.ActualValidityPublisher Loam.Review.ActualReview Loam.Publisher.CorrectionPublisher Loam.Publisher.MovementPublisher Loam.Tests.ActualWorldFixture Loam.Tests.ActualAuthorityDetailed Loam.Tests.HouseholdActualAuthority
      - name: Run Actual validity package test group
        run: lake test -- actual-validity
      - name: Qualify Household Actual authority adapter
        run: lake env lean --run Loam/Tests/HouseholdActualAuthority.lean
