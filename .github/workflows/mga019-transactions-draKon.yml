name: MGA019 Transactions Flow DRAKON

on:
  push:
    branches:
      - audit/mga-019-transactions-flow
    paths:
      - .github/workflows/mga019-transactions-draKon.yml
      - docs/drakon/build_tui_transactions_flow_granularity_audit_map.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-019-transactions-flow
          fetch-depth: 0

      - name: Build and validate MGA-019 Transactions Flow map
        run: |
          python3 docs/drakon/build_tui_transactions_flow_granularity_audit_map.py
          test -s docs/drakon/loam-tui-transactions-flow-granularity-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = 'docs/drakon/loam-tui-transactions-flow-granularity-audit.drn'
          with sqlite3.connect(path) as db:
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
              assert db.execute('select count(*) from diagrams').fetchone()[0] == 3
              assert db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0] == 3
              assert db.execute("select count(*) from diagrams where name='MGA.019.2 Candidate TransactionsFlowPane Seam'").fetchone()[0] == 1
              assert db.execute("select count(*) from diagrams where name='MGA.019.3 Qualification Obligation DAG'").fetchone()[0] == 1
          PY

      - name: Commit artifact and retire one-shot workflow
        run: |
          rm .github/workflows/mga019-transactions-draKon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/drakon/loam-tui-transactions-flow-granularity-audit.drn .github/workflows/mga019-transactions-draKon.yml
          git commit -m 'docs(drakon): sync MGA-019 Transactions Flow artifact'
          git push
