name: One-shot household command TUI watch

on:
  push:
    branches:
      - refactor/household-command-boundary
    paths:
      - '.github/workflows/add-household-command-tui-watch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/household-command-boundary
      - name: Add HouseholdCommand to TUI path qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tui.yml')
          text = path.read_text()
          old = "      - 'Loam/Cli/ReviewCli.lean'\n"
          new = old + "      - 'Loam/HouseholdCommand.lean'\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 ReviewCli path entries, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit CI watch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tui.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ci(tui): watch household command boundary'
          git push origin HEAD:refactor/household-command-boundary
