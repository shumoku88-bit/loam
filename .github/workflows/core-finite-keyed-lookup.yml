name: Core finite keyed lookup

on:
  pull_request:
    paths:
      - 'Loam/Core/FiniteKeyed.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/CapacityEffective.lean'
      - 'Loam/Core/ScheduledMemory.lean'
      - 'Loam/Core/CapacityMemory.lean'
      - 'Loam/Core/AttentionMemory.lean'
      - '.github/workflows/core-finite-keyed-lookup.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  finite-keyed-lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check finite keyed extraction
        shell: bash
        run: |
          set +e
          : > /tmp/core-finite-keyed.log
          status=0
          for file in \
            Loam/Core/FiniteKeyed.lean \
            Loam/Core/EventMemory.lean \
            Loam/Core/ActualValidity.lean \
            Loam/Core/CapacityEffective.lean \
            Loam/Core/ScheduledMemory.lean \
            Loam/Core/CapacityMemory.lean \
            Loam/Core/AttentionMemory.lean
          do
            echo "===== $file =====" | tee -a /tmp/core-finite-keyed.log
            lake env lean "$file" 2>&1 | tee -a /tmp/core-finite-keyed.log
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then status="$current"; fi
          done
          exit "$status"
      - name: Upload finite keyed Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-finite-keyed-log
          path: /tmp/core-finite-keyed.log
