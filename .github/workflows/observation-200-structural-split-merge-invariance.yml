name: Observation 200

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation200.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/200_structural_split_merge_invariance.md'
      - 'LOAM_STRUCTURAL_FALSIFICATION_PROGRESS.md'
      - '.github/workflows/observation-200-structural-split-merge-invariance.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/200-structural-split-merge-invariance'
      - main
    paths:
      - 'Loam/Observations/Observation200.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/200_structural_split_merge_invariance.md'
      - 'LOAM_STRUCTURAL_FALSIFICATION_PROGRESS.md'
      - '.github/workflows/observation-200-structural-split-merge-invariance.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-split-merge-invariance:
    name: Lean structural split / merge invariance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check structural split / merge invariance
        run: lake build Loam.Observations.Observation200
