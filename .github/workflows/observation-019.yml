name: Observation 019

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tla:
    name: TLA+ append-only provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check append-only history projection
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/AppendOnlyProvenance.cfg \
            tla/AppendOnlyProvenance.tla \
            2>&1 | tee /tmp/observation-019-positive.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-019-positive.txt

      - name: Require history beyond current projection
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/AppendOnlyProvenanceBoundary.cfg \
            tla/AppendOnlyProvenance.tla \
            2>&1 | tee /tmp/observation-019-boundary.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'CurrentProjectionDeterminesHistory' /tmp/observation-019-boundary.txt
          grep -Fq 'Invariant' /tmp/observation-019-boundary.txt
