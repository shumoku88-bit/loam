name: Application 036 Household Manifest Cutover Integration

on:
  pull_request:
    paths:
      - 'Loam/MovementAdmission.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli/ReviewCli.lean'
      - 'Loam/Cli/MovementManifestCutoverCli.lean'
      - 'lakefile.lean'
      - '.github/workflows/application-036-household-manifest-cutover-integration.yml'
  push:
    branches:
      - main
      - 'experiment/application-036-household-manifest-cutover-integration'
    paths:
      - 'Loam/MovementAdmission.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli/ReviewCli.lean'
      - 'Loam/Cli/MovementManifestCutoverCli.lean'
      - 'lakefile.lean'
      - '.github/workflows/application-036-household-manifest-cutover-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  household-cutover:
    name: Household Movement cutover rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production entrances
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam loamMovement loamMovementManifestCutover
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Rehearse sidecar to manifest authority cutover
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          corrections="$tmp/corrections.loam"
          manifest="$tmp/movement-manifest"
          frozen="$tmp/frozen-sidecars"

          printf 'paypay\n180\n\ncoffee\n180\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-09-05 \
              LOAM_DESCRIPTION='application 036 baseline' \
              .lake/build/bin/loamMovement "$memory" \
              >"$tmp/sidecar-movement.out"

          test -e "$memory"
          test -e "$memory.actual-validity"
          test -e "$memory.descriptions"
          test ! -e "$memory.relations"
          test ! -e "$memory.discharges"

          sha256sum \
            "$memory" \
            "$memory.actual-validity" \
            "$memory.descriptions" \
            >"$tmp/sidecars.before"

          .lake/build/bin/loam review "$memory" "$corrections" '/application 036 baseline' \
            >"$tmp/review.sidecar"

          .lake/build/bin/loamMovementManifestCutover prepare "$memory" "$manifest" \
            >"$tmp/prepare.out"
          grep -Fxq 'stored_exact_families=3' "$tmp/prepare.out"
          grep -Fxq 'absent_empty_families=2' "$tmp/prepare.out"
          grep -Fxq 'selected_authority_changed=0' "$tmp/prepare.out"
          test -e "$manifest/PREPARED"
          test ! -e "$manifest/CURRENT"

          .lake/build/bin/loamMovementManifestCutover cutover "$memory" "$manifest" \
            >"$tmp/cutover.out"
          grep -Fxq 'stored_exact_families=3' "$tmp/cutover.out"
          grep -Fxq 'absent_empty_families=2' "$tmp/cutover.out"
          grep -Fxq 'selected_generation_matches_source=1' "$tmp/cutover.out"
          grep -Fxq 'frozen_sidecars_unchanged=1' "$tmp/cutover.out"
          grep -Fxq 'authority_switches=1' "$tmp/cutover.out"
          test -e "$manifest/CURRENT"

          sha256sum \
            "$memory" \
            "$memory.actual-validity" \
            "$memory.descriptions" \
            >"$tmp/sidecars.after-cutover"
          cmp "$tmp/sidecars.before" "$tmp/sidecars.after-cutover"

          LOAM_EXPERIMENTAL_MOVEMENT_MANIFEST_ROOT="$manifest" \
            .lake/build/bin/loam review "$memory" "$corrections" '/application 036 baseline' \
            >"$tmp/review.manifest"
          cmp "$tmp/review.sidecar" "$tmp/review.manifest"

          mkdir -p "$frozen"
          mv "$memory" "$frozen/memory.loam"
          mv "$memory.actual-validity" "$frozen/memory.loam.actual-validity"
          mv "$memory.descriptions" "$frozen/memory.loam.descriptions"

          printf 'paypay\n70\n\ntea\n70\n\n' \
            | LOAM_EXPERIMENTAL_MOVEMENT_MANIFEST_ROOT="$manifest" \
              LOAM_OCCURRENCE_DATE=2026-09-05 \
              LOAM_DESCRIPTION='application 036 manifest only' \
              .lake/build/bin/loamMovement "$memory" \
              >"$tmp/manifest-movement.out"

          test ! -e "$memory"
          test ! -e "$memory.actual-validity"
          test ! -e "$memory.descriptions"

          LOAM_EXPERIMENTAL_MOVEMENT_MANIFEST_ROOT="$manifest" \
            .lake/build/bin/loam review "$memory" "$corrections" '/application 036 manifest only' \
            >"$tmp/review.manifest-only"
          grep -Fq 'application 036 manifest only' "$tmp/review.manifest-only"

          sha256sum \
            "$frozen/memory.loam" \
            "$frozen/memory.loam.actual-validity" \
            "$frozen/memory.loam.descriptions" \
            | sed "s#$frozen/memory.loam#$memory#" \
            >"$tmp/sidecars.frozen"
          cmp "$tmp/sidecars.before" "$tmp/sidecars.frozen"

          event_object="$(awk -F '\t' '$1 == "Event" { print $2 }' "$manifest/CURRENT")"
          test -n "$event_object"
          printf 'corrupt-selected-object\n' >>"$manifest/$event_object"

          if LOAM_EXPERIMENTAL_MOVEMENT_MANIFEST_ROOT="$manifest" \
              .lake/build/bin/loam review "$memory" "$corrections" '/application 036 manifest only' \
              >"$tmp/corrupt-review.out" 2>"$tmp/corrupt-review.err"; then
            echo 'corrupt selected generation unexpectedly reviewed successfully' >&2
            exit 1
          fi
          grep -Fq 'failed digest verification' "$tmp/corrupt-review.err"

          echo 'production_kernel_relanded=1'
          echo 'preflight_manifest_only=1'
          echo 'review_manifest_only=1'
          echo 'stored_exact_families=3'
          echo 'absent_empty_families=2'
          echo 'prepare_authority_switches=0'
          echo 'cutover_authority_switches=1'
          echo 'post_cutover_sidecar_writes=0'
          echo 'legacy_fallback_after_corruption=0'
