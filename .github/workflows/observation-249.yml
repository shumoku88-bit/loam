name: Observation 249

on:
  pull_request:
    paths:
      - 'experiments/249_asset_routing_closure_counterexample.lean'
      - 'experiments/249_asset_routing_closure_counterexample.md'
      - '.github/workflows/observation-249.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Falsify Expense-only CurrentCoverage closure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build reused CurrentCoverage boundary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application.CurrentCoverageInspection
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Run Observation 249 witness
        run: lake env lean --run experiments/249_asset_routing_closure_counterexample.lean
