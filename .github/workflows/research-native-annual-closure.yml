name: Research - Native Annual Read Closure

on:
  pull_request:
    paths:
      - 'tools/NativeAnnualReadProbe.lean'
      - 'tools/NativeHouseholdSectionBridge.lean'
      - 'tools/NativeTacklerProjection.lean'
      - 'tools/research-native-annual-section-bridge.py'
      - 'tools/research-native-actual-publication-delta.py'
      - 'tools/research-tackler-git-source-year.py'
      - 'tools/research-source-year-cross-family.py'
      - 'tools/research-annual-single-head-native.py'
      - 'tools/research-annual-admission-day.py'
      - 'tools/research-annual-multiyear-receipts.py'
      - 'tools/research-annual-native-parity.py'
      - 'tools/research-annual-source-view-integration.py'
      - 'tools/NativeAnnualPaceSupportFixture.lean'
      - 'tools/NativeAnnualPaceReadViewProbe.lean'
      - 'tools/NativeAnnualQueryPolicyProbe.lean'
      - 'Loam/Review/AnnualSourceQueryPolicy.lean'
      - 'Loam/Authority/AnnualSourcePublication.lean'
      - 'Loam/Authority/AnnualSourceHeadSandbox.lean'
      - 'Loam/Authority/AnnualSandboxDurabilityBarriers.lean'
      - 'tools/annual-sandbox-sync.py'
      - 'tools/NativeAnnualDurabilityProbe.lean'
      - 'tools/NativeAnnualUnknownOutcomeProbe.lean'
      - 'docs/research/NATIVE_ANNUAL_POST_HEAD_UNKNOWN_2026-10-16.md'
      - 'tools/test-native-annual-durability-barriers.py'
      - 'tools/NativeAnnualSingleHeadSandboxProbe.lean'
      - 'tools/NativeAnnualOrphanRetryProbe.lean'
      - 'tools/NativeAnnualSigkillWriter.lean'
      - 'tools/test-native-annual-sigkill-retry.py'
      - 'tools/NativeAnnualFullPublicationProbe.lean'
      - 'tools/NativeAnnualSourceReadViewProbe.lean'
      - 'Loam/Review/AnnualSourceReadView.lean'
      - 'tools/NativeAnnualMaterializationPreflight.lean'
      - 'Loam/Authority/AnnualSourceMaterialization.lean'
      - 'tools/NativeCrossFamilyYearSource.lean'
      - 'tools/research-tackler-git-calendar-journals.py'
      - 'docs/research/NATIVE_ANNUAL_ACTUAL_SCHEDULED_CLOSURE_2026-10-15.md'
      - 'docs/research/NATIVE_HOUSEHOLD_SECTION_BRIDGE_2026-10-15.md'
      - 'docs/research/NATIVE_ACTUAL_PUBLICATION_DELTA_2026-10-15.md'
      - 'docs/research/TACKLER_SOURCE_YEAR_GIT_REPLAY_2026-10-15.md'
      - 'docs/research/CROSS_FAMILY_SOURCE_YEAR_PUBLICATION_2026-10-15.md'
      - 'docs/research/ANNUAL_SOURCE_PUBLISHER_GIT_COORDINATION_2026-10-15.md'
      - 'docs/research/TACKLER_GIT_CALENDAR_JOURNALS_2026-10-15.md'
      - '.github/workflows/research-native-annual-closure.yml'

permissions:
  contents: read

jobs:
  native-source-closure:
    name: Actual and Scheduled native dependency closure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build real fixture and Actual publisher imports
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Authority.AnnualSandboxDurabilityBarriers Loam.Authority.AnnualSourceHeadSandbox Loam.Authority.AnnualSourcePublication Loam.Review.AnnualSourceQueryPolicy Loam.Review.CycleSpendingPaceReview Loam.Review.CurrentBalanceReview Loam.Review.AnnualSourceReadView Loam.Authority.AnnualSourceMaterialization Loam.Tests.ScheduledBatchReplacement Loam.Publisher.MovementPublisher Loam.Publisher.CorrectionPublisher Loam.Publisher.ActualValidityPublisher Loam.Review.ActualReview Loam.Review.ActualJournalProjection Loam.Review.ScheduledReview Loam.Tests.Support
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false
      - name: Make disposable qualified real Actual and Scheduled source
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/native-annual"
          echo "NATIVE_ANNUAL_ROOT=$root" >> "$GITHUB_ENV"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$root"
      - name: Verify real correction / completion dependency closure
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run tools/NativeAnnualReadProbe.lean "$NATIVE_ANNUAL_ROOT"
      - name: Verify native HouseholdImage COW sections against admitted snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-native-annual-section-bridge.py --check
      - name: Verify real normalized Actual TX publication deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-native-actual-publication-delta.py --check
      - name: Verify native Tackler-shaped calendar-year journal Git revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-tackler-git-calendar-journals.py --check
      - name: Verify Git-pinned January source journal and native re-admission
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-tackler-git-source-year.py --check
      - name: Verify atomic Actual and Scheduled source in Jan-1 Git journals
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-source-year-cross-family.py --check
      - name: Verify single-head native cross-family replay at process-kill boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-annual-single-head-native.py --check
      - name: Verify controlled Jan-1 admission-day receipt and fail-closed cases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-annual-admission-day.py --check
      - name: Verify repeatable 2027 and 2028 native publication receipt chain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-annual-multiyear-receipts.py --check
      - name: Verify candidate parity against native installed HouseholdImage without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-annual-native-parity.py --check
      - name: Verify real year-source HEAD replay via native Actual and Scheduled view
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research-annual-source-view-integration.py --check
      - name: Verify native all-family full source publication objects in disposable years
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/annual-native-source"
          out="$(mktemp -d)/annual-native-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$root"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$root" "$out"
          lake env lean --run tools/NativeAnnualFullPublicationProbe.lean \
            "$out/before.household.loam" "$out/after.household.loam"
      - name: Verify one native selected HEAD over 2027 and 2028
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/annual-native-head"
          out="$(mktemp -d)/annual-native-head-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$root"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$root" "$out"
          lake env lean --run tools/NativeAnnualSingleHeadSandboxProbe.lean \
            "$out/before.household.loam" "$out/after.household.loam"
      - name: Verify interrupted native object resumes only on byte-exact retry
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-orphan"
          out="$(mktemp -d)/native-annual-images"
          annual="$(mktemp -d)/isolated-single-head"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          lake env lean --run tools/NativeAnnualOrphanRetryProbe.lean seed \
            "$annual" "$out/before.household.loam" "$out/after.household.loam"
          lake env lean --run tools/NativeAnnualOrphanRetryProbe.lean retry \
            "$annual" "$out/before.household.loam" "$out/after.household.loam"
      - name: Prove Linux SIGKILL after native source installation before HEAD
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-real-sigkill"
          out="$(mktemp -d)/native-real-sigkill-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          python3 tools/test-native-annual-sigkill-retry.py \
            --before "$out/before.household.loam" --after "$out/after.household.loam"

      - name: Verify post-HEAD fsync uncertainty without duplicate native operation
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-unknown-fixture"
          out="$(mktemp -d)/native-annual-unknown-images"
          annual="$(mktemp -d)/native-annual-unknown-root"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          lake env lean --run tools/NativeAnnualUnknownOutcomeProbe.lean \
            "$annual" "$out/before.household.loam" "$out/after.household.loam"
      - name: Verify native 2026-2028 selected HEAD Linux fsync barriers
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-barrier-fixture"
          out="$(mktemp -d)/native-annual-barrier-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          python3 tools/test-native-annual-durability-barriers.py \
            --before "$out/before.household.loam" \
            --after "$out/after.household.loam"
