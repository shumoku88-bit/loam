name: Observation 151

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation151.lean'
      - 'Loam/Observations.lean'
      - 'experiments/151_unified_actual_wire_shape.md'
      - '.github/workflows/observation-151-unified-actual-wire-shape.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/151-unified-actual-wire-shape'
      - main
    paths:
      - 'Loam/Observations/Observation151.lean'
      - 'Loam/Observations.lean'
      - 'experiments/151_unified_actual_wire_shape.md'
      - '.github/workflows/observation-151-unified-actual-wire-shape.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-shape:
    name: Lean unified Actual wire shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check unified Actual wire shape
        run: lake build Loam.Observations.Observation151
