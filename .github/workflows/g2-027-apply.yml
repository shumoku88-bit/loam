name: G2-027 narrow apply

on:
  push:
    branches:
      - audit/g2-027-undated-count-derivation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/g2-027-undated-count-derivation
          fetch-depth: 0

      - name: Remove retained undated-count constructor state
        shell: python
        run: |
          from pathlib import Path

          changed = []
          for path in Path("Loam").rglob("*.lean"):
              text = path.read_text()
              lines = text.splitlines(keepends=True)
              out = []
              touched = False
              for line in lines:
                  if "undatedCount :=" not in line:
                      out.append(line)
                      continue
                  touched = True
                  if line.rstrip().endswith("}"):
                      if not out:
                          raise SystemExit(f"cannot preserve closing brace in {path}")
                      newline = "\n" if out[-1].endswith("\n") else ""
                      out[-1] = out[-1].rstrip("\n") + " }" + newline
              if touched:
                  path.write_text("".join(out))
                  changed.append(str(path))

          expected = {
              "Loam/Tui/Cli.lean",
              "Loam/Tests/TuiActual.lean",
              "Loam/Tests/TuiSelectedDay.lean",
              "Loam/Tests/TuiHraScheduled.lean",
              "Loam/Tests/TuiHelpFooter.lean",
              "Loam/Tests/TuiScheduled.lean",
              "Loam/Tests/TuiScheduledCreate.lean",
              "Loam/Tests/TuiScheduledTerminal.lean",
          }
          if set(changed) != expected:
              raise SystemExit(f"unexpected G2-027 constructor set: {changed}")

      - name: Add focused undated derivation regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("Loam/Tests/TuiActual.lean")
          text = path.read_text()
          anchor = "def main : IO Unit := do\n  let snapshot ← hraSnapshot\n"
          insertion = '''def main : IO Unit := do
            let snapshot ← hraSnapshot
            let currentUndated := { testRecord 90 with date := none }
            let supersededUndated :=
              { testRecord 91 with date := none, replacement := some ⟨"event-92"⟩ }
            let undatedActual : Loam.Tui.Main.ActualSnapshot := {
              today := "2026-09-07"
              allRecords := [currentUndated, supersededUndated]
            }
            expect (undatedActual.undatedCount == 1)
              "Actual snapshot undated count did not derive current-only records"
            let undatedSnapshot : Loam.Tui.Main.Snapshot := {
              actual := undatedActual
              scheduled := snapshot.scheduled
            }
            let undatedHome := widgetText
              (Loam.Tui.Main.homeView undatedSnapshot (Loam.Tui.Main.initialState "2026-09-07"))
            expect (contains "Undated current Actual: 1" undatedHome)
              "legacy Home did not derive its undated Actual count from retained records"
          '''
          insertion = "\n".join(line[10:] if line.startswith("          ") else line for line in insertion.splitlines()) + "\n"
          if anchor not in text:
              raise SystemExit("TuiActual main anchor not found")
          if "Actual snapshot undated count did not derive current-only records" in text:
              raise SystemExit("G2-027 regression already present")
          path.write_text(text.replace(anchor, insertion, 1))

      - name: Guard scope
        run: |
          if grep -R --line-number --include='*.lean' 'undatedCount :=' Loam; then
            echo 'retained undatedCount constructor state remains' >&2
            exit 1
          fi
          git diff --check
          git diff -- Loam/Tui/Main.lean Loam/Tui/Cli.lean Loam/Tests/TuiActual.lean \
            Loam/Tests/TuiSelectedDay.lean Loam/Tests/TuiHraScheduled.lean \
            Loam/Tests/TuiHelpFooter.lean Loam/Tests/TuiScheduled.lean \
            Loam/Tests/TuiScheduledCreate.lean Loam/Tests/TuiScheduledTerminal.lean

      - name: Commit narrow migration and remove helper workflow
        run: |
          rm .github/workflows/g2-027-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam .github/workflows/g2-027-apply.yml
          git commit -m 'refactor(tui): remove retained G2-027 undated count'
          git push origin HEAD:audit/g2-027-undated-count-derivation
