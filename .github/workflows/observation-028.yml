name: Observation 028

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  j:
    name: J future vocabulary refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install J
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/j-linux64.tar.gz \
            https://github.com/jsoftware/jinstall/releases/download/build/linux64.tar.gz
          mkdir -p /tmp/j
          tar -xzf /tmp/j-linux64.tar.gz -C /tmp/j
          JCONSOLE="$(find /tmp/j -type f -name jconsole -print -quit)"
          test -n "$JCONSOLE"
          chmod +x "$JCONSOLE"
          printf 'JCONSOLE=%s\n' "$JCONSOLE" >> "$GITHUB_ENV"

      - name: Execute J observation
        shell: bash
        run: |
          set -euo pipefail
          "$JCONSOLE" j/028_check.ijs | tee /tmp/j-observation.txt
          grep -Fq 'Observation 028 / future vocabulary refinement' /tmp/j-observation.txt
          grep -Fq 'class counts V0..V5:' /tmp/j-observation.txt
          grep -Fq '1 2 3 4 4 8' /tmp/j-observation.txt
          grep -Fq 'V4 class sizes (redundant Both question):' /tmp/j-observation.txt
          grep -Fq 'V5 class sizes (Hidden becomes observable):' /tmp/j-observation.txt
