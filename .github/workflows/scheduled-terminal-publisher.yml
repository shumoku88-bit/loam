name: Shared Scheduled Terminal Publisher

on:
  pull_request:
    paths:
      - 'Loam/ScheduledTerminalPublisher.lean'
      - 'Loam/ScheduledReview.lean'
      - 'Loam/MovementAdmission.lean'
      - 'Loam/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledTerminalPublisher.lean'
      - '.github/workflows/scheduled-terminal-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - main
      - feat/tui
    paths:
      - 'Loam/ScheduledTerminalPublisher.lean'
      - 'Loam/ScheduledReview.lean'
      - 'Loam/MovementAdmission.lean'
      - 'Loam/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledTerminalPublisher.lean'
      - '.github/workflows/scheduled-terminal-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Build and test Actual-backed Scheduled terminal publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean and build shared Scheduled publisher dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.ScheduledTerminalPublisher Loam.ScheduledReview Loam.ActualReview
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Verify Actual-backed Scheduled completion and cancellation
        run: lake env lean --run Loam/Tests/ScheduledTerminalPublisher.lean "$(mktemp -d)/scheduled-terminal-publisher"
