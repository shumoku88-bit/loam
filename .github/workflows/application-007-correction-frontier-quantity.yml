name: Application 007 Correction Frontier Quantity

on:
  pull_request:
    paths:
      - 'experiments/application_007_correction_frontier_quantity.lean'
      - 'experiments/application_007_correction_frontier_quantity.md'
      - '.github/workflows/application-007-correction-frontier-quantity.yml'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Check correction frontier quantity probe
        run: lake env lean experiments/application_007_correction_frontier_quantity.lean
