name: Observation 078

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation078.lean'
      - 'Loam/Core/**'
      - 'experiments/078_stateless_shadow_identity.md'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/stateless-shadow-identity-observation.yml'
  push:
    branches:
      - main
      - experiment/078-stateless-shadow-identity
    paths:
      - 'Loam/Observations/Observation078.lean'
      - 'Loam/Core/**'
      - 'experiments/078_stateless_shadow_identity.md'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/stateless-shadow-identity-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean stateless shadow identity boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Practical Core
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          axiom-audit: false
          use-github-cache: false

      - name: Audit Observation 078 axioms
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_DIR="$RUNNER_TEMP/axiom-audit-078"
          rm -rf "$AUDIT_DIR"
          git clone --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git "$AUDIT_DIR"
          test "$(git -C "$AUDIT_DIR" rev-parse HEAD)" = \
            "46024e005996495c65ef609368e11ab39c4222e3"
          cp lean-toolchain "$AUDIT_DIR/"
          (cd "$AUDIT_DIR" && lake build)
          lake env "$AUDIT_DIR/.lake/build/bin/axiom-audit" \
            --root Loam.Observations.Observation078 \
            --modules Loam.Observations.Observation078 \
            --allow propext,Classical.choice,Quot.sound

      - name: Check Observation 078 proof directly
        run: lake env lean Loam/Observations/Observation078.lean
