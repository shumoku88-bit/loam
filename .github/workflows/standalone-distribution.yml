name: Standalone Distribution Smoke

on:
  pull_request:
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Cli/**'
      - 'Loam/Tui/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/standalone-distribution.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Cli/**'
      - 'Loam/Tui/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/standalone-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run loam outside repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build unified loam executable
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run copied binary with no source tree or Lean toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail

          standalone="$(mktemp -d)"
          cp .lake/build/bin/loam "$standalone/loam"
          chmod +x "$standalone/loam"

          (
            cd "$standalone"
            test ! -e lakefile.lean
            test ! -d Loam
            test ! -d .lake

            clean_env=(env -i HOME="$HOME" PATH="/usr/bin:/bin")

            help_out="$("${clean_env[@]}" ./loam help)"
            grep -Fq "LOAM practical dogfood" <<<"$help_out"
            grep -Fq "loam movement [LOAM_DATA_DIR]" <<<"$help_out"
            grep -Fq "loam export beancount" <<<"$help_out"
            if grep -Fq "./tools/loam" <<<"$help_out"; then
              echo "standalone binary help still refers to repository wrapper" >&2
              exit 1
            fi

            mkdir household
            set +e
            doctor_out="$("${clean_env[@]}" ./loam doctor "$standalone/household" 2>&1)"
            doctor_status=$?
            set -e
            test "$doctor_status" -eq 2
            grep -Fq "LOAM operational diagnosis" <<<"$doctor_out"
            grep -Fq "Status: blocked" <<<"$doctor_out"
            grep -Fq "This diagnosis is read-only." <<<"$doctor_out"

            set +e
            export_out="$("${clean_env[@]}" ./loam export journal 2>&1)"
            export_status=$?
            set -e
            test "$export_status" -eq 2
            grep -Fq "Usage: loam export journal ACTUAL_FILE OUTPUT_FILE" <<<"$export_out"
          )


  package:
    name: Package ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: loam-linux-x86_64
            expected_arch: x86_64
            os_family: linux
            deployment_target: ''
            max_glibc_symbol: '2.17'
          - runner: ubuntu-22.04-arm
            artifact: loam-linux-aarch64
            expected_arch: aarch64
            os_family: linux
            deployment_target: ''
            max_glibc_symbol: '2.17'
          - runner: macos-15-intel
            artifact: loam-macos-x86_64
            expected_arch: x86_64
            os_family: macos
            deployment_target: '10.15'
            max_glibc_symbol: ''
          - runner: macos-15
            artifact: loam-macos-arm64
            expected_arch: arm64
            os_family: macos
            deployment_target: '11.0'
            max_glibc_symbol: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          echo "runner: ${{ matrix.runner }}"
          echo "architecture: $actual_arch"
          test "$actual_arch" = "${{ matrix.expected_arch }}"

      - name: Build unified loam executable
        uses: leanprover/lean-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Record native portability evidence
        shell: bash
        run: |
          set -euo pipefail

          binary=".lake/build/bin/loam"
          metadata="$RUNNER_TEMP/PORTABILITY.txt"

          file "$binary"

          {
            echo "artifact=${{ matrix.artifact }}"
            echo "runner=${{ matrix.runner }}"
            echo "architecture=$(uname -m)"

            if [[ "${{ matrix.os_family }}" == "macos" ]]; then
              echo "host_macos=$(sw_vers -productVersion)"
              echo "dynamic_dependencies:"
              otool -L "$binary" | sed 's/^/  /'

              build_info="$(xcrun vtool -show-build "$binary" 2>/dev/null || true)"
              echo "mach_o_build_version:"
              if [[ -n "$build_info" ]]; then
                sed 's/^/  /' <<<"$build_info"
              else
                echo "  unavailable"
              fi

              configured_target="${{ matrix.deployment_target }}"
              minimum_macos="$(awk '$1 == "minos" { print $2; exit }' <<<"$build_info")"
              test -n "$configured_target"
              test -n "$minimum_macos"
              test "$minimum_macos" = "$configured_target"
              echo "configured_macos_deployment_target=$configured_target"
              echo "binary_minos=$minimum_macos"
              echo "runtime_qualified_on_host_macos=$(sw_vers -productVersion)"
              echo "portability_note=The deployment target is encoded and checked at link time; runtime execution is qualified on the listed GitHub runner host."
            else
              host_glibc="$(ldd --version | head -n 1)"
              echo "host_glibc=$host_glibc"
              echo "dynamic_dependencies:"
              ldd "$binary" | sed 's/^/  /'

              required_glibc="$(
                (
                  readelf --version-info "$binary" |
                    grep -oE 'GLIBC_[0-9]+([.][0-9]+)*' |
                    sed 's/^GLIBC_//' |
                    sort -Vu |
                    tail -n 1
                ) || true
              )"
              allowed_glibc="${{ matrix.max_glibc_symbol }}"
              test -n "$required_glibc"
              test -n "$allowed_glibc"
              highest="$(printf '%s\n%s\n' "$required_glibc" "$allowed_glibc" | sort -Vu | tail -n 1)"
              test "$highest" = "$allowed_glibc"
              echo "observed_max_glibc_symbol=$required_glibc"
              echo "enforced_max_glibc_symbol=$allowed_glibc"
              echo "portability_note=CI rejects a binary whose highest referenced GLIBC symbol version exceeds this bound; this is not a complete oldest-distribution compatibility guarantee."
            fi
          } | tee "$metadata"

      - name: Package and re-run extracted standalone binary
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/${{ matrix.artifact }}"
          archive="$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz"
          extracted="$RUNNER_TEMP/extracted-${{ matrix.artifact }}"

          mkdir -p "$package_root"
          cp .lake/build/bin/loam "$package_root/loam"
          cp "$RUNNER_TEMP/PORTABILITY.txt" "$package_root/PORTABILITY.txt"
          chmod +x "$package_root/loam"

          tar -C "$RUNNER_TEMP" -czf "$archive" "${{ matrix.artifact }}"

          rm -rf "$package_root"
          mkdir -p "$extracted"
          tar -C "$extracted" -xzf "$archive"

          (
            cd "$extracted/${{ matrix.artifact }}"
            test ! -e lakefile.lean
            test ! -d Loam
            test ! -d .lake

            clean_env=(env -i HOME="$HOME" PATH="/usr/bin:/bin")
            help_out="$("${clean_env[@]}" ./loam help)"
            grep -Fq "LOAM practical dogfood" <<<"$help_out"
            grep -Fq "loam export beancount" <<<"$help_out"
          )

          archive_dir="$(dirname "$archive")"
          archive_name="$(basename "$archive")"
          if [[ "${{ matrix.os_family }}" == "macos" ]]; then
            (cd "$archive_dir" && shasum -a 256 "$archive_name") > "$archive.sha256"
          else
            (cd "$archive_dir" && sha256sum "$archive_name") > "$archive.sha256"
          fi

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz.sha256
            ${{ runner.temp }}/PORTABILITY.txt
          if-no-files-found: error


  collect:
    name: Verify release asset set
    needs: package
    runs-on: ubuntu-24.04

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: loam-*
          path: ${{ runner.temp }}/downloads

      - name: Verify checksums and flatten release assets
        shell: bash
        run: |
          set -euo pipefail

          downloads="$RUNNER_TEMP/downloads"
          release_assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_assets"

          expected=(
            loam-linux-x86_64
            loam-linux-aarch64
            loam-macos-x86_64
            loam-macos-arm64
          )

          for name in "${expected[@]}"; do
            dir="$downloads/$name"
            archive="$dir/$name.tar.gz"
            checksum="$dir/$name.tar.gz.sha256"
            portability="$dir/PORTABILITY.txt"

            test -f "$archive"
            test -f "$checksum"
            test -f "$portability"

            (
              cd "$dir"
              sha256sum -c "$name.tar.gz.sha256"
            )

            cp "$archive" "$release_assets/"
            cp "$checksum" "$release_assets/"
            cp "$portability" "$release_assets/$name.PORTABILITY.txt"
          done

          test "$(find "$release_assets" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 12

          printf '%s\n' "Release asset set:"
          find "$release_assets" -maxdepth 1 -type f -printf '  %f\n' | sort

      - name: Upload verified release asset set
        uses: actions/upload-artifact@v4
        with:
          name: loam-release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: loam-release-assets
          path: release-assets

      - name: Publish or refresh tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          test -n "$tag"

          gh --version

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$tag" \
              --notes "First standalone LOAM release. Prebuilt binaries are provided for Linux and macOS on x86_64 and arm64. Each archive includes portability metadata, with SHA-256 checksums alongside."
          fi
