name: Standalone Distribution Smoke

on:
  pull_request:
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Cli/**'
      - 'Loam/Tui/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/standalone-distribution.yml'
  push:
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Cli/**'
      - 'Loam/Tui/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/standalone-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run loam outside repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build unified loam executable
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run copied binary with no source tree or Lean toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail

          standalone="$(mktemp -d)"
          cp .lake/build/bin/loam "$standalone/loam"
          chmod +x "$standalone/loam"

          (
            cd "$standalone"
            test ! -e lakefile.lean
            test ! -d Loam
            test ! -d .lake

            clean_env=(env -i HOME="$HOME" PATH="/usr/bin:/bin")

            help_out="$("${clean_env[@]}" ./loam help)"
            grep -Fq "LOAM practical dogfood" <<<"$help_out"
            grep -Fq "loam movement [LOAM_DATA_DIR]" <<<"$help_out"
            grep -Fq "loam export beancount" <<<"$help_out"
            if grep -Fq "./tools/loam" <<<"$help_out"; then
              echo "standalone binary help still refers to repository wrapper" >&2
              exit 1
            fi

            mkdir household
            set +e
            doctor_out="$("${clean_env[@]}" ./loam doctor "$standalone/household" 2>&1)"
            doctor_status=$?
            set -e
            test "$doctor_status" -eq 2
            grep -Fq "LOAM operational diagnosis" <<<"$doctor_out"
            grep -Fq "Status: blocked" <<<"$doctor_out"
            grep -Fq "This diagnosis is read-only." <<<"$doctor_out"

            set +e
            export_out="$("${clean_env[@]}" ./loam export journal 2>&1)"
            export_status=$?
            set -e
            test "$export_status" -eq 2
            grep -Fq "Usage: loam export journal ACTUAL_FILE OUTPUT_FILE" <<<"$export_out"
          )


  package:
    name: Package ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: loam-linux-x86_64
            expected_arch: x86_64
            os_family: linux
          - runner: ubuntu-22.04-arm
            artifact: loam-linux-aarch64
            expected_arch: aarch64
            os_family: linux
          - runner: macos-15-intel
            artifact: loam-macos-x86_64
            expected_arch: x86_64
            os_family: macos
          - runner: macos-14
            artifact: loam-macos-arm64
            expected_arch: arm64
            os_family: macos

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          echo "runner: ${{ matrix.runner }}"
          echo "architecture: $actual_arch"
          test "$actual_arch" = "${{ matrix.expected_arch }}"

      - name: Build unified loam executable
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Record native portability evidence
        shell: bash
        run: |
          set -euo pipefail

          binary=".lake/build/bin/loam"
          metadata="$RUNNER_TEMP/PORTABILITY.txt"

          file "$binary"

          {
            echo "artifact=${{ matrix.artifact }}"
            echo "runner=${{ matrix.runner }}"
            echo "architecture=$(uname -m)"

            if [[ "${{ matrix.os_family }}" == "macos" ]]; then
              echo "host_macos=$(sw_vers -productVersion)"
              echo "dynamic_dependencies:"
              otool -L "$binary" | sed 's/^/  /'

              build_info="$(xcrun vtool -show-build "$binary" 2>/dev/null || true)"
              echo "mach_o_build_version:"
              if [[ -n "$build_info" ]]; then
                sed 's/^/  /' <<<"$build_info"
              else
                echo "  unavailable"
              fi

              minimum_macos="$(awk '$1 == "minos" { print $2; exit }' <<<"$build_info")"
              echo "binary_minos=${minimum_macos:-unknown}"
            else
              host_glibc="$(ldd --version | head -n 1)"
              echo "host_glibc=$host_glibc"
              echo "dynamic_dependencies:"
              ldd "$binary" | sed 's/^/  /'

              required_glibc="$(
                (
                  readelf --version-info "$binary" |
                    grep -oE 'GLIBC_[0-9]+([.][0-9]+)*' |
                    sed 's/^GLIBC_//' |
                    sort -Vu |
                    tail -n 1
                ) || true
              )"
              echo "binary_max_glibc_symbol=${required_glibc:-unknown}"
            fi
          } | tee "$metadata"

      - name: Package and re-run extracted standalone binary
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/${{ matrix.artifact }}"
          archive="$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz"
          extracted="$RUNNER_TEMP/extracted-${{ matrix.artifact }}"

          mkdir -p "$package_root"
          cp .lake/build/bin/loam "$package_root/loam"
          cp "$RUNNER_TEMP/PORTABILITY.txt" "$package_root/PORTABILITY.txt"
          chmod +x "$package_root/loam"

          tar -C "$RUNNER_TEMP" -czf "$archive" "${{ matrix.artifact }}"

          rm -rf "$package_root"
          mkdir -p "$extracted"
          tar -C "$extracted" -xzf "$archive"

          (
            cd "$extracted/${{ matrix.artifact }}"
            test ! -e lakefile.lean
            test ! -d Loam
            test ! -d .lake

            clean_env=(env -i HOME="$HOME" PATH="/usr/bin:/bin")
            help_out="$("${clean_env[@]}" ./loam help)"
            grep -Fq "LOAM practical dogfood" <<<"$help_out"
            grep -Fq "loam export beancount" <<<"$help_out"
          )

          if [[ "${{ matrix.os_family }}" == "macos" ]]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz
            ${{ runner.temp }}/${{ matrix.artifact }}.tar.gz.sha256
            ${{ runner.temp }}/PORTABILITY.txt
          if-no-files-found: error
