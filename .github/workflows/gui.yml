name: GUI interaction

on:
  pull_request:
    paths:
      - 'gui/web/**'
      - 'gui/src-tauri/**'
      - 'gui/tests/**'
      - 'gui/package.json'
      - 'gui/package-lock.json'
      - '.github/workflows/gui.yml'
  push:
    paths:
      - 'gui/web/**'
      - 'gui/src-tauri/**'
      - 'gui/tests/**'
      - 'gui/package.json'
      - 'gui/package-lock.json'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-adapter:
    name: Thin native read transport
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui/src-tauri
    steps:
      - uses: actions/checkout@v6
      - name: Qualify framing, lineage ownership and exact quantity text
        run: cargo test --locked
      - name: Check adapter without accounting logic
        run: cargo clippy --locked --all-targets -- -D warnings

  interaction:
    name: Synthetic read-only workbench interaction
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Qualify exact evidence and presentation mechanics
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Qualify browser interaction without household data
        run: npm run test:browser
        env:
          LOAM_GUI_SCREENSHOT_DIR: ${{ runner.temp }}/loam-gui-synthetic
      - name: Keep synthetic preview screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loam-gui-synthetic
          path: ${{ runner.temp }}/loam-gui-synthetic
          if-no-files-found: ignore
