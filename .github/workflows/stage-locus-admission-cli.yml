name: Stage Locus admission CLI

on:
  push:
    branches:
      - feat/locus-admission-administration
    paths:
      - '.github/workflows/stage-locus-admission-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/locus-admission-administration
          fetch-depth: 0
      - name: Patch CLI
        run: python3 tools/stage-locus-admission-cli.py
      - name: Check diff
        run: git diff --check
      - name: Commit CLI
        run: |
          if git diff --quiet -- Loam/Tui/Cli.lean; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Cli.lean
          git commit -m 'feat(tui): wire Locus admission administration entrance'
          git push origin HEAD:feat/locus-admission-administration
