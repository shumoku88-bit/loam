name: Practical AccountingRole Persistence

on:
  pull_request:
    paths:
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Tests/AccountingRolePersistence.lean'
      - '.github/workflows/practical-accounting-role-persistence.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    branches:
      - 'feat/accounting-role-persistence'
      - main
    paths:
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Tests/AccountingRolePersistence.lean'
      - '.github/workflows/practical-accounting-role-persistence.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-accounting-role-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test partial AccountingRole relation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Core and AccountingRole persistence
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core Loam.Persistence.AccountingRolePersistence
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run AccountingRole persistence story
        shell: bash
        run: lake env lean --run Loam/Tests/AccountingRolePersistence.lean
