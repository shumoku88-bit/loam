name: Practical Slice B

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/ScheduledCommitmentInspection.lean'
      - 'Loam/Application/CurrentCoverageInspection.lean'
      - 'Loam/Application/ActualRoutingInspection.lean'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application.lean'
      - 'Loam/Review/CurrentCoverageReview.lean'
      - 'Loam/Review/CapacityReview.lean'
      - 'Loam/Application/CurrentQuantityAnchor.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Review/RoleBalanceReview.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/Scheduled.lean'
      - 'Loam/Core/ScheduledMemory.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Core/ScheduledRetirement.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Persistence/ActualRoutingPersistence.lean'
      - 'Loam/Authority/CapacityAuthority.lean'
      - 'Loam/Persistence/NormalizedCapacityPersistence.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledRoutingPersistence.lean'
      - 'Loam/Tests/ScheduledCommitmentHeadroom.lean'
      - 'Loam/Tests/CurrentCoverageInspection.lean'
      - 'Loam/Tests/CurrentCoverageReview.lean'
      - 'Loam/Tests/CounterpointFiveWorlds.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV1.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV2.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV3.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV4.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV5.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV6.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/practical-slice-b.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    branches:
      - 'feat/scheduled-commitment-headroom'
      - 'feat/scheduled-capacity-pressure'
      - 'feat/current-capacity-coverage-tui'
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/ScheduledCommitmentInspection.lean'
      - 'Loam/Application/CurrentCoverageInspection.lean'
      - 'Loam/Application/ActualRoutingInspection.lean'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application.lean'
      - 'Loam/Review/CurrentCoverageReview.lean'
      - 'Loam/Review/CapacityReview.lean'
      - 'Loam/Application/CurrentQuantityAnchor.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Review/RoleBalanceReview.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/Scheduled.lean'
      - 'Loam/Core/ScheduledMemory.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Core/ScheduledRetirement.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Persistence/ActualRoutingPersistence.lean'
      - 'Loam/Authority/CapacityAuthority.lean'
      - 'Loam/Persistence/NormalizedCapacityPersistence.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledRoutingPersistence.lean'
      - 'Loam/Tests/ScheduledCommitmentHeadroom.lean'
      - 'Loam/Tests/CurrentCoverageInspection.lean'
      - 'Loam/Tests/CurrentCoverageReview.lean'
      - 'Loam/Tests/CounterpointFiveWorlds.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV1.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV2.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV3.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV4.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV5.lean'
      - 'Loam/Tests/FourVoiceCompatibilityV6.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/practical-slice-b.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-slice-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build Scheduled Commitment / Current Coverage boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Core and Application
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Core Loam.Application Loam.Review.CurrentCoverageReview Loam.Application.CurrentQuantityAnchor Loam.Publisher.CurrentQuantityAnchorPublisher Loam.Review.RoleBalanceReview Loam.Tests.ActualWorldFixture

      - name: Run Practical Slice B package test group
        run: lake test -- practical-slice-b
