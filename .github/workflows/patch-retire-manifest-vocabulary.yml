name: One-shot TUI vocabulary patch

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/patch-retire-manifest-vocabulary.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Replace only qualified legacy names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Loam/Tui/Cli.lean')
          text = path.read_text()
          replacements = {
              'Loam.MovementPublisher.publishManifestDraft': ('Loam.MovementPublisher.publishDraft', 1),
              'Loam.ScheduledTerminalPublisher.publishManifestCompletion': ('Loam.ScheduledTerminalPublisher.publishCompletion', 1),
              'Loam.ScheduledTerminalPublisher.publishManifestCancellation': ('Loam.ScheduledTerminalPublisher.publishCancellation', 1),
              'Loam.ScheduledReplacementPublisher.publishManifestReplacement': ('Loam.ScheduledReplacementPublisher.publishReplacement', 1),
              'resolveManifestRoot': ('resolveActualRoot', 2),
          }
          for old, (new, expected) in replacements.items():
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{old}: expected {expected} occurrence(s), found {actual}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/patch-retire-manifest-vocabulary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam/Tui/Cli.lean
          git commit -m "cleanup(runtime): retire manifest names from TUI [generated]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
