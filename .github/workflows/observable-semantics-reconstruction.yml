name: Observable Semantics Reconstruction

on:
  pull_request:
    paths:
      - 'experiments/242_current_read_answer_basis.als'
      - 'experiments/243_current_coverage_answer_basis.als'
      - 'tools/observable_semantics_manifest.json'
      - 'tools/run-alloy-manifest.py'
      - '.github/workflows/observable-semantics-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Qualify answer-first Alloy models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"

      - name: Verify answer-first receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run-alloy-manifest.py \
            --alloy-jar "$ALLOY_JAR" \
            --manifest tools/observable_semantics_manifest.json \
            --verbose
