name: Observation 082

on:
  pull_request:
    paths:
      - 'experiments/082_sanitized_realization_summary.als'
      - 'experiments/082_sanitized_realization_summary.md'
      - '.github/workflows/sanitized-realization-summary-observation.yml'
  push:
    branches:
      - 'experiment/082-sanitized-realization-summary'
      - main
    paths:
      - 'experiments/082_sanitized_realization_summary.als'
      - 'experiments/082_sanitized_realization_summary.md'
      - '.github/workflows/sanitized-realization-summary-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Sanitized realization summary and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 082 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/082_sanitized_realization_summary.als

      - name: Require provenance-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected_sat = {
              'sameSummaryDifferentProvenance': True,
              'SanitizedSummaryDeterminesRealization': True,
              'ExplicitRealizationDeterminesSanitizedSummary': False,
              'SanitizedSummaryDeterminesLinkCount': False,
          }

          wrong = []
          for name, want_sat in expected_sat.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 082 receipt: {wrong}')
          PY

      - name: Record narrow interpretation
        shell: bash
        run: |
          cat <<'EOF'
          Observation 082 expected receipt
          sameSummaryDifferentProvenance: SAT
            meaning: a multi-cell privacy-safe aggregate can survive while Plan -> Actual provenance differs
          SanitizedSummaryDeterminesRealization: SAT counterexample
            meaning: the sanitized matrix does not reconstruct the realization relation
          ExplicitRealizationDeterminesSanitizedSummary: UNSAT counterexample
            meaning: a fixed relation determines its aggregate summary in this model
          SanitizedSummaryDeterminesLinkCount: UNSAT counterexample
            meaning: the projection loses provenance without losing total link cardinality
          EOF
