name: Movement Proposal

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Cli/Movement/Proposal.lean'
      - 'Loam/Cli/MovementProposalCli.lean'
      - 'Loam/Cli/MovementProposalRecordCli.lean'
      - 'Loam/Review/MovementDraftReview.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Application/MovementAdmission.lean'
      - 'Loam/Cli/Movement/RelationEntry.lean'
      - 'Loam/Cli/Movement/DischargeEntry.lean'
      - 'Loam/Tests/MovementProposal.lean'
      - 'Loam/Tests/MovementProposalRecord.lean'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - '.github/workflows/movement-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    name: Qualify read-only proposal transport
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build proposal executable and fixture boundary
        uses: ./.github/actions/lean-build
        with:
          build-args: loamMovementProposal Loam.Tests.ActualWorldFixture

      - name: Verify versioned proposal parsing and read-only review
        run: lake env lean --run Loam/Tests/MovementProposal.lean "$(mktemp -d)/movement-proposal"

  publication:
    name: Qualify explicit proposal publication
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build proposal writer and fixture boundary
        uses: ./.github/actions/lean-build
        with:
          build-args: loamMovementProposalRecord Loam.Tests.ActualWorldFixture

      - name: Verify canonical writer reread and refusal atomicity
        run: lake env lean --run Loam/Tests/MovementProposalRecord.lean "$(mktemp -d)/movement-proposal-record"
