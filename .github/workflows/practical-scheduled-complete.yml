name: Practical Scheduled Complete

on:
  pull_request:
    paths:
      - 'Loam/ActualValidityV2Identity.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Persistence/ScheduledCompletionPersistence.lean'
      - 'Loam/ScheduledCompletionUi.lean'
      - 'Loam/Cli/ScheduledCli.lean'
      - 'Loam/Cli/ScheduledLifecycleCli.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Persistence/ScheduledRetirementPersistence.lean'
      - 'Loam/ActualDate.lean'
      - 'Loam/Persistence/ActualValidityPersistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'Loam/MovementEntry.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-scheduled-complete.yml'
  push:
    paths:
      - 'Loam/ActualValidityV2Identity.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Persistence/ScheduledCompletionPersistence.lean'
      - 'Loam/ScheduledCompletionUi.lean'
      - 'Loam/Cli/ScheduledCli.lean'
      - 'Loam/Cli/ScheduledLifecycleCli.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Persistence/ScheduledRetirementPersistence.lean'
      - 'Loam/ActualDate.lean'
      - 'Loam/Persistence/ActualValidityPersistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'Loam/MovementEntry.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-scheduled-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-scheduled-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete:
    name: Build and test Scheduled completion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical LOAM entrances
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam loamMovement
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Complete with Actual content independent from expectation
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          validity="$memory.actual-validity"
          descriptions="$memory.descriptions"

          cat >"$scheduled" <<'EOF'
          LOAM-SCHEDULED-MEMORY	1
          SCHEDULED	scheduled-1	2026-09-10	jpy
          CHANGE	paypay	-1000
          CHANGE	rent	1000
          SCHEDULED	scheduled-2	2026-09-15	jpy
          CHANGE	paypay	-800
          CHANGE	utilities	800
          SCHEDULED	scheduled-3	2026-09-20	jpy
          CHANGE	yucho	-3000
          CHANGE	investment	3000
          SCHEDULED	scheduled-4	2026-09-25	jpy
          CHANGE	paypay	-400
          CHANGE	coffee	400
          SCHEDULED	scheduled-5	2026-09-27	jpy
          CHANGE	paypay	-300
          CHANGE	service	300
          SCHEDULED	scheduled-6	2026-09-29	jpy
          CHANGE	paypay	-600
          CHANGE	insurance	600
          EOF

          printf 'paypay\n950\n\nrent\n950\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-09-11 LOAM_DESCRIPTION='rent actual' \
              ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-1 \
                >"$tmp/complete-1.out"

          grep -Fq 'Scheduled completion' "$tmp/complete-1.out"
          grep -Fq 'action: Complete' "$tmp/complete-1.out"
          grep -Fq '[ok] Actual date: 2026-09-11' "$tmp/complete-1.out"
          grep -Fq '[ok] Actual movement: 950 jpy' "$tmp/complete-1.out"
          grep -Fq 'Completed scheduled movement: scheduled-1 -> scheduled-completion:scheduled-1, 950 jpy. Date: 2026-09-11.' "$tmp/complete-1.out"

          expected_completion=$'LOAM-SCHEDULED-COMPLETION-MEMORY\t1\nCOMPLETION\tscheduled-1\tscheduled-completion:scheduled-1'
          test "$(cat "$completions")" = "$expected_completion"
          expected_description=$'LOAM-EVENT-DESCRIPTION-MEMORY\t1\nDESC\tscheduled-completion:scheduled-1\trent actual'
          test "$(cat "$descriptions")" = "$expected_description"
          grep -Fxq $'LOAM-ACTUAL-VALIDITY-HISTORY\t2' "$validity"
          grep -Fxq $'BASE\tscheduled-completion:scheduled-1\t2026-09-11' "$validity"
          ! grep -q 'scheduled-completion-validity:scheduled-1' "$validity"
          grep -Fq $'EVENT\tscheduled-completion:scheduled-1' "$memory"
          grep -Fq $'EFFECT\teffect-1\tpaypay\tjpy\t-950' "$memory"
          grep -Fq $'EFFECT\teffect-2\trent\tjpy\t950' "$memory"
          if grep -Fq $'EFFECT\teffect-1\tpaypay\tjpy\t-1000' "$memory"; then
            echo 'scheduled expectation was copied into Actual instead of independently entered' >&2
            exit 1
          fi

          ./tools/loam review "$memory" >"$tmp/review-1.out"
          grep -Fq '2026-09-11  rent actual  [scheduled-completion:scheduled-1]' "$tmp/review-1.out"
          printf '%s\n' "$tmp_dir" > /tmp/loam-scheduled-complete-dir

      - name: Refuse a second completion without changing retained facts
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          validity="$memory.actual-validity"
          descriptions="$memory.descriptions"

          before="$(sha256sum "$memory" "$completions" "$validity" "$descriptions")"
          if ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-1 \
              >"$tmp_dir/repeat.out" 2>"$tmp_dir/repeat.err"; then
            echo 'expected second completion to be refused' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '1'
          grep -Fq 'Scheduled movement already completed: scheduled-1 -> scheduled-completion:scheduled-1.' "$tmp_dir/repeat.out"
          after="$(sha256sum "$memory" "$completions" "$validity" "$descriptions")"
          test "$before" = "$after"

      - name: Recover from relation-only interrupted publication
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          validity="$memory.actual-validity"

          cat >"$completions" <<'EOF'
          LOAM-SCHEDULED-COMPLETION-MEMORY	1
          COMPLETION	scheduled-1	scheduled-completion:scheduled-1
          COMPLETION	scheduled-2	scheduled-completion:scheduled-2
          EOF

          printf 'paypay\n700\n\nutilities\n700\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-09-16 \
              ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-2 \
                >"$tmp_dir/complete-2.out"

          grep -Fq 'action: Resume completion' "$tmp_dir/complete-2.out"
          grep -Fq '[ok] completion relation retained' "$tmp_dir/complete-2.out"
          grep -Fq 'Completed scheduled movement: scheduled-2 -> scheduled-completion:scheduled-2, 700 jpy. Date: 2026-09-16.' "$tmp_dir/complete-2.out"
          test "$(grep -Fc $'COMPLETION\tscheduled-2\tscheduled-completion:scheduled-2' "$completions")" = '1'
          grep -Fxq $'BASE\tscheduled-completion:scheduled-2\t2026-09-16' "$validity"
          ! grep -q 'scheduled-completion-validity:scheduled-2' "$validity"
          grep -Fq $'EVENT\tscheduled-completion:scheduled-2' "$memory"

      - name: Recover from relation-and-date interrupted publication
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          validity="$memory.actual-validity"

          cat >"$completions" <<'EOF'
          LOAM-SCHEDULED-COMPLETION-MEMORY	1
          COMPLETION	scheduled-1	scheduled-completion:scheduled-1
          COMPLETION	scheduled-2	scheduled-completion:scheduled-2
          COMPLETION	scheduled-3	scheduled-completion:scheduled-3
          EOF
          cat >>"$validity" <<'EOF'
          BASE	scheduled-completion:scheduled-3	2026-09-21
          EOF

          printf 'yucho\n2800\n\ninvestment\n2800\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-09-30 \
              ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-3 \
                >"$tmp_dir/complete-3.out"

          grep -Fq 'action: Resume completion' "$tmp_dir/complete-3.out"
          grep -Fq '[ok] Actual date: 2026-09-21 (retained)' "$tmp_dir/complete-3.out"
          grep -Fq 'Using retained Actual date from interrupted completion: 2026-09-21' "$tmp_dir/complete-3.out"
          grep -Fq 'Completed scheduled movement: scheduled-3 -> scheduled-completion:scheduled-3, 2800 jpy. Date: 2026-09-21.' "$tmp_dir/complete-3.out"
          test "$(grep -Fc $'BASE\tscheduled-completion:scheduled-3\t2026-09-21' "$validity")" = '1'
          if grep -Fq '2026-09-30' "$validity"; then
            echo 'retry replaced retained completion date' >&2
            exit 1
          fi

      - name: Recover from relation-date-description interrupted publication
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          validity="$memory.actual-validity"
          descriptions="$memory.descriptions"

          cat >>"$completions" <<'EOF'
          COMPLETION	scheduled-6	scheduled-completion:scheduled-6
          EOF
          cat >>"$validity" <<'EOF'
          BASE	scheduled-completion:scheduled-6	2026-09-30
          EOF
          cat >>"$descriptions" <<'EOF'
          DESC	scheduled-completion:scheduled-6	retained insurance actual
          EOF

          printf 'paypay\n620\n\ninsurance\n620\n\n' \
            | LOAM_OCCURRENCE_DATE=2026-10-01 LOAM_DESCRIPTION='attempted replacement' \
              ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-6 \
                >"$tmp_dir/complete-6.out"

          grep -Fq 'action: Resume completion' "$tmp_dir/complete-6.out"
          grep -Fq '[ok] completion relation retained' "$tmp_dir/complete-6.out"
          grep -Fq '[ok] Actual date: 2026-09-30 (retained)' "$tmp_dir/complete-6.out"
          grep -Fq 'Using retained Actual date from interrupted completion: 2026-09-30' "$tmp_dir/complete-6.out"
          grep -Fq 'Using retained Actual description from interrupted completion: retained insurance actual' "$tmp_dir/complete-6.out"
          grep -Fq 'Completed scheduled movement: scheduled-6 -> scheduled-completion:scheduled-6, 620 jpy. Date: 2026-09-30.' "$tmp_dir/complete-6.out"
          test "$(grep -Fc $'DESC\tscheduled-completion:scheduled-6\tretained insurance actual' "$descriptions")" = '1'
          if grep -Fq 'attempted replacement' "$descriptions"; then
            echo 'retry replaced retained completion description' >&2
            exit 1
          fi
          if grep -Fq '2026-10-01' "$validity"; then
            echo 'retry replaced retained completion date while resuming description evidence' >&2
            exit 1
          fi
          grep -Fq $'EVENT\tscheduled-completion:scheduled-6' "$memory"

      - name: Reject stale completion draft after concurrent cancellation
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"
          completions="$scheduled.completions"
          retirements="$scheduled.retirements"
          fifo="$tmp_dir/scheduled-5-input"
          complete_out="$tmp_dir/scheduled-5-complete.out"
          complete_err="$tmp_dir/scheduled-5-complete.err"
          cancel_out="$tmp_dir/scheduled-5-cancel.out"
          mkfifo "$fifo"

          LOAM_OCCURRENCE_DATE=2026-09-28 \
            ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-5 \
              <"$fifo" >"$complete_out" 2>"$complete_err" &
          complete_pid=$!
          exec 3>"$fifo"
          printf 'paypay\n' >&3

          reached_amount=0
          for _ in $(seq 1 300); do
            if grep -Fq 'From amount?' "$complete_out"; then
              reached_amount=1
              break
            fi
            if ! kill -0 "$complete_pid" 2>/dev/null; then
              cat "$complete_out" >&2 || true
              cat "$complete_err" >&2 || true
              echo 'completion exited before waiting for movement input' >&2
              exit 1
            fi
            sleep 0.1
          done
          test "$reached_amount" = '1'

          timeout 15 ./tools/loam scheduled cancel "$scheduled" scheduled-5 >"$cancel_out"
          grep -Fq 'Cancelled scheduled movement: scheduled-5 on 2026-09-27.' "$cancel_out"

          printf '300\n\nservice\n300\n\n' >&3
          exec 3>&-
          if wait "$complete_pid"; then
            echo 'expected stale completion draft to be refused after cancellation' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '1'
          grep -Fq 'Scheduled movement changed while the completion draft was open: scheduled-5 is now cancelled.' "$complete_out"
          grep -Fq $'RETIREMENT\tscheduled-5' "$retirements"
          if grep -Fq $'COMPLETION\tscheduled-5\t' "$completions"; then
            echo 'stale completion relation was published after cancellation' >&2
            exit 1
          fi
          if grep -Fq $'EVENT\tscheduled-completion:scheduled-5' "$memory"; then
            echo 'stale completion Event was published after cancellation' >&2
            exit 1
          fi

      - name: Refuse deterministic completion Event-id collision
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(cat /tmp/loam-scheduled-complete-dir)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"

          cat >>"$memory" <<'EOF'
          EVENT	scheduled-completion:scheduled-4
          EFFECT	effect-1	paypay	jpy	-1
          EFFECT	effect-2	coffee	jpy	1
          EOF

          if ./tools/loam scheduled complete "$scheduled" "$memory" scheduled-4 \
              >"$tmp_dir/collision.out" 2>"$tmp_dir/collision.err"; then
            echo 'expected completion Event-id collision to fail closed' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'completion Event identity already exists without the expected completion relation' "$tmp_dir/collision.err"
