name: Observation 251

on:
  pull_request:
    paths:
      - 'experiments/251_loam_rea_interpretation.als'
      - 'experiments/251_loam_rea_interpretation.md'
      - '.github/workflows/rea-interpretation-observation.yml'
  push:
    branches:
      - 'experiment/251-loam-rea-interpretation'
      - main
    paths:
      - 'experiments/251_loam_rea_interpretation.als'
      - 'experiments/251_loam_rea_interpretation.md'
      - '.github/workflows/rea-interpretation-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Falsify REA interpretation derivability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 251 Alloy model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/251_loam_rea_interpretation.als

      - name: Require REA interpretation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected_sat = {
              'reaInterpretationExists': True,
              'sameLoamEvidenceDifferentAgent': True,
              'sameLoamEvidenceDifferentResource': True,
              'sameLoamEvidenceDifferentDuality': True,
              'LoamEvidenceDeterminesREAInterpretation': True,
              'LoamPlusResourceDeterminesAgent': True,
              'LoamPlusResourceAndAgentDeterminesDuality': True,
              'FullExplicitOverlayDeterminesSelectedQueries': False,
          }

          wrong = []
          for name, want_sat in expected_sat.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 251 receipt: {wrong}')
          PY
