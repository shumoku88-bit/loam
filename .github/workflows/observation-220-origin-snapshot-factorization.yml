name: Observation 220

on:
  pull_request:
    paths:
      - 'experiments/220_origin_snapshot_factorization.lean'
      - 'experiments/220_origin_snapshot_factorization.md'
      - '.github/workflows/observation-220-origin-snapshot-factorization.yml'
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Core/QuantityBasisCorrectionMemory.lean'
      - 'Loam/Application/QuantityInspection.lean'
      - 'Loam/Application/QuantityBasisFrontier.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  origin-snapshot-factorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build current quantity slice
        run: |
          lake build Loam.Application.CurrentQuantity
      - name: Check Observation 220 Lean probe
        shell: bash
        run: |
          set +e
          lake env lean experiments/220_origin_snapshot_factorization.lean \
            > /tmp/observation-220-lean.log 2>&1
          status=$?
          cat /tmp/observation-220-lean.log
          exit "$status"
      - name: Upload Observation 220 Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-220-lean-log
          path: /tmp/observation-220-lean.log
