name: Observation 004

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy history-summary collision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Seek count-summary collision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j -o /tmp/alloy-output model/004_minimal_sufficient_history.als
          jq -e '.commands.countSummaryCollision.solution | length > 0' /tmp/alloy-output/receipt.json
          sed -n '1,220p' /tmp/alloy-output/receipt.json

  tla:
    name: TLA+ one-bit sufficiency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check one-bit history summary
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/MinimalSufficientHistory.cfg \
            tla/MinimalSufficientHistory.tla \
            2>&1 | tee /tmp/observation-004.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-004.txt
