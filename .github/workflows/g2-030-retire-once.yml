name: G2-030 retire legacy workspaces

on:
  push:
    branches:
      - audit/g2-030-retire-legacy-workspaces
    paths:
      - '.github/workflows/g2-030-retire-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/g2-030-retire-legacy-workspaces
          fetch-depth: 0
      - name: Apply G2-030 retirement
        run: |
          python3 tools/g2_030_retire_legacy_workspaces.py
          python3 docs/drakon/build_tui_legacy_workspace_retirement_audit_map.py
      - name: Commit retired topology
        run: |
          rm tools/g2_030_retire_legacy_workspaces.py
          rm .github/workflows/g2-030-retire-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(tui): retire legacy Main workspaces'
          git push origin HEAD:audit/g2-030-retire-legacy-workspaces
