name: Observation 083

on:
  pull_request:
    paths:
      - 'experiments/083_summary_correlation_loss.als'
      - 'experiments/083_summary_correlation_loss.md'
      - 'j/083_check.ijs'
      - '.github/workflows/observation-083-summary-correlation.yml'
  push:
    branches:
      - 'experiment/083-summary-correlation-loss'
      - main
    paths:
      - 'experiments/083_summary_correlation_loss.als'
      - 'experiments/083_summary_correlation_loss.md'
      - 'j/083_check.ijs'
      - '.github/workflows/observation-083-summary-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Separate marginals and joint correlation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 083 Alloy model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/083_summary_correlation_loss.als

      - name: Require correlation-loss boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected_sat = {
              'sameMarginalsDifferentJoint': True,
              'SeparateMarginalsDetermineJoint': True,
              'JointSummaryDeterminesMarginals': False,
              'SameLinkClassificationsDetermineJoint': False,
          }

          wrong = []
          for name, want_sat in expected_sat.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 083 receipt: {wrong}')
          PY

  j:
    name: Joint-matrix marginal reduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install J
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/j-linux64.tar.gz \
            https://github.com/jsoftware/jinstall/releases/download/build/linux64.tar.gz
          mkdir -p /tmp/j
          tar -xzf /tmp/j-linux64.tar.gz -C /tmp/j
          JCONSOLE="$(find /tmp/j -type f -name jconsole -print -quit)"
          test -n "$JCONSOLE"
          chmod +x "$JCONSOLE"
          printf 'JCONSOLE=%s\n' "$JCONSOLE" >> "$GITHUB_ENV"

      - name: Execute J correlation-loss observation
        shell: bash
        run: |
          set -euo pipefail
          "$JCONSOLE" j/083_check.ijs | tee /tmp/j-observation.txt
          grep -Fq 'Observation 083 / separate marginals lose joint correlation' /tmp/j-observation.txt
          grep -Fq 'same row marginals:' /tmp/j-observation.txt
          grep -Fq 'same column marginals:' /tmp/j-observation.txt
          grep -Fq 'same joint matrix:' /tmp/j-observation.txt
          test "$(grep -Fx '1' /tmp/j-observation.txt | wc -l | tr -d ' ')" -ge 2
          grep -Fxq '0' /tmp/j-observation.txt
