name: Compression Audit

on:
  pull_request:
    paths:
      - 'tools/audit-production-surface'
      - 'tools/audit-production-reachability'
      - 'tools/audit-semantic-candidates'
      - 'tools/audit-mechanics-patterns'
      - 'tools/loam'
      - 'docs/research/COMPRESSION_AUDIT_CHECKPOINT_226.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE1.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE2.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE3.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE4.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE5.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE6.md'
      - 'docs/research/REPOSITORY_COMPRESSION_LIBRARY_SEEDS_2026-09.md'
      - 'Loam/**'
      - 'lakefile.lean'
      - '.github/workflows/compression-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-surface:
    name: Reproduce production surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory production source surface
        shell: bash
        run: |
          set -o pipefail
          bash tools/audit-production-surface | tee /tmp/compression-audit-output.txt
      - name: Trace production import reachability
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit-production-reachability | tee -a /tmp/compression-audit-output.txt
      - name: Expose semantic candidate vocabulary
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit-semantic-candidates | tee -a /tmp/compression-audit-output.txt
      - name: Scan mechanics multiplication pressure
        shell: bash
        run: |
          set -o pipefail
          python3 tools/audit-mechanics-patterns | tee -a /tmp/compression-audit-output.txt
      - name: Upload compression audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compression-audit-output
          path: /tmp/compression-audit-output.txt
