name: Compression Audit

on:
  pull_request:
    paths:
      - 'tools/audit-production-surface'
      - 'tools/audit-production-reachability'
      - 'tools/audit-semantic-candidates'
      - 'tools/audit-mechanics-patterns'
      - 'tools/audit-ci-topology'
      - 'verification/ci/lean-qualification-cases.json'
      - 'tools/run-lean-qualification-case'
      - 'tools/select-lean-qualification-cases'
      - '.github/actions/tla-research-case/**'
      - 'verification/ci/tla-research-cases.json'
      - 'tools/run-tla-research-case'
      - 'tools/select-tla-research-cases'
      - '.github/actions/spin-research-case/**'
      - 'verification/ci/spin-research-cases.json'
      - 'tools/run-spin-research-case'
      - 'tools/select-spin-research-cases'
      - '.github/actions/alloy-research-case/**'
      - 'verification/ci/alloy-research-cases.json'
      - 'tools/run-alloy-research-case'
      - 'tools/select-alloy-research-cases'
      - 'tools/loam'
      - 'docs/research/COMPRESSION_AUDIT_CHECKPOINT_226.md'
      - 'docs/CI_OBLIGATION_MAP.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE1.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE2.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE3.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE4.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE5.md'
      - 'docs/research/COMPRESSION_AUDIT_PHASE6.md'
      - 'docs/research/REPOSITORY_COMPRESSION_LIBRARY_SEEDS_2026-09.md'
      - 'Loam/**'
      - 'lakefile.lean'
      - '.github/workflows/**'
      - '.github/actions/lean-build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-surface:
    name: Reproduce production surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory production source surface
        shell: bash
        run: bash tools/audit-production-surface
      - name: Trace production import reachability
        shell: bash
        run: python3 tools/audit-production-reachability
      - name: Expose semantic candidate vocabulary
        shell: bash
        run: python3 tools/audit-semantic-candidates
      - name: Scan mechanics multiplication pressure
        shell: bash
        run: python3 tools/audit-mechanics-patterns
      - name: Inventory CI topology
        shell: bash
        run: python3 tools/audit-ci-topology
