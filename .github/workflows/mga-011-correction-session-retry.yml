name: MGA-011 Correction session extraction retry

on:
  push:
    branches:
      - audit/mga-011-correction-session
    paths:
      - '.github/workflows/mga-011-correction-session-retry.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Correction terminal session boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          cli_path = Path('Loam/Tui/Cli.lean')
          cli = cli_path.read_text()

          import_anchor = 'import Loam.Tui.Correction\n'
          session_import = 'import Loam.Tui.CorrectionSession\n'
          if session_import not in cli:
              if import_anchor not in cli:
                  raise SystemExit('Correction import anchor not found')
              cli = cli.replace(import_anchor, import_anchor + session_import, 1)

          start_marker = '''/-- A Correction session emits one target-bound replacement intent at most.
          Only the shared CorrectionPublisher performs the authoritative re-read and write. -/
          partial def correctionLoop'''
          end_marker = '''/-- Date editing stays local; the shared publisher performs every authoritative re-check. -/'''
          start = cli.find(start_marker)
          if start < 0:
              raise SystemExit('correctionLoop start marker not found')
          end = cli.find(end_marker, start)
          if end < 0:
              raise SystemExit('correctionLoop end marker not found')
          cli = cli[:start] + cli[end:]

          call_count = cli.count('correctionLoop')
          if call_count == 0:
              raise SystemExit('no production correctionLoop call sites found')
          cli = cli.replace('correctionLoop', 'Loam.Tui.CorrectionSession.run')
          if 'correctionLoop' in cli:
              raise SystemExit('residual correctionLoop reference remains in Tui.Cli')
          cli_path.write_text(cli)

          session = '''
          import Loam.HouseholdCommand
          import Loam.Tui.Correction
          import Loam.Tui.Kernel
          import Loam.Tui.Runtime
          import Loam.Tui.Terminal

          namespace Loam.Tui.CorrectionSession

          open Loam.Tui.Kernel
          open Loam.Tui.Runtime

          set_option autoImplicit false

          /-!
          # Correction terminal session

          `Correction` owns replacement-editor state, validation, transitions, and view.
          This module owns the terminal/effect shell for one correction editor session:
          read one key at a time, redraw the editor, delegate one replacement intent to
          `HouseholdCommand.correctActual`, and return publication refusal to editing.

          It owns no household authority. The caller remains responsible for loading
          the selected world before the session, reloading canonical evidence after the
          session, and choosing the destination surface.
          -/

          /-- Run one Correction editor session and return its human-facing completion notice. -/
          partial def run
              (bounds : Bounds) (root : System.FilePath)
              (world : Loam.MovementAdmission.World) (known : List String)
              (state : Loam.Tui.Correction.State) (frame : CompiledWidget) : IO String := do
            let step := Loam.Tui.Correction.update world known state (← Loam.Tui.Terminal.readKey)
            if step.cancel then return "Correction cancelled."
            match step.publish with
            | some draft =>
                match ← Loam.HouseholdCommand.correctActual root draft with
                | .ok () =>
                    return "Corrected " ++ draft.target.token ++ "."
                | .error message =>
                    let next := Loam.Tui.Correction.withPublishError step.state message
                    let nextFrame := compileWidget (Loam.Tui.Correction.view known next)
                    Loam.Tui.Terminal.emitDirtyDiff bounds 0 0 frame nextFrame
                    run bounds root world known next nextFrame
            | none =>
                let nextFrame := compileWidget (Loam.Tui.Correction.view known step.state)
                Loam.Tui.Terminal.emitDirtyDiff bounds 0 0 frame nextFrame
                run bounds root world known step.state nextFrame

          end Loam.Tui.CorrectionSession
          '''
          Path('Loam/Tui/CorrectionSession.lean').write_text(textwrap.dedent(session).lstrip())

          ledger_path = Path('docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md')
          ledger = ledger_path.read_text()
          ledger = must_replace(
              ledger,
              'Status: **MGA-010 GRADUATED — Record session split qualified; Correction selected as the next focused experiment**',
              'Status: **MGA-011 IMPLEMENTATION EXPERIMENT — Correction terminal session extraction under qualification**',
              'ledger status'
          )
          ledger = must_replace(
              ledger,
              'Classification: **SPLIT_CANDIDATE — NEXT FOCUSED EXPERIMENT**',
              '''Classification: **SPLIT_CANDIDATE — IMPLEMENTATION EXPERIMENT**

          This branch moves only the Correction terminal key-read/redraw/publication loop
          into `Loam.Tui.CorrectionSession`. `Correction` keeps replacement-editor state,
          validation, transitions, and view; `HouseholdCommand.correctActual` stays the
          authoritative write entrance; `Tui.Cli` keeps selected-world loading, canonical
          reload, and workspace destination. Graduation remains conditional on focused CI
          and the refreshed module inventory.''',
              'MGA-011 classification'
          )
          ledger_path.write_text(textwrap.dedent(ledger))

          map_path = Path('docs/drakon/build_tui_cli_granularity_audit_map.py')
          drakon = map_path.read_text()
          drakon = must_replace(
              drakon,
              'Loam/Tui/RecordSession.lean"',
              'Loam/Tui/RecordSession.lean; Loam/Tui/CorrectionSession.lean"',
              'DRAKON source list'
          )
          drakon = must_replace(drakon, 'five local editor loops', 'four local editor loops', 'DRAKON local-loop count')
          drakon = must_replace(
              drakon,
              'delegate extracted terminal sessions\\nRecord / creation / routing / capacity / admission / reversal',
              'delegate extracted terminal sessions\\nRecord / Correction / creation / routing / capacity / admission / reversal',
              'DRAKON extracted-session node'
          )
          drakon = must_replace(
              drakon,
              'run remaining local editor loops\\nCorrection / Date / Completion / Cancellation / Replacement',
              'run remaining local editor loops\\nDate / Completion / Cancellation / Replacement',
              'DRAKON remaining-session node'
          )
          drakon = must_replace(
              drakon,
              'Compare the five editor-session loops still retained in Tui.Cli without turning the successful Record extraction into a symmetry-driven sweep.',
              'Record the focused Correction extraction while keeping the four other local editor-session loops uncommitted candidates.',
              'DRAKON comparison description'
          )
          drakon = must_replace(
              drakon,
              'Correction is the closest next control to Record: it has a dedicated presentation module, re-enters its editor on publication error, returns only a completion notice, and leaves canonical reload plus workspace destination to Tui.Cli.',
              'Correction is now the focused MGA-011 extraction: its dedicated presentation module keeps state, validation, transitions and view, while CorrectionSession owns key reads, dirty redraws, publication delegation and retry-on-publication-error. Canonical reload plus workspace destination remain in Tui.Cli.',
              'DRAKON Correction audit'
          )
          drakon = must_replace(
              drakon,
              '("action", "Correction loop\\nString result + editor retry + caller reload"),',
              '("action", "CorrectionSession.run\\nString result + editor retry + caller reload"),',
              'DRAKON Correction node'
          )
          drakon = must_replace(
              drakon,
              '("decision", "Closest Record-shaped effect seam?", "YES - next focused experiment"),',
              '("decision", "Record-shaped effect seam isolated?", "UNDER QUALIFICATION - MGA-011"),',
              'DRAKON Correction decision'
          )
          drakon = must_replace(
              drakon,
              'The next experiment is Correction only; the other local loops remain uncommitted candidates.',
              'The current experiment is Correction only; the other local loops remain uncommitted candidates.',
              'DRAKON stop-rule audit'
          )
          drakon = must_replace(
              drakon,
              '("action", "Next test: Correction only; otherwise KEEP in Tui.Cli"),',
              '("action", "Current test: qualify Correction; otherwise return it to Tui.Cli"),',
              'DRAKON stop-rule node'
          )
          drakon = drakon.replace('LOAM MGA.009-010 - TUI CLI module granularity', 'LOAM MGA.009-011 - TUI CLI module granularity', 1)
          drakon = drakon.replace('MGA.009-010 TUI CLI module granularity', 'MGA.009-011 TUI CLI module granularity', 1)
          map_path.write_text(drakon)

          print(f'replaced {call_count} Correction session call site(s)')
          PY

          git rm .github/workflows/mga-011-correction-session-once.yml
          git rm .github/workflows/mga-011-correction-session-retry.yml
          git diff --check
          test -s Loam/Tui/CorrectionSession.lean
          grep -q 'import Loam.Tui.CorrectionSession' Loam/Tui/Cli.lean
          ! grep -q 'partial def correctionLoop' Loam/Tui/Cli.lean
          ! grep -q 'correctionLoop' Loam/Tui/Cli.lean
          python3 docs/drakon/build_tui_cli_granularity_audit_map.py
          test -s docs/drakon/loam-tui-cli-granularity-audit.drn

      - name: Commit focused extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(tui): extract Correction terminal session boundary'
          git push
