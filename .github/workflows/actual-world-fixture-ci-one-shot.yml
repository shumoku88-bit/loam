name: Actual world fixture CI one-shot

on:
  push:
    branches:
      - refactor/retire-publish-world

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[generated-fixture-ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/retire-publish-world
          fetch-depth: 0

      - name: Wire test fixture build dependencies
        run: python3 .github/scripts/add_actual_world_fixture_ci.py

      - name: Remove one-shot scaffolding
        run: |
          rm .github/scripts/add_actual_world_fixture_ci.py
          rm .github/workflows/actual-world-fixture-ci-one-shot.yml

      - name: Commit generated CI wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(test): build ActualWorldFixture where required [generated-fixture-ci]'
          git push origin HEAD:refactor/retire-publish-world
