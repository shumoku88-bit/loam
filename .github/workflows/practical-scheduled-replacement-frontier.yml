name: Practical Scheduled Replacement Frontier

on:
  pull_request:
    paths:
      - 'Loam/Core/HashNodup.lean'
      - 'Loam/Core/ScheduledTerminal.lean'
      - 'Loam/Application/ReplacementFrontier.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Tests/ScheduledReplacementFrontier.lean'
      - 'Loam/Tests/ScheduledInspectionTest.lean'
      - 'Loam/Tests/ReplacementFrontierIndexedByTest.lean'
      - '.github/workflows/practical-scheduled-replacement-frontier.yml'
  push:
    branches:
      - main
      - 'feat/scheduled-replacement-frontier'
      - 'perf/indexed-cycle-admission-by-stable-key'
    paths:
      - 'Loam/Core/HashNodup.lean'
      - 'Loam/Core/ScheduledTerminal.lean'
      - 'Loam/Application/ReplacementFrontier.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Tests/ScheduledReplacementFrontier.lean'
      - 'Loam/Tests/ScheduledInspectionTest.lean'
      - 'Loam/Tests/ReplacementFrontierIndexedByTest.lean'
      - '.github/workflows/practical-scheduled-replacement-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Scheduled replacement frontier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build replacement-aware Scheduled reader
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application.ScheduledInspection
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Exercise replacement frontier laws
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/ScheduledReplacementFrontier.lean
          lake env lean --run Loam/Tests/ScheduledInspectionTest.lean
          lake env lean --run Loam/Tests/ReplacementFrontierIndexedByTest.lean
