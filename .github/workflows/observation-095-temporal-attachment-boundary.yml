name: Observation 095

on:
  pull_request:
    paths:
      - 'experiments/095_temporal_attachment_boundary.als'
      - 'experiments/095_temporal_attachment_boundary.md'
      - '.github/workflows/observation-095-temporal-attachment-boundary.yml'
  push:
    branches:
      - 'experiment/095-temporal-attachment-boundary'
      - main
    paths:
      - 'experiments/095_temporal_attachment_boundary.als'
      - 'experiments/095_temporal_attachment_boundary.md'
      - '.github/workflows/observation-095-temporal-attachment-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Temporal attachment boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 095 Alloy model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/095_temporal_attachment_boundary.als

      - name: Require temporal-attachment boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected = {
              'equivalentEncodingWitness': True,
              'lateTemporalLearningWitness': True,
              'sameCoreDifferentTemporalAnswer': True,
              'unknownTimeRetainsEventWitness': True,
              'EqualTemporalRelationGivesEqualDayProjection': False,
              'AttachmentPreservesKnownTemporalAnswers': False,
              'EventCoreDeterminesTemporalAnswer': True,
              'MissingAttachmentInventsNoDay': False,
          }

          wrong = []
          for name, want_sat in expected.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 095 receipt: {wrong}')
          PY
