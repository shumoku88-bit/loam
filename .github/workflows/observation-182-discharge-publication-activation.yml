name: Observation 182

on:
  pull_request:
    paths:
      - 'experiments/182_discharge_publication_safe.pml'
      - 'experiments/182_discharge_publication_unsafe_writer.pml'
      - 'experiments/182_discharge_publication_unsafe_reader.pml'
      - 'experiments/182_discharge_publication_unsafe_orphan_admission.pml'
      - 'experiments/182_discharge_publication_activation.md'
      - '.github/workflows/observation-182-discharge-publication-activation.yml'
  push:
    branches:
      - 'experiment/181-discharge-publication-activation'
      - main
    paths:
      - 'experiments/182_discharge_publication_safe.pml'
      - 'experiments/182_discharge_publication_unsafe_writer.pml'
      - 'experiments/182_discharge_publication_unsafe_reader.pml'
      - 'experiments/182_discharge_publication_unsafe_orphan_admission.pml'
      - 'experiments/182_discharge_publication_activation.md'
      - '.github/workflows/observation-182-discharge-publication-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spin:
    name: SPIN discharge publication activation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SPIN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y spin
          spin -V

      - name: Verify discharge-first Event-last candidate
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/182_discharge_publication_safe.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'errors:[[:space:]]+0' <<<"$output"

      - name: Require Event-first writer counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/182_discharge_publication_unsafe_writer.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected stale outstanding under Event-first writer order'
            exit 1
          fi

      - name: Require discharge-first reader counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/182_discharge_publication_unsafe_reader.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected stale outstanding under discharge-first reader order'
            exit 1
          fi

      - name: Require strict orphan-admission counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/182_discharge_publication_unsafe_orphan_admission.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected old outstanding query to be lost under strict orphan admission'
            exit 1
          fi