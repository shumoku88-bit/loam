name: Observation 153

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation153.lean'
      - 'Loam/Observations/Observation152.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Persistence/ActualValidityPersistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'experiments/153_production_fixture_parity.md'
      - '.github/workflows/observation-153-production-fixture-parity.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/153-production-fixture-parity'
      - main
    paths:
      - 'Loam/Observations/Observation153.lean'
      - 'Loam/Observations/Observation152.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Persistence/ActualValidityPersistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'experiments/153_production_fixture_parity.md'
      - '.github/workflows/observation-153-production-fixture-parity.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-fixture-parity:
    name: Lean production fixture parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check production fixture parity
        run: lake build Loam.Observations.Observation153
