name: Event Merchant Qualifications

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Publisher/EventMerchantPublisher.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Core/ActualEvidence.lean'
      - 'Loam/Core/EventMerchantEvidence.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Persistence/TokenSyntax.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Tui/EventMerchant.lean'
      - 'Loam/Tui/SelectedDay.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/EventMerchantPublisher.lean'
      - 'Loam/Tests/TuiEventMerchant.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/event-merchant.yml'
  push:
    branches:
      - main
      - feat/tui-event-merchant
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Publisher/EventMerchantPublisher.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Core/ActualEvidence.lean'
      - 'Loam/Core/EventMerchantEvidence.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Persistence/TokenSyntax.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Tui/EventMerchant.lean'
      - 'Loam/Tui/SelectedDay.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/EventMerchantPublisher.lean'
      - 'Loam/Tests/TuiEventMerchant.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/event-merchant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Event Merchant publication and TUI input
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Lean and build Event Merchant boundaries
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Publisher.EventMerchantPublisher Loam.Publisher.MovementPublisher Loam.Tui.Cli Loam.Tui.EventMerchant Loam.HouseholdCommand Loam.Tests.ActualWorldFixture

      - name: Run Event Merchant package test group
        run: lake test -- event-merchant
