name: Temporary Correction Scaling Stage 1

on:
  push:
    branches:
      - perf/actual-correction-scaling

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production loam binary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Measure correction-heavy history
        run: python3 tools/benchmark-actual-read.py --no-build --shape corrected --sizes 1000 5000 10000 --repeat 3 --timeout 120
