name: Fix Initial Role Caller

on:
  push:
    branches:
      - 'feat/initial-accounting-role-assignment'
    paths:
      - 'tools/fix-initial-role-caller.py'
      - '.github/workflows/fix-initial-role-caller.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact Locus session caller fix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/initial-accounting-role-assignment

      - name: Apply exact caller fix
        run: |
          python3 tools/fix-initial-role-caller.py
          git diff --check
          if git diff --quiet -- Loam/Tui/Cli.lean; then
            echo 'expected caller patch to change Loam/Tui/Cli.lean' >&2
            exit 1
          fi

      - name: Commit caller fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Cli.lean
          git commit -m 'fix(tui): pass data directory to Locus administration session'
          git push origin HEAD:feat/initial-accounting-role-assignment
