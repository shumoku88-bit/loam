name: Observation 195

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation195.lean'
      - 'Loam/Observations/Observation194.lean'
      - 'Loam/Observations/Observation193.lean'
      - 'Loam/Observations/Observation192.lean'
      - 'Loam/Observations/Observation191.lean'
      - 'Loam/Observations.lean'
      - 'experiments/195_semantic_result_observation.md'
      - '.github/workflows/observation-195-semantic-result-observation.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/195-semantic-result-observation'
      - main
    paths:
      - 'Loam/Observations/Observation195.lean'
      - 'Loam/Observations/Observation194.lean'
      - 'Loam/Observations/Observation193.lean'
      - 'Loam/Observations/Observation192.lean'
      - 'Loam/Observations/Observation191.lean'
      - 'Loam/Observations.lean'
      - 'experiments/195_semantic_result_observation.md'
      - '.github/workflows/observation-195-semantic-result-observation.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-result-observation:
    name: Lean semantic result observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check semantic result observation
        run: lake build Loam.Observations.Observation195
