name: Observation 037

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  j:
    name: J bitemporal memory quotient
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install J
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/j-linux64.tar.gz \
            https://github.com/jsoftware/jinstall/releases/download/build/linux64.tar.gz
          mkdir -p /tmp/j
          tar -xzf /tmp/j-linux64.tar.gz -C /tmp/j
          JCONSOLE="$(find /tmp/j -type f -name jconsole -print -quit)"
          test -n "$JCONSOLE"
          chmod +x "$JCONSOLE"
          printf 'JCONSOLE=%s\n' "$JCONSOLE" >> "$GITHUB_ENV"

      - name: Execute J observation
        shell: bash
        run: |
          set -euo pipefail
          "$JCONSOLE" j/037_check.ijs | tee /tmp/j-observation.txt
          grep -Fq 'Observation 037 / bitemporal memory quotient' /tmp/j-observation.txt
          grep -Fq 'admissible histories:' /tmp/j-observation.txt
          grep -Fxq '15' /tmp/j-observation.txt
          grep -Fq 'nested class counts V0..V5:' /tmp/j-observation.txt
          grep -Fq '1 2 5 6 9 15' /tmp/j-observation.txt
          grep -Fq 'kind-only full timeline classes:' /tmp/j-observation.txt
          grep -Fxq '4' /tmp/j-observation.txt
