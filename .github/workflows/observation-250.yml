name: Observation 250

on:
  pull_request:
    paths:
      - 'experiments/250_generic_purpose_savings_flow.lean'
      - 'experiments/250_generic_purpose_savings_flow.md'
      - '.github/workflows/observation-250.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify generic Purpose savings contribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build reused CurrentCoverage boundary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application.CurrentCoverageInspection
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Run Observation 250 witness
        run: lake env lean --run experiments/250_generic_purpose_savings_flow.lean
