name: Fix Accounting Report Comment

on:
  push:
    branches: [feat/accounting-pl-report]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-accounting-report-comment]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/accounting-pl-report
      - name: Update stale module description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Loam/Tui/Reports.lean')
          text = p.read_text()
          old = '''Reports is presentation and query state only. Stock–Flow and Budget Window consume
          surface-independent shared review answers. Accounting remains an explicit
          evidence-limit surface. Liquidity keeps its unconditional UNKNOWN baseline while
          also exposing the read-only conditional selected-balance path earned by
          Observations 229 and 231.'''
          new = '''Reports is presentation and query state only. Stock–Flow, Transactions Flow,
          occurrence-time Accounting, and Budget Window consume surface-independent shared
          review answers. Accounting composes the explicit RoleFlow boundary without adding a
          second accounting engine. Liquidity keeps its unconditional UNKNOWN baseline while
          also exposing the read-only conditional selected-balance path earned by
          Observations 229 and 231.'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale module description, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-accounting-report-comment.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Loam/Tui/Reports.lean
          git diff --cached --check
          git commit -m "docs(reports): describe role-flow accounting surface"
          git push origin HEAD:feat/accounting-pl-report
