name: Stateless Shadow Quantity

on:
  pull_request:
    paths:
      - 'Loam/ShadowQuantityCli.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Core/**'
      - 'Loam/Observations/Observation078.lean'
      - 'tools/loam'
      - 'tools/private-quantity-parity'
      - 'tools/private-source-shape-summary'
      - 'lakefile.lean'
      - '.github/workflows/stateless-shadow-quantity.yml'
  push:
    branches:
      - feat/stateless-shadow-quantity
      - main
    paths:
      - 'Loam/ShadowQuantityCli.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Core/**'
      - 'Loam/Observations/Observation078.lean'
      - 'tools/loam'
      - 'tools/private-quantity-parity'
      - 'tools/private-source-shape-summary'
      - 'lakefile.lean'
      - '.github/workflows/stateless-shadow-quantity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-quantity:
    name: Read-only recorded quantity shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Build stateless shadow quantity executable
        run: lake build loamShadowQuantity

      - name: Exercise synthetic whole-file shape
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-shadow-quantity.XXXXXX.journal)"
          cat >"$fixture" <<'EOF'
          include synthetic-accounts.journal

          2099-01-01 * synthetic opening
              ; synthetic: metadata
              locus:wallet    100 unit
              locus:origin    -100 unit
          2099-01-02 synthetic split
            locus:wallet  -30 unit
          	locus:food	20 unit
          	locus:stock	10 unit
          EOF

          before="$(sha256sum "$fixture" | cut -d' ' -f1)"
          output="$(./tools/loam shadow-quantity "$fixture")"
          after="$(sha256sum "$fixture" | cut -d' ' -f1)"

          test "$before" = "$after"
          printf '%s\n' "$output"

          grep -Fq 'source: read-only; persistence: none; sidecar: none' <<<"$output"
          grep -Fq 'events projected: 2' <<<"$output"
          grep -Fq 'effects projected: 5' <<<"$output"
          grep -Fq 'header contexts not projected: 2' <<<"$output"
          grep -Fq 'metadata lines not projected: 1' <<<"$output"
          grep -Fq 'include directives not projected: 1' <<<"$output"
          grep -Fq 'locus:wallet: 70 unit' <<<"$output"
          grep -Fq 'locus:origin: -100 unit' <<<"$output"
          grep -Fq 'locus:food: 20 unit' <<<"$output"
          grep -Fq 'locus:stock: 10 unit' <<<"$output"

          rm -f "$fixture"

      - name: Qualify sanitized private source shape summary
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-source-shape-summary.XXXXXX.journal)"
          trap 'rm -f "$fixture"' EXIT

          cat >"$fixture" <<'EOF'
          include private-secret-include.journal
          ; private-secret-top-level-annotation

          2099-01-01 * private-secret-opening-description
              ; private-secret-event-metadata
              private-secret-wallet 100 unit
              private-secret-origin -100 unit
          2099-01-02 private-secret-split-description
              private-secret-wallet -40 unit
              private-secret-food 40 unit
          EOF

          before="$(sha256sum "$fixture" | cut -d' ' -f1)"
          output="$(./tools/private-source-shape-summary "$fixture")"
          after="$(sha256sum "$fixture" | cut -d' ' -f1)"

          test "$before" = "$after"
          grep -Fq 'LOAM private source shape summary' <<<"$output"
          grep -Fq 'events projected: 2' <<<"$output"
          grep -Fq 'effects projected: 4' <<<"$output"
          grep -Fq 'header contexts not projected: 2' <<<"$output"
          grep -Fq 'metadata lines not projected: 2' <<<"$output"
          grep -Fq 'include directives not projected: 1' <<<"$output"
          grep -Fq 'source unchanged: yes' <<<"$output"
          grep -Fq 'private source/value output: withheld' <<<"$output"

          ! grep -Fq 'private-secret' <<<"$output"
          ! grep -Fq '100' <<<"$output"
          ! grep -Fq -- '-100' <<<"$output"
          ! grep -Fq -- '-40' <<<"$output"

      - name: Qualify private parity row entrance and sanitizer
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-private-parity.XXXXXX.journal)"
          adapter="$(mktemp -t loam-native-adapter.XXXXXX)"
          mismatch_adapter="$(mktemp -t loam-native-mismatch.XXXXXX)"
          trap 'rm -f "$fixture" "$adapter" "$mismatch_adapter"' EXIT

          cat >"$fixture" <<'EOF'
          2099-01-01 synthetic opening
            locus:wallet 100 unit
            locus:origin -100 unit
          2099-01-02 synthetic split
            locus:wallet -30 unit
            locus:food 20 unit
            locus:stock 10 unit
          EOF

          rows="$(./tools/loam shadow-quantity --parity-rows "$fixture")"
          grep -Fq $'locus:wallet\tunit\t70' <<<"$rows"
          grep -Fq $'locus:origin\tunit\t-100' <<<"$rows"
          grep -Fq $'locus:food\tunit\t20' <<<"$rows"
          grep -Fq $'locus:stock\tunit\t10' <<<"$rows"

          cat >"$adapter" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          test -f "$1"
          printf '%s\n' \
            $'locus:stock\tunit\t10' \
            $'locus:food\tunit\t20' \
            $'locus:origin\tunit\t-100' \
            $'locus:wallet\tunit\t70'
          EOF
          chmod +x "$adapter"

          output="$(./tools/private-quantity-parity "$fixture" "$adapter")"
          grep -Fq 'LOAM private quantity parity: PASS' <<<"$output"
          grep -Fq 'non-zero coordinates: 4' <<<"$output"
          grep -Fq 'source unchanged: yes' <<<"$output"
          grep -Fq 'private coordinate/value output: withheld' <<<"$output"
          ! grep -Fq 'locus:wallet' <<<"$output"

          cat >"$mismatch_adapter" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          test -f "$1"
          printf '%s\n' $'private-secret-locus\tunit\t999999'
          EOF
          chmod +x "$mismatch_adapter"

          set +e
          mismatch="$(./tools/private-quantity-parity "$fixture" "$mismatch_adapter" 2>&1)"
          status=$?
          set -e

          test "$status" -eq 1
          grep -Fq 'LOAM private quantity parity: MISMATCH' <<<"$mismatch"
          grep -Fq 'private coordinate/value diff: withheld' <<<"$mismatch"
          ! grep -Fq 'private-secret-locus' <<<"$mismatch"
          ! grep -Fq '999999' <<<"$mismatch"

      - name: Fail closed on unsupported source lines
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-shadow-quantity-invalid.XXXXXX.journal)"
          cat >"$fixture" <<'EOF'
          2099-01-01 synthetic
              locus:wallet 10 unit
              unsupported posting shape
          EOF

          set +e
          output="$(./tools/loam shadow-quantity "$fixture" 2>&1)"
          status=$?
          set -e

          test "$status" -eq 2
          grep -Fq 'refused malformed or unsupported source lines' <<<"$output"
          grep -Fq 'no LOAM persistence was written' <<<"$output"
          ! grep -Fq 'unsupported posting shape' <<<"$output"

          rm -f "$fixture"
