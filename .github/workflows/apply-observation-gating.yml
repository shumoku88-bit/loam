name: Apply observation path gating

on:
  push:
    branches:
      - ci/gate-observation-workflows
    paths:
      - '.github/workflows/apply-observation-gating.yml'

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/gate-observation-workflows

      - name: Gate historical observations away from practical Core changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = """on:\n  pull_request:\n  push:\n    branches:\n      - main\n"""
          new = """on:\n  pull_request:\n    paths:\n      - 'Loam/Observations/**'\n      - 'Loam/Observations.lean'\n      - 'model/**'\n      - 'j/**'\n      - 'scheme/**'\n      - 'tla/**'\n      - 'observations/**'\n      - 'Loam.lean'\n      - 'lakefile.lean'\n      - 'lake-manifest.json'\n      - 'lean-toolchain'\n      - '.github/workflows/observation-*.yml'\n  push:\n    branches:\n      - main\n    paths:\n      - 'Loam/Observations/**'\n      - 'Loam/Observations.lean'\n      - 'model/**'\n      - 'j/**'\n      - 'scheme/**'\n      - 'tla/**'\n      - 'observations/**'\n      - 'Loam.lean'\n      - 'lakefile.lean'\n      - 'lake-manifest.json'\n      - 'lean-toolchain'\n      - '.github/workflows/observation-*.yml'\n  workflow_dispatch:\n"""

          changed = []
          already = []
          for path in sorted(Path('.github/workflows').glob('observation-*.yml')):
              text = path.read_text()
              if "- 'Loam/Observations/**'" in text:
                  already.append(path.name)
                  continue
              if old not in text:
                  raise SystemExit(f'unexpected trigger shape: {path}')
              path.write_text(text.replace(old, new, 1))
              changed.append(path.name)

          print(f'already gated: {len(already)}')
          print(f'newly gated: {len(changed)}')
          if len(already) != 7 or len(changed) != 44:
              raise SystemExit(
                  f'expected 7 already gated and 44 new; got {len(already)} and {len(changed)}')
          PY

          mkdir -p /tmp/gated-observations
          cp .github/workflows/observation-*.yml /tmp/gated-observations/

      - name: Upload transformed workflows
        uses: actions/upload-artifact@v4
        with:
          name: gated-observation-workflows
          path: /tmp/gated-observations
          if-no-files-found: error
          retention-days: 1
