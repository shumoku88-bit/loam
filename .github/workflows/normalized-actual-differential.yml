name: Normalized Actual Differential

on:
  push:
    branches:
      - experiment/normalized-actual-differential
  pull_request:
    paths:
      - 'tools/normalized_actual.py'
      - 'tools/normalized_actual_fixture.loam'
      - 'tools/normalized_to_current_fixture.py'
      - 'tools/compare_actual_observations.py'
      - 'Loam/Tests/NormalizedActualProductionObservation.lean'
      - '.github/workflows/normalized-actual-differential.yml'
      - 'Loam/Application/**'
      - 'Loam/Persistence/**'
      - 'Loam/MovementManifestAuthority.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Normalized/current production semantic parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production Lean boundary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Materialize one synthetic world in current production persistence
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          echo "DIFF_ROOT=$tmpdir" >> "$GITHUB_ENV"
          mkdir -p "$tmpdir/movement-authority"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$tmpdir/movement-authority" bank food misc friend
          python3 tools/normalized_to_current_fixture.py \
            tools/normalized_actual_fixture.loam "$tmpdir"

      - name: Compare normalized semantics with current production readers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/normalized_actual.py observe \
            tools/normalized_actual_fixture.loam >"$DIFF_ROOT/normalized.obs"
          lake env lean --run Loam/Tests/NormalizedActualProductionObservation.lean \
            "$DIFF_ROOT" >"$DIFF_ROOT/production.obs"
          python3 tools/compare_actual_observations.py \
            "$DIFF_ROOT/normalized.obs" "$DIFF_ROOT/production.obs"
