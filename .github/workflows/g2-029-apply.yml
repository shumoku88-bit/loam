name: G2-029 narrow apply

on:
  push:
    branches: [audit/g2-029-hra-scheduled-unknown]
    paths: [.github/workflows/g2-029-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/g2-029-hra-scheduled-unknown
          fetch-depth: 0

      - name: Preserve HRA Scheduled Unknown
        shell: python
        run: |
          from pathlib import Path

          def replace_between(text, start, end, replacement):
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          path = Path("Loam/Tui/HraScheduled.lean")
          text = path.read_text()

          marker = "abbrev Record := ScheduledOccurrence String\n"
          addition = marker + '''\n/-- Presentation result for one HRA Scheduled scope. Unknown is not an empty answer. -/\ninductive ScopeEvidence where\n  | records (rows : List Record)\n  | unknown\n  deriving Repr, DecidableEq\n'''
          if text.count(marker) != 1:
              raise SystemExit("Record marker changed")
          text = text.replace(marker, addition, 1)

          text = replace_between(
              text,
              "\ndef scopeRecordsResult",
              "\ndef recordsForScope",
              '''\ndef scopeEvidence (snapshot : Snapshot) (state : State) : Except String ScopeEvidence :=\n  match snapshot.scheduled with\n  | .error message => .error message\n  | .ok scheduled =>\n      match state.scope with\n      | .focusDay =>\n          match Loam.ScheduledReview.dayEvidence scheduled state.focusDate with\n          | .due first rest => .ok (.records (first :: rest))\n          | .unknown => .ok .unknown\n          | .unknownCompletionScheduled => .error "Scheduled completion evidence references an unknown identity."\n          | .unknownRetirementScheduled => .error "Scheduled retirement evidence references an unknown identity."\n          | .unknownReplacementScheduled => .error "Scheduled replacement evidence references an unknown identity."\n          | .invalidReplacementGraph => .error "Scheduled replacement topology is invalid."\n          | .conflictingTerminalEvidence => .error "Scheduled terminal evidence conflicts."\n      | .allCurrent =>\n          match Loam.ScheduledReview.currentOpenRecords scheduled with\n          | .ok records =>\n              .ok (.records (records.mergeSort fun left right =>\n                if left.scheduledOn = right.scheduledOn then left.id.token ≤ right.id.token\n                else left.scheduledOn ≤ right.scheduledOn))\n          | .error message => .error message\n''',
          )

          text = replace_between(
              text,
              "\ndef recordsForScope",
              "\ndef lociForScope",
              '''\n/-- Local browse mechanics project only explicit rows; presentation completeness uses `scopeEvidence`. -/\ndef recordsForScope (snapshot : Snapshot) (state : State) : List Record :=\n  match scopeEvidence snapshot state with\n  | .ok (.records records) => records\n  | .ok .unknown => []\n  | .error _ => []\n''',
          )

          text = replace_between(
              text,
              "\nprivate def paneRow",
              "\nprivate def detailLines",
              '''\nprivate def paneRow (snapshot : Snapshot) (state : State)\n    (leftWidth rightWidth row : Nat) : Widget :=\n  let locusIndex := locusWindowStart state + row\n  let occIndex := occWindowStart state + row\n  let leftPrefix :=\n    if locusIndex = state.locusRow then\n      if state.pane == .loci then " > " else " * "\n    else "   "\n  let rightPrefix :=\n    if occIndex = state.occurrenceRow && (visibleRecords snapshot state).length > 0 then\n      if state.pane == .occurrences then " > " else " * "\n    else "   "\n  let leftText :=\n    match locusLabel snapshot state locusIndex with\n    | some label => leftPrefix ++ label\n    | none => ""\n  let rightText :=\n    match (visibleRecords snapshot state)[occIndex]? with\n    | some record => rightPrefix ++ scheduledSummary record\n    | none =>\n        if row = 0 && (visibleRecords snapshot state).isEmpty then\n          match scopeEvidence snapshot state with\n          | .error message => " [Unavailable] " ++ message\n          | .ok .unknown => " (Unknown; no completeness horizon claimed)"\n          | .ok (.records _) =>\n              match state.scope with\n              | .focusDay => " (none due on this day)"\n              | .allCurrent => " (no current-open Scheduled occurrences)"\n        else ""\n  .row [span (fit leftWidth leftText), span " | ", span (fit rightWidth rightText)]\n''',
          )

          text = replace_between(
              text,
              "\nprivate def detailLines",
              "\nprivate def footer",
              '''\nprivate def detailLines (snapshot : Snapshot) (state : State) : List Widget :=\n  match selectedRecord? snapshot state with\n  | none =>\n      match scopeEvidence snapshot state with\n      | .error message =>\n          [ plainLine " Selected Scheduled Details:"\n          , plainLine ("   [Unavailable] " ++ message)\n          ]\n      | .ok .unknown =>\n          [ plainLine " Selected Scheduled Details:"\n          , mutedLine "   (Unknown; no completeness horizon claimed)"\n          ]\n      | .ok (.records _) =>\n          [ plainLine " Selected Scheduled Details:"\n          , mutedLine "   (no Scheduled selected)"\n          ]\n  | some record =>\n      [ plainLine " Selected Scheduled Details:"\n      , plainLine ("   Identity    : " ++ record.id.token)\n      , plainLine ("   Due Date    : " ++ record.scheduledOn)\n      , plainLine ("   Summary     : " ++ Loam.ScheduledReview.summary record)\n      , plainLine "   Expected Effects:"\n      ] ++\n      (record.movement.changes.map fun change =>\n        plainLine ("     " ++ fit 28 change.coordinate.token ++ " " ++ toString change.quantity.quanta ++ " " ++ record.measure.token))\n''',
          )

          start = text.index("  let rightHeader :=")
          end = text.index("  let body :=", start)
          header = '''  let rightHeader :=\n    match scopeEvidence snapshot state with\n    | .error _ => fit rightWidth " Scheduled [Unavailable]"\n    | .ok .unknown => fit rightWidth " Scheduled [Unknown]"\n    | .ok (.records _) =>\n        fit rightWidth\n          (if state.pane == .occurrences then " Scheduled [active] (" ++ toString occCount ++ ")"\n           else " Scheduled (" ++ toString occCount ++ ")")\n'''
          text = text[:start] + header + text[end:]
          path.write_text(text)

          path = Path("Loam/Tests/TuiHraScheduled.lean")
          text = path.read_text()
          anchor = '''  expect ((Loam.Tui.HraScheduled.recordsForScope snapshot start).length == 2)\n    "HRA Scheduled Focus Day did not return the two scheduled occurrences on 2026-09-07"\n'''
          addition = anchor + '''\n  -- Unknown day evidence stays distinct from an empty complete answer.\n  let unknownState := Loam.Tui.HraScheduled.initial "2026-09-09"\n  match Loam.Tui.HraScheduled.scopeEvidence snapshot unknownState with\n  | .ok .unknown => pure ()\n  | _ => throw (IO.userError "HRA Scheduled Focus Day did not preserve Unknown evidence")\n  let unknownText := widgetText\n    (Loam.Tui.HraScheduled.view { width := 100, height := 30 } snapshot unknownState)\n  expect (contains "Scheduled [Unknown]" unknownText &&\n    contains "Unknown; no completeness horizon claimed" unknownText)\n    "HRA Scheduled did not render open-world Unknown explicitly"\n  expect (!contains "none due on this day" unknownText)\n    "HRA Scheduled collapsed Unknown into an empty-day claim"\n'''
          if text.count(anchor) != 1:
              raise SystemExit("TuiHraScheduled Focus Day anchor changed")
          path.write_text(text.replace(anchor, addition, 1))

      - name: Guard G2-029 scope
        shell: python
        run: |
          from pathlib import Path
          source = Path("Loam/Tui/HraScheduled.lean").read_text()
          test = Path("Loam/Tests/TuiHraScheduled.lean").read_text()
          for token in ["inductive ScopeEvidence", "| unknown", "def scopeEvidence", "Scheduled [Unknown]", "Unknown; no completeness horizon claimed"]:
              if token not in source:
                  raise SystemExit(f"missing G2-029 source token: {token}")
          if "| .unknown => .ok []" in source:
              raise SystemExit("HRA Scheduled still collapses Unknown to empty success")
          if "HRA Scheduled collapsed Unknown into an empty-day claim" not in test:
              raise SystemExit("focused Unknown regression missing")

      - name: Commit narrow fix and remove helper workflow
        run: |
          git rm .github/workflows/g2-029-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam/Tui/HraScheduled.lean Loam/Tests/TuiHraScheduled.lean
          git commit -m "fix(tui): preserve G2-029 Scheduled Unknown"
          git push
