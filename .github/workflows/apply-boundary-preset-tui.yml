name: Apply Boundary Preset TUI Patch

on:
  push:
    branches:
      - 'feat/tui-report-boundary-presets'
    paths:
      - '.github/workflows/apply-boundary-preset-tui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tui-report-boundary-presets
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/apply-boundary-preset-tui.py

      - name: Remove one-shot patch helpers
        run: git rm .github/workflows/apply-boundary-preset-tui.yml tools/apply-boundary-preset-tui.py

      - name: Commit final production tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Reports.lean Loam/Tui/Cli.lean Loam/Tests/TuiReports.lean
          git commit -m 'feat(tui): add replaceable report window presets'
          git push origin HEAD:feat/tui-report-boundary-presets
