name: Apply Boundary Preset TUI Patch

on:
  push:
    branches:
      - 'feat/tui-report-boundary-presets'
    paths:
      - '.github/workflows/apply-boundary-preset-tui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tui-report-boundary-presets
          fetch-depth: 0

      - name: Apply narrow Reports preset patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          reports = "Loam/Tui/Reports.lean"
          replace_once(
              reports,
              "import Loam.ActualDate\n",
              "import Loam.ActualDate\nimport Loam.BoundaryPresetConfig\n",
          )
          replace_once(
              reports,
              "inductive Mode where\n  | menu\n  | stockFlow\n  | accounting\n  | liquidity\n  | budgetWindow\n  deriving Repr, DecidableEq\n\nstructure Form where",
              "inductive Mode where\n  | menu\n  | stockFlow\n  | accounting\n  | liquidity\n  | budgetWindow\n  deriving Repr, DecidableEq\n\n/-- Presentation-only source for the explicit report coordinates. -/\ninductive WindowSource where\n  | calendarMonth\n  | preset (index : Nat)\n  | custom\n  deriving Repr, DecidableEq\n\nstructure Form where",
          )
          replace_once(
              reports,
              "  calendarAnchor : String := \"\"\n  stockFlowSnapshot : Option Loam.StockFlowReview.Snapshot := none",
              "  calendarAnchor : String := \"\"\n  windowPresets : List Loam.BoundaryPresetConfig.Preset := []\n  windowSource : WindowSource := .calendarMonth\n  stockFlowSnapshot : Option Loam.StockFlowReview.Snapshot := none",
          )
          replace_once(
              reports,
              "/--\nSeed the shared explicit-window editor with the Gregorian month containing the\nHome selected day. This is presentation convenience only, not a household cycle.\nThe conditional outlook gets the final day of that same month as an editable\nassumption-horizon prefill; it is not executed until the user explicitly runs it.\n-/\ndef initialForDate (selectedDate : String) : State :=\n  match Loam.Tui.Calendar.calendarMonthWindowForDate? selectedDate with\n  | some (start, endExclusive) =>\n      {\n        mode := .menu\n        form := { start := start, endExclusive := endExclusive, focus := ⟨2, by decide⟩ }\n        liquidityForm := liquidityFormForEndExclusive endExclusive\n        calendarAnchor := selectedDate\n      }\n  | none =>\n      {\n        mode := .menu\n        calendarAnchor := selectedDate\n        notice := \"Calendar-month prefill unavailable; enter explicit report coordinates.\"\n      }",
              "/--\nSeed the shared explicit-window editor with the Gregorian month containing the\nHome selected day. Named presets remain replaceable presentation/query\nconfiguration; they are resolved to explicit coordinates before any report query\nis emitted. The conditional outlook keeps its independent editable assumption\nhorizon and is not executed until the user explicitly runs it.\n-/\ndef initialForDateWithPresets\n    (selectedDate : String)\n    (presets : List Loam.BoundaryPresetConfig.Preset) : State :=\n  match Loam.Tui.Calendar.calendarMonthWindowForDate? selectedDate with\n  | some (start, endExclusive) =>\n      {\n        mode := .menu\n        form := { start := start, endExclusive := endExclusive, focus := ⟨2, by decide⟩ }\n        liquidityForm := liquidityFormForEndExclusive endExclusive\n        calendarAnchor := selectedDate\n        windowPresets := presets\n        windowSource := .calendarMonth\n      }\n  | none =>\n      {\n        mode := .menu\n        calendarAnchor := selectedDate\n        windowPresets := presets\n        windowSource := .calendarMonth\n        notice := \"Calendar-month prefill unavailable; enter explicit report coordinates.\"\n      }\n\n/-- Compatibility initializer when no named presets were loaded. -/\ndef initialForDate (selectedDate : String) : State :=\n  initialForDateWithPresets selectedDate []",
          )
          replace_once(
              reports,
              "      form := { state.form with start := start, endExclusive := endExclusive }\n      notice := \"\"",
              "      form := { state.form with start := start, endExclusive := endExclusive }\n      windowSource := .calendarMonth\n      notice := \"\"",
          )
          marker = "  | none =>\n      withError state \"Calendar-month reset unavailable; enter an explicit window.\"\n\nprivate def resetLiquidityHorizon"
          insertion = """  | none =>
      withError state \"Calendar-month reset unavailable; enter an explicit window.\"

/-- Human-readable label for presentation only; it never enters a report query. -/
def windowSourceLabel (state : State) : String :=
  match state.windowSource with
  | .calendarMonth => \"Calendar Month\"
  | .custom => \"Custom\"
  | .preset index =>
      match state.windowPresets.get? index with
      | some preset => preset.name
      | none => \"Unavailable preset\"

private def selectPreset (state : State) (index : Nat) : State :=
  match state.windowPresets.get? index with
  | none =>
      clearResults {
        state with
          form := { start := \"\", endExclusive := \"\", focus := ⟨0, by decide⟩ }
          windowSource := .preset index
          notice := \"Selected report preset is unavailable.\"
      }
  | some preset =>
      match Loam.BoundaryPresetConfig.windowForDate? preset state.calendarAnchor with
      | some (start, endExclusive) =>
          clearResults {
            state with
              form := { start := start, endExclusive := endExclusive, focus := ⟨2, by decide⟩ }
              windowSource := .preset index
              notice := \"\"
          }
      | none =>
          clearResults {
            state with
              form := { start := \"\", endExclusive := \"\", focus := ⟨0, by decide⟩ }
              windowSource := .preset index
              notice :=
                \"Preset \" ++ preset.name ++
                \" has no explicit adjacent boundary window for \" ++ state.calendarAnchor ++ \".\"
          }

/-- Cycle only among Calendar Month and loaded named presets; Custom is reached by editing. -/
def cycleWindowSource (state : State) (forward : Bool) : State :=
  let count := state.windowPresets.length + 1
  let current :=
    match state.windowSource with
    | .calendarMonth => 0
    | .preset index => index + 1
    | .custom => 0
  let next :=
    if forward then
      (current + 1) % count
    else
      (current + count - 1) % count
  if next = 0 then resetCalendarMonth state else selectPreset state (next - 1)

private def editWindowState (state : State) (edit : String → String) : State :=
  let next := clearResults {
    state with
      form := editActive state.form edit
      notice := \"\"
  }
  if state.form.focus.val < 2 then { next with windowSource := .custom } else next

private def resetLiquidityHorizon"""
          replace_once(reports, marker, insertion)
          replace_once(
              reports,
              "/-- Shift only when the currently visible coordinates are exactly one calendar month. -/\ndef shiftCalendarMonth (state : State) (forward : Bool) : State :=\n  match Loam.Tui.Calendar.shiftCalendarMonthWindow?\n      state.form.start state.form.endExclusive forward with\n  | some (start, endExclusive) => setCalendarWindow state start endExclusive\n  | none =>\n      { state with\n          notice := \"Arrow keys shift calendar-month windows only; press m to restore one.\" }",
              "/-- Shift only while Calendar Month is the selected presentation source. -/\ndef shiftCalendarMonth (state : State) (forward : Bool) : State :=\n  match state.windowSource with\n  | .calendarMonth =>\n      match Loam.Tui.Calendar.shiftCalendarMonthWindow?\n          state.form.start state.form.endExclusive forward with\n      | some (start, endExclusive) => setCalendarWindow state start endExclusive\n      | none =>\n          { state with\n              notice := \"Calendar-month coordinates are unavailable; press m to restore them.\" }\n  | _ =>\n      { state with\n          notice := \"Arrow keys shift Calendar Month only; press m or [ / ] to choose a source.\" }",
          )
          replace_once(
              reports,
              "  | .left => { state := shiftCalendarMonth state false }\n  | .right => { state := shiftCalendarMonth state true }\n  | .tab =>",
              "  | .left => { state := shiftCalendarMonth state false }\n  | .right => { state := shiftCalendarMonth state true }\n  | .input '[' => { state := cycleWindowSource state false }\n  | .input ']' => { state := cycleWindowSource state true }\n  | .tab =>",
          )
          replace_once(
              reports,
              "  | .backspace =>\n      { state := clearResults { state with\n          form := editActive state.form (fun text => String.ofList text.toList.dropLast)\n          notice := \"\" } }\n  | .input 'm' | .input 'M' => { state := resetCalendarMonth state }\n  | .input char =>\n      { state := clearResults { state with\n          form := editActive state.form (fun text => text.push char)\n          notice := \"\" } }",
              "  | .backspace =>\n      { state := editWindowState state (fun text => String.ofList text.toList.dropLast) }\n  | .input 'm' | .input 'M' => { state := resetCalendarMonth state }\n  | .input char =>\n      { state := editWindowState state (fun text => text.push char) }",
          )
          replace_once(
              reports,
              "    , muted \"Calendar month is only a coordinate convenience, not a household cycle.\"\n    , blank\n    , field state 0 \"Start\" state.form.start",
              "    , muted \"Calendar month is only a coordinate convenience, not a household cycle.\"\n    , line (\"Window: \" ++ windowSourceLabel state)\n    , muted \"Named presets are replaceable query config; reports still receive explicit coordinates only.\"\n    , blank\n    , field state 0 \"Start\" state.form.start",
          )
          replace_once(
              reports,
              "    , muted \"← / → calendar month   m selected-day month\"\n    , muted \"Tab / Shift-Tab focus   Enter next/run   Backspace delete\"",
              "    , muted \"[ / ] window source   ← / → Calendar Month   m selected-day month\"\n    , muted \"Tab / Shift-Tab focus   Enter next/run   Backspace delete\"",
          )
          replace_once(
              reports,
              "    [ line \"Reports / Budget Window\"\n    , muted \"Calendar month is only a coordinate convenience, not a household cycle.\"\n    , blank\n    , field state 0 \"Start\" state.form.start",
              "    [ line \"Reports / Budget Window\"\n    , muted \"Calendar month is only a coordinate convenience, not a household cycle.\"\n    , line (\"Window: \" ++ windowSourceLabel state)\n    , muted \"Named presets are replaceable query config; reports still receive explicit coordinates only.\"\n    , blank\n    , field state 0 \"Start\" state.form.start",
          )
          replace_once(
              reports,
              "    , muted \"← / → calendar month   m selected-day month\"\n    , muted \"Tab / Shift-Tab focus   Enter next/run   Backspace delete\"\n    , muted \"b / Esc Reports menu   q quit\"\n    , line state.notice\n    ]\n\n\ndef view",
              "    , muted \"[ / ] window source   ← / → Calendar Month   m selected-day month\"\n    , muted \"Tab / Shift-Tab focus   Enter next/run   Backspace delete\"\n    , muted \"b / Esc Reports menu   q quit\"\n    , line state.notice\n    ]\n\n\ndef view",
          )

          cli = "Loam/Tui/Cli.lean"
          replace_once(
              cli,
              "import Loam.Tui.Reports\n",
              "import Loam.Tui.Reports\nimport Loam.BoundaryPresetConfig\n",
          )
          replace_once(
              cli,
              "  else if isHome && (key = .input 'v' || key = .input 'V') then\n    let reports := Loam.Tui.Reports.initialForDate state.selectedDate\n    let reportsFrame := compileWidget (Loam.Tui.Reports.view reports)",
              "  else if isHome && (key = .input 'v' || key = .input 'V') then\n    let reports ←\n      match ← Loam.BoundaryPresetConfig.load? (dataDir / \"boundary-presets.tsv\") with\n      | some presets =>\n          pure (Loam.Tui.Reports.initialForDateWithPresets state.selectedDate presets)\n      | none =>\n          let base := Loam.Tui.Reports.initialForDate state.selectedDate\n          pure { base with\n            notice := \"Boundary preset config malformed; named presets unavailable.\" }\n    let reportsFrame := compileWidget (Loam.Tui.Reports.view reports)",
          )

          tests = "Loam/Tests/TuiReports.lean"
          anchor = """  expect (initial.liquidityForm.focus.val == 1)
    \"conditional outlook prefill did not focus explicit Run\"

  let stock := (Loam.Tui.Reports.update initial .enter).state
"""
          inserted = """  expect (initial.liquidityForm.focus.val == 1)
    \"conditional outlook prefill did not focus explicit Run\"

  let pension : Loam.BoundaryPresetConfig.Preset := {
    name := \"Pension\"
    boundaries := [\"2026-08-15\", \"2026-10-15\"]
  }
  let presetInitial := Loam.Tui.Reports.initialForDateWithPresets \"2026-09-07\" [pension]
  let presetStock := (Loam.Tui.Reports.update presetInitial .enter).state
  let pensionState := (Loam.Tui.Reports.update presetStock (.input ']')).state
  expect (Loam.Tui.Reports.windowSourceLabel pensionState == \"Pension\")
    \"named report preset was not selected\"
  expect (pensionState.form.start == \"2026-08-15\")
    \"Pension preset did not resolve the explicit previous boundary\"
  expect (pensionState.form.endExclusive == \"2026-10-15\")
    \"Pension preset did not resolve the explicit next boundary\"
  let pensionText := widgetText (Loam.Tui.Reports.view pensionState)
  expect (contains \"Window: Pension\" pensionText)
    \"Reports did not render the selected replaceable preset\"
  expect (contains \"explicit coordinates only\" pensionText)
    \"Reports lost the preset-to-coordinate boundary\"
  match (Loam.Tui.Reports.update pensionState .enter).query with
  | some (.stockFlow start endExclusive) =>
      expect (start == \"2026-08-15\") \"preset Stock-Flow query changed start\"
      expect (endExclusive == \"2026-10-15\") \"preset Stock-Flow query changed end\"
  | _ => throw (IO.userError \"preset Stock-Flow did not reduce to an explicit coordinate query\")

  let calendarAgain := (Loam.Tui.Reports.update pensionState (.input ']')).state
  expect (Loam.Tui.Reports.windowSourceLabel calendarAgain == \"Calendar Month\")
    \"window-source cycle did not return to Calendar Month\"
  expect (calendarAgain.form.start == \"2026-09-01\")
    \"Calendar Month source did not restore selected-day month start\"
  expect (calendarAgain.form.endExclusive == \"2026-10-01\")
    \"Calendar Month source did not restore selected-day month end\"

  let customEditing : Loam.Tui.Reports.State := {
    pensionState with form := { pensionState.form with focus := ⟨0, by decide⟩ }
  }
  let customState := (Loam.Tui.Reports.update customEditing .backspace).state
  expect (Loam.Tui.Reports.windowSourceLabel customState == \"Custom\")
    \"manual coordinate edit did not become Custom presentation state\"

  let outBase := Loam.Tui.Reports.initialForDateWithPresets \"2026-10-15\" [pension]
  let outStock := (Loam.Tui.Reports.update outBase .enter).state
  let outPreset := (Loam.Tui.Reports.update outStock (.input ']')).state
  expect (outPreset.form.start.isEmpty && outPreset.form.endExclusive.isEmpty)
    \"preset without a later explicit boundary left stale coordinates visible\"
  expect (contains \"no explicit adjacent boundary window\" outPreset.notice)
    \"preset exhaustion did not fail closed with an explanation\"

  let stock := (Loam.Tui.Reports.update initial .enter).state
"""
          replace_once(tests, anchor, inserted)
          PY

      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/apply-boundary-preset-tui.yml

      - name: Commit final production tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Reports.lean Loam/Tui/Cli.lean Loam/Tests/TuiReports.lean
          git commit -m 'feat(tui): add replaceable report window presets'
          git push origin HEAD:feat/tui-report-boundary-presets
