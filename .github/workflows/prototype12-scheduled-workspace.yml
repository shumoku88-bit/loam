name: Prototype 12 Scheduled Workspace

on:
  pull_request:
    paths:
      - 'Loam/ScheduledReview.lean'
      - 'Loam/Prototype/VerifiedTui04/**'
      - 'Loam/Prototype/VerifiedTui09/**'
      - 'Loam/Prototype/VerifiedTui10/**'
      - 'Loam/Prototype/VerifiedTui11/**'
      - 'Loam/Prototype/VerifiedTui12/**'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/ScheduledOpenWorldInspection.lean'
      - 'Loam/Persistence/Scheduled*.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/prototype12-scheduled-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean Scheduled workspace under shared SelectedDay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Build previous and Scheduled workspace prototypes
        run: lake build loamUiPrototype11 loamUiPrototype12
