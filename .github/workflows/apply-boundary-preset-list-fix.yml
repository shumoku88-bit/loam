name: Apply Boundary Preset List Fix

on:
  push:
    branches:
      - 'feat/tui-report-boundary-presets'
    paths:
      - '.github/workflows/apply-boundary-preset-list-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tui-report-boundary-presets
          fetch-depth: 0

      - name: Apply Lean list lookup fix
        run: python3 tools/fix-boundary-preset-tui.py

      - name: Remove one-shot helpers
        run: rm tools/fix-boundary-preset-tui.py .github/workflows/apply-boundary-preset-list-fix.yml

      - name: Commit final production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(tui): use explicit preset list lookup'
          git push origin HEAD:feat/tui-report-boundary-presets
