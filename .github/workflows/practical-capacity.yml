name: Practical Capacity

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Core/Capacity.lean'
      - 'Loam/Core/CapacityMemory.lean'
      - 'Loam/Core.lean'
      - 'Loam/Application/CapacityInspection.lean'
      - 'Loam/CapacityReview.lean'
      - 'Loam/CapacityEvidence.lean'
      - 'Loam/CapacityAuthority.lean'
      - 'Loam/Persistence/NormalizedCapacityPersistence.lean'
      - 'Loam/Cli/CapacityCli.lean'
      - 'Loam/Tests/CapacityDogfood.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - '.github/workflows/practical-capacity.yml'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Core/Capacity.lean'
      - 'Loam/Core/CapacityMemory.lean'
      - 'Loam/Core.lean'
      - 'Loam/Application/CapacityInspection.lean'
      - 'Loam/CapacityReview.lean'
      - 'Loam/CapacityEvidence.lean'
      - 'Loam/CapacityAuthority.lean'
      - 'Loam/Persistence/NormalizedCapacityPersistence.lean'
      - 'Loam/Cli/CapacityCli.lean'
      - 'Loam/Tests/CapacityDogfood.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - '.github/workflows/practical-capacity.yml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and exercise capacity entrance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Capacity executable
        uses: ./.github/actions/lean-build
        with:
          build-args: loamCapacity

      - name: Run Capacity memory and persistence check
        shell: bash
        run: lake env lean --run Loam/Tests/CapacityDogfood.lean

      - name: Exercise practical capacity entrance
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          capacity="$tmpdir/capacity.loam"
          rejected="$tmpdir/rejected.log"

          printf 'unallocated\nfood\n100\n' | .lake/build/bin/loamCapacity "$capacity"
          printf 'food\ngroceries\n40\n' | .lake/build/bin/loamCapacity "$capacity"

          if printf 'food\ngroceries\n61\n' | .lake/build/bin/loamCapacity "$capacity" >"$rejected" 2>&1; then
            echo 'capacity entrance admitted a named-source overdraft' >&2
            exit 1
          fi
          grep -F 'insufficient current entitlement' "$rejected"

          output="$(.lake/build/bin/loamCapacity show "$capacity")"
          printf '%s\n' "$output"
          grep -F 'food: 60 jpy' <<<"$output"
          grep -F 'groceries: 40 jpy' <<<"$output"
          if grep -Fq 'unallocated:' <<<"$output"; then
            echo 'internal unallocated boundary leaked into entitlement view' >&2
            exit 1
          fi

          grep -F $'LOAM-NORMALIZED-CAPACITY\t1' "$capacity"
          test ! -e "$capacity.effective"

          window="$(.lake/build/bin/loamCapacity show-window "$capacity" 2026-01-01 2099-01-01)"
          printf '%s\n' "$window"
          grep -F 'food: 60 jpy' <<<"$window"
          grep -F 'groceries: 40 jpy' <<<"$window"
