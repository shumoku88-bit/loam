name: Reversal derived inverse one-shot

on:
  push:
    branches:
      - refactor/reversal-derived-inverse

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/reversal-derived-inverse
      - name: Build proof and reversal boundary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core.BalancedMovement Loam.ActualReversalPublisher Loam.Tests.ActualWorldFixture Loam.Tests.ActualReversalPublisher
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Verify exact reversal publication
        shell: bash
        run: lake env lean --run Loam/Tests/ActualReversalPublisher.lean "$(mktemp -d)/actual-reversal"
