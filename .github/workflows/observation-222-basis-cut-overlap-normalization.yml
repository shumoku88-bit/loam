name: Observation 222

on:
  pull_request:
    paths:
      - 'experiments/222_basis_cut_overlap_normalization.lean'
      - 'experiments/222_basis_cut_overlap_normalization.md'
      - '.github/workflows/observation-222-basis-cut-overlap-normalization.yml'
      - 'Loam/Application/BasisCut.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Core/Event.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  basis-cut-overlap-normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build supporting production slice
        run: |
          lake build Loam.Application.BasisCut
      - name: Check Observation 222 Lean probe
        shell: bash
        run: |
          set +e
          lake env lean experiments/222_basis_cut_overlap_normalization.lean > /tmp/observation-222-lean.log 2>&1
          status=$?
          cat /tmp/observation-222-lean.log
          exit "$status"
      - name: Upload Observation 222 Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-222-lean-log
          path: /tmp/observation-222-lean.log
