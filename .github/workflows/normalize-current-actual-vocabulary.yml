name: One-shot residual Actual vocabulary cleanup

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/normalize-current-actual-vocabulary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Remove residual current manifest wording from Lean
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'selected Movement manifest plus independent': 'selected Actual authority plus independent',
              'Movement manifest frontier': 'Actual authority frontier',
              'MOVEMENT_MANIFEST_ROOT': 'ACTUAL_ROOT',
              'Older call sites or version-1 manifests that': 'Older call sites or version-1 serialized inputs that',
              'Movement manifest fixture': 'Actual authority fixture',
              'initialize manifest fixture': 'initialize Actual fixture',
              'load manifest Actual review': 'load Actual review',
              'fresh manifest review': 'fresh Actual review',
              'missingManifest': 'missingActual',
          }

          changed = []
          for path in Path('Loam').rglob('*.lean'):
              if 'Observations' in path.parts:
                  continue
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print('changed files:')
          for path in changed:
              print(' ', path)
          PY

      - name: Commit residual Lean cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam
          git commit -m "cleanup(runtime): remove residual manifest wording [generated-residual-vocab]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
