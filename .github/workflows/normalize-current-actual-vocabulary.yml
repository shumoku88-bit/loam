name: One-shot current Actual vocabulary audit

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/normalize-current-actual-vocabulary.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Audit remaining current manifest vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = [
              '# Residual current manifest vocabulary audit',
              '',
              'Historical Loam/Observations sources are intentionally excluded.',
              ''
          ]

          for path in sorted(Path('Loam').rglob('*.lean')):
              if 'Observations' in path.parts:
                  continue
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  if 'manifest' in line.lower() or 'LOAM_MOVEMENT_MANIFEST_ROOT' in line:
                      lines.append(f'{path}:{lineno}:{line}')

          lines.append('')
          lines.append('## workflows')
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name == 'normalize-current-actual-vocabulary.yml':
                  continue
              for lineno, line in enumerate(path.read_text().splitlines(), 1):
                  if 'manifest' in line.lower() or 'movement-authority' in line:
                      lines.append(f'{path}:{lineno}:{line}')

          Path('.legacy-manifest-audit.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit audit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .legacy-manifest-audit.txt
          git commit -m "docs(audit): refresh residual manifest vocabulary receipt [generated-manifest-audit]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
