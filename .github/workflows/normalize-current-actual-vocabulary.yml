name: One-shot current Actual workflow vocabulary normalization

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/normalize-current-actual-vocabulary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Normalize current workflow vocabulary and fixture paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'normalize-current-actual-vocabulary.yml':
                  continue
              text = path.read_text()
              original = text
              text = text.replace('manifest-backed', 'Actual-backed')
              text = text.replace('manifest authority', 'Actual authority')
              text = text.replace('"$(mktemp -d)/movement-authority"', '"$(mktemp -d)"')
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print('changed files:')
          for path in changed:
              print(' ', path)
          PY

      - name: Commit generated workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "cleanup(ci): normalize current Actual authority vocabulary [generated-actual-workflows]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
