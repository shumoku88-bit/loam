name: Cycle Funding Inspection

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/Support.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'Loam/Review/CycleFundingInspection.lean'
      - 'Loam/Tests/CycleFundingInspection.lean'
      - 'Loam/Review/BalanceReview.lean'
      - 'Loam/Review/CurrentCoverageReview.lean'
      - 'Loam/Core/**'
      - 'Loam/Application/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/cycle-funding-inspection.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/Support.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'Loam/Review/CycleFundingInspection.lean'
      - 'Loam/Tests/CycleFundingInspection.lean'
      - 'Loam/Review/BalanceReview.lean'
      - 'Loam/Review/CurrentCoverageReview.lean'
      - 'Loam/Core/**'
      - 'Loam/Application/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/cycle-funding-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycle-funding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Qualify pure cycle funding composition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build shared funding boundary
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Review.CycleFundingInspection Loam.Tests.ActualWorldFixture Loam.Tests.Support
      - name: Run Cycle Funding package test group
        run: lake test -- cycle-funding
