name: MGA015 ledger stage

on:
  push:
    branches:
      - audit/mga-015-scheduled-completion-session
    paths:
      - .github/workflows/mga015-ledger-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-015-scheduled-completion-session
      - name: Record MGA-015 qualification checkpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md')
          text = p.read_text()
          old = 'Status: **MGA-014 COMPLETE — ScheduledReplacementSession KEEP_BOUNDARY / SPLIT_QUALIFIED; PR #971 ready for merge**'
          new = 'Status: **MGA-015 IN QUALIFICATION — ScheduledCompletionSession narrow effect-shell experiment; PR #974**'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unexpected ledger status')

          marker = '## MGA-015 — `Loam.Tui.ScheduledCompletionSession` focused extraction'
          if marker not in text:
              text += '''\n\n## MGA-015 — `Loam.Tui.ScheduledCompletionSession` focused extraction\n\nClassification checkpoint: **SPLIT_CANDIDATE — IMPLEMENTATION UNDER QUALIFICATION (PR #974)**\n\nMGA-015 re-observed completion after MGA-014 and the paired DRAKON continuation map.\nThe experiment deliberately extracts only the reusable inner terminal/effect shell:\n\n- `ScheduledCompletion` retains editor state, representability checks, Record-shaped\n  editing/preview transitions, completion-draft construction, refusal restoration,\n  and view;\n- `ScheduledCompletionSession` owns terminal key reads, dirty redraws, delegation to\n  `HouseholdCommand.completeScheduled`, retry after publication refusal, and one\n  Boolean result;\n- both HRA Scheduled and SelectedDay enter the same session;\n- a successful session returns `true`, while cancellation returns `false`;\n- optional next-Scheduled creation, `ScheduledCreationSession.runWithScheduledId`,\n  routing inheritance, canonical reload, and destination-workspace refresh remain\n  caller-owned continuation semantics.\n\nThe Boolean return is therefore treated as an explicit stop line rather than an\ninvitation to absorb the continuation into the Session. The experiment is qualified\nonly if production CI remains green, the module remains reachable with a narrow\ndependency surface, and the refreshed inventory shows no production-like unreachable\nmodule. Final classification and inventory numbers are intentionally deferred until\nthose checks complete.\n'''

          p.write_text(text)
          PY
      - name: Commit checkpoint and retire one-shot workflow
        run: |
          rm .github/workflows/mga015-ledger-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md .github/workflows/mga015-ledger-stage.yml
          git commit -m 'docs(audit): stage MGA-015 qualification checkpoint'
          git push
