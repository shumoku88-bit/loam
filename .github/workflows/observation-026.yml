name: Observation 026

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy offered meaning acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"

      - name: Execute Alloy observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            model/026_offered_meaning_acceptance.als

      - name: Require acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          commands = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())['commands']

          def sat(name):
              return bool(commands.get(name, {}).get('solution', []))

          expected = {
              'sameOfferedDifferentOriginDifferentAcceptance': True,
              'sameOfferedSameOriginDifferentAcceptance': False,
              'sameResolutionDifferentAcceptance': True,
              'sameOfferedDifferentOriginSameContentAcceptance': True,
              'OfferedMeaningDeterminesContentAcceptance': False,
              'OfferedMeaningDeterminesOriginAcceptance': True,
              'OfferedMeaningAndOriginDetermineOriginAcceptance': False,
              'OriginDoesNotChangeResolutionMeaning': False,
              'WholeFrontierResolutionStillSettles': False,
          }
          for name, want in expected.items():
              got = sat(name)
              print(f'{name}: {"SAT" if got else "UNSAT"}')
              if got != want:
                  raise SystemExit(f'unexpected Alloy result for {name}: {got}')
          PY
