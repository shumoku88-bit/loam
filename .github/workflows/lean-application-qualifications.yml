      - 'tools/run-lean-qualification-case'
      - 'tools/select-lean-qualification-cases'
      - 'verification/ci/lean-qualification-cases.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select Lean qualification obligations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Qualify changed-path and branch selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Core/Attention.lean)" = '["attention-slice-c1"]'
          test "$(python3 tools/select-lean-qualification-cases --event push --branch feat/attention-practical-core --paths Loam/Core/Capacity.lean)" = '[]'
          test "$(python3 tools/select-lean-qualification-cases --event push --branch perf/indexed-correction-frontier --paths Loam/Application/CorrectionFrontier.lean)" = '["actual-correction-frontier"]'
          test "$(python3 tools/select-lean-qualification-cases --event push --branch feat/scheduled-replacement-frontier --paths verification/ci/lean-qualification-cases.json)" = '["scheduled-replacement-frontier"]'
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Tests/DeterministicMovementScenario.lean)" = '["deterministic-movement-scenario"]'
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Tests/DeterministicActualMutationScenario.lean)" = '["deterministic-actual-mutation-scenario"]'
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Tests/DeterministicSettlementScenario.lean)" = '["deterministic-settlement-scenario"]'
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Tests/DeterministicScheduledRecoveryScenario.lean)" = '["deterministic-scheduled-recovery-scenario"]'
          test "$(python3 tools/select-lean-qualification-cases --event pull_request --paths Loam/Tests/DeterministicScenarioSupport.lean)" = '["deterministic-movement-scenario","deterministic-actual-mutation-scenario","deterministic-settlement-scenario","deterministic-scheduled-recovery-scenario"]'
          test "$(python3 tools/select-lean-qualification-cases --event workflow_dispatch --paths)" = '["attention-slice-c1","capacity-slice-a1","actual-correction-frontier","capacity-effective-window","scheduled-replacement-frontier","settlement-production-slice-c","settlement-actual-image-d2","settlement-normalized-actual-v2-d3","settlement-actual-authority-d4","settlement-explicit-writer-e","settlement-review","deterministic-movement-scenario","deterministic-actual-mutation-scenario","deterministic-settlement-scenario","deterministic-scheduled-recovery-scenario"]'

      - name: Select qualifications for this event
        id: select
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 tools/select-lean-qualification-cases             --event "$GITHUB_EVENT_NAME"             --event-file "$GITHUB_EVENT_PATH"             --format matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'selected Lean qualification matrix: %s\n' "$matrix"

  qualify:
    name: ${{ matrix.jobName }}
    needs: select
    if: ${{ needs.select.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build qualified Lean surface
        uses: ./.github/actions/lean-build
        with:
          build-args: ${{ matrix.buildArgs }}

      - name: Run qualification
        shell: bash
        run: python3 tools/run-lean-qualification-case '${{ matrix.id }}'
