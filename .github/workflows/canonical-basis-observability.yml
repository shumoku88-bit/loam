name: Canonical Basis Observability

on:
  pull_request:
    paths:
      - 'experiments/246_canonical_basis_observability.als'
      - 'experiments/246_canonical_basis_observability.md'
      - 'experiments/249_locus_admission_authority_separation.als'
      - 'experiments/249_locus_admission_authority_separation.md'
      - 'experiments/250_locus_policy_failure_recovery_domain.als'
      - 'experiments/250_locus_policy_failure_recovery_domain.md'
      - '.github/workflows/canonical-basis-observability.yml'
  push:
    branches:
      - 'research/canonical-basis-audit'
    paths:
      - 'experiments/246_canonical_basis_observability.als'
      - 'experiments/246_canonical_basis_observability.md'
      - 'experiments/249_locus_admission_authority_separation.als'
      - 'experiments/249_locus_admission_authority_separation.md'
      - 'experiments/250_locus_policy_failure_recovery_domain.als'
      - 'experiments/250_locus_policy_failure_recovery_domain.md'
      - '.github/workflows/canonical-basis-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Qualify canonical basis observability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Require observability and policy-separation witnesses
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/canonical-basis-manifest.json <<'JSON'
          [
            {
              "id": "experiment-246-canonical-basis-observability",
              "model": "experiments/246_canonical_basis_observability.als",
              "expected": {
                "zeroCoverageHasReadWitness": true,
                "mutationPresenceCanBeReadInvisible": true,
                "mutationPresenceCanBeWriteVisible": true
              }
            },
            {
              "id": "experiment-249-locus-admission-authority-separation",
              "model": "experiments/249_locus_admission_authority_separation.als",
              "expected": {
                "staleOlderPolicyCanFalseReject": true,
                "AddOnlyStaleCannotOverAuthorize": false,
                "revocationMakesStaleOverAuthorize": true,
                "EqualPolicySetsAgree": false
              }
            },
            {
              "id": "experiment-250-locus-policy-failure-recovery-domain",
              "model": "experiments/250_locus_policy_failure_recovery_domain.als",
              "expected": {
                "policyOnlyFailureLeavesEvidenceReadable": true,
                "PolicyOnlyFailureDoesNotPermitWrite": false,
                "coupledRecoveryCanLoseCurrentPermission": true,
                "AddOnlyHistoricalAdmissionSurvivesSplitRecovery": false,
                "SplitRecoveryPreservesCurrentPolicyAnswer": false
              }
            }
          ]
          JSON
          python3 tools/run-alloy-manifest.py \
            --alloy-jar "$ALLOY_JAR" \
            --manifest /tmp/canonical-basis-manifest.json \
            --verbose
