name: Practical Starting Quantity

on:
  pull_request:
    paths:
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Core/QuantityBasisCorrectionMemory.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/Application/QuantityBasisFrontier.lean'
      - 'Loam/BalanceViewConfig.lean'
      - 'Loam/Persistence/QuantityBasisPersistence.lean'
      - 'Loam/Persistence/QuantityBasisCorrectionPersistence.lean'
      - 'Loam/Cli/QuantityBasisCorrectionCli.lean'
      - 'Loam/Cli/DailyQuantityCli.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementEntry.lean'
      - 'tools/loam'
      - 'tools/loam-movement'
      - 'lakefile.lean'
      - '.github/workflows/practical-starting-quantity.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Core/QuantityBasisCorrectionMemory.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/Application/QuantityBasisFrontier.lean'
      - 'Loam/BalanceViewConfig.lean'
      - 'Loam/Persistence/QuantityBasisPersistence.lean'
      - 'Loam/Persistence/QuantityBasisCorrectionPersistence.lean'
      - 'Loam/Cli/QuantityBasisCorrectionCli.lean'
      - 'Loam/Cli/DailyQuantityCli.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementEntry.lean'
      - 'tools/loam'
      - 'tools/loam-movement'
      - 'lakefile.lean'
      - '.github/workflows/practical-starting-quantity.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and test starting quantity slice
    runs-on: ubuntu-latest
    env:
      LOAM_DATA_DIR: scratch/dogfood
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Build practical binaries
        run: lake build loamMovement loamDailyQuantity

      - name: Derive current quantities from basis plus balanced movements
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          event_corrections="$tmp/event-corrections.loam"
          basis="$tmp/basis.loam"
          basis_corrections="$tmp/basis-corrections.loam"

          printf 'bank\n100000\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'wallet\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'pension\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'food\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"

          printf 'pension\n20000\n\nbank\n20000\n\n' | .lake/build/bin/loamMovement "$memory"
          printf 'bank\n5000\n\nfood\n5000\n\n' | .lake/build/bin/loamMovement "$memory"
          printf 'bank\n10000\n\nwallet\n10000\n\n' | .lake/build/bin/loamMovement "$memory"

          .lake/build/bin/loamDailyQuantity current \
            "$memory" "$event_corrections" "$basis" "$basis_corrections" >"$tmp/before.out"
          grep -F 'bank: 105000 jpy' "$tmp/before.out"
          grep -F 'wallet: 10000 jpy' "$tmp/before.out"
          grep -F 'pension: -20000 jpy' "$tmp/before.out"
          grep -F 'food: 5000 jpy' "$tmp/before.out"

          printf '1\n95000\n' | .lake/build/bin/loamDailyQuantity \
            correct-starting-quantity "$basis" "$basis_corrections"

          .lake/build/bin/loamDailyQuantity current \
            "$memory" "$event_corrections" "$basis" "$basis_corrections" >"$tmp/after.out"
          grep -F 'bank: 100000 jpy' "$tmp/after.out"
          grep -F 'wallet: 10000 jpy' "$tmp/after.out"
          grep -F 'pension: -20000 jpy' "$tmp/after.out"
          grep -F 'food: 5000 jpy' "$tmp/after.out"

      - name: Keep balance view distinct from all recorded loci
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          event_corrections="$tmp/event-corrections.loam"
          basis="$tmp/basis.loam"
          basis_corrections="$tmp/basis-corrections.loam"
          view="$tmp/balance-view.tsv"

          printf 'bank\n100000\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'wallet\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'pension\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'food\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"

          printf 'pension\n20000\n\nbank\n20000\n\n' | .lake/build/bin/loamMovement "$memory"
          printf 'bank\n5000\n\nfood\n5000\n\n' | .lake/build/bin/loamMovement "$memory"
          printf 'bank\n10000\n\nwallet\n10000\n\n' | .lake/build/bin/loamMovement "$memory"

          printf 'bank\tjpy\nwallet\tjpy\n' >"$view"
          .lake/build/bin/loamDailyQuantity balances \
            "$memory" "$event_corrections" "$basis" "$basis_corrections" "$view" >"$tmp/balances.out"
          grep -F 'bank: 105000 jpy' "$tmp/balances.out"
          grep -F 'wallet: 10000 jpy' "$tmp/balances.out"
          if grep -Eq 'pension:|food:' "$tmp/balances.out"; then
            echo 'non-balance locus leaked into configured balance view' >&2
            exit 1
          fi

      - name: Refuse current projection when a recorded locus has no basis
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          event_corrections="$tmp/event-corrections.loam"
          missing_basis="$tmp/missing-basis.loam"

          printf 'source\n100\n\nbank\n100\n\n' | .lake/build/bin/loamMovement "$memory"
          set +e
          .lake/build/bin/loamDailyQuantity current \
            "$memory" "$event_corrections" "$missing_basis" >"$tmp/missing.out" 2>"$tmp/missing.err"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$tmp/missing.out"
          grep -F 'starting quantity missing for source / jpy' "$tmp/missing.err"

      - name: Keep setup append-only and fail closed on malformed storage
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          basis="$tmp/basis.loam"
          printf 'bank\n100000\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          cp "$basis" "$tmp/before"

          set +e
          printf 'bank\n99999\n' | .lake/build/bin/loamDailyQuantity \
            starting-quantity "$basis" >"$tmp/duplicate.out" 2>"$tmp/duplicate.err"
          status=$?
          set -e
          test "$status" -eq 1
          cmp "$tmp/before" "$basis"
          grep -F 'use correct-starting-quantity' "$tmp/duplicate.err"

          printf 'BROKEN\n' >"$basis"
          cp "$basis" "$tmp/broken-before"
          set +e
          printf 'wallet\n0\n' | .lake/build/bin/loamDailyQuantity \
            starting-quantity "$basis" >"$tmp/broken.out" 2>"$tmp/broken.err"
          status=$?
          set -e
          test "$status" -eq 2
          cmp "$tmp/broken-before" "$basis"
          grep -F 'malformed or unsupported quantity-basis file' "$tmp/broken.err"

      - name: Exercise simplified dogfood menu wiring
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/dogfood

          printf 'starting\nbank\n100000\n' | ./tools/loam
          test -f scratch/dogfood/basis.loam

          printf '3\n' | ./tools/loam >/tmp/loam-balance-menu-empty.out
          grep -F '3. Show balances' /tmp/loam-balance-menu-empty.out
          grep -F 'No balances are selected in the current balance view.' /tmp/loam-balance-menu-empty.out

          printf 'bank\tjpy\n' > scratch/dogfood/balance-view.tsv
          printf '3\n' | ./tools/loam >/tmp/loam-balance-menu-before.out
          grep -F 'Balances (starting balance + effective recorded changes):' /tmp/loam-balance-menu-before.out
          grep -F 'bank: 100000 jpy' /tmp/loam-balance-menu-before.out

          printf 'basis\n1\n90000\n' | ./tools/loam
          test -f scratch/dogfood/basis-corrections.loam
          printf '3\n' | ./tools/loam >/tmp/loam-balance-menu-after.out
          grep -F 'bank: 90000 jpy' /tmp/loam-balance-menu-after.out
