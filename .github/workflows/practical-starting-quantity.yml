name: Practical Starting Quantity

on:
  pull_request:
    paths:
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/QuantityBasisPersistence.lean'
      - 'Loam/DailyQuantityCli.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - '.github/workflows/practical-starting-quantity.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/QuantityBasisPersistence.lean'
      - 'Loam/DailyQuantityCli.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - '.github/workflows/practical-starting-quantity.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and test starting quantity slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build practical binaries
        run: lake build loam loamDailyQuantity
      - name: Exercise anchored current quantity
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          corrections="$tmp/corrections.loam"
          basis="$tmp/basis.loam"
          printf 'bank\n100000\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'wallet\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          printf 'bank\n20000\n' | .lake/build/bin/loam income "$memory"
          printf 'bank\n5000\n' | .lake/build/bin/loam spend "$memory"
          printf 'bank\nwallet\n10000\n' | .lake/build/bin/loam transfer "$memory"
          .lake/build/bin/loamDailyQuantity current "$memory" "$corrections" "$basis" >"$tmp/current.out"
          grep -F 'bank: 105000 jpy' "$tmp/current.out"
          grep -F 'wallet: 10000 jpy' "$tmp/current.out"
          grep -F $'LOAM-QUANTITY-BASIS-MEMORY\t1' "$basis"
          grep -F $'BASIS\tbasis-1\tbank\tjpy\t100000' "$basis"
          grep -F $'BASIS\tbasis-2\twallet\tjpy\t0' "$basis"
      - name: Refuse unanchored or ambiguous current quantity
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          corrections="$tmp/corrections.loam"
          missing_basis="$tmp/missing-basis.loam"
          duplicate_basis="$tmp/duplicate-basis.loam"
          printf 'bank\n100\n' | .lake/build/bin/loam income "$memory"
          set +e
          .lake/build/bin/loamDailyQuantity current "$memory" "$corrections" "$missing_basis" >"$tmp/missing.out" 2>"$tmp/missing.err"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$tmp/missing.out"
          grep -F 'starting quantity missing for bank / jpy' "$tmp/missing.err"
          printf 'LOAM-QUANTITY-BASIS-MEMORY\t1\nBASIS\tbasis-a\tbank\tjpy\t100\nBASIS\tbasis-b\tbank\tjpy\t200\n' >"$duplicate_basis"
          set +e
          .lake/build/bin/loamDailyQuantity current "$memory" "$corrections" "$duplicate_basis" >"$tmp/duplicate.out" 2>"$tmp/duplicate.err"
          status=$?
          set -e
          test "$status" -eq 1
          test ! -s "$tmp/duplicate.out"
          grep -F 'multiple unresolved starting quantities for bank / jpy' "$tmp/duplicate.err"
      - name: Refuse accidental replacement through setup
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          basis="$tmp/basis.loam"
          printf 'bank\n100000\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis"
          cp "$basis" "$tmp/before"
          set +e
          printf 'bank\n99999\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis" >"$tmp/duplicate.out" 2>"$tmp/duplicate.err"
          status=$?
          set -e
          test "$status" -eq 1
          cmp "$tmp/before" "$basis"
          grep -F 'basis revision is not available yet' "$tmp/duplicate.err"
          printf 'BROKEN\n' >"$basis"
          cp "$basis" "$tmp/broken-before"
          set +e
          printf 'wallet\n0\n' | .lake/build/bin/loamDailyQuantity starting-quantity "$basis" >"$tmp/broken.out" 2>"$tmp/broken.err"
          status=$?
          set -e
          test "$status" -eq 2
          cmp "$tmp/broken-before" "$basis"
          grep -F 'malformed or unsupported quantity-basis file' "$tmp/broken.err"
      - name: Exercise dogfood menu wiring
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/dogfood
          printf '9\nbank\n100000\n' | ./tools/loam
          test -f scratch/dogfood/basis.loam
          printf '10\n' | ./tools/loam >/tmp/loam-current-menu.out
          grep -F 'bank: 100000 jpy' /tmp/loam-current-menu.out
