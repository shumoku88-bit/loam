name: Temporary Transactions Flow TUI Edit

on:
  push:
    branches:
      - feat/tui-transactions-flow
    paths:
      - '.github/workflows/tmp-transactions-flow-tui-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/tui-transactions-flow
          fetch-depth: 0
      - name: Apply qualified sparse Transactions Flow integration
        run: python3 tools/tmp_transactions_flow_tui_patch.py
      - name: Publish source patch and stage workflow copy
        shell: bash
        run: |
          cp .github/workflows/tui.yml tools/tmp_tui_workflow_patched.yml
          git checkout -- .github/workflows/tui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam/Tui/Reports.lean Loam/Tui/Cli.lean Loam/Tests/TuiReports.lean Loam/Tests/TuiTransactionsFlow.lean tools/tmp_tui_workflow_patched.yml
          git commit -m "feat(tui): add sparse Transactions Flow report"
          git push origin HEAD:feat/tui-transactions-flow
