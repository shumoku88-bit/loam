name: MGA017 Reports map

on:
  push:
    branches:
      - audit/mga-017-reports-frontier
    paths:
      - .github/workflows/mga017-reports-map.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-017-reports-frontier
      - name: Build and validate Reports granularity DRAKON
        run: |
          python3 docs/drakon/build_tui_reports_granularity_audit_map.py
          python3 - <<'PY'
          import sqlite3
          path = 'docs/drakon/loam-tui-reports-granularity-audit.drn'
          with sqlite3.connect(path) as db:
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
              assert db.execute('select count(*) from diagrams').fetchone()[0] == 4
              assert db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0] == 4
              assert db.execute("select count(*) from diagrams where name='MGA.017.3 Candidate Seams'").fetchone()[0] == 1
          PY
      - name: Commit artifact and retire one-shot workflow
        run: |
          rm .github/workflows/mga017-reports-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/drakon/loam-tui-reports-granularity-audit.drn .github/workflows/mga017-reports-map.yml
          git commit -m 'docs(drakon): sync MGA-017 Reports artifact'
          git push
