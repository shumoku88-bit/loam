name: Zero-Origin Factorization

on:
  pull_request:
    paths:
      - 'experiments/247_zero_origin_factorization.als'
      - 'experiments/247_zero_origin_factorization.md'
      - '.github/workflows/canonical-basis-zero-origin.yml'
  push:
    branches:
      - 'research/canonical-basis-audit'
    paths:
      - 'experiments/247_zero_origin_factorization.als'
      - 'experiments/247_zero_origin_factorization.md'
      - '.github/workflows/canonical-basis-zero-origin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Qualify zero-origin factorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Require factorization witnesses and preservation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/zero-origin-factorization-manifest.json <<'JSON'
          [
            {
              "id": "experiment-247-zero-origin-factorization",
              "model": "experiments/247_zero_origin_factorization.als",
              "expected": {
                "everyDirectHasFactoredImage": true,
                "explicitOriginReconstructsDirect": true,
                "trackedSetStillCarriesInformation": true,
                "originFlagAloneIsInsufficient": true,
                "DirectToFactoredCoveragePreserved": false
              }
            }
          ]
          JSON
          python3 tools/run-alloy-manifest.py \
            --alloy-jar "$ALLOY_JAR" \
            --manifest /tmp/zero-origin-factorization-manifest.json \
            --verbose
