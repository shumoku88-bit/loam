name: Practical Slice A2

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Capacity.lean'
      - 'Loam/Core/Purpose.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core.lean'
      - 'Loam/Application/CapacityInspection.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application.lean'
      - 'Loam/Tests/Capacity.lean'
      - 'Loam/Tests/ActualRoutingConsumption.lean'
      - 'Loam/Tests/CorrectedActualConsumption.lean'
      - 'Loam/Tests/CapacityHouseholdStory.lean'
      - '.github/workflows/practical-slice-a2.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    branches:
      - 'feat/actual-locus-routing-consumption'
      - 'fix/correction-aware-consumption'
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Capacity.lean'
      - 'Loam/Core/Purpose.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core.lean'
      - 'Loam/Application/CapacityInspection.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application.lean'
      - 'Loam/Tests/Capacity.lean'
      - 'Loam/Tests/ActualRoutingConsumption.lean'
      - 'Loam/Tests/CorrectedActualConsumption.lean'
      - 'Loam/Tests/CapacityHouseholdStory.lean'
      - '.github/workflows/practical-slice-a2.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-slice-a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build typed practical boundary with actual routing consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Core and Application
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Core Loam.Application

      - name: Run capacity boundary check
        shell: bash
        run: lake env lean --run Loam/Tests/Capacity.lean

      - name: Run actual routing consumption boundary check
        shell: bash
        run: lake env lean --run Loam/Tests/ActualRoutingConsumption.lean

      - name: Run correction-aware consumption boundary check
        shell: bash
        run: lake env lean --run Loam/Tests/CorrectedActualConsumption.lean

      - name: Run household capacity development story
        shell: bash
        run: lake env lean --run Loam/Tests/CapacityHouseholdStory.lean
