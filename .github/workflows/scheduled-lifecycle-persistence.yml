name: Scheduled Lifecycle Persistence

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledLifecyclePersistence.lean'
      - '.github/workflows/scheduled-lifecycle-persistence.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - main
      - feat/tui
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledLifecyclePersistence.lean'
      - '.github/workflows/scheduled-lifecycle-persistence.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Build and test complete Scheduled lifecycle persistence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean and build lifecycle persistence
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Persistence.ScheduledLifecyclePersistence
      - name: Verify complete lifecycle codec and fail-closed authority
        run: lake env lean --run Loam/Tests/ScheduledLifecyclePersistence.lean "$(mktemp -d)/scheduled-lifecycle"
