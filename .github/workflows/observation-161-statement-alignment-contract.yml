name: Observation 161

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation161Contract.lean'
      - 'Loam/Observations/Observation161.lean'
      - 'Loam/Observations.lean'
      - 'experiments/161_statement_alignment_contract.md'
      - '.github/workflows/observation-161-statement-alignment-contract.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/160-statement-alignment-contract'
      - main
    paths:
      - 'Loam/Observations/Observation161Contract.lean'
      - 'Loam/Observations/Observation161.lean'
      - 'Loam/Observations.lean'
      - 'experiments/161_statement_alignment_contract.md'
      - '.github/workflows/observation-161-statement-alignment-contract.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statement-alignment:
    name: Lean statement alignment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check statement alignment contract
        run: lake build Loam.Observations.Observation161
