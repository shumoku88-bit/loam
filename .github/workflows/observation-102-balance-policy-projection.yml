name: Observation 102

on:
  pull_request:
    paths:
      - 'experiments/102_balance_policy_projection.lean'
      - 'experiments/102_balance_policy_projection.md'
      - '.github/workflows/observation-102-balance-policy-projection.yml'
      - 'Loam/Application/CurrentQuantity.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/QuantityBasisMemory.lean'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Core/QuantityBasisCorrectionMemory.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  balance-policy-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build current quantity slice
        run: lake build loamDailyQuantity
      - name: Check Observation 102 Lean probe
        run: lake env lean experiments/102_balance_policy_projection.lean
