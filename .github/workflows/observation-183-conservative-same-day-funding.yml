name: Observation 183

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation183.lean'
      - 'Loam/Observations.lean'
      - 'experiments/183_conservative_same_day_funding.md'
      - '.github/workflows/observation-183-conservative-same-day-funding.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/183-conservative-same-day-funding'
      - main
    paths:
      - 'Loam/Observations/Observation183.lean'
      - 'Loam/Observations.lean'
      - 'experiments/183_conservative_same_day_funding.md'
      - '.github/workflows/observation-183-conservative-same-day-funding.yml'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservative-same-day-funding:
    name: Lean conservative same-day funding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check conservative same-day funding
        run: lake build Loam.Observations.Observation183
