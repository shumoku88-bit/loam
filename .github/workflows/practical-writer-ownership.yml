name: Practical Writer Ownership

on:
  pull_request:
    paths:
      - 'Loam/WriterOwnership.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Cli/Movement/Entry.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Tests/WriterOwnershipPersistence.lean'
      - 'tools/loam-movement'
      - 'experiments/practical_writer_ownership_holder.lean'
      - '.github/workflows/practical-writer-ownership.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  qualify-production-writer-ownership:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Build production CLIs
        run: lake build loam loamMovement
      - name: Retain physical stale-replacement counterexample
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/WriterOwnershipPersistence.lean \
            | tee /tmp/practical-writer-ownership-persistence.out
          grep -Fq 'stale_replace_loses_completed_update=true' \
            /tmp/practical-writer-ownership-persistence.out
          grep -Fq 'production_writer_ownership_preserves_both_updates=true' \
            /tmp/practical-writer-ownership-persistence.out
      - name: Observe retained writer entrances waiting for ownership
        shell: bash
        run: |
          set -euo pipefail

          bin='.lake/build/bin/loam'
          movement_bin='.lake/build/bin/loamMovement'
          memory='practical-writer-ownership-memory.loam'
          event='practical-writer-ownership-event.loam'
          manifest='practical-writer-ownership-authority'
          compat_memory='practical-writer-ownership-compat.loam'
          ready='practical-writer-ownership-ready'
          holder_pid=''
          writer_pid=''

          cleanup() {
            if [ -n "${writer_pid:-}" ]; then
              kill -KILL "$writer_pid" 2>/dev/null || true
              wait "$writer_pid" 2>/dev/null || true
            fi
            if [ -n "${holder_pid:-}" ]; then
              kill -KILL "$holder_pid" 2>/dev/null || true
              wait "$holder_pid" 2>/dev/null || true
            fi
            rm -f "$memory" "$event" "$ready" "$compat_memory" \
              "$memory.loam-writer-lock" /tmp/practical-writer-ownership-*.out
            rm -rf "$manifest"
          }
          trap cleanup EXIT

          start_holder() {
            local anchor="$1"
            rm -f "$ready"
            LEAN_PATH='.lake/build/lib/lean' \
              lean --run experiments/practical_writer_ownership_holder.lean \
              "$anchor" "$ready" \
              > /tmp/practical-writer-ownership-holder.out 2>&1 &
            holder_pid=$!
            for _ in $(seq 1 200); do
              if [ -f "$ready" ]; then
                return 0
              fi
              sleep 0.05
            done
            cat /tmp/practical-writer-ownership-holder.out || true
            echo 'ownership holder did not become ready' >&2
            exit 1
          }

          require_writer_waiting() {
            sleep 0.25
            if kill -0 "$writer_pid" 2>/dev/null; then
              echo 'writer_waited_for_ownership=true'
            else
              cat /tmp/practical-writer-ownership-writer.out || true
              echo 'writer_waited_for_ownership=false' >&2
              exit 1
            fi
          }

          release_and_wait_writer() {
            wait "$holder_pid"
            holder_pid=''
            wait "$writer_pid"
            writer_pid=''
            rm -f "$ready"
          }

          printf 'LOAM-EVENT-MEMORY\t1\n' > "$memory"
          "$bin" event create "$event" seed-event effect-1 cash jpy -100

          start_holder "$memory"
          "$bin" event-memory add "$memory" "$event" \
            > /tmp/practical-writer-ownership-writer.out 2>&1 &
          writer_pid=$!
          require_writer_waiting
          release_and_wait_writer
          "$bin" event-memory get "$memory" seed-event >/dev/null
          echo 'event_memory_add_owned=true'

          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" cash food

          start_holder "$manifest/CURRENT"
          printf 'cash\n50\n\nfood\n50\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-02 \
                "$movement_bin" "$compat_memory" \
                > /tmp/practical-writer-ownership-writer.out 2>&1 &
          writer_pid=$!
          require_writer_waiting
          release_and_wait_writer

          event_ref="$(awk -F '\t' '$1 == "Event" { print $2; exit }' "$manifest/CURRENT")"
          grep -Fq $'EVENT\trecord-1' "$manifest/$event_ref"
          echo 'movement_manifest_owned=true'
