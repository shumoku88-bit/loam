name: Retire publishWorld one-shot

on:
  push:
    branches:
      - refactor/retire-publish-world

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[generated-publish-world-retirement]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/retire-publish-world
          fetch-depth: 0

      - name: Rewrite test fixtures and retire production helper
        run: python3 .github/scripts/retire_publish_world.py

      - name: Remove one-shot scaffolding
        run: |
          rm .github/scripts/retire_publish_world.py
          rm .github/workflows/retire-publish-world-one-shot.yml

      - name: Commit generated migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(test): retire production world fixture [generated-publish-world-retirement]'
          git push origin HEAD:refactor/retire-publish-world
