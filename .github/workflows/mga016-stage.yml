name: MGA016 stage

on:
  push:
    branches:
      - audit/mga-016-scheduled-continuation-session
    paths:
      - .github/workflows/mga016-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-016-scheduled-continuation-session
      - name: Delegate duplicated continuation workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Loam/Tui/Cli.lean')
          text = path.read_text()

          old_import = 'import Loam.Tui.ScheduledCompletionSession\n'
          new_import = old_import + 'import Loam.Tui.ScheduledContinuationSession\n'
          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit('unexpected ScheduledCompletionSession import count')
              text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'              let notice ←\n'
              r'                if !completed then\n'
              r'.*?'
              r'(?=              let fresh ← requireReload notice)',
              re.S,
          )
          replacement = '''              let notice ←
                if !completed then
                  pure "Scheduled completion cancelled."
                else
                  Loam.Tui.ScheduledContinuationSession.runAfterCompletion
                    bounds root known record snapshot.actual.today
                    (currentLocusCatalog dataDir world)
'''
          text, count = pattern.subn(replacement, text)
          if count != 2:
              raise SystemExit(f'unexpected continuation block count: {count}')
          if text.count('Loam.Tui.ScheduledContinuationSession.runAfterCompletion') != 2:
              raise SystemExit('continuation delegation count mismatch')
          if 'ScheduledCreationSession.runWithScheduledId' in text:
              raise SystemExit('legacy continuation creation call remains in Cli')
          if 'HouseholdCommand.inheritScheduledRouting' in text:
              raise SystemExit('legacy continuation routing call remains in Cli')

          path.write_text(text)
          PY
      - name: Commit staged refactor and retire workflow
        run: |
          rm .github/workflows/mga016-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Cli.lean .github/workflows/mga016-stage.yml
          git commit -m 'refactor(tui): delegate Scheduled continuation session'
          git push
