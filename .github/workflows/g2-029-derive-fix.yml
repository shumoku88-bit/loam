name: G2-029 derive fix

on:
  push:
    branches: [audit/g2-029-hra-scheduled-unknown]
    paths: [.github/workflows/g2-029-derive-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/g2-029-hra-scheduled-unknown
      - name: Remove unused derived instances
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Loam/Tui/HraScheduled.lean')
          s = p.read_text()
          old = '''inductive ScopeEvidence where
            | records (rows : List Record)
            | unknown
            deriving Repr, DecidableEq
          '''
          new = '''inductive ScopeEvidence where
            | records (rows : List Record)
            | unknown
          '''
          if old not in s:
              raise SystemExit('ScopeEvidence deriving shape changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and self-remove
        run: |
          git rm .github/workflows/g2-029-derive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam/Tui/HraScheduled.lean
          git commit -m "fix(tui): avoid unused G2-029 derived instances"
          git push
