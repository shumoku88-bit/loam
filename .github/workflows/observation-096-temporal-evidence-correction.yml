name: Observation 096

on:
  pull_request:
    paths:
      - 'tla/TemporalEvidenceCorrection.tla'
      - 'tla/TemporalEvidenceCorrection.cfg'
      - 'tla/TemporalEvidenceCorrectionBoundary.cfg'
      - 'experiments/096_temporal_evidence_correction.md'
      - '.github/workflows/observation-096-temporal-evidence-correction.yml'
  push:
    branches:
      - 'experiment/096-temporal-evidence-correction'
      - main
    paths:
      - 'tla/TemporalEvidenceCorrection.tla'
      - 'tla/TemporalEvidenceCorrection.cfg'
      - 'tla/TemporalEvidenceCorrectionBoundary.cfg'
      - 'experiments/096_temporal_evidence_correction.md'
      - '.github/workflows/observation-096-temporal-evidence-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla:
    name: Append-only temporal evidence correction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check append-only temporal correction safety
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock \
            -config tla/TemporalEvidenceCorrection.cfg \
            tla/TemporalEvidenceCorrection.tla \
            2>&1 | tee /tmp/observation-096-positive.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-096-positive.txt

      - name: Require final-frontier historical-loss counterexample
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock \
            -config tla/TemporalEvidenceCorrectionBoundary.cfg \
            tla/TemporalEvidenceCorrection.tla \
            2>&1 | tee /tmp/observation-096-boundary.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'CurrentFrontierCanReconstructPastKnowledge' /tmp/observation-096-boundary.txt
          grep -Fq 'Invariant' /tmp/observation-096-boundary.txt
