name: Observation 174

on:
  pull_request:
    paths:
      - 'experiments/174_signed_quantity_orientation_pressure.als'
      - 'experiments/174_signed_quantity_orientation_pressure.md'
      - '.github/workflows/observation-174-signed-quantity-orientation-pressure.yml'
  push:
    branches:
      - 'experiment/174-signed-quantity-orientation-pressure'
      - main
    paths:
      - 'experiments/174_signed_quantity_orientation_pressure.als'
      - 'experiments/174_signed_quantity_orientation_pressure.md'
      - '.github/workflows/observation-174-signed-quantity-orientation-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy signed quantity orientation pressure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Execute Alloy observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/174_signed_quantity_orientation_pressure.als

      - name: Require expected witnesses and checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected = {
              'negativeSourceReceivable': True,
              'positiveSourceReceivable': True,
              'sameSourceSignSupportsOppositeDirections': True,
              'sameRelationDirectionAcrossOppositeSourceSigns': True,
              'sameBurdenAcrossOppositeSourceSigns': True,
              'sameSemanticEdgeTwoSignedEncodings': True,
              'SourceSignDeterminesRelationDirection': True,
              'RelationDirectionDeterminesSourceSign': True,
              'SourceSignDeterminesBurdenSplit': True,
              'SignedEncodingUniqueForSemanticEdge': True,
          }

          wrong = []
          for name, want_sat in expected.items():
              if name not in commands:
                  wrong.append((name, 'MISSING', want_sat))
                  print(f'{name}: MISSING')
                  continue

              solutions = commands[name].get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 174 results: {wrong}')
          PY
