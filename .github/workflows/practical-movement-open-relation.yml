name: Practical Movement Open Relation

on:
  pull_request:
    paths:
      - 'Loam/Application/OpenRelationFrontier.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Cli/Movement/Entry.lean'
      - 'Loam/Cli/Movement/RelationEntry.lean'
      - 'Loam/Persistence/OpenRelationPersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Tests/OpenRelationFrontier.lean'
      - 'tools/loam-movement'
      - '.github/workflows/practical-movement-open-relation.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - 'Loam/Application/OpenRelationFrontier.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Cli/Movement/Entry.lean'
      - 'Loam/Cli/Movement/RelationEntry.lean'
      - 'Loam/Persistence/OpenRelationPersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Tests/OpenRelationFrontier.lean'
      - 'tools/loam-movement'
      - '.github/workflows/practical-movement-open-relation.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  movement-relation:
    name: Movement relation through manifest authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean and build Movement
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamMovement
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run current open relation frontier regression
        run: lake env lean Loam/Tests/OpenRelationFrontier.lean

      - name: Publish explicit receivable on negative source Effect
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel

          printf 'paypay\n1000\n\ntravel\n1000\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t400' \
                ./tools/loam-movement "$memory" >"$tmp_dir/out"

          grep -Fq 'event: record-1' "$tmp_dir/out"
          grep -Fq '[ok] open relation evidence admitted: 1' "$tmp_dir/out"
          grep -Fq 'Recorded movement: 1000 jpy. Date: 2026-09-05.' "$tmp_dir/out"

          event_ref="$(awk -F '\t' '$1 == "Event" { print $2; exit }' "$manifest/CURRENT")"
          relation_ref="$(awk -F '\t' '$1 == "RelationUnit" { print $2; exit }' "$manifest/CURRENT")"
          grep -Fq $'EFFECT\teffect-1\tpaypay\tjpy\t-1000' "$manifest/$event_ref"
          expected=$'LOAM-RELATION-UNIT-MEMORY\t1\nRELATION\trelation-1\trecord-1\teffect-1\tE\tfriend\tH\t\t400'
          test "$(cat "$manifest/$relation_ref")" = "$expected"

      - name: Keep redirected relation-free Movement explicit
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" cash coffee

          printf 'cash\n25\n\ncoffee\n25\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                ./tools/loam-movement "$memory" >"$tmp_dir/out"

          grep -Fq '[ok] open relation decision: none' "$tmp_dir/out"
          relation_ref="$(awk -F '\t' '$1 == "RelationUnit" { print $2; exit }' "$manifest/CURRENT")"
          test "$(cat "$manifest/$relation_ref")" = $'LOAM-RELATION-UNIT-MEMORY\t1'

      - name: Reject relation-plane over-allocation before authority switch
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel
          cp "$manifest/CURRENT" "$tmp_dir/current.before"

          if printf 'paypay\n100\n\ntravel\n100\n\n' \
              | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                  LOAM_OCCURRENCE_DATE=2026-09-05 \
                  LOAM_RELATIONS=$'effect-1\tE2H\tfriend-a\t60\neffect-1\tE2H\tfriend-b\t60' \
                  ./tools/loam-movement "$memory" \
                  >"$tmp_dir/out" 2>"$tmp_dir/err"; then
            echo 'expected aggregate relation over-allocation to fail' >&2
            exit 1
          else
            status=$?
          fi

          test "$status" = '2'
          grep -Fq 'open relation evidence did not justify one source-local frontier' "$tmp_dir/err"
          cmp "$tmp_dir/current.before" "$manifest/CURRENT"
