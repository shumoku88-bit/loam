name: Observation 046

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lean:
    name: Lean coverage witness boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and check Lean proofs
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          axiom-audit: true
          use-github-cache: false
