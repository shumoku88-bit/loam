name: Annual Canonical Source Cutover Readiness Inventory

on:
  pull_request:
    paths:
      - 'tools/annual-production-readiness.json'
      - 'tools/check-annual-production-readiness.py'
      - 'docs/research/ANNUAL_PRODUCTION_READINESS_2026-10-16.md'
      - 'Loam/Authority/HouseholdAuthority.lean'
      - 'Loam/Review/AnnualSource*.lean'
      - '.github/workflows/annual-production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annual-cutover-blocker-inventory:
    name: Cutover blocker inventory (not a release approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Check inventory structure and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-annual-production-readiness.py --self-test --json
      - name: Assert unsafe annual cutover remains refused
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/check-annual-production-readiness.py --require-ready
          result=$?
          if [ "$result" -ne 2 ]; then
            echo "expected explicit not-ready refusal code 2; got $result" >&2
            exit 1
          fi
          echo "PASS: current engine stays canonical; annual physical cutover blocked"
