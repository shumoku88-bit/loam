name: MGA021 First-Pass Residual Rerank

on:
  push:
    branches:
      - 'audit/mga-021-first-pass-closure'

jobs:
  rerank:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 250
      - name: Build latest module inventory
        run: |
          python3 tools/module_granularity_audit.py --history 200 --tsv /tmp/mga021.tsv --markdown /tmp/mga021.md
          echo '--- inventory summary ---'
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('/tmp/mga021.tsv'), delimiter='\t'))
          prod = [r for r in rows if r['layer'] != 'Tests']
          unreachable = [r for r in prod if r['reachable_from_declared_root'] == 'False' and r['layer'] not in {'umbrella','other'}]
          print('modules', len(rows))
          print('small<=80', sum(int(r['lines']) <= 80 for r in rows))
          print('one-consumer', sum(int(r['fan_in']) == 1 for r in rows))
          print('unreachable-production-like', len(unreachable))
          print('\n--- largest reachable production modules ---')
          for r in sorted((r for r in prod if r['reachable_from_declared_root'] == 'True'), key=lambda r: (-int(r['lines']), r['module']))[:25]:
              print(r['module'], 'lines='+r['lines'], 'decls='+r['declarations'], 'fanin='+r['fan_in'], 'fanout='+r['fan_out'], 'sole='+r['sole_consumer'])
          print('\n--- one-consumer reachable production modules, size desc ---')
          one = [r for r in prod if r['reachable_from_declared_root'] == 'True' and int(r['fan_in']) == 1]
          for r in sorted(one, key=lambda r: (-int(r['lines']), -int(r['sole_consumer_cochanges']), r['module']))[:35]:
              print(r['module'], 'lines='+r['lines'], 'decls='+r['declarations'], 'fanout='+r['fan_out'], 'consumer='+r['sole_consumer'], 'cochanges='+r['sole_consumer_cochanges'])
          PY
