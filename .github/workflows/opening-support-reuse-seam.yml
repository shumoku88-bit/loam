name: Observation 245

on:
  pull_request:
    paths:
      - 'experiments/245_opening_support_reuse_seam.lean'
      - 'experiments/245_opening_support_reuse_seam.md'
      - '.github/workflows/opening-support-reuse-seam.yml'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/QuantityInspection.lean'
      - 'Loam/Core/Event*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/245-opening-support-reuse-seam'
      - main
    paths:
      - 'experiments/245_opening_support_reuse_seam.lean'
      - 'experiments/245_opening_support_reuse_seam.md'
      - '.github/workflows/opening-support-reuse-seam.yml'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/QuantityInspection.lean'
      - 'Loam/Core/Event*.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Probe opening support reuse seam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Build production quantity inspection dependency
        run: lake build Loam.Application.QuantityInspection

      - name: Compile Observation 245
        run: lake env lean experiments/245_opening_support_reuse_seam.lean

      - name: Run Observation 245 witnesses
        run: lake env lean --run experiments/245_opening_support_reuse_seam.lean
