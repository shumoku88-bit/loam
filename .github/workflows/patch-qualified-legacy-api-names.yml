name: One-shot qualified legacy API rename

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/patch-qualified-legacy-api-names.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[generated-api-rename]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Replace qualified legacy API names only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'Loam.MovementPublisher.publishManifestDraftWithPreview': 'Loam.MovementPublisher.publishDraftWithPreview',
              'Loam.MovementPublisher.publishManifestDraft': 'Loam.MovementPublisher.publishDraft',
              'Loam.ActualValidityPublisher.publishManifestDate': 'Loam.ActualValidityPublisher.publishDate',
              'Loam.CorrectionPublisher.publishManifestCorrection': 'Loam.CorrectionPublisher.publishCorrection',
              'Loam.ActualReversalPublisher.publishManifestReversal': 'Loam.ActualReversalPublisher.publishReversal',
              'Loam.ScheduledCreationPublisher.publishManifestCreation': 'Loam.ScheduledCreationPublisher.publishCreation',
              'Loam.ScheduledTerminalPublisher.publishManifestCompletion': 'Loam.ScheduledTerminalPublisher.publishCompletion',
              'Loam.ScheduledTerminalPublisher.publishManifestCancellation': 'Loam.ScheduledTerminalPublisher.publishCancellation',
              'Loam.ScheduledReplacementPublisher.publishManifestReplacement': 'Loam.ScheduledReplacementPublisher.publishReplacement',
              'Loam.LocusAdmissionPublisher.publishManifestAdmission': 'Loam.LocusAdmissionPublisher.publishAdmission',
              'Loam.ScheduledReview.loadEvidenceFromManifest': 'Loam.ScheduledReview.loadEvidenceFromActual',
          }

          changed = []
          counts = {old: 0 for old in replacements}
          for path in Path('Loam').rglob('*.lean'):
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  n = text.count(old)
                  if n:
                      counts[old] += n
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          print('replacement counts:')
          for old, count in counts.items():
              print(f'  {count:3d}  {old}')
          print('changed files:')
          for path in changed:
              print(' ', path)

          leftovers = []
          for path in Path('Loam').rglob('*.lean'):
              text = path.read_text()
              for old in replacements:
                  if old in text:
                      leftovers.append((str(path), old))
          if leftovers:
              raise SystemExit('qualified legacy names remain: ' + repr(leftovers))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/patch-qualified-legacy-api-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam
          git commit -m "cleanup(runtime): migrate callers off legacy API names [generated-api-rename]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
