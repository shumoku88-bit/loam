name: Finalize Initial AccountingRole Integration

on:
  push:
    branches:
      - 'feat/initial-accounting-role-assignment'
    paths:
      - 'tools/finalize-initial-accounting-role.py'
      - '.github/workflows/finalize-initial-accounting-role.yml'

permissions:
  contents: write

jobs:
  finalize:
    name: Verify, integrate and retire branch scaffolding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/initial-accounting-role-assignment

      - name: Apply exact final integration
        run: |
          python3 tools/finalize-initial-accounting-role.py
          git diff --check

      - name: Prepare Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Build production TUI with exact diagnostics
        id: build
        continue-on-error: true
        run: |
          set +e
          lake build loamTui > /tmp/accounting-role-build.log 2>&1
          status=$?
          cat /tmp/accounting-role-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build diagnostic on failure
        if: steps.build.outputs.status != '0'
        run: |
          cp /tmp/accounting-role-build.log tools/accounting-role-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/accounting-role-build.log
          git commit -m 'chore(tui): capture AccountingRole build diagnostic'
          git push origin HEAD:feat/initial-accounting-role-assignment
          exit 1

      - name: Verify AccountingRole semantic boundary
        run: lake env lean --run Loam/Tests/AccountingRolePublisher.lean "$(mktemp -d)/accounting-role"

      - name: Verify AccountingRole presentation boundary
        run: lake env lean --run Loam/Tests/TuiAccountingRoleAdministration.lean

      - name: Retire branch-only scaffolding and commit final integration
        run: |
          rm -f \
            .github/workflows/apply-initial-accounting-role-ci.yml \
            .github/workflows/apply-initial-accounting-role-tui.yml \
            .github/workflows/initial-accounting-role-assignment.yml \
            .github/workflows/finalize-initial-accounting-role.yml \
            tools/apply-initial-accounting-role-ci.py \
            tools/apply-initial-accounting-role-tui.py \
            tools/tui.yml.patched \
            tools/accounting-role-build.log \
            tools/finalize-initial-accounting-role.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898288+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(tui): integrate initial AccountingRole administration'
          git push origin HEAD:feat/initial-accounting-role-assignment
