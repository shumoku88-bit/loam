name: Purpose Routing Administration

on:
  pull_request:
    paths:
      - 'Loam/ActualRoutingPublisher.lean'
      - 'Loam/ActualRoutingReview.lean'
      - 'Loam/Tui/ActualRoutingAdministration.lean'
      - 'Loam/Tui/ActualRoutingAdministrationSession.lean'
      - 'Loam/Tests/TuiActualRoutingAdministration.lean'
      - '.github/workflows/purpose-routing-administration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Qualify Purpose routing administration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Build shared Actual routing administration boundaries
        run: |
          lake build Loam.ActualRoutingPublisher
          lake build Loam.ActualRoutingReview
          lake build Loam.Tui.ActualRoutingAdministration
          lake build Loam.Tui.ActualRoutingAdministrationSession

      - name: Verify audit navigation and shared publication
        run: lake env lean --run Loam/Tests/TuiActualRoutingAdministration.lean "$(mktemp -d)/purpose-routing"
