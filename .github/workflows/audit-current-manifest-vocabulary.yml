name: One-shot current manifest vocabulary audit

on:
  push:
    branches:
      - cleanup/retire-manifest-vocabulary
    paths:
      - .github/workflows/audit-current-manifest-vocabulary.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[generated-vocab-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/retire-manifest-vocabulary
          fetch-depth: 0

      - name: Scan current runtime and CI vocabulary
        run: |
          {
            echo '# Current manifest vocabulary audit'
            echo
            echo 'Patterns: publishManifest | loadRecordsFromManifest | loadEvidenceFromManifest | LOAM_MOVEMENT_MANIFEST_ROOT | ownershipAllowedByManifestMode | resolveManifestRoot | movement-authority | manifestRoot | manifest-backed | selected manifest | manifest authority'
            echo
            grep -RInE 'publishManifest|loadRecordsFromManifest|loadEvidenceFromManifest|LOAM_MOVEMENT_MANIFEST_ROOT|ownershipAllowedByManifestMode|resolveManifestRoot|movement-authority|manifestRoot|manifest-backed|selected manifest|manifest authority' Loam .github/workflows \
              --exclude='audit-current-manifest-vocabulary.yml' || true
          } > .legacy-manifest-audit.txt
          cat .legacy-manifest-audit.txt

      - name: Remove one-shot workflow and publish audit receipt
        run: |
          git rm .github/workflows/audit-current-manifest-vocabulary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .legacy-manifest-audit.txt
          git commit -m "chore: record current manifest vocabulary audit [generated-vocab-audit]"
          git push origin HEAD:cleanup/retire-manifest-vocabulary
