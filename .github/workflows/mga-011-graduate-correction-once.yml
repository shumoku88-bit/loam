name: MGA-011 graduate Correction session

on:
  push:
    branches:
      - audit/mga-011-graduate-correction
    paths:
      - '.github/workflows/mga-011-graduate-correction-once.yml'

permissions:
  contents: write

jobs:
  graduate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Graduate MGA-011 and stage MGA-012 control
        run: |
          python3 tools/mga_011_graduate.py
          python3 docs/drakon/build_tui_cli_granularity_audit_map.py
          test -s docs/drakon/loam-tui-cli-granularity-audit.drn
          git diff --check
          grep -q 'MGA-011 GRADUATED' docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md
          grep -q 'MGA.012.1 Actual Date Anti-Symmetry Control' docs/drakon/build_tui_cli_granularity_audit_map.py
          git rm .github/workflows/mga-011-graduate-correction-once.yml
          git rm tools/mga_011_graduate.py

      - name: Commit graduation record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(audit): graduate MGA-011 Correction session boundary'
          git push
