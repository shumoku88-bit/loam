name: MATH-6 Row Image Pressure

on:
  pull_request:
    paths:
      - 'Loam/Tests/TransactionsFlowSharedImageBenchmark.lean'
      - '.github/workflows/math6-row-image-pressure.yml'
      - '.github/actions/lean-build/**'
      - 'Loam/TransactionsFlowReview.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Measure duplicate versus shared row image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Transactions-Flow review
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.TransactionsFlowReview
      - name: Run paired MATH-6 benchmark
        run: |
          echo "=== MATH-6 shared Transactions-Flow row image pressure ==="
          echo "events | duplicate row image | shared row image | speedup"
          for n in 1000 5000 10000 25000; do
            lake env lean --run Loam/Tests/TransactionsFlowSharedImageBenchmark.lean "$n"
          done
          echo
          echo "Runtime-sized fixtures; benchmark isolates repeated stage-2 row-image construction."
