concurrency:
  group: production-tui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: Build production household TUI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build pull-request TUI surface
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamTui terminalProbe Loam.Tests.ActualWorldFixture Loam.Tests.Support Loam.Review.MovementDraftReview
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Verify native terminal latency, batching and resize safety
        run: |
          python3 tests/test_terminal_input_latency.py
          python3 tests/test_terminal_mechanics_pty.py

      - name: Verify representative TUI mechanics
        shell: bash
        run: |
          set -euo pipefail
          lake test -- tui-representative
          lake env lean --run Loam/Tests/BoundedHistorySupport.lean
          lake env lean --run Loam/Tests/ActualReversalPublisher.lean "$(mktemp -d)/actual-reversal-pr"
          lake env lean --run Loam/Tests/AccountingRolePublisher.lean "$(mktemp -d)/accounting-role-pr"
          lake env lean --run Loam/Tests/BudgetWindowReview.lean "$(mktemp -d)/budget-window-review-pr"
          lake env lean --run Loam/Tests/TuiScheduled.lean
          lake env lean --run Loam/Tests/TuiHomeActualGeneration.lean
          lake env lean --run Loam/Tests/StockFlowReview.lean
          lake env lean --run Loam/Tests/TuiCycleGrant.lean "$(mktemp -d)/tui-cycle-grant-pr"
          lake env lean --run tests/test_date_jump.lean

      - name: Verify Cycle Budget and Scheduled startup PTY interactions
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_DIR="$(mktemp -d)/cycle-budget-pty"
          lake env lean --run Loam/Tests/CycleBudgetReview.lean "$FIXTURE_DIR"
          python3 tests/test_cycle_budget_tui.py "$FIXTURE_DIR" .lake/build/bin/loamTui
          python3 tests/test_tui_viewport_pty.py "$FIXTURE_DIR" .lake/build/bin/loamTui

      - name: Verify checked Scheduled batch terminal flow on isolated data
        run: python3 tests/test_scheduled_bulk_edit_pty.py

  full:
    name: Full production household TUI qualification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build production executables
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam loamTui terminalProbe Loam.Tests.ActualWorldFixture Loam.Tests.Support
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Verify unified loam command dispatch
        shell: bash
        run: |
          set -euo pipefail

          compare_dispatch() {
            local standalone="$1"
            shift
            local combined_out standalone_out combined_status standalone_status
            set +e
            combined_out="$(.lake/build/bin/loam "$@" 2>&1)"
            combined_status=$?
            standalone_out="$(.lake/build/bin/"$standalone" "${@:2}" 2>&1)"
            standalone_status=$?
            set -e
            test "$combined_status" -eq "$standalone_status"
            test "$combined_out" = "$standalone_out"
          }

          help_out="$(.lake/build/bin/loam help)"
          grep -F "Open TUI interface (primary entrance)" <<<"$help_out"
          grep -F "loam movement [LOAM_DATA_DIR]" <<<"$help_out"

          compare_dispatch loamTui tui too many


      - name: Verify display/history and admission-scoped Locus catalog
        run: lake env lean --run Loam/Tests/LocusCatalog.lean

      - name: Build and verify read-only Locus coherence review
        run: |
          lake build Loam.Review.LocusCoherenceReview
          lake env lean --run Loam/Tests/LocusCoherenceReview.lean

      - name: Build shared Locus admission publisher boundary
        run: lake build Loam.Publisher.LocusAdmissionPublisher

      - name: Verify add-only Locus admission publication
        run: lake env lean --run Loam/Tests/LocusAdmissionPublisher.lean "$(mktemp -d)/locus-admission"

      - name: Verify Locus admission administration interaction
        run: lake env lean --run Loam/Tests/TuiLocusAdmissionAdministration.lean

      - name: Build shared initial AccountingRole publisher boundary
        run: lake build Loam.Publisher.AccountingRolePublisher

      - name: Verify virgin-Locus initial AccountingRole publication
        run: lake env lean --run Loam/Tests/AccountingRolePublisher.lean "$(mktemp -d)/accounting-role"

      - name: Verify AccountingRole administration interaction
        run: lake env lean --run Loam/Tests/TuiAccountingRoleAdministration.lean

      - name: Build bounded historical support administration boundary
        run: lake build Loam.Publisher.BoundedHistorySupportPublisher Loam.Review.BoundedHistorySupportReview Loam.Tui.BoundedHistorySupportAdministration

      - name: Verify bounded historical support publication and anchor guard
        run: lake env lean --run Loam/Tests/BoundedHistorySupport.lean

      - name: Verify bounded historical support administration interaction
        run: lake env lean --run Loam/Tests/TuiBoundedHistorySupportAdministration.lean

      - name: Run shared Actual review checks
        run: lake env lean --run Loam/Tests/RecordReview.lean

      - name: Build production presentation helper
        run: lake build Loam.Presentation.Reports

      - name: Verify typed presentation read state
        run: lake env lean --run Loam/Tests/PresentationReadState.lean

      - name: Verify shared Reports presentation
        run: lake env lean --run Loam/Tests/PresentationReports.lean

      - name: Verify admitted Actual journal export
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/journal-export"
          lake env lean --run Loam/Tests/JournalExport.lean "$root"
          ./.lake/build/bin/loam export journal "$root/actual.loam" "$root/actual-journal.txt"
          grep -Fq "2026-09-02"$'\t'"journal-replacement" "$root/actual-journal.txt"
          grep -Fq "2026-09-03"$'\t'"journal-untouched" "$root/actual-journal.txt"
          if grep -q "journal-original" "$root/actual-journal.txt"; then
            echo "superseded correction target leaked into current journal" >&2
            exit 1
          fi

          cp "$root/actual.loam" "$root/actual-before-alias-check.loam"

          if ./.lake/build/bin/loam export journal \
              "$root/actual.loam" \
              "$root/./actual.loam"; then
            echo "Journal export accepted a dot-path alias of Actual authority" >&2
            exit 1
          fi
          cmp "$root/actual-before-alias-check.loam" "$root/actual.loam"

          ln -s "$root/actual.loam" "$root/actual-alias.loam"
          if ./.lake/build/bin/loam export journal \
              "$root/actual.loam" \
              "$root/actual-alias.loam"; then
            echo "Journal export accepted a symlink alias of Actual authority" >&2
            exit 1
          fi
          cmp "$root/actual-before-alias-check.loam" "$root/actual.loam"
