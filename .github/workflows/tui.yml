      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/CurrentCoverageInspection.lean'
      - 'Loam/Application/ScheduledCommitmentInspection.lean'
      - 'Loam/CurrentCoverageReview.lean'
      - 'Loam/Tests/CurrentCoverageReview.lean'
      - 'Loam/Tui/**'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/MovementAdmission.lean'
      - 'Loam/CorrectionPublisher.lean'
      - 'Loam/ActualValidityPublisher.lean'
      - 'Loam/ActualReversalPublisher.lean'
