  workflow_dispatch:

concurrency:
  group: production-tui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: Build production household TUI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build production executables
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam loamMovement loamMovementProposal loamMovementProposalRecord loamCapacity loamOpenScheduled loamDoctor loamDailyQuantity loamActualRouting loamScheduledRouting loamBudgetWindow loamJournalExport loamPtaExport loamBeancountExport loamTui Loam.Tests.ActualWorldFixture
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify unified loam command dispatch
        shell: bash
        run: |
          set -euo pipefail

          compare_dispatch() {
            local standalone="$1"
            shift
            local combined_out standalone_out combined_status standalone_status
            set +e
            combined_out="$(.lake/build/bin/loam "$@" 2>&1)"
            combined_status=$?
            standalone_out="$(.lake/build/bin/"$standalone" "${@:2}" 2>&1)"
            standalone_status=$?
            set -e
            test "$combined_status" -eq "$standalone_status"
            test "$combined_out" = "$standalone_out"
          }

          help_out="$(.lake/build/bin/loam help)"
          grep -F "Open TUI interface (primary entrance)" <<<"$help_out"
          grep -F "loam movement [LOAM_DATA_DIR]" <<<"$help_out"

          compare_dispatch loamTui tui too many
          compare_dispatch loamDoctor doctor "$(mktemp -d)"
          compare_dispatch loamMovement movement too many
          compare_dispatch loamMovementProposal movement-proposal
          compare_dispatch loamMovementProposalRecord movement-proposal-record
          compare_dispatch loamCapacity capacity
          compare_dispatch loamOpenScheduled open-scheduled
          compare_dispatch loamActualRouting actual-routing
          compare_dispatch loamScheduledRouting scheduled-routing
          compare_dispatch loamBudgetWindow budget-window

          compare_quantity_dispatch() {
            local command="$1"
            local combined_out standalone_out combined_status standalone_status
            set +e
            combined_out="$(.lake/build/bin/loam "$command" 2>&1)"
            combined_status=$?
            standalone_out="$(.lake/build/bin/loamDailyQuantity "$command" 2>&1)"
            standalone_status=$?
            set -e
            test "$combined_status" -eq "$standalone_status"
            test "$combined_out" = "$standalone_out"
          }

          compare_quantity_dispatch balances
          compare_quantity_dispatch current

          compare_export_dispatch() {
            local standalone="$1"
            local kind="$2"
            shift 2
            local combined_out standalone_out combined_status standalone_status
            set +e
            combined_out="$(.lake/build/bin/loam export "$kind" "$@" 2>&1)"
            combined_status=$?
            standalone_out="$(.lake/build/bin/"$standalone" "$@" 2>&1)"
            standalone_status=$?
            set -e
            test "$combined_status" -eq "$standalone_status"
            test "$combined_out" = "$standalone_out"
          }

          compare_export_dispatch loamJournalExport journal
          compare_export_dispatch loamPtaExport pta
          compare_export_dispatch loamBeancountExport beancount

      - name: Verify display/history and admission-scoped Locus catalog
        run: lake env lean --run Loam/Tests/LocusCatalog.lean

      - name: Build shared Locus admission publisher boundary
        run: lake build Loam.LocusAdmissionPublisher

      - name: Verify add-only Locus admission publication
        run: lake env lean --run Loam/Tests/LocusAdmissionPublisher.lean "$(mktemp -d)/locus-admission"

      - name: Verify Locus admission administration interaction
        run: lake env lean --run Loam/Tests/TuiLocusAdmissionAdministration.lean

      - name: Build shared initial AccountingRole publisher boundary
        run: lake build Loam.AccountingRolePublisher

      - name: Verify virgin-Locus initial AccountingRole publication
        run: lake env lean --run Loam/Tests/AccountingRolePublisher.lean "$(mktemp -d)/accounting-role"

      - name: Verify AccountingRole administration interaction
        run: lake env lean --run Loam/Tests/TuiAccountingRoleAdministration.lean

      - name: Run shared Actual review checks
        run: lake env lean --run Loam/Tests/RecordReview.lean

      - name: Verify admitted Actual journal export
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/journal-export"
          lake env lean --run Loam/Tests/JournalExport.lean "$root"
          ./.lake/build/bin/loamJournalExport "$root/actual.loam" "$root/actual-journal.txt"
          grep -Fq "2026-09-02"$'\t'"journal-replacement" "$root/actual-journal.txt"
          grep -Fq "2026-09-03"$'\t'"journal-untouched" "$root/actual-journal.txt"
          if grep -q "journal-original" "$root/actual-journal.txt"; then
            echo "superseded correction target leaked into current journal" >&2
            exit 1
          fi
      - name: Verify Plain Text Accounting export
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/pta-export"
          lake env lean --run Loam/Tests/PlainTextAccountingExport.lean
          lake env lean --run Loam/Tests/JournalExport.lean "$root"
          ./.lake/build/bin/loamPtaExport \
            "$root/actual.loam" \
            "$root/accounting-role.loam" \
            "$root/actual.journal"
          grep -Fq "2026-09-02 LOAM event journal-replacement" "$root/actual.journal"
          grep -Fq "    assets:wallet  -120 jpy" "$root/actual.journal"
          grep -Fq "    expenses:food  120 jpy" "$root/actual.journal"
          grep -Fq "    assets:wallet  -12.34 usd" "$root/actual.journal"
          grep -Fq "    expenses:food  12.34 usd" "$root/actual.journal"
          grep -Fq "    assets:wallet  -27.90 ils" "$root/actual.journal"
          grep -Fq "    expenses:food  27.90 ils" "$root/actual.journal"
          grep -Fq "    ; loam-event-id: journal-untouched" "$root/actual.journal"
          if grep -q "journal-original" "$root/actual.journal"; then
            echo "superseded correction target leaked into PTA journal" >&2
            exit 1
          fi

          if ./.lake/build/bin/loamPtaExport \
              "$root/actual.loam" \
              "$root/accounting-role.loam" \
              "$root/./actual.loam"; then
            echo "PTA export accepted a dot-path alias of Actual authority" >&2
            exit 1
          fi

          if ./.lake/build/bin/loamPtaExport \
              "$root/actual.loam" \
              "$root/accounting-role.loam" \
              "$root/config/measure-presentation.tsv"; then
            echo "PTA export accepted the Measure presentation input as output" >&2
            exit 1
          fi

          ln -s "$root/accounting-role.loam" "$root/accounting-role-alias.loam"
          if ./.lake/build/bin/loamPtaExport \
              "$root/actual.loam" \
              "$root/accounting-role.loam" \
              "$root/accounting-role-alias.loam"; then
            echo "PTA export accepted a symlink alias of AccountingRole authority" >&2
            exit 1
          fi

      - name: Verify Record publication and fresh canonical review
        run: lake env lean --run Loam/Tests/TuiRecord.lean "$(mktemp -d)/actual-root"

      - name: Build shared Correction publisher boundary
        run: lake build Loam.CorrectionPublisher

      - name: Verify normalized Actual correction publication
        run: lake env lean --run Loam/Tests/CorrectionPublisher.lean "$(mktemp -d)/correction-publisher"

      - name: Verify selected-day Correction editor and shared publication
        run: lake env lean --run Loam/Tests/TuiCorrection.lean "$(mktemp -d)/tui-correction"

      - name: Build shared ActualValidity publisher boundary
        run: lake build Loam.ActualValidityPublisher

      - name: Verify selected-day date editor and shared publication
        run: lake env lean --run Loam/Tests/TuiActualDateCorrection.lean "$(mktemp -d)/tui-date-correction"

      - name: Build shared Actual Reversal publisher boundary
        run: lake build Loam.ActualReversalPublisher

      - name: Verify relation-first exact Actual reversal publication
        run: lake env lean --run Loam/Tests/ActualReversalPublisher.lean "$(mktemp -d)/actual-reversal"

      - name: Verify selected-day Actual reversal and fresh canonical review
        run: lake env lean --run Loam/Tests/TuiActualReversal.lean "$(mktemp -d)/tui-actual-reversal"

      - name: Verify full-day Actual local window navigation
        run: lake env lean --run Loam/Tests/TuiActual.lean

      - name: Verify Scheduled browse, detail, and open-world Unknown
        run: lake env lean --run Loam/Tests/TuiScheduled.lean

      - name: Verify HRA Scheduled workspace mechanics
        run: lake env lean --run Loam/Tests/TuiHraScheduled.lean

      - name: Build shared Scheduled creation publisher boundary
        run: lake build Loam.ScheduledCreationPublisher

      - name: Build construction-only Scheduled generation
        run: lake build Loam.ScheduledGeneration

      - name: Verify construction-only Scheduled generation
        run: lake env lean --run Loam/Tests/ScheduledGeneration.lean

      - name: Verify Scheduled generation interaction
        run: lake env lean --run Loam/Tests/TuiScheduledGeneration.lean

      - name: Verify selected-day Scheduled creation and fresh canonical review
        run: lake env lean --run Loam/Tests/TuiScheduledCreate.lean "$(mktemp -d)/tui-scheduled-create"

      - name: Build shared Scheduled terminal publisher boundary
        run: lake build Loam.ScheduledTerminalPublisher

      - name: Verify selected-day Scheduled completion and cancellation
        run: lake env lean --run Loam/Tests/TuiScheduledTerminal.lean "$(mktemp -d)/tui-scheduled-terminal"

      - name: Verify post-completion Scheduled awareness
        run: lake env lean --run Loam/Tests/TuiScheduledContinuation.lean

      - name: Verify selected-day Actual and Scheduled composition
        run: lake env lean --run Loam/Tests/TuiSelectedDay.lean

      - name: Build Attention review boundary
        run: lake build Loam.AttentionReview Loam.Tui.Attention Loam.Tui.AttentionAdministration

      - name: Verify shared Attention persistence and review boundary
        run: lake env lean --run Loam/Tests/AttentionPersistence.lean "$(mktemp -d)/attention-review"

      - name: Verify read-only Attention workspace
        run: lake env lean --run Loam/Tests/TuiAttention.lean

      - name: Verify Attention administration interaction
        run: lake env lean --run Loam/Tests/TuiAttentionAdministration.lean

      - name: Build Actual-backed Balance review boundary
        run: lake build Loam.BalanceReview

      - name: Verify Actual-backed Balance review boundary
        run: lake env lean --run Loam/Tests/BalanceReview.lean "$(mktemp -d)/balance-review"

      - name: Verify admitted Actual quantity CLI projections
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/actual-quantity-cli"
          lake env lean --run Loam/Tests/ActualQuantityCliFixture.lean "$root"

          ./.lake/build/bin/loamDailyQuantity current             "$root/actual.loam" "$root/zero-origin-coverage.loam"             >"$root/current.txt"
          grep -Fq "wallet: -75 jpy" "$root/current.txt"
          grep -Fq "food: 75 jpy" "$root/current.txt"
          if grep -Fq "cash: 0 jpy" "$root/current.txt"; then
            echo "zero current quantity leaked into zero-omitting current view" >&2
            exit 1
          fi

          ./.lake/build/bin/loamDailyQuantity balances             "$root/actual.loam" "$root/zero-origin-coverage.loam"             "$root/config/balance-view.tsv"             >"$root/balances.txt"
          grep -Fq "wallet: -75 jpy" "$root/balances.txt"
          grep -Fq "cash: 0 jpy" "$root/balances.txt"

          ./.lake/build/bin/loam effective "$root/actual.loam"             >"$root/effective.txt"
          grep -Fq "correction-frontier projection" "$root/effective.txt"
          grep -Fq "wallet: -75 jpy" "$root/effective.txt"
          grep -Fq "food: 75 jpy" "$root/effective.txt"
      - name: Verify read-only Balances workspace
        run: lake env lean --run Loam/Tests/TuiBalances.lean

      - name: Build shared Capacity publisher boundary
        run: lake build Loam.CapacityPublisher

      - name: Verify Capacity transfer and fresh shared review
        run: lake env lean --run Loam/Tests/TuiCapacityTransfer.lean "$(mktemp -d)/tui-capacity-transfer"

      - name: Verify Capacity rebalance and fresh shared review
        run: lake env lean --run Loam/Tests/TuiCapacityRebalance.lean "$(mktemp -d)/tui-capacity-rebalance"

      - name: Verify shared Capacity review boundary
        run: lake env lean --run Loam/Tests/CapacityReview.lean "$(mktemp -d)/capacity-review"

      - name: Verify windowed Current Coverage review boundary
        run: lake env lean --run Loam/Tests/CurrentCoverageReview.lean "$(mktemp -d)/current-coverage-review"

      - name: Verify Capacity workspace
        run: lake env lean --run Loam/Tests/TuiCapacity.lean

      - name: Build shared Actual Purpose routing administration boundaries
        run: |
