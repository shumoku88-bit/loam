name: Daily Pace History Pressure

on:
  pull_request:
    paths:
      - 'Loam/Tests/DailyPaceHistoryBenchmark.lean'
      - '.github/workflows/daily-pace-history-pressure.yml'
      - 'Loam/CycleSpendingPaceReview.lean'
      - 'Loam/ActualDate.lean'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build Daily Pace review dependency
        run: lake build Loam.CycleSpendingPaceReview
      - name: Run paired Daily Pace history benchmark
        run: lake env lean --run Loam/Tests/DailyPaceHistoryBenchmark.lean
