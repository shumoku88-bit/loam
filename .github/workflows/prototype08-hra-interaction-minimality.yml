name: Prototype 08 HRA Interaction Minimality

on:
  pull_request:
    paths:
      - 'docs/research/household/HRA_INTERACTION_ATLAS_2026-09.md'
      - 'Loam/Prototype/Interaction08/Minimality.als'
      - '.github/workflows/prototype08-hra-interaction-minimality.yml'
  push:
    branches:
      - 'research/hra-interaction-minimality-08'
    paths:
      - 'docs/research/household/HRA_INTERACTION_ATLAS_2026-09.md'
      - 'Loam/Prototype/Interaction08/Minimality.als'
      - '.github/workflows/prototype08-hra-interaction-minimality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy HRA-derived surface minimality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Execute interaction minimality model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            Loam/Prototype/Interaction08/Minimality.als
          find /tmp/alloy-output -maxdepth 2 -type f -print -exec sed -n '1,180p' {} \;

      - name: Require expected structural results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']

          # True means SAT/counterexample exists. For checks, the desired
          # result is False: no counterexample in the bounded scope.
          expected = {
              'workspaceCore': True,
              'splitActualCore': True,
              'hraAdditiveEntitlement': True,
              'NoFourSurfaceSufficient': False,
              'FiveSurfaceCoreIsWorkspace': False,
              'MinimalExcludesPaletteAndEntitlement': False,
          }

          wrong = []
          for name, want_sat in expected.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Alloy results: {wrong}')
          PY
