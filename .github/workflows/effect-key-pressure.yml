name: EffectKey Pressure

on:
  push:
    branches:
      - experiment/effect-key-pressure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shumoku88-bit/loam-data
          ref: 169450fc1b85fe998070b91da16af1e4dccd25ca
          path: household
      - name: Measure current persisted key pressure
        run: bash tools/run-effect-key-pressure "$GITHUB_WORKSPACE/household"
