name: Observation 251

on:
  pull_request:
    paths:
      - 'experiments/251_optional_actual_routing_candidates.lean'
      - '.github/workflows/observation-251.yml'

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify optional non-Expense Actual routing candidates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build reused Actual routing boundaries
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.ActualRoutingReview Loam.ActualRoutingPublisher
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Run Observation 251 witness
        run: lake env lean --run experiments/251_optional_actual_routing_candidates.lean
