name: Operational Continuity

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/OperationalContinuity.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/MovementWorldLoader.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/DoctorCli.lean'
      - 'Loam/Cli/NewHouseholdCli.lean'
      - 'Loam/Cli/ResumeCli.lean'
      - 'Loam/Tests/HiatusResume.lean'
      - 'Loam/Tests/FreshHouseholdDailyLife.lean'
      - 'Loam/Tests/NewHousehold.lean'
      - 'Loam/Tests/OperationalContinuity.lean'
      - 'tools/loam'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - '.github/workflows/operational-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Qualify diagnosis and operational continuity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build household doctor
        uses: ./.github/actions/lean-build
        with:
          build-args: loam Loam.MovementWorldLoader

      - name: Verify fail-closed diagnosis and human explanation
        run: |
          lake test -- OperationalContinuity
          lake test -- NewHousehold
          lake test -- HiatusResume
          lake test -- FreshHouseholdDailyLife

      - name: Verify practical doctor entrance stays read-only and explanatory
        shell: bash
        run: |
          data_dir="$(mktemp -d)/household"
          mkdir -p "$data_dir"
          set +e
          output="$(./tools/loam doctor "$data_dir" 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -Fq 'LOAM operational diagnosis' <<<"$output"
          grep -Fq 'Status: blocked' <<<"$output"
          grep -Fq 'What did not happen:' <<<"$output"
          grep -Fq 'This diagnosis is read-only.' <<<"$output"
          grep -Fq 'Technical detail:' <<<"$output"

      - name: Verify explicit fresh-root CLI and refusal to overwrite
        shell: bash
        run: |
          base="$(mktemp -d)"
          new_root="$base/new-household"
          ./tools/loam init "$new_root"
          ./tools/loam doctor "$new_root"
          test -s "$new_root/household.loam"
          cp "$new_root/household.loam" "$base/before.loam"
          if ./tools/loam init "$new_root"; then
            echo 'init unexpectedly accepted an existing root' >&2
            exit 1
          fi
          cmp "$base/before.loam" "$new_root/household.loam"

      - name: Verify resume report never edits original household
        shell: bash
        run: |
          base="$(mktemp -d)"
          ./tools/loam init "$base/existing"
          cp "$base/existing/household.loam" "$base/original.loam"
          report="$(./tools/loam resume "$base/existing")"
          grep -Fq 'Resume existing household (read-only)' <<<"$report"
          grep -Fq 'Overdue current-open Scheduled occurrences:' <<<"$report"
          grep -Fq 'does NOT declare missing days complete' <<<"$report"
          cmp "$base/original.loam" "$base/existing/household.loam"
