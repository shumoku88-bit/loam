name: Application 001 Query Shape

on:
  push:
    paths:
      - 'experiments/application_001_quantity_query_shape.als'
      - 'experiments/application_001_quantity_query_shape.md'
      - '.github/workflows/application-001-query-shape.yml'
  pull_request:
    paths:
      - 'experiments/application_001_quantity_query_shape.als'
      - 'experiments/application_001_quantity_query_shape.md'
      - '.github/workflows/application-001-query-shape.yml'

permissions:
  contents: read

jobs:
  alloy-query-shape:
    name: Alloy query-shape boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Execute query-shape experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/application_001_quantity_query_shape.als
          find /tmp/alloy-output -maxdepth 2 -type f -print -exec sed -n '1,220p' {} \;

      - name: Require expected witnesses and checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected = {
              'zeroCorrectionReadable': True,
              'oneClosedCorrectionReadable': True,
              'oneOpenCorrectionRefuses': True,
              'multipleCorrectionsRequireFrontier': True,
              'invisibleEvidenceCanVaryWithoutChangingMode': True,
              'ZeroCorrectionsAlwaysUseRecordedQuantity': False,
              'OneClosedCorrectionAlwaysUsesSingleCorrectionProjection': False,
              'OneOpenCorrectionNeverPretendsToBeEffective': False,
              'MultipleCorrectionsNeverPretendToHaveAFrontier': False,
              'UnobservedEvidenceCannotChangeInspectionMode': False,
          }

          wrong = []
          for name, want_sat in expected.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Alloy results: {wrong}')
          PY
