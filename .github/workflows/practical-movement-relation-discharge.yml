name: Practical Movement Relation Discharge

on:
  pull_request:
    paths:
      - 'Loam/Application/OpenRelationFrontier.lean'
      - 'Loam/Application/RelationDischargeFrontier.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Cli/Movement/DischargeEntry.lean'
      - 'Loam/Cli/Movement/RelationEntry.lean'
      - 'Loam/Persistence/OpenRelationPersistence.lean'
      - 'Loam/Persistence/RelationDischargePersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Tests/RelationDischargeFrontier.lean'
      - 'tools/loam-movement'
      - '.github/workflows/practical-movement-relation-discharge.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - 'Loam/Application/OpenRelationFrontier.lean'
      - 'Loam/Application/RelationDischargeFrontier.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Cli/Movement/DischargeEntry.lean'
      - 'Loam/Cli/Movement/RelationEntry.lean'
      - 'Loam/Persistence/OpenRelationPersistence.lean'
      - 'Loam/Persistence/RelationDischargePersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Tests/RelationDischargeFrontier.lean'
      - 'tools/loam-movement'
      - '.github/workflows/practical-movement-relation-discharge.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  movement-discharge:
    name: Movement discharge through manifest authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean and build Movement
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamMovement
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run current relation discharge frontier regression
        run: lake env lean Loam/Tests/RelationDischargeFrontier.lean

      - name: Publish exact partial discharge on second Movement
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel friend-in

          printf 'paypay\n100\n\ntravel\n100\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t100' \
                ./tools/loam-movement "$memory" >"$tmp_dir/first"

          relation_ref="$(awk -F '\t' '$1 == "RelationUnit" { print $2; exit }' "$manifest/CURRENT")"
          grep -Fq $'RELATION\trelation-1\trecord-1\teffect-1\tE\tfriend\tH\t\t100' \
            "$manifest/$relation_ref"

          printf 'friend-in\n40\n\npaypay\n40\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-06 \
                LOAM_DISCHARGES=$'relation-1\t40' \
                ./tools/loam-movement "$memory" >"$tmp_dir/second"

          grep -Fq 'event: record-2' "$tmp_dir/second"
          grep -Fq '[ok] relation discharge evidence admitted: 1' "$tmp_dir/second"
          event_ref="$(awk -F '\t' '$1 == "Event" { print $2; exit }' "$manifest/CURRENT")"
          discharge_ref="$(awk -F '\t' '$1 == "RelationDischarge" { print $2; exit }' "$manifest/CURRENT")"
          grep -Fq $'EVENT\trecord-2' "$manifest/$event_ref"
          expected=$'LOAM-RELATION-DISCHARGE-MEMORY\t1\nDISCHARGE\trecord-2\trelation-1\t40'
          test "$(cat "$manifest/$discharge_ref")" = "$expected"

      - name: Keep relation-discharge-free redirected Movement explicit
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" cash coffee

          printf 'cash\n25\n\ncoffee\n25\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                ./tools/loam-movement "$memory" >"$tmp_dir/out"

          grep -Fq '[ok] relation discharge decision: none' "$tmp_dir/out"
          discharge_ref="$(awk -F '\t' '$1 == "RelationDischarge" { print $2; exit }' "$manifest/CURRENT")"
          test "$(cat "$manifest/$discharge_ref")" = $'LOAM-RELATION-DISCHARGE-MEMORY\t1'

      - name: Reject over-discharge before authority switch
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel friend-in

          printf 'paypay\n100\n\ntravel\n100\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t100' \
                ./tools/loam-movement "$memory" >/dev/null
          cp "$manifest/CURRENT" "$tmp_dir/current.before"

          if printf 'friend-in\n120\n\npaypay\n120\n\n' \
              | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                  LOAM_OCCURRENCE_DATE=2026-09-06 \
                  LOAM_DISCHARGES=$'relation-1\t120' \
                  ./tools/loam-movement "$memory" \
                  >"$tmp_dir/out" 2>"$tmp_dir/err"; then
            echo 'expected over-discharge to fail' >&2
            exit 1
          else
            status=$?
          fi

          test "$status" = '2'
          grep -Fq 'relation discharge evidence did not justify one current target frontier' "$tmp_dir/err"
          cmp "$tmp_dir/current.before" "$manifest/CURRENT"

      - name: Reject duplicate Event-target discharge correspondence
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          manifest="$tmp_dir/movement-authority"
          memory="$tmp_dir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel friend-in

          printf 'paypay\n100\n\ntravel\n100\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t100' \
                ./tools/loam-movement "$memory" >/dev/null
          cp "$manifest/CURRENT" "$tmp_dir/current.before"

          if printf 'friend-in\n70\n\npaypay\n70\n\n' \
              | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                  LOAM_OCCURRENCE_DATE=2026-09-06 \
                  LOAM_DISCHARGES=$'relation-1\t40\nrelation-1\t30' \
                  ./tools/loam-movement "$memory" \
                  >"$tmp_dir/out" 2>"$tmp_dir/err"; then
            echo 'expected duplicate Event-target discharge to fail' >&2
            exit 1
          else
            status=$?
          fi

          test "$status" = '2'
          grep -Fq 'relation discharge evidence did not justify one current target frontier' "$tmp_dir/err"
          cmp "$tmp_dir/current.before" "$manifest/CURRENT"
