name: Purpose Catalog Boundary

on:
  pull_request:
    paths:
      - 'Loam/Presentation/PresentationMetadata.lean'
      - 'Loam/Presentation/PurposeCatalog.lean'
      - 'Loam/Tui/Capacity.lean'
      - 'Loam/Tui/CycleBudget.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/Tests/PurposeCatalog.lean'
      - 'Loam/Tests/TuiPurposeLabels.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/purpose-catalog.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'Loam/Presentation/PresentationMetadata.lean'
      - 'Loam/Presentation/PurposeCatalog.lean'
      - 'Loam/Tui/Capacity.lean'
      - 'Loam/Tui/CycleBudget.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/Tests/PurposeCatalog.lean'
      - 'Loam/Tests/TuiPurposeLabels.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/purpose-catalog.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prove display noninterference and test Purpose labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Build production TUI integration
        run: lake build loamTui

      - name: Run Purpose catalog package test group
        run: lake test -- purpose-catalog
