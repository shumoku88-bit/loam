name: Purpose Catalog Boundary

on:
  pull_request:
    paths:
      - 'Loam/PresentationMetadata.lean'
      - 'Loam/PurposeCatalog.lean'
      - 'Loam/Observations/Observation239.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Tui/Capacity.lean'
      - 'Loam/Tui/CycleBudget.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/Tests/PurposeCatalog.lean'
      - 'Loam/Tests/TuiPurposeLabels.lean'
      - 'experiments/239_purpose_catalog_noninterference.md'
      - '.github/workflows/purpose-catalog.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'Loam/PresentationMetadata.lean'
      - 'Loam/PurposeCatalog.lean'
      - 'Loam/Observations/Observation239.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Tui/Capacity.lean'
      - 'Loam/Tui/CycleBudget.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/Tests/PurposeCatalog.lean'
      - 'Loam/Tests/TuiPurposeLabels.lean'
      - 'experiments/239_purpose_catalog_noninterference.md'
      - '.github/workflows/purpose-catalog.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Prove display noninterference and test Purpose labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Build selected live observations
        run: lake build

      - name: Build production TUI integration
        run: lake build loamTui

      - name: Exercise Purpose catalog decoding and fallback
        run: lake env lean --run Loam/Tests/PurposeCatalog.lean

      - name: Exercise TUI label rendering without semantic identity drift
        run: lake env lean --run Loam/Tests/TuiPurposeLabels.lean
