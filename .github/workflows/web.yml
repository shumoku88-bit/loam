name: Web Frontend

on:
  pull_request:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Web/**'
      - 'Loam/Presentation/**'
      - 'Loam/Tests/WebSnapshot.lean'
      - 'Loam/Tests/WebRecord.lean'
      - 'Loam/Tests/WebRecordPublication.lean'
      - 'Loam/Tests/PresentationHome.lean'
      - 'Loam/Tests/PresentationReports.lean'
      - 'Loam/Tests/PresentationReadState.lean'
      - 'Loam/ActualAuthority.lean'
      - 'Loam/ActualReview.lean'
      - 'Loam/ScheduledReview.lean'
      - 'Loam/AttentionReview.lean'
      - 'Loam/CapacityReview.lean'
      - 'Loam/CycleBudgetReview.lean'
      - 'Loam/CycleSpendingPaceReview.lean'
      - 'Loam/StockFlowReview.lean'
      - 'Loam/RoleFlowReview.lean'
      - 'Loam/TransactionsFlowReview.lean'
      - 'Loam/RoleBalanceReview.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Persistence/OpeningSupportPersistence.lean'
      - 'Loam/Persistence/CurrentQuantityAnchorPersistence.lean'
      - 'Loam/CurrentQuantityAnchor.lean'
      - 'Loam/BalanceReview.lean'
      - 'Loam/BalanceViewConfig.lean'
      - 'Loam/CurrentCoverageReview.lean'
      - 'Loam/CycleFundingInspection.lean'
      - 'Loam/PurposeCatalog.lean'
      - 'tools/loam'
      - 'tools/loam_web_server.py'
      - 'lakefile.lean'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: Build Web frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Web frontend
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamWeb
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify typed presentation read state
        run: lake env lean --run Loam/Tests/PresentationReadState.lean

      - name: Verify shared Home presentation
        run: lake env lean --run Loam/Tests/PresentationHome.lean

      - name: Verify shared Reports presentation
        run: lake env lean --run Loam/Tests/PresentationReports.lean

      - name: Verify presentation-only Web snapshot
        run: lake env lean --run Loam/Tests/WebSnapshot.lean

      - name: Verify Web Record form and shared preview
        run: lake env lean --run Loam/Tests/WebRecord.lean

      - name: Verify retry-safe Web Record publication
        run: |
          tmpdir="$(mktemp -d)"
          lake env lean --run Loam/Tests/WebRecordPublication.lean "$tmpdir/data"
          .lake/build/bin/loamWeb --record-confirm "$tmpdir/data" web-cli-operation \
            2026-09-25 cli-confirm jpy paypay 100 books 100 > "$tmpdir/confirm.html"
          grep -q 'Recorded Event' "$tmpdir/confirm.html"
          .lake/build/bin/loamWeb --record-confirm "$tmpdir/data" web-cli-operation \
            2026-09-25 cli-confirm jpy paypay 100 books 100 > "$tmpdir/retry.html"
          grep -q 'Record already completed as Event' "$tmpdir/retry.html"

      - name: Verify Record document command modes
        run: |
          .lake/build/bin/loamWeb --record-form /tmp/loam-web-missing web-command-form > /tmp/loam-record-form.html
          grep -q '<title>LOAM Record</title>' /tmp/loam-record-form.html
          .lake/build/bin/loamWeb --record-preview /tmp/loam-web-missing web-command-preview \
            2026-09-25 test jpy paypay 100 books 100 > /tmp/loam-record-preview.html
          grep -q '<title>LOAM Record</title>' /tmp/loam-record-preview.html
          .lake/build/bin/loamWeb --record-confirm /tmp/loam-web-missing web-command-confirm \
            2026-09-25 test jpy paypay 100 books 100 > /tmp/loam-record-confirm.html
          grep -q '<title>LOAM Record</title>' /tmp/loam-record-confirm.html

      - name: Verify stdout document mode
        run: |
          .lake/build/bin/loamWeb /tmp/loam-web-missing - > /tmp/loam-web.html
          grep -q '<title>LOAM Web</title>' /tmp/loam-web.html
          grep -q '<!DOCTYPE HTML PUBLIC' /tmp/loam-web.html

      - name: Refuse Web output inside household storage
        run: |
          tmpdir="$(mktemp -d)"
          data="$tmpdir/data"
          mkdir -p "$data"
          printf 'KEEP\n' > "$data/actual.loam"

          if .lake/build/bin/loamWeb "$data" "$data/snapshot.html"; then
            echo "Web output unexpectedly created a file inside the household root" >&2
            exit 1
          fi
          test ! -e "$data/snapshot.html"

          if .lake/build/bin/loamWeb "$data" "$data/./actual.loam"; then
            echo "Web output unexpectedly replaced Actual through a lexical alias" >&2
            exit 1
          fi
          grep -qx 'KEEP' "$data/actual.loam"

          ln -s "$data/actual.loam" "$tmpdir/actual-alias"
          if .lake/build/bin/loamWeb "$data" "$tmpdir/actual-alias"; then
            echo "Web output unexpectedly replaced Actual through a symbolic-link alias" >&2
            exit 1
          fi
          grep -qx 'KEEP' "$data/actual.loam"

          .lake/build/bin/loamWeb "$data" "$tmpdir/snapshot.html"
          grep -q '<title>LOAM Web</title>' "$tmpdir/snapshot.html"

      - name: Check request-on-read server syntax
        run: python3 -m py_compile tools/loam_web_server.py

      - name: Verify request freshness and issued-operation transport
        run: |
          tmpdir="$(mktemp -d)"
          counter="$tmpdir/counter"
          cat > "$tmpdir/fake-loam-web" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          counter="$counter"
          n=0
          if [[ -f "\$counter" ]]; then
            n="\$(cat "\$counter")"
          fi
          n="\$((n + 1))"
          printf '%s' "\$n" > "\$counter"
          extra=''
          if [[ "\${1:-}" == '--record-form' ]]; then
            extra="<input type=\"hidden\" name=\"operation\" value=\"\${3:-}\">"
          fi
          printf '<!DOCTYPE html><html><body>render-%s%s</body></html>' "\$n" "\$extra"
          EOF
          chmod +x "$tmpdir/fake-loam-web"

          python3 tools/loam_web_server.py "$tmpdir/fake-loam-web" "$tmpdir/data"             >"$tmpdir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ > "$tmpdir/first.html"; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/ > "$tmpdir/second.html"
          curl -fsS http://127.0.0.1:8765/record > "$tmpdir/record.html"
          operation="$(sed -n 's/.*name="operation" value="\([^"]*\)".*/\1/p' "$tmpdir/record.html")"
          test -n "$operation"

          forged_status="$(curl -sS -o "$tmpdir/forged.html" -w '%{http_code}' \
            -X POST http://127.0.0.1:8765/record/preview \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'operation=web-forged-operation' \
            --data-urlencode 'date=2026-09-25' \
            --data-urlencode 'description=forged' \
            --data-urlencode 'measure=jpy' \
            --data-urlencode 'from_locus=paypay' \
            --data-urlencode 'from_amount=1' \
            --data-urlencode 'to_locus=books' \
            --data-urlencode 'to_amount=1')"
          test "$forged_status" = "403"

          curl -fsS -X POST http://127.0.0.1:8765/record/preview \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "operation=$operation" \
            --data-urlencode 'date=2026-09-25' \
            --data-urlencode 'description=book & tea' \
            --data-urlencode 'measure=jpy' \
            --data-urlencode 'from_locus=paypay' \
            --data-urlencode 'from_amount=2470' \
            --data-urlencode 'to_locus=books' \
            --data-urlencode 'to_amount=2470' > "$tmpdir/review.html"
          curl -fsS -X POST http://127.0.0.1:8765/record/confirm \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "operation=$operation" \
            --data-urlencode 'date=2026-09-25' \
            --data-urlencode 'description=book & tea' \
            --data-urlencode 'measure=jpy' \
            --data-urlencode 'from_locus=paypay' \
            --data-urlencode 'from_amount=2470' \
            --data-urlencode 'to_locus=books' \
            --data-urlencode 'to_amount=2470' > "$tmpdir/confirmed.html"

          grep -q 'render-1' "$tmpdir/first.html"
          grep -q 'render-2' "$tmpdir/second.html"
          grep -q 'render-3' "$tmpdir/record.html"
          grep -q 'render-4' "$tmpdir/review.html"
          grep -q 'render-5' "$tmpdir/confirmed.html"
          test "$(cat "$counter")" = "5"
