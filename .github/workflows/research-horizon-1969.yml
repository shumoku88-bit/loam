# One-off #1969 research lane. Intentionally *not* proposed for permanent CI.
# Keep this workflow on a draft branch, capture the results, then retire it.
name: Research - Household Horizon Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/research-horizon-1969.yml'
      - 'tools/research-horizon-baseline.py'
      - 'tools/HorizonWriteProfile.lean'
      - 'tools/research-horizon-write.py'

permissions:
  contents: read

concurrency:
  group: research-horizon-1969-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-horizon:
    name: 1-30 year synthetic read profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build existing production TUI + CLI
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          # Synthetic fixture runner imports this test module; compile it explicitly.
          build-args: loamTui loam Loam.Tests.ActualWorldFixture
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false
      - name: Compile existing native whole-Household phase profile
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -c "$RUNNER_TEMP/loam-actual-read-profile.c" tools/ActualReadProfile.lean
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shlex
          import subprocess
          temp = Path(os.environ["RUNNER_TEMP"])
          args = [a for a in shlex.split(Path(".lake/build/bin/loamTui.rsp").read_text())
                  if not a.endswith("/Loam/Tui/Executable.c.o.export")]
          subprocess.run(["lake", "env", "leanc", "-O3", "-o",
                          str(temp / "loam-actual-read-profile"),
                          str(temp / "loam-actual-read-profile.c"), *args], check=True)
          PY
      - name: Run bounded 1/5/10/20/30-year read-only synthetic study
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          python3 tools/research-horizon-baseline.py \
            --profile "$RUNNER_TEMP/loam-actual-read-profile" \
            --years 1 5 10 20 30 --events-per-day 2 --runs 3 \
            --output "$RUNNER_TEMP/horizon-results.json"
      - name: Compile existing HouseholdCommand write profile
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -c "$RUNNER_TEMP/loam-horizon-write.c" tools/HorizonWriteProfile.lean
          python3 - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          args = [a for a in shlex.split(Path(".lake/build/bin/loamTui.rsp").read_text())
                  if not a.endswith("/Loam/Tui/Executable.c.o.export")]
          subprocess.run(["lake", "env", "leanc", "-O3", "-o",
                          str(temp / "loam-horizon-write"),
                          str(temp / "loam-horizon-write.c"), *args], check=True)
          PY
      - name: Measure isolated HouseholdCommand write and old-year revisions
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          python3 tools/research-horizon-write.py \
            --binary "$RUNNER_TEMP/loam-horizon-write" \
            --years 1 10 20 30 --events-per-day 2 --runs 2 \
            --output "$RUNNER_TEMP/horizon-write-results.json"
      - name: Save synthetic observations (not canonical data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-1969-results
          path: |
            ${{ runner.temp }}/horizon-results.json
            ${{ runner.temp }}/horizon-write-results.json
          if-no-files-found: ignore
          retention-days: 7
