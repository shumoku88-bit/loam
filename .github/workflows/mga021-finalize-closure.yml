name: MGA021 Finalize Closure Bookkeeping

on:
  push:
    branches:
      - 'audit/mga-021-first-pass-closure'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-021-first-pass-closure
      - name: Refresh ledger only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ledger = Path('docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md')
          text = ledger.read_text()
          old = "Checkpoint base: `448fffdbe0b161151f8f21811bc1cde177d2b1f4`\n\nStatus: **MGA-016 COMPLETE — ScheduledContinuationSession KEEP_BOUNDARY / SPLIT_QUALIFIED; PR #977 ready for merge**\n"
          new = "Checkpoint base: `813425b1ef4a115b8b419936a9cc95bc530d1857`\n\nStatus: **MGA-021 FIRST PASS CLOSED — no unexplained structural candidate justifies another broad implementation experiment**\n\n## MGA-021 current checkpoint\n\nFresh whole-repository inventory after MGA-020 / PR #986:\n\n```text\nLean modules: 337\nModules <= 80 lines: 92\nModules with exactly one local consumer: 56\nDeclared Lake roots: 17\nProduction-like modules unreachable from declared roots: 0\n```\n\nMGA-017 through MGA-020 focused on the remaining Reports responsibility density. MGA-018 qualified `ReportWindow`; MGA-020 qualified `TransactionsFlowPane`. The MGA-021 residual rerank found no new unexplained collapse, move, split, or retirement candidate strong enough to continue the broad first pass. See `MODULE_GRANULARITY_FIRST_PASS_CLOSURE_021.md` for the closure evidence and reopening rule. Historical detailed entries remain below.\n"
          if old not in text:
              raise SystemExit('ledger checkpoint anchor not found')
          ledger.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md
          git commit -m 'docs(audit): refresh ledger at MGA-021 closure'
          git push origin HEAD:audit/mga-021-first-pass-closure
