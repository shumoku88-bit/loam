name: Observation 147

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation147.lean'
      - 'Loam/Observations.lean'
      - 'experiments/147_actual_validity_root_compression.md'
      - '.github/workflows/observation-147-actual-validity-root-compression.yml'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/ActualValidityHistory.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/147-actual-validity-root-compression'
      - main
    paths:
      - 'Loam/Observations/Observation147.lean'
      - 'Loam/Observations.lean'
      - 'experiments/147_actual_validity_root_compression.md'
      - '.github/workflows/observation-147-actual-validity-root-compression.yml'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/ActualValidityHistory.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-compression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check ActualValidity root compression
        run: lake build Loam.Observations.Observation147
