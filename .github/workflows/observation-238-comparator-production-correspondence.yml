name: Observation 238

on:
  pull_request:
    paths:
      - 'verification/observation238/**'
      - 'experiments/238_comparator_production_correspondence.md'
      - '.github/workflows/observation-238-comparator-production-correspondence.yml'
  workflow_dispatch:

jobs:
  comparator-counterexample:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned Comparator tools
        working-directory: verification/observation238
        run: |
          lake update
          lake build comparator lean4export

      - name: Test production-free accepted Solution
        working-directory: verification/observation238
        run: |
          export COMPARATOR_LANDRUN="$(realpath .lake/packages/Comparator/scripts/fake-landrun.sh)"
          export COMPARATOR_LEAN4EXPORT="$(realpath .lake/packages/lean4export/.lake/build/bin/lean4export)"
          lake env .lake/packages/Comparator/.lake/build/bin/comparator config.json

      - name: Record negative boundary
        run: |
          echo "Accepted Solution deliberately does not import LOAM production code."
          echo "Success therefore qualifies statement/axiom/kernel checking, not production correspondence."
          echo "fake-landrun is used; no adversarial sandboxing claim is made."
