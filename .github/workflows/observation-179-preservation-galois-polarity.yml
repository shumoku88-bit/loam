name: Observation 179

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation159.lean'
      - 'Loam/Observations/Observation179.lean'
      - 'Loam/Observations.lean'
      - 'experiments/179_preservation_galois_polarity.md'
      - '.github/workflows/observation-179-preservation-galois-polarity.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Quantity.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/179-preservation-galois-polarity'
      - main
    paths:
      - 'Loam/Observations/Observation159.lean'
      - 'Loam/Observations/Observation179.lean'
      - 'Loam/Observations.lean'
      - 'experiments/179_preservation_galois_polarity.md'
      - '.github/workflows/observation-179-preservation-galois-polarity.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Quantity.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation-galois-polarity:
    name: Lean preservation / Galois polarity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check preservation polarity
        run: lake build Loam.Observations.Observation179
