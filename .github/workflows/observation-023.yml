name: Observation 023

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy append-only resolution structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy 6.2.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"

      - name: Execute Alloy observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            model/023_append_only_resolution.als

      - name: Require resolution witnesses and frontier safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          commands = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())['commands']

          def sat(name):
              return bool(commands.get(name, {}).get('solution', []))

          expected = {
              'conflictBeforeResolution': True,
              'fullResolutionSettles': True,
              'partialResolutionLeavesConflict': True,
              'WholeFrontierResolutionSettles': False,
              'WholeFrontierResolutionHasUniqueTip': False,
              'PartialResolutionDoesNotSettle': False,
          }
          for name, want in expected.items():
              got = sat(name)
              print(f'{name}: {"SAT" if got else "UNSAT"}')
              if got != want:
                  raise SystemExit(f'unexpected Alloy result for {name}: {got}')
          PY

  tla:
    name: TLA+ append-only resolution behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check append-only resolution behavior
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/AppendOnlyResolution.cfg \
            tla/AppendOnlyResolution.tla \
            2>&1 | tee /tmp/observation-023-positive.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-023-positive.txt

      - name: Require both resolved arrival-order witnesses
        shell: bash
        run: |
          set -euo pipefail
          for cfg in ABR BAR; do
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC \
              -config "tla/AppendOnlyResolution${cfg}.cfg" \
              tla/AppendOnlyResolution.tla \
              > "/tmp/observation-023-${cfg}.txt" 2>&1
            status=$?
            set -e
            cat "/tmp/observation-023-${cfg}.txt"
            test "$status" -ne 0
            grep -Fq "No${cfg}Witness" "/tmp/observation-023-${cfg}.txt"
            grep -Fq 'Invariant' "/tmp/observation-023-${cfg}.txt"
          done
