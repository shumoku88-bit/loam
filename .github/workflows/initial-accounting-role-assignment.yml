name: Initial AccountingRole Assignment

on:
  pull_request:
    paths:
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/AccountingRolePublisher.lean'
      - 'Loam/Tests/AccountingRolePublisher.lean'
      - '.github/workflows/initial-accounting-role-assignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Qualify virgin-Locus AccountingRole assignment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.AccountingRolePublisher
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify initial role admission and publication
        run: lake env lean --run Loam/Tests/AccountingRolePublisher.lean "$(mktemp -d)/accounting-role"
