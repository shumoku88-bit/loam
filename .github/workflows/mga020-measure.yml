name: MGA020 Measure Transactions Flow Pane

on:
  push:
    branches:
      - 'audit/mga-020-transactions-flow-pane-clean'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-020-transactions-flow-pane-clean
          fetch-depth: 250
      - name: Measure module topology
        run: |
          python3 tools/module_granularity_audit.py \
            --history 200 \
            --tsv /tmp/mga020.tsv \
            --dot /tmp/mga020.dot \
            --markdown /tmp/mga020.md
          echo '--- summary ---'
          head -n 20 /tmp/mga020.md
          echo '--- focused ---'
          grep -E 'Loam.Tui.(Reports|ReportWindow|TransactionsFlowPane)' /tmp/mga020.tsv || true
