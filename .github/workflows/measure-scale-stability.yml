name: Measure Scale Stability

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Presentation/MeasurePresentation.lean'
      - 'Loam/Authority/MeasurePresentationAuthority.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Cli/MeasureScaleCli.lean'
      - 'Loam/Cli.lean'
      - 'tools/loam'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Authority/CapacityAuthority.lean'
      - 'Loam/Publisher/CapacityPublisher.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/CurrentQuantityAnchorPersistence.lean'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/MeasureScaleAdministration.lean'
      - 'docs/ADDING_CURRENCY.md'
      - 'docs/research/AUDIT_MEASURE_SCALE_STABILITY_2026-09-24.md'
      - '.github/workflows/measure-scale-stability.yml'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Presentation/MeasurePresentation.lean'
      - 'Loam/Authority/MeasurePresentationAuthority.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Cli/MeasureScaleCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Authority/CapacityAuthority.lean'
      - 'Loam/Publisher/CapacityPublisher.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/CurrentQuantityAnchorPersistence.lean'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Tests/MeasureScaleAdministration.lean'
      - 'docs/ADDING_CURRENCY.md'
      - 'docs/research/AUDIT_MEASURE_SCALE_STABILITY_2026-09-24.md'
      - '.github/workflows/measure-scale-stability.yml'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-scale-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify Measure scale administration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build production Measure scale boundary
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Presentation.MeasurePresentation Loam.Authority.MeasurePresentationAuthority Loam.HouseholdCommand Loam.Cli.MeasureScaleCli Loam.Cli Loam.Tests.ActualWorldFixture

      - name: Run Measure Scale package test scenario
        run: lake test -- MeasureScaleAdministration
