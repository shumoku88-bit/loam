name: MGA018 ReportWindow cutover

on:
  push:
    branches:
      - audit/mga-018-report-window
    paths:
      - .github/workflows/mga018-report-window.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-018-report-window
          fetch-depth: 0

      - name: Apply ReportWindow ownership cutover
        run: python3 tools/mga018_report_window.py

      - name: Build production TUI
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamTui
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Commit qualified production cutover
        run: |
          rm .github/workflows/mga018-report-window.yml tools/mga018_report_window.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/ReportWindow.lean Loam/Tui/Reports.lean .github/workflows/mga018-report-window.yml tools/mga018_report_window.py
          git commit -m 'refactor(tui): give report window one state owner'
          git push
