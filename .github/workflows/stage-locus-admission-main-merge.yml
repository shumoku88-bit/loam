name: Stage Locus admission main merge

on:
  push:
    branches:
      - feat/locus-admission-administration
    paths:
      - '.github/workflows/stage-locus-admission-main-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/locus-admission-administration
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge origin/main --no-commit --no-ff || true
          python3 tools/stage-locus-admission-main-merge.py
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'unresolved merge paths remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check --cached
          git commit -m 'Merge main into Locus admission administration'
          git push origin HEAD:feat/locus-admission-administration
