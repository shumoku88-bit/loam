name: Selected Lean Observations

# This lane owns CI coverage for the selected live Lean observation umbrella.
# Do not add a per-observation workflow when its only independent action would
# be to rebuild a module already imported by Loam.Observations.

on:
  pull_request:
    paths:
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-lean-observations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Build selected live Lean observations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build selected observation umbrella
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
