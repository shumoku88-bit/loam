name: Lean Proof Surfaces

# Three deliberately different Lean build surfaces:
# - product: ordinary product/runtime library aggregation, excluding research witnesses
# - durable: compiled owner modules replayed by bundled LeanChecker + separate axiom audit
# - observations: broader research-regression witnesses, which may use native_decide
#
# Do not add a per-observation workflow when its only independent action would
# be to rebuild a module already imported by Loam.Observations.

on:
  pull_request:
    paths:
      - 'tools/ReplayDurableProofs.lean'
      - 'tests/test_durable_replay.py'
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/ReplayDurableProofs.lean'
      - 'tests/test_durable_replay.py'
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  workflow_dispatch:
    inputs:
      qualify_435:
        description: 'One-shot Issue 1963 baseline/candidate migration qualification (not a gate)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-proof-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_435
    name: Qualify migration (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ['4.33.1', '4.35.0']
    steps:
      - uses: actions/checkout@v6
      - name: Select isolated compiler
        run: printf 'leanprover/lean4:v%s\n' '${{ matrix.version }}' > lean-toolchain
      - name: Restore version-specific shared cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Set up compiler (setup separate from measurements)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          axiom-audit: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Install stock sandbox dependency (no host policy relaxation)
        if: matrix.version == '4.35.0'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Measure builds, actual test driver and proof routes
        env:
          QUALIFICATION_OUT: ${{ runner.temp }}/qualification
        run: python3 docs/experiments/lean435-qualification/run.py
      - name: Save raw qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lean-migration-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/qualification/*.json
            ${{ runner.temp }}/qualification/*.jsonl
            ${{ runner.temp }}/qualification/*.txt
          if-no-files-found: error

  scope:
    if: github.event_name != 'workflow_dispatch' || !inputs.qualify_435
    name: Select Lean proof qualification scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      pta: ${{ steps.scope.outputs.pta }}
      replay_tests: ${{ steps.scope.outputs.replay_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select expensive proof surfaces
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          changed="$RUNNER_TEMP/changed-paths.txt"
          full=false
          pta=false
          replay_tests=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              > "$changed"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            full=true
            pta=true
            replay_tests=true
            : > "$changed"
          else
            full=true
            git diff-tree --no-commit-id --name-only -r HEAD > "$changed"
          fi

          while IFS= read -r path; do
            case "$path" in
              Loam/Application/PtaMigration.lean|Loam/Tests/PtaMigrationClassifier.lean|tools/pta-hledger-adapter-experiment.py|tests/fixtures/pta-import/*|.github/workflows/selected-lean-observations.yml)
                pta=true
                ;;
            esac

            case "$path" in
              tools/ReplayDurableProofs.lean|tests/test_durable_replay.py|lean-toolchain|.github/workflows/selected-lean-observations.yml)
                replay_tests=true
                ;;
            esac

            if [[ "$full" != "true" ]]; then
              case "$path" in
                Loam/Tui/*|Loam/Tests/*|Loam/Presentation/*)
                  ;;
                Loam/*|Loam.lean|tools/audit-production-reachability|tools/ReplayDurableProofs.lean|tests/test_durable_replay.py|lakefile.lean|lake-manifest.json|lean-toolchain|.github/workflows/selected-lean-observations.yml)
                  full=true
                  ;;
              esac
            fi
          done < "$changed"

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "pta=$pta" >> "$GITHUB_OUTPUT"
          echo "replay_tests=$replay_tests" >> "$GITHUB_OUTPUT"

  product:
    name: Build product Lean surface
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build product library aggregation
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify product surface excludes research/test modules
        run: python3 tools/audit-production-reachability

      - name: Exercise PTA migration classifier gate
        run: lake env lean --run Loam/Tests/PtaMigrationClassifier.lean

      - name: Install pinned hledger for adapter boundary
        if: needs.scope.outputs.pta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hledger-bin"
          curl -fL \
            https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/hledger-bin" hledger
          echo "$RUNNER_TEMP/hledger-bin" >> "$GITHUB_PATH"

      - name: Exercise hledger-normalized PTA adapter boundary
        if: needs.scope.outputs.pta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          hledger --version
          normalized="$RUNNER_TEMP/pta-hledger-normalized.tsv"
          python3 tools/pta-hledger-adapter-experiment.py \
            hledger \
            tests/fixtures/pta-import/hledger-boundary.journal \
            tests/fixtures/pta-import/hledger-boundary.measure-scales.tsv \
            "$normalized"
          lake env lean --run Loam/Tests/PtaMigrationClassifier.lean \
            adapter "$normalized" \
            tests/fixtures/pta-import/hledger-boundary.expected.tsv

  durable:
    name: Check durable Lean proof surface
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build durable proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.DurableProofs
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Replay durable defining modules
        run: /usr/bin/time -p lake env lean tools/ReplayDurableProofs.lean

      - name: Qualify durable replay scope sentinels
        if: needs.scope.outputs.replay_tests == 'true'
        run: python3 tests/test_durable_replay.py

      - name: Audit durable proof axioms only
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git \
            "$workdir/axiom-audit"
          test "$(git -C "$workdir/axiom-audit" rev-parse HEAD)" = \
            "46024e005996495c65ef609368e11ab39c4222e3"
          cp lean-toolchain "$workdir/axiom-audit/"
          (cd "$workdir/axiom-audit" && lake build)
          lake env "$workdir/axiom-audit/.lake/build/bin/axiom-audit" \
            --root Loam \
            --modules Loam.DurableProofs \
            --allow propext,Classical.choice,Quot.sound

  observations:
    name: Build selected live Lean research witnesses
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build selected observation umbrella
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false
