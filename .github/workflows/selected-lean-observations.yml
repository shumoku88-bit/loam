name: Lean Proof Surfaces

# Three deliberately different Lean build surfaces:
# - product: ordinary product/runtime library aggregation, excluding research witnesses
# - durable: small long-lived theorem surface, checked with lean4checker + axiom audit
# - observations: broader research-regression witnesses, which may use native_decide
#
# Do not add a per-observation workflow when its only independent action would
# be to rebuild a module already imported by Loam.Observations.

on:
  pull_request:
    paths:
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Lean proof qualification scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select expensive proof surfaces
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$RUNNER_TEMP/changed-paths.txt"
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > "$changed"

          full=false
          while IFS= read -r path; do
            case "$path" in
              Loam/Tui/*|Loam/Tests/*|Loam/Presentation/*)
                ;;
              Loam/*|Loam.lean|tools/audit-production-reachability|lakefile.lean|lake-manifest.json|lean-toolchain|.github/workflows/selected-lean-observations.yml)
                full=true
                break
                ;;
            esac
          done < "$changed"

          echo "full=$full" >> "$GITHUB_OUTPUT"

  product:
    name: Build product Lean surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build product library aggregation
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify product surface excludes research/test modules
        run: python3 tools/audit-production-reachability

      - name: Exercise PTA migration classifier gate
        run: lake env lean --run Loam/Tests/PtaMigrationClassifier.lean

  durable:
    name: Check durable Lean proof surface
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and independently check durable proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.DurableProofs
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          leanchecker-args: "Loam.DurableProofs"
          axiom-audit: false
          use-github-cache: true

      - name: Audit durable proof axioms only
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git \
            "$workdir/axiom-audit"
          test "$(git -C "$workdir/axiom-audit" rev-parse HEAD)" = \
            "46024e005996495c65ef609368e11ab39c4222e3"
          cp lean-toolchain "$workdir/axiom-audit/"
          (cd "$workdir/axiom-audit" && lake build)
          lake env "$workdir/axiom-audit/.lake/build/bin/axiom-audit" \
            --root Loam \
            --modules Loam.DurableProofs \
            --allow propext,Classical.choice,Quot.sound

  observations:
    name: Build selected live Lean research witnesses
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build selected observation umbrella
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
