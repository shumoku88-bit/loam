name: Lean Proof Surfaces

# Three deliberately different Lean build surfaces:
# - product: ordinary product/runtime library aggregation, excluding research witnesses
# - durable: small long-lived theorem surface, checked with lean4checker + axiom audit
# - observations: broader research-regression witnesses, which may use native_decide
#
# Do not add a per-observation workflow when its only independent action would
# be to rebuild a module already imported by Loam.Observations.

on:
  pull_request:
    paths:
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/**'
      - 'Loam.lean'
      - 'tools/audit-production-reachability'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/selected-lean-observations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proof-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select Lean proof qualification scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      pta: ${{ steps.scope.outputs.pta }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select expensive proof surfaces
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          changed="$RUNNER_TEMP/changed-paths.txt"
          full=false
          pta=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              > "$changed"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            full=true
            pta=true
            : > "$changed"
          else
            full=true
            git diff-tree --no-commit-id --name-only -r HEAD > "$changed"
          fi

          while IFS= read -r path; do
            case "$path" in
              Loam/Application/PtaMigration.lean|Loam/Tests/PtaMigrationClassifier.lean|tools/pta-hledger-adapter-experiment.py|tests/fixtures/pta-import/*|.github/workflows/selected-lean-observations.yml)
                pta=true
                ;;
            esac

            if [[ "$full" != "true" ]]; then
              case "$path" in
                Loam/Tui/*|Loam/Tests/*|Loam/Presentation/*)
                  ;;
                Loam/*|Loam.lean|tools/audit-production-reachability|lakefile.lean|lake-manifest.json|lean-toolchain|.github/workflows/selected-lean-observations.yml)
                  full=true
                  ;;
              esac
            fi
          done < "$changed"

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "pta=$pta" >> "$GITHUB_OUTPUT"

  product:
    name: Build product Lean surface
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build product library aggregation
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify product surface excludes research/test modules
        run: python3 tools/audit-production-reachability

      - name: Exercise PTA migration classifier gate
        run: lake env lean --run Loam/Tests/PtaMigrationClassifier.lean

      - name: Install pinned hledger for adapter boundary
        if: needs.scope.outputs.pta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hledger-bin"
          curl -fL \
            https://github.com/plaintextaccounting/hledger/releases/download/1.52.3/hledger-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/hledger-bin" hledger
          echo "$RUNNER_TEMP/hledger-bin" >> "$GITHUB_PATH"

      - name: Exercise hledger-normalized PTA adapter boundary
        if: needs.scope.outputs.pta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          hledger --version
          normalized="$RUNNER_TEMP/pta-hledger-normalized.tsv"
          python3 tools/pta-hledger-adapter-experiment.py \
            hledger \
            tests/fixtures/pta-import/hledger-boundary.journal \
            tests/fixtures/pta-import/hledger-boundary.measure-scales.tsv \
            "$normalized"
          lake env lean --run Loam/Tests/PtaMigrationClassifier.lean \
            adapter "$normalized" \
            tests/fixtures/pta-import/hledger-boundary.expected.tsv

  durable:
    name: Check durable Lean proof surface
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build and independently check durable proofs
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.DurableProofs
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          leanchecker-args: "Loam.DurableProofs"
          axiom-audit: false
          use-github-cache: false

      - name: Audit durable proof axioms only
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 --branch v0.1.2 \
            https://github.com/leanprover-community/axiom-audit.git \
            "$workdir/axiom-audit"
          test "$(git -C "$workdir/axiom-audit" rev-parse HEAD)" = \
            "46024e005996495c65ef609368e11ab39c4222e3"
          cp lean-toolchain "$workdir/axiom-audit/"
          (cd "$workdir/axiom-audit" && lake build)
          lake env "$workdir/axiom-audit/.lake/build/bin/axiom-audit" \
            --root Loam \
            --modules Loam.DurableProofs \
            --allow propext,Classical.choice,Quot.sound

  observations:
    name: Build selected live Lean research witnesses
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build selected observation umbrella
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false
