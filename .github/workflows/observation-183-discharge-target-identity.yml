name: Observation 183

on:
  pull_request:
    paths:
      - 'experiments/183_discharge_target_identity_safe.pml'
      - 'experiments/183_discharge_target_identity_unsafe_reuse.pml'
      - 'experiments/183_discharge_target_identity_reservation.md'
      - '.github/workflows/observation-183-discharge-target-identity.yml'
  push:
    branches:
      - 'experiment/183-relation-id-reservation'
      - main
    paths:
      - 'experiments/183_discharge_target_identity_safe.pml'
      - 'experiments/183_discharge_target_identity_unsafe_reuse.pml'
      - 'experiments/183_discharge_target_identity_reservation.md'
      - '.github/workflows/observation-183-discharge-target-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spin:
    name: SPIN discharge target identity reservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SPIN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y spin
          spin -V

      - name: Verify reserved-target allocator candidate
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/183_discharge_target_identity_safe.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'errors:[[:space:]]+0' <<<"$output"

      - name: Require identity-reuse counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/183_discharge_target_identity_unsafe_reuse.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected retained orphan discharge to activate under target identity reuse'
            exit 1
          fi
