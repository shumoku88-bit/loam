name: Sparse EffectKey Projection

on:
  push:
    branches:
      - experiment/sparse-effect-key-projection
  pull_request:
    paths:
      - 'tools/sparse-effect-key-projection.py'
      - 'tools/check-sparse-effect-key-dogfood'
      - 'Loam/Tests/SparseEffectKeyActualObservation.lean'
      - 'Loam/Tests/SparseEffectKeyRelationObservation.lean'
      - '.github/workflows/sparse-effect-key-projection.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relation-source:
    name: Preserve only semantically referenced EffectKey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical entrances
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam loamMovement loamHouseholdObservation
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Round trip relation-bearing Movement through sparse EffectKey wire
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          checkdir="${tmpdir}.check"
          rebuilt="${tmpdir}.rebuilt"
          trap 'rm -rf "$tmpdir" "$checkdir" "$rebuilt"' EXIT
          manifest="$tmpdir/movement-authority"
          memory="$tmpdir/compat-memory.loam"

          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay travel

          printf 'paypay\n1000\n\ntravel\n1000\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_DESCRIPTION='relation source fixture' \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t400' \
                ./tools/loam-movement "$memory" >/dev/null

          lake env lean --run Loam/Tests/SparseEffectKeyRelationObservation.lean \
            "$tmpdir" >"$tmpdir/original.relation"
          grep -Fx $'RELATION\trelation-1\trecord-1\teffect-1\tpaypay\tjpy\t-1000\t400' \
            "$tmpdir/original.relation"

          python3 tools/sparse-effect-key-projection.py check \
            "$tmpdir" "$checkdir"
          python3 tools/sparse-effect-key-projection.py pack \
            "$tmpdir" "$tmpdir/actual.sparse"

          grep -Fx $'KEYED-EFFECT\teffect-1\tpaypay\tjpy\t-1000' \
            "$tmpdir/actual.sparse"
          grep -Fx $'EFFECT\ttravel\tjpy\t1000' \
            "$tmpdir/actual.sparse"
          if grep -Fq $'effect-2\ttravel' "$tmpdir/actual.sparse"; then
            echo 'unreferenced EffectKey leaked into sparse wire' >&2
            exit 1
          fi

          cp -a "$tmpdir" "$rebuilt"
          python3 tools/sparse-effect-key-projection.py apply \
            "$tmpdir/actual.sparse" "$rebuilt"

          lake env lean --run Loam/Tests/SparseEffectKeyRelationObservation.lean \
            "$rebuilt" >"$tmpdir/rebuilt.relation"
          diff -u "$tmpdir/original.relation" "$tmpdir/rebuilt.relation"

          lake env lean --run Loam/Tests/SparseEffectKeyActualObservation.lean \
            "$tmpdir" >"$tmpdir/original.actual"
          lake env lean --run Loam/Tests/SparseEffectKeyActualObservation.lean \
            "$rebuilt" >"$tmpdir/rebuilt.actual"
          diff -u "$tmpdir/original.actual" "$tmpdir/rebuilt.actual"

          event_ref="$(awk -F '\t' '$1 == "Event" { print $2; exit }' "$rebuilt/movement-authority/CURRENT")"
          grep -Fq $'EFFECT\teffect-1\tpaypay\tjpy\t-1000' \
            "$rebuilt/movement-authority/$event_ref"
          grep -Fq $'EFFECT\tcompat-effect-1\ttravel\tjpy\t1000' \
            "$rebuilt/movement-authority/$event_ref"
