name: Observation 329

on:
  pull_request:
    paths:
      - 'tla/MeasureScalePublicationOrder.tla'
      - 'tla/MeasureScalePublicationOrderNaive.cfg'
      - 'tla/MeasureScalePublicationOrderLocked.cfg'
      - 'tla/MeasureScalePublicationOrderLockedScaleReachable.cfg'
      - 'tla/MeasureScalePublicationOrderLockedUseReachable.cfg'
      - 'experiments/329_measure_scale_publication_order.md'
      - '.github/workflows/observation-329-measure-scale-order.yml'
  push:
    branches:
      - 'experiment/329-measure-scale-publication-order'
      - main
    paths:
      - 'tla/MeasureScalePublicationOrder.tla'
      - 'tla/MeasureScalePublicationOrderNaive.cfg'
      - 'tla/MeasureScalePublicationOrderLocked.cfg'
      - 'tla/MeasureScalePublicationOrderLockedScaleReachable.cfg'
      - 'tla/MeasureScalePublicationOrderLockedUseReachable.cfg'
      - 'experiments/329_measure_scale_publication_order.md'
      - '.github/workflows/observation-329-measure-scale-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla:
    name: TLA+ Measure scale publication order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Require naive first-use race
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -metadir /tmp/observation-329-naive \
            -config tla/MeasureScalePublicationOrderNaive.cfg \
            tla/MeasureScalePublicationOrder.tla \
            2>&1 | tee /tmp/observation-329-naive.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'MeaningStable' /tmp/observation-329-naive.txt
          grep -Fq 'Invariant' /tmp/observation-329-naive.txt

      - name: Check aggregate-lock protocol safety
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -metadir /tmp/observation-329-locked \
            -config tla/MeasureScalePublicationOrderLocked.cfg \
            tla/MeasureScalePublicationOrder.tla \
            2>&1 | tee /tmp/observation-329-locked.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-329-locked.txt

      - name: Require reachable pre-use scale change
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -metadir /tmp/observation-329-scale \
            -config tla/MeasureScalePublicationOrderLockedScaleReachable.cfg \
            tla/MeasureScalePublicationOrder.tla \
            2>&1 | tee /tmp/observation-329-scale.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'NeverScale2' /tmp/observation-329-scale.txt
          grep -Fq 'Invariant' /tmp/observation-329-scale.txt

      - name: Require reachable quantity publication
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -metadir /tmp/observation-329-use \
            -config tla/MeasureScalePublicationOrderLockedUseReachable.cfg \
            tla/MeasureScalePublicationOrder.tla \
            2>&1 | tee /tmp/observation-329-use.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'NeverUsed' /tmp/observation-329-use.txt
          grep -Fq 'Invariant' /tmp/observation-329-use.txt
