name: Beancount Export

on:
  pull_request:
    paths:
      - 'Loam/BeancountExport.lean'
      - 'Loam/Cli/BeancountExportCli.lean'
      - 'Loam/Tests/BeancountExport.lean'
      - 'Loam/Tests/JournalExport.lean'
      - 'Loam/ActualJournalProjection.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'lakefile.lean'
      - '.github/workflows/beancount-export.yml'
  push:
    branches:
      - 'feat/beancount-export'
    paths:
      - 'Loam/BeancountExport.lean'
      - 'Loam/Cli/BeancountExportCli.lean'
      - 'Loam/Tests/BeancountExport.lean'
      - 'Loam/Tests/JournalExport.lean'
      - 'Loam/ActualJournalProjection.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'lakefile.lean'
      - '.github/workflows/beancount-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: LOAM Beancount export and Fava
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build exporter and fixtures
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamBeancountExport Loam.Tests.BeancountExport Loam.Tests.JournalExport
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify pure Beancount projection boundary
        run: lake env lean --run Loam/Tests/BeancountExport.lean

      - name: Generate exported fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/beancount-export"
          echo "$root" > /tmp/loam-beancount-root
          lake env lean --run Loam/Tests/JournalExport.lean "$root"
          ./.lake/build/bin/loamBeancountExport             "$root/actual.loam"             "$root/accounting-role.loam"             "$root/actual.beancount"

          grep -Fq "open Assets:Loam-wallet JPY" "$root/actual.beancount"
          grep -Fq "open Expenses:Loam-food JPY" "$root/actual.beancount"
          grep -Fq 'loam_event_id: "journal-replacement"' "$root/actual.beancount"
          grep -Fq 'loam_event_id: "journal-untouched"' "$root/actual.beancount"
          if grep -q "journal-original" "$root/actual.beancount"; then
            echo "superseded correction target leaked into Beancount projection" >&2
            exit 1
          fi

          if ./.lake/build/bin/loamBeancountExport               "$root/actual.loam"               "$root/accounting-role.loam"               "$root/./actual.loam"; then
            echo "Beancount export accepted an alias of Actual authority" >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Beancount and Fava
        run: |
          python -m pip install --upgrade pip
          python -m pip install "beancount==3.2.3" "fava==1.30.14"

      - name: Validate generated Beancount with real parser
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/loam-beancount-root)"
          bean-check "$root/actual.beancount"

      - name: Smoke-test generated projection in Fava
        shell: bash
        run: |
          set -euo pipefail
          root="$(cat /tmp/loam-beancount-root)"
          fava "$root/actual.beancount" >/tmp/fava.log 2>&1 &
          fava_pid=$!
          trap 'kill "$fava_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:5000/ >/tmp/fava-index.html; then
              ready=1
              break
            fi
            if ! kill -0 "$fava_pid" 2>/dev/null; then
              cat /tmp/fava.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/fava.log
            exit 1
          fi

          test -s /tmp/fava-index.html
