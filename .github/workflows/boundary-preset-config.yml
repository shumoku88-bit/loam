name: Boundary Preset Config

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/BoundaryPresetConfig.lean'
      - 'Loam/Tests/BoundaryPresetConfig.lean'
      - '.github/workflows/boundary-preset-config.yml'
  push:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/BoundaryPresetConfig.lean'
      - 'Loam/Tests/BoundaryPresetConfig.lean'
      - '.github/workflows/boundary-preset-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Verify replaceable report boundary presets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build boundary preset config
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.BoundaryPresetConfig

      - name: Verify strict replaceable preset behavior
        run: lake env lean --run Loam/Tests/BoundaryPresetConfig.lean
