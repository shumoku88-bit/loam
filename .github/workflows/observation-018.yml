name: Observation 018

on:
  pull_request:
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  push:
    branches:
      - main
    paths:
      - 'Loam/Observations/**'
      - 'Loam/Observations.lean'
      - 'model/**'
      - 'j/**'
      - 'scheme/**'
      - 'tla/**'
      - 'observations/**'
      - 'Loam.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/observation-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla:
    name: TLA+ provenance without resource identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check provenance explanation and targeted undo
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/ProvenanceWithoutResourceIdentity.cfg \
            tla/ProvenanceWithoutResourceIdentity.tla \
            2>&1 | tee /tmp/observation-018-positive.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-018-positive.txt

      - name: Require provenance for explanation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/ProvenanceWithoutResourceIdentityExplanationBoundary.cfg \
            tla/ProvenanceWithoutResourceIdentity.tla \
            2>&1 | tee /tmp/observation-018-explanation.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'AggregateDeterminesExplanation' /tmp/observation-018-explanation.txt
          grep -Fq 'Invariant' /tmp/observation-018-explanation.txt

      - name: Require provenance for targeted undo
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/ProvenanceWithoutResourceIdentityUndoBoundary.cfg \
            tla/ProvenanceWithoutResourceIdentity.tla \
            2>&1 | tee /tmp/observation-018-undo.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'AggregateDeterminesNamedUndo' /tmp/observation-018-undo.txt
          grep -Fq 'Invariant' /tmp/observation-018-undo.txt
