name: Shared Scheduled Creation Publisher

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/ScheduledCreationPublisher.lean'
      - 'Loam/ScheduledReview.lean'
      - 'Loam/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledCreationPublisher.lean'
      - '.github/workflows/scheduled-creation-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - main
      - feat/tui
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/ScheduledCreationPublisher.lean'
      - 'Loam/ScheduledReview.lean'
      - 'Loam/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledCreationPublisher.lean'
      - '.github/workflows/scheduled-creation-publisher.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Build and test Actual-backed Scheduled creation publisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean and build shared Scheduled creation dependencies
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.ScheduledCreationPublisher Loam.ScheduledReview Loam.Tests.ActualWorldFixture
      - name: Verify Actual-backed Scheduled creation publication
        run: lake env lean --run Loam/Tests/ScheduledCreationPublisher.lean "$(mktemp -d)/scheduled-creation-publisher"
