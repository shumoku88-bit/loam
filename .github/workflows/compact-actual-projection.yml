name: Compact Actual Projection

on:
  pull_request:
    paths:
      - 'tools/compact-actual-projection.py'
      - 'Loam/Tests/ActualValidityRevisionFixture.lean'
      - 'Loam/Tests/CompactActualObservation.lean'
      - '.github/workflows/compact-actual-projection.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revised-date:
    name: Preserve sparse occurrence-date revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production library
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Round trip revised occurrence date through compact Actual
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          manifest="$tmpdir/movement-authority"

          lake env lean --run Loam/Tests/ActualValidityRevisionFixture.lean "$manifest"

          lake env lean --run Loam/Tests/CompactActualObservation.lean "$tmpdir" \
            >"$tmpdir/original.actual"
          grep -Fx $'RECORD\tevent-1\t2026-09-02\tcurrent\t-\tcorrected date fixture' \
            "$tmpdir/original.actual"
          grep -Fx $'EFFECT\tevent-1\teffect-1\tcash\tjpy\t-100' \
            "$tmpdir/original.actual"
          grep -Fx $'EFFECT\tevent-1\teffect-2\tfood\tjpy\t100' \
            "$tmpdir/original.actual"

          python3 tools/compact-actual-projection.py check \
            "$tmpdir" "$tmpdir/semantic-check"
          python3 tools/compact-actual-projection.py pack \
            "$tmpdir" "$tmpdir/actual.compact"

          grep -Fx $'VALIDITY\tREVISION\tdate-revision-1\tevent-1\t2026-09-02' \
            "$tmpdir/actual.compact"
          grep -Fx $'VALIDITY\tCORRECTION\tROOT\tevent-1\tdate-revision-1' \
            "$tmpdir/actual.compact"

          cp -a "$tmpdir" "$tmpdir.rebuilt"
          python3 tools/compact-actual-projection.py apply \
            "$tmpdir/actual.compact" "$tmpdir.rebuilt"

          lake env lean --run Loam/Tests/CompactActualObservation.lean "$tmpdir.rebuilt" \
            >"$tmpdir/rebuilt.actual"
          diff -u "$tmpdir/original.actual" "$tmpdir/rebuilt.actual"
          grep -Fx $'RECORD\tevent-1\t2026-09-02\tcurrent\t-\tcorrected date fixture' \
            "$tmpdir/rebuilt.actual"
