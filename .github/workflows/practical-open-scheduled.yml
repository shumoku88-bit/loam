name: Practical Open Scheduled

on:
  pull_request:
    paths:
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Cli/OpenScheduledCli.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/Scheduled.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Core/ScheduledRetirement.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-open-scheduled.yml'
  push:
    paths:
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Cli/OpenScheduledCli.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/Scheduled.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Core/ScheduledRetirement.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-open-scheduled.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-open-scheduled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-scheduled:
    name: Build and test open Scheduled view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build open Scheduled entrance
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamOpenScheduled
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Project only live open occurrences in scheduled-date order
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          scheduled="$tmp_dir/scheduled.loam"
          manifest="$tmp_dir/movement-authority"

          cat >"$scheduled" <<'EOF'
          LOAM-SCHEDULED-LIFECYCLE	1
          BEGIN	Scheduled
          LOAM-SCHEDULED-MEMORY	1
          SCHEDULED	scheduled-late	2026-10-01	jpy
          CHANGE	bank	-300
          CHANGE	late-subject	300
          SCHEDULED	scheduled-early	2026-08-20	jpy
          CHANGE	bank	-100
          CHANGE	early-subject	100
          SCHEDULED	scheduled-cancelled	2026-09-20	jpy
          CHANGE	bank	-400
          CHANGE	cancelled-subject	400
          SCHEDULED	scheduled-interrupted	2026-09-15	jpy
          CHANGE	bank	-200
          CHANGE	points	-50
          CHANGE	interrupted-subject	250
          END	Scheduled
          BEGIN	Completion
          LOAM-SCHEDULED-COMPLETION-MEMORY	1
          COMPLETION	scheduled-interrupted	actual-not-published
          END	Completion
          BEGIN	Retirement
          LOAM-SCHEDULED-RETIREMENT-MEMORY	1
          RETIREMENT	scheduled-cancelled
          END	Retirement
          BEGIN	Replacement
          LOAM-SCHEDULED-REPLACEMENT-MEMORY	1
          END	Replacement
          EOF

          lake env lean --run Loam/Tests/EmptyMovementManifest.lean "$manifest"

          ./tools/loam open-scheduled "$scheduled" "$manifest" > /tmp/loam-open-scheduled.out

          grep -Fq 'Explicit current-open Scheduled movements (ordered by scheduled date):' /tmp/loam-open-scheduled.out
          grep -Fq 'Coverage: explicit Scheduled evidence only; unmaterialized future obligations remain Unknown.' /tmp/loam-open-scheduled.out
          grep -Fq 'scheduled-early' /tmp/loam-open-scheduled.out
          grep -Fq 'scheduled-interrupted' /tmp/loam-open-scheduled.out
          grep -Fq 'scheduled-late' /tmp/loam-open-scheduled.out

          grep -Fq 'bank -> early-subject: 100 jpy' /tmp/loam-open-scheduled.out
          grep -Fq 'bank -> late-subject: 300 jpy' /tmp/loam-open-scheduled.out

          grep -Fq '  FROM' /tmp/loam-open-scheduled.out
          grep -Fq '    bank: 200 jpy' /tmp/loam-open-scheduled.out
          grep -Fq '    points: 50 jpy' /tmp/loam-open-scheduled.out
          grep -Fq '  TO' /tmp/loam-open-scheduled.out
          grep -Fq '    interrupted-subject: 250 jpy' /tmp/loam-open-scheduled.out

          if grep -Fq 'scheduled-cancelled' /tmp/loam-open-scheduled.out; then
            echo 'retired Scheduled occurrence remained open' >&2
            exit 1
          fi

          early_line="$(grep -n 'scheduled-early' /tmp/loam-open-scheduled.out | cut -d: -f1)"
          interrupted_line="$(grep -n 'scheduled-interrupted' /tmp/loam-open-scheduled.out | cut -d: -f1)"
          late_line="$(grep -n 'scheduled-late' /tmp/loam-open-scheduled.out | cut -d: -f1)"
          test "$early_line" -lt "$interrupted_line"
          test "$interrupted_line" -lt "$late_line"
