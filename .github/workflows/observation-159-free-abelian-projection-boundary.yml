name: Observation 159

on:
  pull_request:
    paths:
      - 'Loam/Observations/Observation159.lean'
      - 'Loam/Observations.lean'
      - 'experiments/159_free_abelian_projection_boundary.md'
      - '.github/workflows/observation-159-free-abelian-projection-boundary.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Quantity.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/159-free-abelian-projection-boundary'
      - main
    paths:
      - 'Loam/Observations/Observation159.lean'
      - 'Loam/Observations.lean'
      - 'experiments/159_free_abelian_projection_boundary.md'
      - '.github/workflows/observation-159-free-abelian-projection-boundary.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Core/Quantity.lean'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-abelian-projection:
    name: Lean free Abelian projection boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check free Abelian projection boundary
        run: lake build Loam.Observations.Observation159
