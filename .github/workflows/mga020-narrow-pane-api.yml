name: MGA020 Narrow Pane API

on:
  push:
    branches:
      - 'audit/mga-020-transactions-flow-pane-clean'

permissions:
  contents: write

jobs:
  narrow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-020-transactions-flow-pane-clean
      - name: Keep only composition-facing pane API public
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Loam/Tui/TransactionsFlowPane.lean')
          text = path.read_text()
          clear_block = '''def clear (_state : State) : State := initial


'''
          if text.count(clear_block) != 1:
              raise SystemExit('unused clear helper mismatch')
          text = text.replace(clear_block, '', 1)
          for old, new in [
              ('def rows\n', 'private def rows\n'),
              ('def contributions\n', 'private def contributions\n'),
              ('def selectedRow?\n', 'private def selectedRow?\n'),
              ('def summaryPrefix\n', 'private def summaryPrefix\n'),
              ('structure TableLayout where\n', 'private structure TableLayout where\n')]:
              if text.count(old) != 1:
                  raise SystemExit(f'API narrowing mismatch for {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Rebuild production TUI
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamTui
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Re-run focused Reports behavior
        run: |
          lake env lean --run Loam/Tests/TuiTransactionsFlow.lean
          lake env lean --run Loam/Tests/TuiReports.lean

      - name: Commit narrowed API and retire helper
        run: |
          rm .github/workflows/mga020-narrow-pane-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/TransactionsFlowPane.lean .github/workflows/mga020-narrow-pane-api.yml
          git diff --cached --check
          git commit -m 'refactor(tui): narrow Transactions Flow pane surface'
          git push origin HEAD:audit/mga-020-transactions-flow-pane-clean
