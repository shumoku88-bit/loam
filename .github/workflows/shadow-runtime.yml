name: Shadow Runtime Qualifications

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Cli/ShadowAuditCli.lean'
      - 'Loam/Cli/ShadowQuantityCli.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Core/**'
      - 'Loam/Observations/Observation078.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'experiments/074_private_shadow_projection_boundary.md'
      - '.github/workflows/shadow-runtime.yml'
  push:
    branches:
      - 'experiment/074-private-shadow-projection'
      - 'feat/stateless-shadow-quantity'
      - main
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Cli/ShadowAuditCli.lean'
      - 'Loam/Cli/ShadowQuantityCli.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Core/**'
      - 'Loam/Observations/Observation078.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'experiments/074_private_shadow_projection_boundary.md'
      - '.github/workflows/shadow-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    name: Redacted read-only shadow audit
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experiment/074-private-shadow-projection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build compiled shadow audit
        uses: ./.github/actions/lean-build
        with:
          build-args: loamShadowAudit

      - name: Check redaction, identity pressure, and source immutability
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/shadow-partial.journal <<'EOF'
          include synthetic-accounts.journal

          2026-01-01 * PRIVATE-DESCRIPTION-A
              ; event-id: synthetic-event-a
              synthetic-locus-a    10 SYN
              synthetic-locus-b    -10 SYN

          2026-01-02 * PRIVATE-DESCRIPTION-B
              ; opaque: PRIVATE-METADATA
              synthetic-locus-a    -15 SYN
              synthetic-locus-b    10 SYN
              synthetic-locus-c    5 SYN
          EOF

          before="$(sha256sum /tmp/shadow-partial.journal)"
          partial="$(.lake/build/bin/loamShadowAudit /tmp/shadow-partial.journal --counts)"
          after="$(sha256sum /tmp/shadow-partial.journal)"
          test "$before" = "$after"

          grep -Fq 'stable event identity: partial' <<<"$partial"
          grep -Fq 'stable effect identity: absent' <<<"$partial"
          grep -Fq 'lossless Practical Core projection without invented identity: no' <<<"$partial"
          grep -Fq 'source events: 2' <<<"$partial"
          grep -Fq 'candidate effects: 5' <<<"$partial"
          grep -Fq 'multi-effect events: 2' <<<"$partial"
          grep -Fq 'events with explicit event identity: 1' <<<"$partial"
          grep -Fq 'effects with explicit effect identity: 0' <<<"$partial"
          grep -Fq 'events with opaque metadata: 2' <<<"$partial"

          for secret in \
            PRIVATE-DESCRIPTION-A \
            PRIVATE-DESCRIPTION-B \
            PRIVATE-METADATA \
            synthetic-locus-a \
            synthetic-locus-b \
            synthetic-locus-c \
            '10 SYN' \
            '-15 SYN'; do
            if grep -Fq -- "$secret" <<<"$partial"; then
              echo 'shadow audit leaked a raw source value' >&2
              exit 1
            fi
          done

          cat >/tmp/shadow-complete.journal <<'EOF'
          2026-01-03 * PRIVATE-DESCRIPTION-C
              ; event-id: synthetic-event-c
              ; effect-key: synthetic-effect-c1
              synthetic-locus-d    7 SYN
              ; effect-key: synthetic-effect-c2
              synthetic-locus-e    -7 SYN
          EOF

          complete="$(.lake/build/bin/loamShadowAudit /tmp/shadow-complete.journal)"
          grep -Fq 'stable event identity: complete' <<<"$complete"
          grep -Fq 'stable effect identity: complete' <<<"$complete"
          grep -Fq 'lossless Practical Core projection without invented identity: yes' <<<"$complete"

          if grep -Fq 'PRIVATE-DESCRIPTION-C' <<<"$complete"; then
            echo 'shadow audit leaked a raw source description' >&2
            exit 1
          fi

      - name: Check practical wrapper uses compiled audit
        shell: bash
        run: |
          set -euo pipefail
          test -x .lake/build/bin/loamShadowAudit
          out="$(./tools/loam shadow-audit /tmp/shadow-complete.journal)"
          grep -Fq 'lossless Practical Core projection without invented identity: yes' <<<"$out"
          if grep -Fq 'lean --run' tools/loam; then
            echo 'practical wrapper must not invoke Lean frontend per action' >&2
            exit 1
          fi

  quantity:
    name: Read-only recorded quantity shadow
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/stateless-shadow-quantity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Build stateless shadow quantity executable
        run: lake build loamShadowQuantity

      - name: Exercise synthetic whole-file shape
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-shadow-quantity.XXXXXX.journal)"
          cat >"$fixture" <<'EOF'
          include synthetic-accounts.journal

          2099-01-01 * synthetic opening
              ; synthetic: metadata
              locus:wallet    100 unit
              locus:origin    -100 unit
          2099-01-02 synthetic split
            locus:wallet  -30 unit
          	locus:food	20 unit
          	locus:stock	10 unit
          EOF

          before="$(sha256sum "$fixture" | cut -d' ' -f1)"
          output="$(./tools/loam shadow-quantity "$fixture")"
          after="$(sha256sum "$fixture" | cut -d' ' -f1)"

          test "$before" = "$after"
          printf '%s\n' "$output"

          grep -Fq 'source: read-only; persistence: none; sidecar: none' <<<"$output"
          grep -Fq 'events projected: 2' <<<"$output"
          grep -Fq 'effects projected: 5' <<<"$output"
          grep -Fq 'header contexts not projected: 2' <<<"$output"
          grep -Fq 'metadata lines not projected: 1' <<<"$output"
          grep -Fq 'include directives not projected: 1' <<<"$output"
          grep -Fq 'locus:wallet: 70 unit' <<<"$output"
          grep -Fq 'locus:origin: -100 unit' <<<"$output"
          grep -Fq 'locus:food: 20 unit' <<<"$output"
          grep -Fq 'locus:stock: 10 unit' <<<"$output"

          rm -f "$fixture"

      - name: Fail closed on unsupported source lines
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -t loam-shadow-quantity-invalid.XXXXXX.journal)"
          cat >"$fixture" <<'EOF'
          2099-01-01 synthetic
              locus:wallet 10 unit
              unsupported posting shape
          EOF

          set +e
          output="$(./tools/loam shadow-quantity "$fixture" 2>&1)"
          status=$?
          set -e

          test "$status" -eq 2
          grep -Fq 'refused malformed or unsupported source lines' <<<"$output"
          grep -Fq 'no LOAM persistence was written' <<<"$output"
          ! grep -Fq 'unsupported posting shape' <<<"$output"

          rm -f "$fixture"
