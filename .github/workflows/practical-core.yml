name: Practical Lean Core

on:
  pull_request:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  push:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test practical Lean boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical core and persistence
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core Loam.Persistence
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run practical persistence check
        shell: bash
        run: lake env lean --run Loam/Tests/Persistence.lean

      - name: Run practical CLI check
        shell: bash
        run: |
          amount_file="$(mktemp)"
          printf 'LOAM-AMOUNT\t1\njpy\t-1250\n' >"$amount_file"
          output="$(./tools/loam amount show "$amount_file")"
          test "$output" = $'jpy\t-1250'

          printf 'broken\n' >"$amount_file"
          if ./tools/loam amount show "$amount_file" >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported amount file' /tmp/loam-cli.err

          tmp_dir="$(mktemp -d)"
          event_file="$tmp_dir/event.loam"
          ./tools/loam event create "$event_file" event-1 \
            effect-a wallet jpy -1000 \
            effect-b wallet jpy -250 \
            effect-c bank jpy 1250

          expected_event=$'LOAM-EVENT\t1\nevent-1\neffect-a\twallet\tjpy\t-1000\neffect-b\twallet\tjpy\t-250\neffect-c\tbank\tjpy\t1250'
          test "$(cat "$event_file")" = "$expected_event"

          output="$(./tools/loam event quantity "$event_file" wallet jpy)"
          test "$output" = '-1250'

          output="$(./tools/loam event quantity "$event_file" bank jpy)"
          test "$output" = '1250'

          output="$(./tools/loam event quantity "$event_file" pocket jpy)"
          test "$output" = '0'

          if ./tools/loam event create "$event_file" replacement-event >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected existing event target to be refused' >&2
            exit 1
          fi
          grep -Fq 'target event file already exists' /tmp/loam-cli.err
          test "$(cat "$event_file")" = "$expected_event"

          duplicate_file="$tmp_dir/duplicate.loam"
          if ./tools/loam event create "$duplicate_file" duplicate-event \
            same-key wallet jpy -1 \
            same-key bank jpy 1 >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected duplicate effect key to fail' >&2
            exit 1
          fi
          grep -Fq 'duplicate effect key in event' /tmp/loam-cli.err
          test ! -e "$duplicate_file"

          malformed_tuple_file="$tmp_dir/malformed-tuple.loam"
          if ./tools/loam event create "$malformed_tuple_file" bad-event \
            effect-a wallet jpy nope >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed effect tuple to fail' >&2
            exit 1
          fi
          grep -Fq 'event effects must be KEY LOCUS MEASURE QUANTA tuples' /tmp/loam-cli.err
          test ! -e "$malformed_tuple_file"

          empty_file="$tmp_dir/empty.loam"
          ./tools/loam event create "$empty_file" empty-event
          output="$(./tools/loam event quantity "$empty_file" wallet jpy)"
          test "$output" = '0'

          printf 'broken\n' >"$event_file"
          if ./tools/loam event quantity "$event_file" wallet jpy >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed event input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported event file' /tmp/loam-cli.err

          memory_file="$tmp_dir/memory.loam"
          printf 'LOAM-EVENT-MEMORY\t1\nEVENT\tevent-2\nEFFECT\teffect-d\twallet\tjpy\t-500\nEVENT\tevent-1\nEFFECT\teffect-a\twallet\tjpy\t-1000\nEFFECT\teffect-b\twallet\tjpy\t-250\n' >"$memory_file"

          output="$(./tools/loam event-memory quantity "$memory_file" wallet jpy)"
          test "$output" = '-1750'

          output="$(./tools/loam event-memory quantity "$memory_file" bank jpy)"
          test "$output" = '0'

          output="$(./tools/loam event-memory get "$memory_file" event-1)"
          expected_remembered=$'LOAM-EVENT\t1\nevent-1\neffect-a\twallet\tjpy\t-1000\neffect-b\twallet\tjpy\t-250'
          test "$output" = "$expected_remembered"

          if ./tools/loam event-memory get "$memory_file" missing-event >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected missing Event identity to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '1'
          grep -Fq 'event not found in memory' /tmp/loam-cli.err

          added_event_file="$tmp_dir/event-3.loam"
          ./tools/loam event create "$added_event_file" event-3 \
            effect-e wallet jpy -75 \
            effect-f bank jpy 75
          ./tools/loam event-memory add "$memory_file" "$added_event_file"

          expected_memory_after_add=$'LOAM-EVENT-MEMORY\t1\nEVENT\tevent-2\nEFFECT\teffect-d\twallet\tjpy\t-500\nEVENT\tevent-1\nEFFECT\teffect-a\twallet\tjpy\t-1000\nEFFECT\teffect-b\twallet\tjpy\t-250\nEVENT\tevent-3\nEFFECT\teffect-e\twallet\tjpy\t-75\nEFFECT\teffect-f\tbank\tjpy\t75'
          test "$(cat "$memory_file")" = "$expected_memory_after_add"

          output="$(./tools/loam event-memory quantity "$memory_file" wallet jpy)"
          test "$output" = '-1825'

          output="$(./tools/loam event-memory quantity "$memory_file" bank jpy)"
          test "$output" = '75'

          output="$(./tools/loam event-memory quantity "$memory_file" pocket jpy)"
          test "$output" = '0'

          output="$(./tools/loam event-memory get "$memory_file" event-3)"
          expected_added=$'LOAM-EVENT\t1\nevent-3\neffect-e\twallet\tjpy\t-75\neffect-f\tbank\tjpy\t75'
          test "$output" = "$expected_added"

          duplicate_event_file="$tmp_dir/event-2-duplicate.loam"
          ./tools/loam event create "$duplicate_event_file" event-2 duplicate-effect pocket jpy 1
          before_duplicate="$(cat "$memory_file")"
          if ./tools/loam event-memory add "$memory_file" "$duplicate_event_file" >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected duplicate Event identity to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '1'
          grep -Fq 'event identity already remembered' /tmp/loam-cli.err
          test "$(cat "$memory_file")" = "$before_duplicate"

          malformed_added_event="$tmp_dir/malformed-event.loam"
          printf 'broken\n' >"$malformed_added_event"
          before_malformed_event="$(cat "$memory_file")"
          if ./tools/loam event-memory add "$memory_file" "$malformed_added_event" >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed Event input for memory add to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'malformed or unsupported event file' /tmp/loam-cli.err
          test "$(cat "$memory_file")" = "$before_malformed_event"

          printf 'broken\n' >"$memory_file"
          if ./tools/loam event-memory get "$memory_file" event-1 >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed Event memory to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'malformed or unsupported event-memory file' /tmp/loam-cli.err

          if ./tools/loam event-memory quantity "$memory_file" wallet jpy >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed Event memory quantity input to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'malformed or unsupported event-memory file' /tmp/loam-cli.err

          record_memory="$tmp_dir/record-memory.loam"
          printf 'wallet\n-1280\njpy\n' | ./tools/loam record "$record_memory" >/tmp/loam-record.out
          grep -Fq 'Recorded total at wallet / jpy: -1280' /tmp/loam-record.out
          expected_record_memory=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\twallet\tjpy\t-1280'
          test "$(cat "$record_memory")" = "$expected_record_memory"

          printf 'wallet\n-220\njpy\n' | ./tools/loam record "$record_memory" >/tmp/loam-record.out
          grep -Fq 'Recorded total at wallet / jpy: -1500' /tmp/loam-record.out
          expected_record_memory=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\twallet\tjpy\t-1280\nEVENT\trecord-2\nEFFECT\teffect-1\twallet\tjpy\t-220'
          test "$(cat "$record_memory")" = "$expected_record_memory"
          output="$(./tools/loam event-memory quantity "$record_memory" wallet jpy)"
          test "$output" = '-1500'

          invalid_record_memory="$tmp_dir/invalid-record-memory.loam"
          if printf 'wallet\nnot-a-number\n' | ./tools/loam record "$invalid_record_memory" >/tmp/loam-record.out 2>/tmp/loam-record.err; then
            echo 'expected invalid interactive change to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'change must be a signed integer quantity' /tmp/loam-record.err
          test ! -e "$invalid_record_memory"

          malformed_record_memory="$tmp_dir/malformed-record-memory.loam"
          printf 'broken\n' >"$malformed_record_memory"
          before_malformed_record="$(cat "$malformed_record_memory")"
          if printf 'wallet\n-1\njpy\n' | ./tools/loam record "$malformed_record_memory" >/tmp/loam-record.out 2>/tmp/loam-record.err; then
            echo 'expected malformed Event memory record target to fail' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'malformed or unsupported event-memory file' /tmp/loam-record.err
          test "$(cat "$malformed_record_memory")" = "$before_malformed_record"
