name: Practical Lean Core

on:
  pull_request:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  push:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Loam.Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical core only
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run practical persistence check
        shell: bash
        run: lake env lean --run Loam/Tests/Persistence.lean

      - name: Run practical CLI check
        shell: bash
        run: |
          amount_file="$(mktemp)"
          printf 'LOAM-AMOUNT\t1\njpy\t-1250\n' >"$amount_file"
          output="$(./tools/loam amount show "$amount_file")"
          test "$output" = $'jpy\t-1250'

          printf 'broken\n' >"$amount_file"
          if ./tools/loam amount show "$amount_file" >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported amount file' /tmp/loam-cli.err

          tmp_dir="$(mktemp -d)"
          event_file="$tmp_dir/event.loam"
          ./tools/loam event create "$event_file" event-1 \
            effect-a wallet jpy -1000 \
            effect-b wallet jpy -250 \
            effect-c bank jpy 1250

          expected_event=$'LOAM-EVENT\t1\nevent-1\neffect-a\twallet\tjpy\t-1000\neffect-b\twallet\tjpy\t-250\neffect-c\tbank\tjpy\t1250'
          test "$(cat "$event_file")" = "$expected_event"

          output="$(./tools/loam event quantity "$event_file" wallet jpy)"
          test "$output" = '-1250'

          output="$(./tools/loam event quantity "$event_file" bank jpy)"
          test "$output" = '1250'

          output="$(./tools/loam event quantity "$event_file" pocket jpy)"
          test "$output" = '0'

          if ./tools/loam event create "$event_file" replacement-event >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected existing event target to be refused' >&2
            exit 1
          fi
          grep -Fq 'target event file already exists' /tmp/loam-cli.err
          test "$(cat "$event_file")" = "$expected_event"

          duplicate_file="$tmp_dir/duplicate.loam"
          if ./tools/loam event create "$duplicate_file" duplicate-event \
            same-key wallet jpy -1 \
            same-key bank jpy 1 >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected duplicate effect key to fail' >&2
            exit 1
          fi
          grep -Fq 'duplicate effect key in event' /tmp/loam-cli.err
          test ! -e "$duplicate_file"

          malformed_tuple_file="$tmp_dir/malformed-tuple.loam"
          if ./tools/loam event create "$malformed_tuple_file" bad-event \
            effect-a wallet jpy nope >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed effect tuple to fail' >&2
            exit 1
          fi
          grep -Fq 'event effects must be KEY LOCUS MEASURE QUANTA tuples' /tmp/loam-cli.err
          test ! -e "$malformed_tuple_file"

          empty_file="$tmp_dir/empty.loam"
          ./tools/loam event create "$empty_file" empty-event
          output="$(./tools/loam event quantity "$empty_file" wallet jpy)"
          test "$output" = '0'

          printf 'broken\n' >"$event_file"
          if ./tools/loam event quantity "$event_file" wallet jpy >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed event input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported event file' /tmp/loam-cli.err
