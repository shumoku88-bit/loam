name: Practical Lean Core

on:
  pull_request:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  push:
    paths:
      - 'Loam/Core/**'
      - 'Loam/Core.lean'
      - 'Loam/Persistence.lean'
      - 'Loam/Persistence/EventDescriptionPersistence.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Tests/**'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test practical Lean boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical core and persistence
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core Loam.Persistence Loam.Persistence.EventDescriptionPersistence
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run practical persistence check
        shell: bash
        run: lake env lean --run Loam/Tests/Persistence.lean

      - name: Run EventDescription persistence check
        shell: bash
        run: lake env lean --run Loam/Tests/EventDescriptionPersistenceTest.lean

      - name: Run low-level CLI boundary check
        shell: bash
        run: |
          set -euo pipefail

          amount_file="$(mktemp)"
          printf 'LOAM-AMOUNT\t1\njpy\t-1250\n' >"$amount_file"
          output="$(./tools/loam amount show "$amount_file")"
          test "$output" = $'jpy\t-1250'

          printf 'broken\n' >"$amount_file"
          if ./tools/loam amount show "$amount_file" >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported amount file' /tmp/loam-cli.err

          tmp_dir="$(mktemp -d)"
          event_file="$tmp_dir/event.loam"
          ./tools/loam event create "$event_file" event-1 \
            effect-a wallet jpy -1000 \
            effect-b wallet jpy -250 \
            effect-c bank jpy 1250

          expected_event=$'LOAM-EVENT\t1\nevent-1\neffect-a\twallet\tjpy\t-1000\neffect-b\twallet\tjpy\t-250\neffect-c\tbank\tjpy\t1250'
          test "$(cat "$event_file")" = "$expected_event"
          test "$(./tools/loam event quantity "$event_file" wallet jpy)" = '-1250'
          test "$(./tools/loam event quantity "$event_file" bank jpy)" = '1250'
          test "$(./tools/loam event quantity "$event_file" pocket jpy)" = '0'

          if ./tools/loam event create "$event_file" replacement-event >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected existing event target to be refused' >&2
            exit 1
          fi
          grep -Fq 'target event file already exists' /tmp/loam-cli.err
          test "$(cat "$event_file")" = "$expected_event"

          duplicate_file="$tmp_dir/duplicate.loam"
          if ./tools/loam event create "$duplicate_file" duplicate-event \
            same-key wallet jpy -1 \
            same-key bank jpy 1 >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected duplicate effect key to fail' >&2
            exit 1
          fi
          grep -Fq 'duplicate effect key in event' /tmp/loam-cli.err
          test ! -e "$duplicate_file"

          memory_file="$tmp_dir/memory.loam"
          printf 'LOAM-EVENT-MEMORY\t1\nEVENT\tevent-2\nEFFECT\teffect-d\twallet\tjpy\t-500\nEVENT\tevent-1\nEFFECT\teffect-a\twallet\tjpy\t-1000\nEFFECT\teffect-b\twallet\tjpy\t-250\n' >"$memory_file"

          test "$(./tools/loam event-memory quantity "$memory_file" wallet jpy)" = '-1750'
          test "$(./tools/loam event-memory quantity "$memory_file" bank jpy)" = '0'

          output="$(./tools/loam event-memory get "$memory_file" event-1)"
          expected_remembered=$'LOAM-EVENT\t1\nevent-1\neffect-a\twallet\tjpy\t-1000\neffect-b\twallet\tjpy\t-250'
          test "$output" = "$expected_remembered"

          added_event_file="$tmp_dir/event-3.loam"
          ./tools/loam event create "$added_event_file" event-3 \
            effect-e wallet jpy -75 \
            effect-f bank jpy 75
          ./tools/loam event-memory add "$memory_file" "$added_event_file"
          test "$(./tools/loam event-memory quantity "$memory_file" wallet jpy)" = '-1825'
          test "$(./tools/loam event-memory quantity "$memory_file" bank jpy)" = '75'

          printf 'broken\n' >"$memory_file"
          if ./tools/loam event-memory quantity "$memory_file" wallet jpy >/tmp/loam-cli.out 2>/tmp/loam-cli.err; then
            echo 'expected malformed Event memory quantity input to fail' >&2
            exit 1
          fi
          grep -Fq 'malformed or unsupported event-memory file' /tmp/loam-cli.err

      - name: Keep specialized recording verbs absent
        shell: bash
        run: |
          set -euo pipefail
          ./tools/loam help >/tmp/loam-help.out
          grep -Fq './tools/loam movement MEMORY_FILE' /tmp/loam-help.out
          if grep -Eq 'Record a JPY spend|Record JPY income|Move JPY between loci' /tmp/loam-help.out; then
            echo 'specialized recording verb leaked into public help' >&2
            exit 1
          fi

          for verb in spend income transfer; do
            if ./tools/loam "$verb" /tmp/absent-memory.loam >/tmp/loam-absent.out 2>/tmp/loam-absent.err; then
              echo "absent recording verb unexpectedly succeeded through wrapper: $verb" >&2
              exit 1
            fi
            grep -Fq 'loam: command not understood' /tmp/loam-absent.err

            if .lake/build/bin/loam "$verb" /tmp/absent-memory.loam >/tmp/loam-direct-absent.out 2>/tmp/loam-direct-absent.err; then
              echo "absent recording verb unexpectedly succeeded through compiled CLI: $verb" >&2
              exit 1
            fi
            grep -Fq 'loam: command not understood' /tmp/loam-direct-absent.err
          done
