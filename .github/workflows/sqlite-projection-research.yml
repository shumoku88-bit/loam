name: SQLite Projection Research

on:
  pull_request:
    paths:
      - 'experiments/sqlite_projection/**'
      - 'docs/research/external-pressure/LOAM_TEXT_SQLITE_PERSISTENCE_STUDY_2026-10.md'
      - '.github/workflows/sqlite-projection-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    name: Compare admitted LOAM and disposable SQLite answers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore shared Lean build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false

      - name: Build isolated SQLite research executables
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/sqlite_projection
          lake update
          lake build sqliteProjectionExperiment sqliteProjectionScaleBenchmark

      - name: Run semantic projection checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/sqlite_projection
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          .lake/build/bin/sqliteProjectionExperiment "$tmp"

      - name: Run E3 scale boundary benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/sqlite_projection
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for n in 1000 10000 100000; do
            root="$tmp/$n"
            mkdir -p "$root"
            .lake/build/bin/sqliteProjectionScaleBenchmark "$root" "$n"
          done
