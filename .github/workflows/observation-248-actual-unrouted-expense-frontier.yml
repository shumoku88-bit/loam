name: Observation 248

on:
  pull_request:
    paths:
      - 'experiments/248_actual_unrouted_expense_frontier.lean'
      - 'experiments/248_actual_unrouted_expense_frontier.md'
      - '.github/workflows/observation-248-actual-unrouted-expense-frontier.yml'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application/ActualRoutingInspection.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Core/RoutingEffective.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
  push:
    branches:
      - 'experiment/actual-unrouted-expense-frontier'
    paths:
      - 'experiments/248_actual_unrouted_expense_frontier.lean'
      - 'experiments/248_actual_unrouted_expense_frontier.md'
      - '.github/workflows/observation-248-actual-unrouted-expense-frontier.yml'
      - 'Loam/Application/ConsumptionInspection.lean'
      - 'Loam/Application/ActualRoutingInspection.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/HistoricalRouting.lean'
      - 'Loam/Core/RoutingEffective.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observation-248-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Qualify derived Event-valid unrouted Expense frontier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build reused production boundaries
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application.CurrentCoverageInspection
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run Observation 248 witness
        shell: bash
        run: lake env lean --run experiments/248_actual_unrouted_expense_frontier.lean
