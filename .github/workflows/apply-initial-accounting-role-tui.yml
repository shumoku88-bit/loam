name: Apply Initial AccountingRole TUI Patch

on:
  push:
    branches:
      - 'feat/initial-accounting-role-assignment'
    paths:
      - 'tools/apply-initial-accounting-role-tui.py'
      - '.github/workflows/apply-initial-accounting-role-tui.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact Home entrance patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/initial-accounting-role-assignment

      - name: Apply exact patch
        run: |
          python3 tools/apply-initial-accounting-role-tui.py
          git diff --check
          if git diff --quiet -- Loam/Tui/Cli.lean Loam/Tui/HraHome.lean; then
            echo 'expected the exact patch to change the TUI files' >&2
            exit 1
          fi

      - name: Commit patched TUI files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Cli.lean Loam/Tui/HraHome.lean
          git commit -m 'feat(tui): wire initial AccountingRole administration'
          git push origin HEAD:feat/initial-accounting-role-assignment
