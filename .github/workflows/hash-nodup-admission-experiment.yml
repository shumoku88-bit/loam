name: Hash Nodup Admission Experiment

on:
  pull_request:
    paths:
      - '.github/workflows/hash-nodup-admission-experiment.yml'
      - 'Loam/Core/HashNodup.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/ActualValidity.lean'
      - 'Loam/Core/ActualValidityHistory.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'tools/benchmark-actual-read.py'

permissions:
  contents: read

jobs:
  probe:
    name: Compare proof-producing hash Nodup admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build production review entrance
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Measure 1k 5k 10k Events
        run: python3 tools/benchmark-actual-read.py --sizes 1000 5000 10000 --repeat 2 --timeout 240 --no-build

      - name: Measure 50k Events once
        run: python3 tools/benchmark-actual-read.py --sizes 50000 --repeat 1 --timeout 300 --no-build
