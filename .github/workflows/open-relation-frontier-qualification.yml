name: Open Relation Frontier Qualification

on:
  pull_request:
    paths:
      - 'Loam/Application/OpenRelationFrontier.lean'
      - 'experiments/open_relation_frontier_qualification.lean'
      - '.github/workflows/open-relation-frontier-qualification.yml'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Check open relation frontier qualification
        run: lake env lean experiments/open_relation_frontier_qualification.lean
