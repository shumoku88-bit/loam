name: Scheduled balanced drafts one-shot

on:
  push:
    branches:
      - refactor/scheduled-balanced-drafts

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/scheduled-balanced-drafts
          fetch-depth: 0

      - name: Check whether generation is pending
        id: gate
        shell: bash
        run: |
          if [ -f .github/scripts/compress_scheduled_drafts.py ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite Scheduled draft boundary
        if: steps.gate.outputs.run == 'true'
        run: python3 .github/scripts/compress_scheduled_drafts.py

      - name: Close generated fixture arithmetic proofs
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'Loam/Tests/ScheduledCreationPublisher.lean',
              'Loam/Tests/ScheduledReplacementPublisher.lean',
          ]:
              path = Path(name)
              text = path.read_text()
              if 'import Lean.Elab.Tactic.Omega' not in text:
                  marker = '\nopen Loam.Core\n'
                  if marker not in text:
                      raise SystemExit(f'{name}: open marker missing')
                  text = text.replace(marker, '\nimport Lean.Elab.Tactic.Omega\n' + marker, 1)
              text = text.replace(
                  'balanced := by simp [movementTotalQuanta]',
                  'balanced := by\n    simp [movementTotalQuanta]\n    omega')
              path.write_text(text)
          PY

      - name: Build changed Lean boundaries
        if: steps.gate.outputs.run == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.ScheduledOccurrenceConstruction Loam.ScheduledCreationPublisher Loam.ScheduledReplacementPublisher Loam.ScheduledTerminalPublisher Loam.Tui.ScheduledCreation Loam.Tui.ScheduledReplacement Loam.Tests.ActualWorldFixture
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run focused Scheduled regressions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/ScheduledCreationPublisher.lean "$(mktemp -d)/scheduled-create"
          lake env lean --run Loam/Tests/ScheduledReplacementPublisher.lean "$(mktemp -d)/scheduled-replace"
          lake env lean --run Loam/Tests/TuiScheduledCreate.lean "$(mktemp -d)/tui-scheduled-create"
          lake env lean --run Loam/Tests/TuiScheduledTerminal.lean "$(mktemp -d)/tui-scheduled-terminal"

      - name: Commit generated compression
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/compress_scheduled_drafts.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(scheduled): carry balanced movement in drafts [generated]'
          git push origin HEAD:refactor/scheduled-balanced-drafts
