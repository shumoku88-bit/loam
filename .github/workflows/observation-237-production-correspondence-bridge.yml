name: Observation 237

on:
  pull_request:
    paths:
      - 'experiments/237_production_correspondence_bridge.lean'
      - 'experiments/237_production_correspondence_bridge.md'
      - '.github/workflows/observation-237-production-correspondence-bridge.yml'
      - 'Loam/Application/ScheduledOpenWorldInspection.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Core/ScheduledMemory.lean'
      - 'Loam/Core/ScheduledCompletion.lean'
      - 'Loam/Core/ScheduledRetirement.lean'
      - 'Loam/Core/ScheduledReplacement.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  production-correspondence-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check Observation 237 Lean probe
        shell: bash
        run: |
          set +e
          lake env lean experiments/237_production_correspondence_bridge.lean > /tmp/observation-237-lean.log 2>&1
          status=$?
          cat /tmp/observation-237-lean.log
          exit "$status"
      - name: Upload Observation 237 Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-237-lean-log
          path: /tmp/observation-237-lean.log
