name: Temporary TUI review-root cleanup

on:
  push:
    branches:
      - refactor/tui-review-root-callers
    paths:
      - '.github/workflows/tmp-tui-review-root-cleanup.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/tui-review-root-callers
      - name: Rewrite TUI callers and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Loam/Tui/Cli.lean')
          text = path.read_text()

          imports = [
              'import Loam.ScheduledRoutingPublisher\n',
              'import Loam.ScheduledContinuationRouting\n',
              'import Loam.Persistence.ScheduledRoutingPersistence\n',
              'import Loam.MovementPublisher\n',
          ]
          for old in imports:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, '')

          scheduled_old = '''    Loam.ScheduledReview.loadEvidenceFromActual\n      (dataDir / "scheduled.loam") dataDir'''
          scheduled_new = '''    Loam.ScheduledReview.loadHouseholdEvidence dataDir dataDir'''
          assert text.count(scheduled_old) == 1, text.count(scheduled_old)
          text = text.replace(scheduled_old, scheduled_new)

          capacity_old = 'Loam.CapacityReview.loadSnapshot (dataDir / "capacity.loam")'
          capacity_new = 'Loam.CapacityReview.loadSnapshotFromHouseholdRoot dataDir'
          assert text.count(capacity_old) == 5, text.count(capacity_old)
          text = text.replace(capacity_old, capacity_new)

          path.write_text(text)
          PY
          rm .github/workflows/tmp-tui-review-root-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Loam/Tui/Cli.lean .github/workflows/tmp-tui-review-root-cleanup.yml
          git commit -m 'refactor(tui): use canonical review root entrances'
          git push origin HEAD:refactor/tui-review-root-callers
