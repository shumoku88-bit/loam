name: Practical Income Transfer

on:
  pull_request:
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Core/**'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-income-transfer.yml'
  push:
    paths:
      - 'Loam/Cli.lean'
      - 'Loam/Core/**'
      - 'Loam/Persistence.lean'
      - 'Loam/WriterOwnership.lean'
      - 'tools/loam'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-income-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-income-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test income and transfer entrances
    runs-on: ubuntu-latest
    env:
      LOAM_DATA_DIR: scratch/dogfood
    steps:
      - uses: actions/checkout@v6

      - name: Build practical loam executable
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run compiled income and transfer smoke check
        shell: bash
        run: |
          test -x .lake/build/bin/loam
          tmp_dir="$(mktemp -d)"
          memory_file="$tmp_dir/memory.loam"

          printf 'bank\n5000\n' | .lake/build/bin/loam income "$memory_file" | tee /tmp/loam-income.out
          grep -Fq 'Recorded: received 5000 jpy into bank.' /tmp/loam-income.out
          expected_income=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\tbank\tjpy\t5000'
          test "$(cat "$memory_file")" = "$expected_income"

          printf 'bank\nwallet\n1200\n' | .lake/build/bin/loam transfer "$memory_file" | tee /tmp/loam-transfer.out
          grep -Fq 'Recorded: moved 1200 jpy from bank to wallet.' /tmp/loam-transfer.out
          expected_after_transfer=$'LOAM-EVENT-MEMORY\t1\nEVENT\trecord-1\nEFFECT\teffect-1\tbank\tjpy\t5000\nEVENT\trecord-2\nEFFECT\teffect-1\tbank\tjpy\t-1200\nEFFECT\teffect-2\twallet\tjpy\t1200'
          test "$(cat "$memory_file")" = "$expected_after_transfer"

          output="$(.lake/build/bin/loam event-memory quantity "$memory_file" bank jpy)"
          test "$output" = '3800'
          output="$(.lake/build/bin/loam event-memory quantity "$memory_file" wallet jpy)"
          test "$output" = '1200'

          before_same_locus="$(cat "$memory_file")"
          if printf 'bank\nbank\n' | .lake/build/bin/loam transfer "$memory_file" >/tmp/loam-transfer-same.out 2>/tmp/loam-transfer-same.err; then
            echo 'same-locus transfer must be refused' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'transfer source and destination must differ' /tmp/loam-transfer-same.err
          test "$(cat "$memory_file")" = "$before_same_locus"

          invalid_income="$tmp_dir/invalid-income.loam"
          if printf 'bank\nnope\n' | .lake/build/bin/loam income "$invalid_income" >/tmp/loam-income-invalid.out 2>/tmp/loam-income-invalid.err; then
            echo 'invalid income amount must be refused' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'amount must be a positive integer' /tmp/loam-income-invalid.err
          test ! -e "$invalid_income"

          before_negative="$(cat "$memory_file")"
          if printf 'bank\nwallet\n-1\n' | .lake/build/bin/loam transfer "$memory_file" >/tmp/loam-transfer-negative.out 2>/tmp/loam-transfer-negative.err; then
            echo 'negative transfer amount must be refused' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'amount must be a positive integer' /tmp/loam-transfer-negative.err
          test "$(cat "$memory_file")" = "$before_negative"

          malformed="$tmp_dir/malformed.loam"
          printf 'broken\n' >"$malformed"
          before_malformed="$(cat "$malformed")"
          if printf 'bank\n1\n' | .lake/build/bin/loam income "$malformed" >/tmp/loam-income-malformed.out 2>/tmp/loam-income-malformed.err; then
            echo 'malformed existing memory must be refused' >&2
            exit 1
          else
            status=$?
          fi
          test "$status" = '2'
          grep -Fq 'malformed or unsupported event-memory file' /tmp/loam-income-malformed.err
          test "$(cat "$malformed")" = "$before_malformed"

          rm -rf scratch/dogfood
          printf '7\nbank\n5000\n' | ./tools/loam | tee /tmp/loam-menu-income.out
          grep -Fq '7. Record income' /tmp/loam-menu-income.out
          grep -Fq 'Data: scratch/dogfood' /tmp/loam-menu-income.out
          grep -Fq 'Recorded: received 5000 jpy into bank.' /tmp/loam-menu-income.out

          printf '8\nbank\nwallet\n1200\n' | ./tools/loam | tee /tmp/loam-menu-transfer.out
          grep -Fq '8. Transfer funds' /tmp/loam-menu-transfer.out
          grep -Fq 'Recorded: moved 1200 jpy from bank to wallet.' /tmp/loam-menu-transfer.out

          menu_memory="scratch/dogfood/memory.loam"
          output="$(.lake/build/bin/loam event-memory quantity "$menu_memory" bank jpy)"
          test "$output" = '3800'
          output="$(.lake/build/bin/loam event-memory quantity "$menu_memory" wallet jpy)"
          test "$output" = '1200'
