name: Suspense Known/Unknown Research

on:
  pull_request:
    paths:
      - 'experiments/269_suspense_known_unknown.als'
      - 'experiments/269_suspense_known_unknown.md'
      - 'Loam/Observations/Observation309.lean'
      - '.github/workflows/suspense-known-unknown.yml'
  push:
    branches:
      - 'experiment/269-suspense-known-unknown'
      - 'experiment/suspense-real-correction'
      - main
    paths:
      - 'experiments/269_suspense_known_unknown.als'
      - 'experiments/269_suspense_known_unknown.md'
      - 'Loam/Observations/Observation309.lean'
      - '.github/workflows/suspense-known-unknown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloy:
    name: Qualify valid unknown classification boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 269 Alloy model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            experiments/269_suspense_known_unknown.als

      - name: Require unknown / invalid boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']

          expected_sat = {
              'validUnknownExists': True,
              'validPartialClassificationExists': True,
              'partialResolutionExists': True,
              'fullResolutionExists': True,
              'invalidImbalanceExists': True,
              'UnknownIsNotInvalid': False,
              'RedistributionPreservesPhysicalPayment': False,
              'RedistributionPreservesDestinationTotal': False,
              'FullResolutionLeavesNoUnresolvedQuantity': False,
          }

          wrong = []
          for name, want_sat in expected_sat.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 269 receipt: {wrong}')
          PY

