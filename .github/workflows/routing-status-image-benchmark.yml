name: Routing status image benchmark

on:
  push:
    branches:
      - 'research/temporal-routing-status-image'
    paths:
      - 'Loam/Tests/RoutingStatusImageBenchmark.lean'
      - '.github/workflows/routing-status-image-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Paired routing bulk lookup benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Core.HistoricalRouting
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/RoutingStatusImageBenchmark.lean \
            | tee /tmp/routing-status-image.txt

          {
            echo '## Routing fixed-time status image paired benchmark'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '~~~text'
            cat /tmp/routing-status-image.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
