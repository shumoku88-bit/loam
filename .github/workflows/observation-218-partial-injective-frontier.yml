name: Observation 218

on:
  pull_request:
    paths:
      - 'experiments/218_partial_injective_frontier.lean'
      - 'experiments/218_finite_partial_injection_cycle.lean'
      - 'experiments/218_partial_injective_frontier.md'
      - '.github/workflows/observation-218-partial-injective-frontier.yml'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Core/ActualValidityHistory.lean'
      - 'Loam/Core/ScheduledReplacement.lean'
      - 'Loam/Core/QuantityBasisCorrectionMemory.lean'
      - 'Loam/Application/ReplacementFrontier.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/QuantityBasisFrontier.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  partial-injective-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build production-shaped factor probe
        run: |
          lake build Loam.Application.CorrectionFrontier
          lake build Loam.Application.ActualValidityFrontier
          lake build Loam.Application.ScheduledInspection
          lake build Loam.Application.QuantityBasisFrontier
      - name: Check Observation 218 Lean proofs
        shell: bash
        run: |
          set +e
          : > /tmp/observation-218-lean.log
          lake env lean experiments/218_partial_injective_frontier.lean >> /tmp/observation-218-lean.log 2>&1
          structural_status=$?
          lake env lean experiments/218_finite_partial_injection_cycle.lean >> /tmp/observation-218-lean.log 2>&1
          cycle_status=$?
          cat /tmp/observation-218-lean.log
          if [ "$structural_status" -ne 0 ] || [ "$cycle_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Observation 218 Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-218-lean-log
          path: /tmp/observation-218-lean.log
