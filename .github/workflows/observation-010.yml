name: Observation 010

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  alloy:
    name: Alloy 6.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Execute Alloy observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            model/010_purpose_becomes_envelope.als
          find /tmp/alloy-output -maxdepth 2 -type f -print -exec sed -n '1,120p' {} \;

      - name: Require all five witnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']
          expected = [
              'baselineEnvelopeLike',
              'withoutExclusivePlacement',
              'withoutUseBoundary',
              'withoutNamedMovement',
              'repeatedUseUnderCandidateLaws',
          ]
          missing = []
          for name in expected:
              command = commands.get(name, {})
              solutions = command.get('solution', [])
              print(f'{name}: {"SAT" if solutions else "NO WITNESS"}')
              if not solutions:
                  missing.append(name)
          if missing:
              raise SystemExit(f'missing SAT witnesses: {missing}')
          PY
