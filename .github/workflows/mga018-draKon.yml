name: MGA018 Reports DRAKON

on:
  push:
    branches:
      - audit/mga-018-report-window
    paths:
      - .github/workflows/mga018-draKon.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-018-report-window
          fetch-depth: 0

      - name: Build and validate MGA-018 Reports map
        run: |
          python3 docs/drakon/build_tui_reports_granularity_audit_map.py
          test -s docs/drakon/loam-tui-reports-granularity-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = 'docs/drakon/loam-tui-reports-granularity-audit.drn'
          with sqlite3.connect(path) as db:
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
              assert db.execute('select count(*) from diagrams').fetchone()[0] == 5
              assert db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0] == 5
              assert db.execute("select count(*) from diagrams where name='MGA.018.1 Qualified ReportWindow State Owner'").fetchone()[0] == 1
          PY

      - name: Commit artifact and retire one-shot workflow
        run: |
          rm .github/workflows/mga018-draKon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/drakon/loam-tui-reports-granularity-audit.drn .github/workflows/mga018-draKon.yml
          git commit -m 'docs(drakon): sync MGA-018 ReportWindow artifact'
          git push
