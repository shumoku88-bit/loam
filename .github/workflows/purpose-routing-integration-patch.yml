name: Apply Purpose Routing Integration Patch

on:
  push:
    branches:
      - 'feat/purpose-routing-administration'
    paths:
      - 'tools/apply-purpose-routing-integration.py'
      - '.github/workflows/purpose-routing-integration-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/purpose-routing-administration
          fetch-depth: 0

      - name: Apply fail-closed integration patch
        run: python3 tools/apply-purpose-routing-integration.py

      - name: Remove branch-only patch machinery
        run: |
          rm tools/apply-purpose-routing-integration.py
          rm .github/workflows/purpose-routing-integration-patch.yml

      - name: Commit production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Loam/Tui/Cli.lean Loam/Tui/HraHome.lean tools/apply-purpose-routing-integration.py .github/workflows/purpose-routing-integration-patch.yml
          git diff --cached --exit-code && { echo "integration patch produced no changes"; exit 1; } || true
          git commit -m "feat(tui): wire Purpose routing administration"
          git push origin HEAD:feat/purpose-routing-administration
