name: Apply Initial AccountingRole CI Patch

on:
  push:
    branches:
      - 'feat/initial-accounting-role-assignment'
    paths:
      - 'tools/apply-initial-accounting-role-ci.py'
      - '.github/workflows/apply-initial-accounting-role-ci.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact Production TUI qualification patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/initial-accounting-role-assignment

      - name: Apply exact patch
        run: |
          python3 tools/apply-initial-accounting-role-ci.py
          git diff --check
          if git diff --quiet -- .github/workflows/tui.yml; then
            echo 'expected the exact patch to change Production TUI workflow' >&2
            exit 1
          fi
          cp .github/workflows/tui.yml tools/tui.yml.patched

      - name: Publish patched workflow blob at temporary non-workflow path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/tui.yml.patched
          git commit -m 'chore(ci): stage patched Production TUI workflow blob'
          git push origin HEAD:feat/initial-accounting-role-assignment
