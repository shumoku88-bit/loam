name: Stock-Flow fusion benchmark

on:
  push:
    branches:
      - 'research/stock-flow-fusion-harvest'
    paths:
      - 'Loam/Tests/StockFlowFusionBenchmark.lean'
      - 'Loam/Observations/Observation332.lean'
      - 'Loam/Observations/Observation333.lean'
      - '.github/workflows/stock-flow-fusion-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Paired Stock-Flow production vs fused candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations.Observation332 Loam.Observations.Observation333
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/StockFlowFusionBenchmark.lean \
            | tee /tmp/stock-flow-fusion.txt

          {
            echo '## Stock-Flow fusion paired benchmark'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '~~~text'
            cat /tmp/stock-flow-fusion.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
