name: MGA015 graduate

on:
  push:
    branches:
      - audit/mga-015-scheduled-completion-session
    paths:
      - .github/workflows/mga015-graduate.yml

permissions:
  contents: write

jobs:
  graduate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-015-scheduled-completion-session
      - name: Graduate ledger and DRAKON evidence
        run: |
          python3 .github/mga015_graduate.py
          python3 docs/drakon/build_tui_scheduled_session_audit_map.py
          python3 - <<'PY'
          import sqlite3
          path = 'docs/drakon/loam-tui-scheduled-session-audit.drn'
          with sqlite3.connect(path) as db:
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
              assert db.execute('select count(*) from diagrams').fetchone()[0] == 3
              assert db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0] == 3
              assert db.execute("select count(*) from diagrams where name='MGA.015.2 Qualified Scheduled Completion Session Seam'").fetchone()[0] == 1
          PY
      - name: Commit graduation and retire helpers
        run: |
          rm .github/workflows/mga015-graduate.yml .github/mga015_graduate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md \
            docs/drakon/build_tui_scheduled_session_audit_map.py \
            docs/drakon/loam-tui-scheduled-session-audit.drn \
            .github/workflows/mga015-graduate.yml \
            .github/mga015_graduate.py
          git commit -m 'docs(audit): qualify MGA-015 completion session boundary'
          git push
