name: Observation 069

on:
  pull_request:
    paths:
      - 'tla/PolicyAttributionHistory.tla'
      - 'tla/PolicyAttributionHistory*.cfg'
      - 'experiments/069_policy_change_history_pressure.md'
      - 'README.md'
      - 'OBSERVATION_MAP.md'
      - '.github/workflows/observation-069-policy-attribution-history.yml'
  push:
    branches:
      - main
      - 'experiment/069-policy-change-history-pressure'
    paths:
      - 'tla/PolicyAttributionHistory.tla'
      - 'tla/PolicyAttributionHistory*.cfg'
      - 'experiments/069_policy_change_history_pressure.md'
      - 'README.md'
      - 'OBSERVATION_MAP.md'
      - '.github/workflows/observation-069-policy-attribution-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tla:
    name: TLA+ policy attribution history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          test -s /tmp/tla2tools.jar

      - name: Check retained attribution safety
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/PolicyAttributionHistory.cfg \
            tla/PolicyAttributionHistory.tla \
            2>&1 | tee /tmp/observation-069-positive.txt
          grep -Fq 'Model checking completed. No error has been found.' /tmp/observation-069-positive.txt

      - name: Require current-policy reconstruction boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config tla/PolicyAttributionHistoryBoundary.cfg \
            tla/PolicyAttributionHistory.tla \
            2>&1 | tee /tmp/observation-069-boundary.txt
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -Fq 'CurrentPolicyReconstructsRecordedAttribution' /tmp/observation-069-boundary.txt
          grep -Fq 'Invariant' /tmp/observation-069-boundary.txt
          grep -Fq 'recordedAttribution = "earlier3_later1"' /tmp/observation-069-boundary.txt
          grep -Fq 'currentPolicy = "preferLater"' /tmp/observation-069-boundary.txt
