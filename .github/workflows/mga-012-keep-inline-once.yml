name: MGA-012 keep ActualDateCorrection loop inline

on:
  push:
    branches:
      - audit/mga-012-keep-date-loop-inline
    paths:
      - 'tools/mga_012_keep_inline.py'
      - '.github/workflows/mga-012-keep-inline-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply MGA-012 verdict
        run: |
          python3 tools/mga_012_keep_inline.py
          python3 docs/drakon/build_tui_cli_granularity_audit_map.py
          test -s docs/drakon/loam-tui-cli-granularity-audit.drn
          git diff --check
          grep -q 'MGA-012 CLOSED' docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md
          grep -q 'KEEP_INLINE / SPLIT_REJECTED' docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md
          grep -q 'MGA.012.1 Actual Date Anti-Symmetry Verdict' docs/drakon/build_tui_cli_granularity_audit_map.py
          git rm tools/mga_012_keep_inline.py
          git rm .github/workflows/mga-012-keep-inline-once.yml

      - name: Commit MGA-012 verdict
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(audit): keep ActualDateCorrection loop inline'
          git push
