name: CSLib Semantic Correspondence 006

on:
  pull_request:
    paths:
      - 'experiments/cslib_semantic_correspondence_006.lean'
      - '.github/workflows/cslib-semantic-correspondence-006.yml'
      - 'Loam/Core/BalancedMovement.lean'
      - 'Loam/Observations/Observation159.lean'
      - 'Loam/Observations/Observation163.lean'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Check CSA-006 proof
        run: lake env lean experiments/cslib_semantic_correspondence_006.lean
