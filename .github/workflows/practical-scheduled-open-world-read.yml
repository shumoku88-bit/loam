name: Practical Scheduled Open-World Read

on:
  pull_request:
    paths:
      - 'Loam/Application.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/ScheduledOpenWorldInspection.lean'
      - 'Loam/Cli/OpenScheduledCli.lean'
      - 'Loam/Cli/ScheduledBalanceCli.lean'
      - 'Loam/Cli/ScheduledDayEvidenceCli.lean'
      - 'Loam/Tests/ScheduledOpenWorldInspection.lean'
      - '.github/workflows/practical-scheduled-open-world-read.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - 'Loam/Application.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/ScheduledOpenWorldInspection.lean'
      - 'Loam/Cli/OpenScheduledCli.lean'
      - 'Loam/Cli/ScheduledBalanceCli.lean'
      - 'Loam/Cli/ScheduledDayEvidenceCli.lean'
      - 'Loam/Tests/ScheduledOpenWorldInspection.lean'
      - '.github/workflows/practical-scheduled-open-world-read.yml'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-scheduled-open-world-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-world:
    name: Qualify Scheduled open-world read contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Application contract and adapter
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application.ScheduledOpenWorldInspection loamOpenScheduled
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run open-world Scheduled story
        shell: bash
        run: lake env lean --run Loam/Tests/ScheduledOpenWorldInspection.lean

      - name: Exercise exact-day machine answer and explicit-only projections
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          scheduled="$tmp_dir/scheduled.loam"
          memory="$tmp_dir/memory.loam"

          cat >"$scheduled" <<'EOF'
          LOAM-SCHEDULED-MEMORY	1
          SCHEDULED	rent-1	2026-09-08	jpy
          CHANGE	bank	-50
          CHANGE	rent	50
          EOF

          .lake/build/bin/loamOpenScheduled \
            day-evidence "$scheduled" "$memory" 2026-09-08 \
            | tee /tmp/loam-scheduled-day-due.out
          grep -Fq $'DUE\t2026-09-08' /tmp/loam-scheduled-day-due.out
          grep -Fq $'SCHEDULED\trent-1\t2026-09-08\tjpy' \
            /tmp/loam-scheduled-day-due.out

          .lake/build/bin/loamOpenScheduled \
            day-evidence "$scheduled" "$memory" 2026-09-09 \
            | tee /tmp/loam-scheduled-day-unknown.out
          grep -Fq $'UNKNOWN\t2026-09-09' /tmp/loam-scheduled-day-unknown.out
          grep -Fq 'does not establish NOT_DUE' /tmp/loam-scheduled-day-unknown.out

          .lake/build/bin/loamOpenScheduled "$scheduled" "$memory" \
            | tee /tmp/loam-open-scheduled-open-world.out
          grep -Fq 'Explicit current-open Scheduled movements' \
            /tmp/loam-open-scheduled-open-world.out
          grep -Fq 'unmaterialized future obligations remain Unknown' \
            /tmp/loam-open-scheduled-open-world.out

          cat >"$tmp_dir/balance-view.tsv" <<'EOF'
          bank	jpy
          rent	jpy
          EOF

          .lake/build/bin/loamOpenScheduled balance-effects "$tmp_dir" 2026-10-01 \
            | tee /tmp/loam-scheduled-balance-open-world.out
          grep -Fq 'Coverage: explicit current-open Scheduled evidence only; unmaterialized future obligations remain Unknown.' \
            /tmp/loam-scheduled-balance-open-world.out
