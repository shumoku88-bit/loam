name: Research - Darwin Annual Sync API Probe

on:
  pull_request:
    paths:
      - 'tools/annual-darwin-sync-probe.c'
      - 'tools/annual-sandbox-sync.py'
      - 'tools/test-native-annual-durability-barriers.py'
      - 'tools/NativeAnnualDurabilityProbe.lean'
      - 'tools/NativeAnnualCopyRestoreProbe.lean'
      - 'tools/NativeAnnualInstalledMigrationProbe.lean'
      - 'Loam/Tests/JanuaryFirstHousehold.lean'
      - 'docs/research/ANNUAL_INSTALLED_COPY_MIGRATION_2026-10-16.md'
      - 'tools/test-native-annual-copy-restore.py'
      - 'docs/research/ANNUAL_COPY_FIRST_RESTORE_2026-10-16.md'
      - 'tools/NativeAnnualUnknownOutcomeProbe.lean'
      - 'Loam/Authority/AnnualSandboxDurabilityBarriers.lean'
      - 'Loam/Authority/AnnualSourceHeadSandbox.lean'
      - 'docs/research/ANNUAL_NATIVE_DARWIN_LEAN_BARRIERS_2026-10-16.md'
      - 'tools/test-annual-darwin-sync.py'
      - 'docs/research/ANNUAL_DARWIN_APFS_SYNC_PREFLIGHT_2026-10-16.md'
      - '.github/workflows/research-annual-darwin-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin-sync-recon:
    name: macOS APFS file / directory sync syscall observation
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Record runner volume and macOS version
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          diskutil info /
          python3 --version
      - name: Native Darwin syscall and synthetic ordered install probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test-annual-darwin-sync.py
  darwin-native-source-recovery:
    name: Native Lean Actual+Scheduled APFS sync and SIGKILL (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build native Lean source-closure prerequisites
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Tests.JanuaryFirstHousehold Loam.Authority.AnnualSandboxDurabilityBarriers Loam.Authority.AnnualSourceHeadSandbox Loam.Authority.AnnualSourcePublication Loam.Review.AnnualSourceQueryPolicy Loam.Review.CycleSpendingPaceReview Loam.Review.CurrentBalanceReview Loam.Review.AnnualSourceReadView Loam.Authority.AnnualSourceMaterialization Loam.Tests.ScheduledBatchReplacement Loam.Publisher.MovementPublisher Loam.Publisher.CorrectionPublisher Loam.Publisher.ActualValidityPublisher Loam.Review.ActualReview Loam.Review.ActualJournalProjection Loam.Review.ScheduledReview Loam.Tests.Support
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: false
      - name: Compile explicit Darwin F_FULLFSYNC helper in temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          cc -std=gnu11 -Wall -Wextra -Werror \
            -o "$dest/annual-darwin-sync-probe" tools/annual-darwin-sync-probe.c
          echo "LOAM_ANNUAL_DARWIN_SYNC_BINARY=$dest/annual-darwin-sync-probe" >> "$GITHUB_ENV"
      - name: Exercise real Lean year-source fsync barriers and SIGKILL/resume
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-darwin-fixture"
          out="$(mktemp -d)/native-annual-darwin-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          python3 tools/test-native-annual-durability-barriers.py \
            --before "$out/before.household.loam" \
            --after "$out/after.household.loam"
      - name: Exercise post-HEAD result-unknown classification with native Lean
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-annual-darwin-unknown-fixture"
          out="$(mktemp -d)/native-annual-darwin-unknown-images"
          annual="$(mktemp -d)/native-annual-darwin-unknown-root"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          lake env lean --run tools/NativeAnnualUnknownOutcomeProbe.lean \
            "$annual" "$out/before.household.loam" "$out/after.household.loam"
      - name: Replay copy-first annual source restore under native APFS barriers
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/native-darwin-annual-backup-fixture"
          out="$(mktemp -d)/native-darwin-annual-backup-images"
          lake env lean --run Loam/Tests/ScheduledBatchReplacement.lean setup "$fixture"
          lake env lean --run tools/NativeCrossFamilyYearSource.lean "$fixture" "$out"
          python3 tools/test-native-annual-copy-restore.py \
            --before "$out/before.household.loam" \
            --after "$out/after.household.loam"

      - name: Rehearse copied installed Jan-1 household under native annual source
        shell: bash
        run: |
          set -euo pipefail
          source="$(mktemp -d)/ordinary-household"
          annual="$(mktemp -d)/annual-copy"
          lake env lean --run Loam/Tests/JanuaryFirstHousehold.lean "$source"
          lake env lean --run tools/NativeAnnualInstalledMigrationProbe.lean \
            "$source" "$annual"
