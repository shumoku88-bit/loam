name: Practical Dogfood Session

on:
  pull_request:
    paths:
      - 'tools/loam'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'tools/loam'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Keep practical dogfood session alive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build practical binaries
        run: lake build loam loamDailyQuantity
      - name: Exercise several menu actions in one process
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/dogfood
          printf '9\nbank\n100000\n10\n11\n1\n90000\n10\nq\n' | ./tools/loam >"$RUNNER_TEMP/session.out"
          test -f scratch/dogfood/basis.loam
          test -f scratch/dogfood/basis-corrections.loam
          grep -F '  bank: 100000 jpy' "$RUNNER_TEMP/session.out"
          grep -F '  bank: 90000 jpy' "$RUNNER_TEMP/session.out"
          test "$(grep -c '^What do you want to do?$' "$RUNNER_TEMP/session.out")" -ge 4
      - name: Return to menu after a fail-closed current view
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scratch/dogfood
          printf '7\nbank\n100\n10\n9\nbank\n0\n10\nq\n' | ./tools/loam >"$RUNNER_TEMP/recover.out" 2>"$RUNNER_TEMP/recover.err"
          grep -F 'starting quantity missing for bank / jpy' "$RUNNER_TEMP/recover.err"
          grep -F '  bank: 100 jpy' "$RUNNER_TEMP/recover.out"
          test "$(grep -c '^What do you want to do?$' "$RUNNER_TEMP/recover.out")" -ge 4
