name: Practical Dogfood Session

on:
  pull_request:
    paths:
      - 'tools/loam'
      - 'tools/loam-movement'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'tools/loam'
      - 'tools/loam-movement'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Keep practical dogfood session alive
    runs-on: ubuntu-latest
    env:
      LOAM_DATA_DIR: scratch/dogfood
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build practical binaries
        run: lake build loam loamMovement loamDailyQuantity

      - name: Keep ordinary data outside the source repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../loam-data
          printf 'q\n' | env -u LOAM_DATA_DIR ./tools/loam >"$RUNNER_TEMP/default-data.out"
          test -d ../loam-data
          grep -Fq 'Data: ../loam-data' "$RUNNER_TEMP/default-data.out"
          test ! -e ../loam-data/memory.loam
          test ! -e ../loam-data/zero-origin-coverage.loam
          test ! -e ../loam-data/config/balance-view.tsv
          rm -rf ../loam-data

      - name: Exercise persistent movement and explicit zero-origin evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          root = Path("scratch/dogfood")

          def start_session():
              return subprocess.Popen(
                  ["./tools/loam"],
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
              )

          def read_until(proc, marker, transcript):
              chunk = ""
              while marker not in chunk:
                  ch = proc.stdout.read(1)
                  if ch == "":
                      transcript.append(chunk)
                      raise RuntimeError(
                          f"LOAM exited before marker {marker!r}\n" + "".join(transcript)
                      )
                  chunk += ch
              transcript.append(chunk)
              return chunk

          def send(proc, text):
              proc.stdin.write(text + "\n")
              proc.stdin.flush()

          def finish(proc, transcript):
              proc.stdin.close()
              transcript.append(proc.stdout.read())
              status = proc.wait(timeout=10)
              if status != 0:
                  raise RuntimeError(
                      f"LOAM session exited with {status}\n" + "".join(transcript)
                  )
              return "".join(transcript)

          shutil.rmtree(root, ignore_errors=True)
          proc = start_session()
          transcript = []
          first = read_until(proc, "> ", transcript)
          assert "Data: scratch/dogfood" in first, "".join(transcript)

          # No coverage evidence and no selected question is a clean empty view.
          send(proc, "3")
          empty = read_until(proc, "> ", transcript)
          assert "No balances are selected in the current balance view." in empty, "".join(transcript)

          # The ordinary menu must not expose the retired snapshot writers.
          send(proc, "m")
          more = read_until(proc, "> ", transcript)
          assert "starting" not in more.lower(), "".join(transcript)
          assert "Correct a starting balance" not in more, "".join(transcript)
          send(proc, "b")
          read_until(proc, "> ", transcript)

          root.mkdir(parents=True, exist_ok=True)
          (root / "config").mkdir()
          (root / "zero-origin-coverage.loam").write_text(
              "LOAM-ZERO-ORIGIN-COVERAGE\t1\n"
              "COORDINATE\tbank\tjpy\n",
              encoding="utf-8",
          )
          (root / "config" / "balance-view.tsv").write_text(
              "bank\tjpy\n", encoding="utf-8")
          (root / "memory.loam.locus-admission").write_text(
              "LOAM-LOCUS-ADMISSION-VOCABULARY\t1\n"
              "LOCUS\tincome-source\n"
              "LOCUS\tbank\n",
              encoding="utf-8",
          )

          send(proc, "3")
          anchored_zero = read_until(proc, "> ", transcript)
          assert "  bank: 0 jpy" in anchored_zero, "".join(transcript)

          send(proc, "1")
          read_until(proc, "From locus (blank when done)? ", transcript)
          send(proc, "income-source")
          read_until(proc, "From amount? ", transcript)
          send(proc, "100")
          read_until(proc, "From locus (blank when done)? ", transcript)
          send(proc, "")
          read_until(proc, "To locus (blank when done)? ", transcript)
          send(proc, "bank")
          read_until(proc, "To amount? ", transcript)
          send(proc, "100")
          read_until(proc, "To locus (blank when done)? ", transcript)
          send(proc, "")
          read_until(proc, "> ", transcript)

          send(proc, "3")
          current = read_until(proc, "> ", transcript)
          assert "  bank: 100 jpy" in current, "".join(transcript)

          # Event activity outside coverage remains unknown even if presentation asks for it.
          (root / "config" / "balance-view.tsv").write_text(
              "income-source\tjpy\n", encoding="utf-8")
          send(proc, "3")
          refused = read_until(proc, "> ", transcript)
          assert "zero-origin coverage missing for income-source / jpy" in refused, "".join(transcript)

          send(proc, "q")
          full = finish(proc, transcript)
          assert full.count("m. More actions") >= 6, full
          PY
