name: Practical Dogfood Session

on:
  pull_request:
    paths:
      - 'tools/loam'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    paths:
      - 'tools/loam'
      - '.github/workflows/practical-dogfood-session.yml'
      - 'Loam/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Keep practical dogfood session alive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Build practical binaries
        run: lake build loam loamDailyQuantity
      - name: Exercise persistent menu and fail-closed recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          import subprocess
          import sys

          def start_session():
              return subprocess.Popen(
                  ["./tools/loam"],
                  stdin=subprocess.PIPE,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
              )

          def read_until(proc, marker, transcript):
              chunk = ""
              while marker not in chunk:
                  ch = proc.stdout.read(1)
                  if ch == "":
                      transcript.append(chunk)
                      raise RuntimeError(
                          f"LOAM exited before marker {marker!r}\n" + "".join(transcript)
                      )
                  chunk += ch
              transcript.append(chunk)
              return chunk

          def send(proc, text):
              proc.stdin.write(text + "\n")
              proc.stdin.flush()

          def finish(proc, transcript):
              proc.stdin.close()
              transcript.append(proc.stdout.read())
              status = proc.wait(timeout=10)
              if status != 0:
                  raise RuntimeError(
                      f"LOAM session exited with {status}\n" + "".join(transcript)
                  )
              return "".join(transcript)

          shutil.rmtree("scratch/dogfood", ignore_errors=True)
          proc = start_session()
          transcript = []
          read_until(proc, "> ", transcript)
          send(proc, "9")
          read_until(proc, "Starting at? ", transcript)
          send(proc, "bank")
          read_until(proc, "Starting quantity? ", transcript)
          send(proc, "100000")
          read_until(proc, "> ", transcript)
          send(proc, "10")
          before = read_until(proc, "> ", transcript)
          assert "  bank: 100000 jpy" in before, "".join(transcript)
          send(proc, "11")
          read_until(proc, "Select number: ", transcript)
          send(proc, "1")
          read_until(proc, "Correct starting quantity to? ", transcript)
          send(proc, "90000")
          read_until(proc, "> ", transcript)
          send(proc, "10")
          after = read_until(proc, "> ", transcript)
          assert "  bank: 90000 jpy" in after, "".join(transcript)
          send(proc, "q")
          full = finish(proc, transcript)
          assert full.count("What do you want to do?") >= 5, full

          shutil.rmtree("scratch/dogfood", ignore_errors=True)
          proc = start_session()
          transcript = []
          read_until(proc, "> ", transcript)
          send(proc, "7")
          read_until(proc, "Received into? ", transcript)
          send(proc, "bank")
          read_until(proc, "Amount? ", transcript)
          send(proc, "100")
          read_until(proc, "> ", transcript)
          send(proc, "10")
          failed = read_until(proc, "> ", transcript)
          assert "starting quantity missing for bank / jpy" in failed, "".join(transcript)
          send(proc, "9")
          read_until(proc, "Starting at? ", transcript)
          send(proc, "bank")
          read_until(proc, "Starting quantity? ", transcript)
          send(proc, "0")
          read_until(proc, "> ", transcript)
          send(proc, "10")
          recovered = read_until(proc, "> ", transcript)
          assert "  bank: 100 jpy" in recovered, "".join(transcript)
          send(proc, "q")
          full = finish(proc, transcript)
          assert full.count("What do you want to do?") >= 5, full
          PY
