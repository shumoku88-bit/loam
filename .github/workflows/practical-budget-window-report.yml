name: Practical Budget Window Report

on:
  pull_request:
    paths:
      - 'Loam/BudgetWindowReview.lean'
      - 'Loam/Cli/BudgetWindowCli.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/Persistence/CapacityPersistence.lean'
      - 'Loam/Persistence/CapacityEffectivePersistence.lean'
      - 'Loam/Persistence/ActualRoutingPersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli/CapacityCli.lean'
      - 'Loam/Cli/ActualRoutingCli.lean'
      - 'lakefile.lean'
      - '.github/workflows/practical-budget-window-report.yml'
      - 'lean-toolchain'
  push:
    branches:
      - main
    paths:
      - 'Loam/BudgetWindowReview.lean'
      - 'Loam/Cli/BudgetWindowCli.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam/Application/CapacityWindowInspection.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/MovementManifestAuthority.lean'
      - 'Loam/Persistence/CapacityPersistence.lean'
      - 'Loam/Persistence/CapacityEffectivePersistence.lean'
      - 'Loam/Persistence/ActualRoutingPersistence.lean'
      - 'Loam/Tests/EmptyMovementManifest.lean'
      - 'Loam/Cli/MovementCli.lean'
      - 'Loam/Cli/CapacityCli.lean'
      - 'Loam/Cli/ActualRoutingCli.lean'
      - 'lakefile.lean'
      - '.github/workflows/practical-budget-window-report.yml'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-budget-window-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Project Entitlement Consumption Remaining
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical entrances
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamMovement loamCapacity loamActualRouting loamBudgetWindow loamHouseholdObservation
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Exercise a clean budget coordinate window
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          manifest="$tmpdir/movement-authority"
          memory="$tmpdir/compat-memory.loam"
          lake env lean --run Loam/Tests/EmptyMovementManifest.lean \
            "$manifest" paypay expenses:food

          printf 'unallocated\nfood\n100\n' \
            | LOAM_CAPACITY_EFFECTIVE_DATE=2026-08-17 \
              .lake/build/bin/loamCapacity "$tmpdir/capacity.loam"

          printf 'unallocated\ngeneral\n50\n' \
            | LOAM_CAPACITY_EFFECTIVE_DATE=2026-08-17 \
              .lake/build/bin/loamCapacity "$tmpdir/capacity.loam"

          printf 'paypay\n20\n\nexpenses:food\n20\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-08-16 \
                LOAM_DESCRIPTION='before clean epoch' \
                .lake/build/bin/loamMovement "$memory"

          printf 'paypay\n30\n\nexpenses:food\n30\n\n' \
            | env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
                LOAM_OCCURRENCE_DATE=2026-08-18 \
                LOAM_DESCRIPTION='inside clean epoch' \
                .lake/build/bin/loamMovement "$memory"

          .lake/build/bin/loamActualRouting \
            initial "$tmpdir/actual-routing.loam" expenses:food managed food

          output="$(.lake/build/bin/loamBudgetWindow \
            "$tmpdir" 2026-08-17 2026-10-15 food)"
          printf '%s\n' "$output"

          grep -Fx 'Budget window [2026-08-17, 2026-10-15)' <<<"$output"
          grep -Fx 'Purpose: food' <<<"$output"
          grep -Fx 'Entitlement: 100 jpy' <<<"$output"
          grep -Fx 'Consumption: 30 jpy' <<<"$output"
          grep -Fx 'Remaining: 70 jpy' <<<"$output"

          zero_output="$(.lake/build/bin/loamBudgetWindow \
            "$tmpdir" 2026-08-17 2026-10-15 unseen)"
          printf '%s\n' "$zero_output"
          grep -Fx 'Purpose: unseen' <<<"$zero_output"
          grep -Fx 'Entitlement: 0 jpy' <<<"$zero_output"
          grep -Fx 'Consumption: 0 jpy' <<<"$zero_output"
          grep -Fx 'Remaining: 0 jpy' <<<"$zero_output"

          all_output="$(.lake/build/bin/loamBudgetWindow \
            "$tmpdir" 2026-08-17 2026-10-15 --all)"
          printf '%s\n' "$all_output"

          grep -Fx 'Budget window [2026-08-17, 2026-10-15)' <<<"$all_output"
          grep -Fx 'Purposes:' <<<"$all_output"
          grep -Fx '  food: entitlement 100 jpy, consumption 30 jpy, remaining 70 jpy' <<<"$all_output"
          grep -Fx '  general: entitlement 50 jpy, consumption 0 jpy, remaining 50 jpy' <<<"$all_output"

          observation_output="$(env LOAM_MOVEMENT_MANIFEST_ROOT="$manifest" \
            .lake/build/bin/loamHouseholdObservation \
            "$tmpdir" 2026-08-17 2026-10-15)"
          printf '%s\n' "$observation_output"

          grep -Fx $'HOBS1\tmeta\timplementation\tloam' <<<"$observation_output"
          grep -Fx $'HOBS1\tmeta\twindow_start\t2026-08-17' <<<"$observation_output"
          grep -Fx $'HOBS1\tmeta\twindow_end_exclusive\t2026-10-15' <<<"$observation_output"
          grep -Fx $'HOBS1\tbudget\tfood\tjpy\t100\t30\t70' <<<"$observation_output"
          grep -Fx $'HOBS1\tbudget\tgeneral\tjpy\t50\t0\t50' <<<"$observation_output"
          grep -Fx $'HOBS1\tcapacity\tpurpose\tfood\tjpy\t100' <<<"$observation_output"
          grep -Fx $'HOBS1\tcapacity\tpurpose\tgeneral\tjpy\t50' <<<"$observation_output"
          grep -Fx $'HOBS1\tscalar\tbudget\ttotal_entitlement\tjpy\t150' <<<"$observation_output"
          grep -Fx $'HOBS1\tscalar\tbudget\ttotal_consumption\tjpy\t30' <<<"$observation_output"
          grep -Fx $'HOBS1\tscalar\tbudget\ttotal_remaining\tjpy\t120' <<<"$observation_output"
          test "$(tail -n 1 <<<"$observation_output")" = $'HOBS1\tmeta\tstatus\tcomplete'

          mv "$tmpdir/actual-routing.loam" "$tmpdir/actual-routing.saved"
          if .lake/build/bin/loamBudgetWindow \
              "$tmpdir" 2026-08-17 2026-10-15 food >/tmp/budget-window.err 2>&1; then
            echo 'budget report silently accepted missing routing authority' >&2
            exit 1
          fi
          grep -F 'required Actual routing evidence not found' /tmp/budget-window.err
