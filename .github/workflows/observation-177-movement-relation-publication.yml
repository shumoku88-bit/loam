name: Observation 177

on:
  pull_request:
    paths:
      - 'experiments/177_movement_relation_publication_safe.pml'
      - 'experiments/177_movement_relation_publication_unsafe_writer.pml'
      - 'experiments/177_movement_relation_publication_unsafe_reader.pml'
      - 'experiments/177_movement_relation_publication.md'
      - '.github/workflows/observation-177-movement-relation-publication.yml'
  push:
    branches:
      - 'experiment/177-movement-relation-publication'
      - main
    paths:
      - 'experiments/177_movement_relation_publication_safe.pml'
      - 'experiments/177_movement_relation_publication_unsafe_writer.pml'
      - 'experiments/177_movement_relation_publication_unsafe_reader.pml'
      - 'experiments/177_movement_relation_publication.md'
      - '.github/workflows/observation-177-movement-relation-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spin:
    name: SPIN Movement relation publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SPIN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y spin
          spin -V

      - name: Verify relation-first Event-last candidate
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/177_movement_relation_publication_safe.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'errors:[[:space:]]+0' <<<"$output"

      - name: Require Event-first writer counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/177_movement_relation_publication_unsafe_writer.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected false-known-none under Event-first writer order'
            exit 1
          fi

      - name: Require relation-first reader counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/177_movement_relation_publication_unsafe_reader.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected false-known-none under relation-first reader order'
            exit 1
          fi
