name: CSLib Semantic Correspondence 004

on:
  pull_request:
    paths:
      - 'experiments/cslib_semantic_correspondence_004.lean'
      - '.github/workflows/cslib-semantic-correspondence-004.yml'
      - 'Loam/FreshNumberedToken.lean'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Check CSA-004 proof
        run: lake env lean experiments/cslib_semantic_correspondence_004.lean
