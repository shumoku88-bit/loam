name: MGA017 ledger

on:
  push:
    branches:
      - audit/mga-017-reports-frontier
    paths:
      - .github/workflows/mga017-ledger.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/mga-017-reports-frontier
      - name: Record MGA-017 verdict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md')
          text = path.read_text()
          old = 'Status: **MGA-016 COMPLETE — ScheduledContinuationSession KEEP_BOUNDARY / SPLIT_QUALIFIED; PR #977 ready for merge**'
          new = 'Status: **MGA-017 COMPLETE — Reports frontier mapped; ReportWindow SPLIT_CANDIDATE; Transactions Flow SPLIT_CANDIDATE deferred**'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unexpected ledger status')
          marker = '## MGA-017 — `Loam.Tui.Reports` physical-boundary frontier'
          if marker not in text:
              text += '''

## MGA-017 — `Loam.Tui.Reports` physical-boundary frontier

Classification: **MIXED VERDICT — ReportWindow SPLIT_CANDIDATE; Transactions Flow SPLIT_CANDIDATE DEFERRED; remaining report slices KEEP_INLINE**

MGA-017 begins after Generation 2 closed at G2-034. It does not reopen semantic
subtraction. It asks only whether the physical `Loam.Tui.Reports` module still
matches its independent presentation reasons to change.

Current inventory identifies `Reports` as an unusually dense production module:

```text
1214 lines / 103 declarations / fan-in 3 / fan-out 13 / reachable
```

DRAKON and repository history show several independently changing regions rather
than one monolithic presentation requirement: report-window coordinates (#488,
#550), conditional Liquidity (#548, #952), cross-mode terminal paging (#555),
Transactions Flow interaction and responsive layout (#630, #633), Income & Expense
presentation (#813-#815), and Balances presentation (#820-#821).

The strongest first physical split candidate is the shared report-window owner:

```text
WindowSource + Form
calendar anchor + named presets
calendar seed/reset/shift
preset selection/cycling
custom coordinate editing + focus
```

Stock-Flow, Transactions Flow, Income & Expense, and Budget Window all consume
that same presentation/query-coordinate responsibility. Liquidity deliberately
does not: its explicit completeness-assumption horizon has different semantics.
A future MGA-018 experiment qualifies only if it creates one nested canonical
window state with no mirrored start/end/preset fields, no report-specific policy
parameters, and no moved report semantics or authority.

Transactions Flow is a second **SPLIT_CANDIDATE** because it owns dedicated
selection/detail state, sparse-row interaction, responsive table layout, contributor
detail, a dedicated production-style test module, and independent #630/#633
history. Its implementation is deferred until window ownership is settled so a
split does not manufacture coordinate-state plumbing.

The following remain **KEEP_INLINE for now**:

- Income & Expense rendering: independent history exists, but a new file would
  currently mostly move one-consumer pure presentation code;
- Balances / Liquidity / Budget render slices: one file per menu item is not an
  earned boundary, and Balances already delegates its substantial shared projection
  to `Loam.Tui.RoleBalances`;
- bounds-aware paging: it is a genuine cross-mode policy but remains local to one
  workspace with no second consumer demanding a shared module.

The detailed source/history evidence and stop rules are recorded in
`MODULE_GRANULARITY_FRONTIER_017.md` and the four-diagram
`loam-tui-reports-granularity-audit.drn`. No production Lean code changes in
MGA-017.
'''
          path.write_text(text)
          PY
      - name: Commit ledger and retire one-shot workflow
        run: |
          rm .github/workflows/mga017-ledger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md .github/workflows/mga017-ledger.yml
          git commit -m 'docs(audit): record MGA-017 Reports frontier verdict'
          git push
