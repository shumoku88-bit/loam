name: Observation 234

on:
  pull_request:
    paths:
      - 'experiments/234_transactions_flow_actual_window.lean'
      - 'experiments/234_transactions_flow_actual_window.md'
      - '.github/workflows/observation-234-transactions-flow-actual-window.yml'
      - 'Loam/ActualReview.lean'
      - 'Loam/ActualDate.lean'
      - 'Loam/Core/Event.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  transactions-flow-actual-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check Observation 234 Lean probe
        shell: bash
        run: |
          set +e
          lake env lean experiments/234_transactions_flow_actual_window.lean > /tmp/observation-234-lean.log 2>&1
          status=$?
          cat /tmp/observation-234-lean.log
          exit "$status"
      - name: Upload Observation 234 Lean log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-234-lean-log
          path: /tmp/observation-234-lean.log
