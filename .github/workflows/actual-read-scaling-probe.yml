name: Actual Read Scaling Probe

on:
  pull_request:
    paths:
      - 'tools/benchmark-actual-read.py'
      - '.github/workflows/actual-read-scaling-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Measure normalized Actual read scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build production review entrance
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Measure 1k 5k 10k Event reads
        run: python3 tools/benchmark-actual-read.py --sizes 1000 5000 10000 --repeat 2 --timeout 240 --no-build
