permissions:
  contents: read

jobs:
  select:
    name: Select Alloy research obligations
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Qualify changed-path and branch selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 tools/select-alloy-research-cases             --event pull_request             --paths experiments/242_accounting_projection_factorization.als)" =             '["accounting-projection-factorization"]'
          test "$(python3 tools/select-alloy-research-cases             --event pull_request             --paths experiments/327_interpretation_subject_correction.als)" =             '["interpretation-subject-correction"]'
          test "$(python3 tools/select-alloy-research-cases             --event push             --branch experiment/242-accounting-projection-factorization             --paths experiments/249_cash_flow_classification.als)" =             '[]'
          test "$(python3 tools/select-alloy-research-cases             --event push             --branch experiment/327-interpretation-subject-correction             --paths experiments/327_interpretation_subject_correction.als)" =             '["interpretation-subject-correction"]'
          test "$(python3 tools/select-alloy-research-cases             --event push             --branch experiment/242-accounting-projection-factorization             --paths verification/ci/alloy-research-cases.json)" =             '["accounting-projection-factorization"]'
          test "$(python3 tools/select-alloy-research-cases             --event workflow_dispatch             --paths)" =             '["summary-correlation-loss","accounting-projection-factorization","current-vs-historical-balance-support","temporal-quantity-anchor","shared-current-anchor-cut","cash-flow-classification","rea-interpretation","rea-ledger-commutation","balance-history-boundary","external-party-identity-boundary","event-party-granularity","description-party-boundary","merchant-query-pressure","merchant-coverage-completeness","suspense-known-unknown","interpretation-history","reflection-subject-sufficiency","interpretation-recorded-time","interpretation-attributed-time","interpretation-carrier-compression","interpretation-attribution-unknown","interpretation-split-boundary","interpretation-subject-correction","measure-scale-history"]'

      - name: Select obligations for this event
        id: select
        shell: bash
        run: |
          set -euo pipefail
          cases="$(python3 tools/select-alloy-research-cases             --event "$GITHUB_EVENT_NAME"             --event-file "$GITHUB_EVENT_PATH")"
          printf 'cases=%s\n' "$cases" >> "$GITHUB_OUTPUT"
          printf 'selected Alloy cases: %s\n' "$cases"

  summary-correlation-loss:
    name: Separate marginals and joint correlation
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.cases), 'summary-correlation-loss') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/alloy-research-case
        with:
          case: summary-correlation-loss

  accounting-projection-factorization:
    name: Falsify accounting projection compression
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.cases), 'accounting-projection-factorization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
