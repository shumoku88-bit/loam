name: Actual journal sort benchmark

on:
  push:
    branches:
      - 'research/actual-journal-sort-pressure'
    paths:
      - 'Loam/Tests/ActualJournalSortBenchmark.lean'
      - '.github/workflows/actual-journal-sort-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Paired Actual journal sort benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.ActualJournalProjection
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/ActualJournalSortBenchmark.lean \
            | tee /tmp/actual-journal-sort.txt

          {
            echo '## Actual journal sort paired benchmark'
            echo
            echo "Commit: `${GITHUB_SHA}`"
            echo
            echo '~~~text'
            cat /tmp/actual-journal-sort.txt
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
