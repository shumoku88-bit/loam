name: Application 034 Movement Admission Baseline

on:
  push:
    branches:
      - 'experiment/application-034-movement-admission-seam'
    paths:
      - '.github/workflows/application-034-movement-admission-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: capture pre-refactor canonical Movement bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean and build production Movement
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loamMovement
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          memory="$tmp_dir/memory.loam"

          printf 'paypay\n100\n\ntravel\n100\n\n' \
            | env LOAM_OCCURRENCE_DATE=2026-09-05 \
                LOAM_DESCRIPTION='manifest source movement' \
                LOAM_RELATIONS=$'effect-1\tE2H\tfriend\t100' \
                .lake/build/bin/loamMovement "$memory"

          printf 'friend-in\n40\n\npaypay\n40\n\n' \
            | env LOAM_OCCURRENCE_DATE=2026-09-06 \
                LOAM_DESCRIPTION='manifest discharge movement' \
                LOAM_DISCHARGES=$'relation-1\t40' \
                .lake/build/bin/loamMovement "$memory"

          echo 'APPLICATION034_BASELINE_SHA256'
          sha256sum \
            "$memory" \
            "$memory.actual-validity" \
            "$memory.descriptions" \
            "$memory.relations" \
            "$memory.discharges"
          echo 'APPLICATION034_BASELINE_BYTES'
          wc -c \
            "$memory" \
            "$memory.actual-validity" \
            "$memory.descriptions" \
            "$memory.relations" \
            "$memory.discharges"
