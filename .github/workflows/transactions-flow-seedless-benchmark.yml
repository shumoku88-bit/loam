name: Transactions-Flow seedless benchmark

on:
  push:
    branches:
      - 'research/mathematical-structure-map-draft'
    paths:
      - 'Loam/Tests/TransactionsFlowSeedlessBenchmark.lean'
      - 'Loam/Observations/Observation331.lean'
      - '.github/workflows/transactions-flow-seedless-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Paired current vs seedless sparse summary
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Observations.Observation331
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Record runner context
        shell: bash
        run: |
          {
            echo '## Transactions-Flow seedless paired benchmark'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Runner: ubuntu-24.04'
            echo
            echo "CPU cores: $(nproc)"
            echo
            echo '~~~text'
            free -h
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --run Loam/Tests/TransactionsFlowSeedlessBenchmark.lean \
            | tee /tmp/transactions-flow-seedless.txt

          {
            echo
            echo '### Results'
            echo
            echo '~~~text'
            cat /tmp/transactions-flow-seedless.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
