name: Temporary Description Scaling Qualification

on:
  push:
    branches:
      - perf/actual-description-scaling

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production loam binary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Measure plain history
        run: python3 tools/benchmark-actual-read.py --no-build --shape plain --sizes 1000 5000 10000 50000 --repeat 3 --timeout 120

      - name: Measure description-heavy history
        run: python3 tools/benchmark-actual-read.py --no-build --shape described --sizes 1000 5000 10000 50000 --repeat 3 --timeout 120
