name: Actual Reversal

on:
  pull_request:
    paths:
      - 'Loam/Core/ActualReversal.lean'
      - 'Loam/Persistence/ActualReversalPersistence.lean'
      - 'Loam/ActualReversalPublisher.lean'
      - 'Loam/Tui/ActualReversal.lean'
      - 'Loam/Tui/ActualReversalSession.lean'
      - 'Loam/Tui/SelectedDay.lean'
      - 'Loam/Tui/Cli.lean'
      - 'Loam/Tests/ActualReversalPublisher.lean'
      - 'Loam/Tests/TuiActualReversal.lean'
      - '.github/workflows/actual-reversal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Qualify explicit Actual reversal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build shared reversal publisher boundary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.ActualReversalPublisher
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Verify relation-first exact reversal publication
        run: lake env lean --run Loam/Tests/ActualReversalPublisher.lean "$(mktemp -d)/actual-reversal"

      - name: Verify reversal TUI intent and fresh Actual review
        run: lake env lean --run Loam/Tests/TuiActualReversal.lean "$(mktemp -d)/tui-actual-reversal"
