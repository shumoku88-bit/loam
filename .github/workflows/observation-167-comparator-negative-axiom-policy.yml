name: Observation 167

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  comparator-negative-axiom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build pinned Comparator tools
        working-directory: verification/observation167
        run: |
          lake update
          lake build comparator lean4export

      - name: Expect Comparator to reject unpermitted axiom
        working-directory: verification/observation167
        run: |
          export COMPARATOR_LANDRUN="$(realpath .lake/packages/Comparator/scripts/fake-landrun.sh)"
          export COMPARATOR_LEAN4EXPORT="$(realpath .lake/packages/lean4export/.lake/build/bin/lean4export)"
          set +e
          output=$(lake env .lake/packages/Comparator/.lake/build/bin/comparator config.json 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Comparator unexpectedly accepted an unpermitted axiom."
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "Observation167.unpermitted_fact"

      - name: Record trust boundary
        run: |
          echo "Comparator rejected a statement-matching proof that used an axiom outside the empty allowlist."
          echo "This trial still uses Comparator's fake-landrun development shim."
          echo "It does NOT claim adversarial build sandboxing."
