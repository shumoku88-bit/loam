name: Practical Correction Projection

on:
  pull_request:
    paths:
      - 'Loam/Cli/EffectiveCli.lean'
      - 'Loam/Cli/CorrectionIntegrityCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/QuantityInspection.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Persistence.lean'
      - '.github/workflows/practical-correction.yml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  push:
    paths:
      - 'Loam/Cli/EffectiveCli.lean'
      - 'Loam/Cli/CorrectionIntegrityCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/QuantityInspection.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Persistence.lean'
      - '.github/workflows/practical-correction.yml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection:
    name: Test retained correction projections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build practical projection commands
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Exercise closed, frontier, and refused correction shapes
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          memory="$tmp/memory.loam"
          corrections="$tmp/corrections.loam"

          cat >"$memory" <<'EOF'
          LOAM-EVENT-MEMORY\t1
          EVENT\ta
          EFFECT\ta-from\twallet\tjpy\t-100
          EFFECT\ta-to\tfood\tjpy\t100
          EVENT\tb
          EFFECT\tb-from\twallet\tjpy\t-110
          EFFECT\tb-to\tfood\tjpy\t110
          EVENT\tc
          EFFECT\tc-from\twallet\tjpy\t-120
          EFFECT\tc-to\tfood\tjpy\t120
          EOF
          cat >"$corrections" <<'EOF'
          LOAM-EVENT-CORRECTION-MEMORY\t1
          CORRECTION\tc1\ta\tb
          EOF

          .lake/build/bin/loam effective "$memory" "$corrections" >"$tmp/effective.out"
          grep -Fq 'single-correction projection' "$tmp/effective.out"
          grep -Fq 'wallet: -230 jpy' "$tmp/effective.out"
          grep -Fq 'food: 230 jpy' "$tmp/effective.out"

          .lake/build/bin/loam correction-integrity "$memory" "$corrections" >"$tmp/integrity.out"
          grep -Fq 'a -> b' "$tmp/integrity.out"
          grep -Fq 'relation: closed' "$tmp/integrity.out"
          grep -Fq 'original contribution excluded; replacement retained once' "$tmp/integrity.out"
          grep -Fq 'All correction relations are closed.' "$tmp/integrity.out"

          cat >"$corrections" <<'EOF'
          LOAM-EVENT-CORRECTION-MEMORY\t1
          CORRECTION\tc1\ta\tb
          CORRECTION\tc2\tb\tc
          EOF
          .lake/build/bin/loam effective "$memory" "$corrections" >"$tmp/frontier.out"
          grep -Fq 'correction-frontier projection' "$tmp/frontier.out"
          grep -Fq 'wallet: -120 jpy' "$tmp/frontier.out"
          grep -Fq 'food: 120 jpy' "$tmp/frontier.out"

          cat >"$corrections" <<'EOF'
          LOAM-EVENT-CORRECTION-MEMORY\t1
          CORRECTION\tc1\ta\tb
          CORRECTION\tc2\ta\tc
          EOF
          if .lake/build/bin/loam effective "$memory" "$corrections" >"$tmp/refuse.out" 2>&1; then
            echo 'branching correction evidence must refuse one current frontier' >&2
            exit 1
          fi
          grep -Fq 'corrections do not justify one current frontier' "$tmp/refuse.out"

          cat >"$corrections" <<'EOF'
          LOAM-EVENT-CORRECTION-MEMORY\t1
          CORRECTION\tc1\ta\tmissing
          EOF
          if .lake/build/bin/loam correction-integrity "$memory" "$corrections" >"$tmp/open.out" 2>&1; then
            echo 'open correction relation must not report complete integrity' >&2
            exit 1
          fi
          grep -Fq 'relation: open' "$tmp/open.out"
          grep -Fq 'one or more correction relations are open' "$tmp/open.out"
