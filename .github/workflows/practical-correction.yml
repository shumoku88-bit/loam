name: Practical Correction Entrance

on:
  pull_request:
    paths:
      - 'LoamCorrection.lean'
      - 'LoamEffective.lean'
      - 'LoamCorrectionIntegrity.lean'
      - 'Loam/CorrectionCli.lean'
      - 'Loam/EffectiveCli.lean'
      - 'Loam/CorrectionIntegrityCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Core/**'
      - 'Loam/Persistence.lean'
      - 'tools/loam'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-correction.yml'
  push:
    paths:
      - 'LoamCorrection.lean'
      - 'LoamEffective.lean'
      - 'LoamCorrectionIntegrity.lean'
      - 'Loam/CorrectionCli.lean'
      - 'Loam/EffectiveCli.lean'
      - 'Loam/CorrectionIntegrityCli.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Core/**'
      - 'Loam/Persistence.lean'
      - 'tools/loam'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/practical-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: practical-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test compiled correction entrance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build practical loam executable
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: loam
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Run compiled correction, effective, and integrity smoke check
        shell: bash
        run: |
          test -x .lake/build/bin/loam
          if grep -Fq 'lean --run' tools/loam; then
            echo 'practical wrapper must not invoke Lean frontend per action' >&2
            exit 1
          fi

          rm -rf scratch/dogfood
          mkdir -p scratch/dogfood
          memory_file="scratch/dogfood/memory.loam"
          correction_file="scratch/dogfood/corrections.loam"

          printf 'LOAM-EVENT-MEMORY\t1\nEVENT\tbad-record\nEFFECT\teffect-1\tスーパー\twallet\t1280\n' >"$memory_file"

          printf '4\n1\nwallet\n1280\n' | ./tools/loam | tee /tmp/loam-correction.out
          grep -Fq 'Correction recorded: 1280 jpy from wallet.' /tmp/loam-correction.out

          expected_memory=$'LOAM-EVENT-MEMORY\t1\nEVENT\tbad-record\nEFFECT\teffect-1\tスーパー\twallet\t1280\nEVENT\treplacement-1\nEFFECT\teffect-1\twallet\tjpy\t-1280'
          test "$(cat "$memory_file")" = "$expected_memory"

          expected_corrections=$'LOAM-EVENT-CORRECTION-MEMORY\t1\nCORRECTION\tcorrection-1\tbad-record\treplacement-1'
          test "$(cat "$correction_file")" = "$expected_corrections"

          printf '5\n' | ./tools/loam | tee /tmp/loam-effective.out
          grep -Fq 'Effective quantities (single-correction projection; zero coordinates omitted):' /tmp/loam-effective.out
          if grep -Fq 'スーパー:' /tmp/loam-effective.out; then
            echo 'ordinary effective view must omit zero coordinate' >&2
            exit 1
          fi
          grep -Fq 'wallet: -1280 jpy' /tmp/loam-effective.out

          printf '6\n' | ./tools/loam | tee /tmp/loam-integrity.out
          grep -Fq 'Correction correction-1' /tmp/loam-integrity.out
          grep -Fq 'bad-record -> replacement-1' /tmp/loam-integrity.out
          grep -Fq 'relation: closed' /tmp/loam-integrity.out
          grep -Fq 'スーパー: 1280 wallet' /tmp/loam-integrity.out
          grep -Fq 'wallet: -1280 jpy' /tmp/loam-integrity.out
          grep -Fq 'Projection law: original contribution excluded; replacement retained once' /tmp/loam-integrity.out
          grep -Fq 'Arithmetic balance: not asserted across different coordinates or measures' /tmp/loam-integrity.out
          grep -Fq 'All correction relations are closed.' /tmp/loam-integrity.out

          direct="$(.lake/build/bin/loam effective "$memory_file" "$correction_file")"
          grep -Fq 'wallet: -1280 jpy' <<<"$direct"

          # A source update may require one rebuild, but successful rebuild chatter
          # must not leak Lean linter warnings into the practical menu surface.
          touch Loam/EffectiveCli.lean
          printf '5\n' | ./tools/loam | tee /tmp/loam-rebuild.out
          grep -Fq 'Building LOAM...' /tmp/loam-rebuild.out
          if grep -Fq 'warning:' /tmp/loam-rebuild.out; then
            echo 'successful practical rebuild must keep Lean warnings out of the user surface' >&2
            exit 1
          fi
          grep -Fq 'wallet: -1280 jpy' /tmp/loam-rebuild.out
