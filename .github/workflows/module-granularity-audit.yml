name: Module granularity inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/module_granularity_audit.py"
      - "docs/research/MODULE_GRANULARITY_AUDIT.md"
      - "docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md"
      - "docs/research/MODULE_GRANULARITY_FIRST_PASS_CLOSURE_021.md"
      - "docs/research/MODULE_GRANULARITY_FRONTIER_017.md"
      - "docs/research/MODULE_GRANULARITY_REPORT_WINDOW_018.md"
      - "docs/research/MODULE_GRANULARITY_TRANSACTIONS_FLOW_019.md"
      - "docs/research/MODULE_GRANULARITY_TRANSACTIONS_FLOW_020.md"
      - "docs/research/TRANSACTIONS_FLOW_PANE_OBLIGATION_DAG.md"
      - "Loam/Application/CorrectionFrontier.lean"
      - "Loam/Application/CorrectionFrontierSemantics.lean"
      - "Loam/Application/CorrectionFrontierIndexed.lean"
      - "docs/research/AUDIT_GENERATION_3_CORRECTION_FRONTIER.md"
      - "docs/d2/correction_frontier_responsibility_topology.d2"
      - "Loam/Tui/Reports.lean"
      - "Loam/Tui/ReportsModel.lean"
      - "Loam/Tui/ReportsView.lean"
      - "Loam/Tui/ReportsSession.lean"
      - "Loam/Tui/CycleBudgetSession.lean"
      - "Loam/Tui/TransactionsFlowPane.lean"
      - "Loam/Tests/TuiTransactionsFlow.lean"
      - "docs/drakon/build_map.py"
      - "docs/drakon/build_tui_cli_granularity_audit_map.py"
      - "docs/drakon/build_tui_scheduled_session_audit_map.py"
      - "docs/drakon/loam-tui-scheduled-session-audit.drn"
      - "docs/drakon/build_tui_reports_granularity_audit_map.py"
      - "docs/drakon/loam-tui-reports-granularity-audit.drn"
      - "docs/drakon/build_tui_transactions_flow_granularity_audit_map.py"
      - "docs/drakon/loam-tui-transactions-flow-granularity-audit.drn"
      - ".github/workflows/module-granularity-audit.yml"

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 250

      - name: Build module inventory
        run: |
          python3 tools/module_granularity_audit.py \
            --history 200 \
            --tsv /tmp/loam-module-granularity.tsv \
            --dot /tmp/loam-module-imports.dot \
            --markdown /tmp/loam-module-granularity.md
          test -s /tmp/loam-module-granularity.tsv
          test -s /tmp/loam-module-imports.dot
          test -s /tmp/loam-module-granularity.md
          head -n 25 /tmp/loam-module-granularity.md

      - name: Build TUI CLI granularity DRAKON map
        run: |
          python3 docs/drakon/build_tui_cli_granularity_audit_map.py
          test -s docs/drakon/loam-tui-cli-granularity-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = "docs/drakon/loam-tui-cli-granularity-audit.drn"
          with sqlite3.connect(path) as db:
              assert db.execute("pragma integrity_check").fetchone()[0] == "ok"
              diagram_count = db.execute("select count(*) from diagrams").fetchone()[0]
              source_count = db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0]
              assert diagram_count > 0
              assert source_count == diagram_count
          PY

      - name: Qualify Scheduled session DRAKON map
        run: |
          python3 docs/drakon/build_tui_scheduled_session_audit_map.py
          test -s docs/drakon/loam-tui-scheduled-session-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = "docs/drakon/loam-tui-scheduled-session-audit.drn"
          with sqlite3.connect(path) as db:
              assert db.execute("pragma integrity_check").fetchone()[0] == "ok"
              diagram_count = db.execute("select count(*) from diagrams").fetchone()[0]
              source_count = db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0]
              assert diagram_count >= 4
              assert source_count == diagram_count
              assert db.execute("select count(*) from diagrams where name='MGA.015.2 Qualified Scheduled Completion Session Seam'").fetchone()[0] == 1
              assert db.execute("select count(*) from diagrams where name='MGA.016.1 Qualified Scheduled Continuation Coordinator'").fetchone()[0] == 1
          PY
          git diff --exit-code -- docs/drakon/loam-tui-scheduled-session-audit.drn

      - name: Qualify Reports granularity DRAKON map
        run: |
          python3 docs/drakon/build_tui_reports_granularity_audit_map.py
          test -s docs/drakon/loam-tui-reports-granularity-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = "docs/drakon/loam-tui-reports-granularity-audit.drn"
          with sqlite3.connect(path) as db:
              assert db.execute("pragma integrity_check").fetchone()[0] == "ok"
              diagram_count = db.execute("select count(*) from diagrams").fetchone()[0]
              source_count = db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0]
              assert diagram_count == 5
              assert source_count == diagram_count
              assert db.execute("select count(*) from diagrams where name='MGA.017.3 Candidate Seams'").fetchone()[0] == 1
              assert db.execute("select count(*) from diagrams where name='MGA.018.1 Qualified ReportWindow State Owner'").fetchone()[0] == 1
          PY
          git diff --exit-code -- docs/drakon/loam-tui-reports-granularity-audit.drn

      - name: Qualify Transactions Flow granularity DRAKON map
        run: |
          python3 docs/drakon/build_tui_transactions_flow_granularity_audit_map.py
          test -s docs/drakon/loam-tui-transactions-flow-granularity-audit.drn
          python3 - <<'PY'
          import sqlite3
          path = "docs/drakon/loam-tui-transactions-flow-granularity-audit.drn"
          with sqlite3.connect(path) as db:
              assert db.execute("pragma integrity_check").fetchone()[0] == "ok"
              diagram_count = db.execute("select count(*) from diagrams").fetchone()[0]
              source_count = db.execute("select count(*) from diagram_info where name='sources'").fetchone()[0]
              assert diagram_count == 4
              assert source_count == diagram_count
              assert db.execute("select count(*) from diagrams where name='MGA.019.2 Candidate TransactionsFlowPane Seam'").fetchone()[0] == 1
              assert db.execute("select count(*) from diagrams where name='MGA.019.3 Qualification Obligation DAG'").fetchone()[0] == 1
              assert db.execute("select count(*) from diagrams where name='MGA.020.1 Qualified TransactionsFlowPane State Owner'").fetchone()[0] == 1
          PY
          git diff --exit-code -- docs/drakon/loam-tui-transactions-flow-granularity-audit.drn

      - name: Upload descriptive inventory
        uses: actions/upload-artifact@v4
        with:
          name: module-granularity-inventory
          path: |
            /tmp/loam-module-granularity.tsv
            /tmp/loam-module-imports.dot
            /tmp/loam-module-granularity.md
            docs/drakon/loam-tui-cli-granularity-audit.drn
            docs/drakon/loam-tui-scheduled-session-audit.drn
            docs/drakon/loam-tui-reports-granularity-audit.drn
            docs/drakon/loam-tui-transactions-flow-granularity-audit.drn
