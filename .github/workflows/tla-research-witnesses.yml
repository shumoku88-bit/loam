  measure-scale-publication-order:
    name: TLA+ Measure scale publication order
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.cases), 'measure-scale-publication-order') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/tla-research-case
        with:
          case: measure-scale-publication-order

