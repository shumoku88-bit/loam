name: Experiment 245 Capacity Publication Topology

on:
  pull_request:
    paths:
      - 'experiments/Observation245CapacityPublicationTopology.tla'
      - 'experiments/245_capacity_publication_topology.md'
      - '.github/workflows/capacity-publication-topology-experiment.yml'
  push:
    branches:
      - 'experiment/245-capacity-publication-topology'
    paths:
      - 'experiments/Observation245CapacityPublicationTopology.tla'
      - 'experiments/245_capacity_publication_topology.md'
      - '.github/workflows/capacity-publication-topology-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apalache:
    name: Apalache Capacity topology comparison
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Apalache
        shell: bash
        run: |
          set -euo pipefail
          APALACHE_VERSION='0.62.2'
          ARCHIVE="apalache-${APALACHE_VERSION}.tgz"
          URL="https://github.com/apalache-mc/apalache/releases/download/v${APALACHE_VERSION}/${ARCHIVE}"
          EXPECTED_SHA256='765f610537281a0f25b8c30f2554f19523e2859c824e80e62276653ee23c10e2'

          curl --fail --location --retry 3 --output "/tmp/${ARCHIVE}" "$URL"
          printf '%s  %s\n' "$EXPECTED_SHA256" "/tmp/${ARCHIVE}" | sha256sum -c -

          mkdir -p /tmp/apalache-dist
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp/apalache-dist
          APALACHE_HOME="$(find /tmp/apalache-dist -mindepth 1 -maxdepth 1 -type d -name 'apalache-*' -print -quit)"
          test -n "$APALACHE_HOME"
          test -x "$APALACHE_HOME/bin/apalache-mc"
          printf 'APALACHE_HOME=%s\n' "$APALACHE_HOME" >> "$GITHUB_ENV"

      - name: Typecheck Capacity topology model
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" typecheck \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Prove split invariant starts true
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=Init \
            --next=SplitNext \
            --inv=SplitIndInv \
            --length=0 \
            --out-dir=/tmp/apalache-capacity-split-init \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Prove one split step preserves invariant
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=SplitIndInv \
            --next=SplitNext \
            --inv=SplitIndInv \
            --length=1 \
            --out-dir=/tmp/apalache-capacity-split-ind \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Prove split invariant implies activation safety
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=SplitIndInv \
            --next=SplitNext \
            --inv=SplitSafety \
            --length=0 \
            --out-dir=/tmp/apalache-capacity-split-safety \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Require split crash availability-loss witness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$("$APALACHE_HOME/bin/apalache-mc" check \
            --init=Init \
            --next=SplitNext \
            --inv=NoSplitCrashUnavailable \
            --length=5 \
            --out-dir=/tmp/apalache-capacity-split-unavailable \
            experiments/Observation245CapacityPublicationTopology.tla 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Eq 'state invariant [0-9]+ violated|counterexample' <<<"$output"

      - name: Require split blocked-restart witness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$("$APALACHE_HOME/bin/apalache-mc" check \
            --init=Init \
            --next=SplitNext \
            --inv=NoSplitBlockedRestart \
            --length=7 \
            --out-dir=/tmp/apalache-capacity-split-blocked \
            experiments/Observation245CapacityPublicationTopology.tla 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Eq 'state invariant [0-9]+ violated|counterexample' <<<"$output"

      - name: Prove atomic invariant starts true
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=Init \
            --next=AtomicNext \
            --inv=AtomicIndInv \
            --length=0 \
            --out-dir=/tmp/apalache-capacity-atomic-init \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Prove one atomic step preserves invariant
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=AtomicIndInv \
            --next=AtomicNext \
            --inv=AtomicIndInv \
            --length=1 \
            --out-dir=/tmp/apalache-capacity-atomic-ind \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Prove atomic invariant implies complete paired evidence
        shell: bash
        run: |
          set -euo pipefail
          "$APALACHE_HOME/bin/apalache-mc" check \
            --init=AtomicIndInv \
            --next=AtomicNext \
            --inv=AtomicSafety \
            --length=0 \
            --out-dir=/tmp/apalache-capacity-atomic-safety \
            experiments/Observation245CapacityPublicationTopology.tla

      - name: Require atomic crash then ordinary-retry completion witness
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$("$APALACHE_HOME/bin/apalache-mc" check \
            --init=Init \
            --next=AtomicNext \
            --inv=NoAtomicRecoveredCompletion \
            --length=7 \
            --out-dir=/tmp/apalache-capacity-atomic-recovery \
            experiments/Observation245CapacityPublicationTopology.tla 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Eq 'state invariant [0-9]+ violated|counterexample' <<<"$output"
