name: Observation 061

on:
  pull_request:
    paths:
      - 'experiments/061_resolution_split_publication_safe.pml'
      - 'experiments/061_resolution_split_publication_unsafe_writer.pml'
      - 'experiments/061_resolution_split_publication_unsafe_reader.pml'
      - 'experiments/061_resolution_split_publication.md'
      - '.github/workflows/resolution-split-publication-observation.yml'
  push:
    branches:
      - 'experiment/061-resolution-split-publication'
      - main
    paths:
      - 'experiments/061_resolution_split_publication_safe.pml'
      - 'experiments/061_resolution_split_publication_unsafe_writer.pml'
      - 'experiments/061_resolution_split_publication_unsafe_reader.pml'
      - 'experiments/061_resolution_split_publication.md'
      - '.github/workflows/resolution-split-publication-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spin:
    name: SPIN Resolution split publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install SPIN
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y spin
          spin -V

      - name: Verify stable-frontier candidate protocol
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/061_resolution_split_publication_safe.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'errors:[[:space:]]+0' <<<"$output"

      - name: Require Event-first writer counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/061_resolution_split_publication_unsafe_writer.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected an unsafe Resolution writer-order interleaving'
            exit 1
          fi

      - name: Require Resolution-first reader counterexample
        shell: bash
        run: |
          set -euo pipefail
          output="$(spin -run experiments/061_resolution_split_publication_unsafe_reader.pml 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Eq 'assertion violated|errors:[[:space:]]+[1-9][0-9]*' <<<"$output"
          if grep -Eq 'errors:[[:space:]]+0' <<<"$output"; then
            echo 'expected an unsafe Resolution reader-order interleaving'
            exit 1
          fi
