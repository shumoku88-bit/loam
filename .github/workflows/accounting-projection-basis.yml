name: Accounting Projection Basis

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Review/RoleFlowReview.lean'
      - 'Loam/Review/RoleBalanceReview.lean'
      - 'Loam/Review/RoleBalanceAnswerability.lean'
      - 'Loam/Cli/ExplainCli.lean'
      - 'Loam/Review/CurrentBalanceReview.lean'
      - 'Loam/Review/TransactionsFlowReview.lean'
      - 'Loam/Review/MultimeasureSpendReview.lean'
      - 'Loam/Review/BalanceReview.lean'
      - 'Loam/Review/HistoricalBalanceReview.lean'
      - 'Loam/Review/OpeningPositionReview.lean'
      - 'Loam/Core/BoundedHistorySupport.lean'
      - 'Loam/Application/CurrentQuantityAnchor.lean'
      - 'Loam/Application/CurrentQuantityPresence.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/CurrentQuantityAnchorCli.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Persistence/OpeningSupportPersistence.lean'
      - 'Loam/Persistence/CurrentQuantityAnchorPersistence.lean'
      - 'Loam/Persistence/BoundedHistorySupportPersistence.lean'
      - 'Loam/Persistence/CurrentQuantityPresencePersistence.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/ZeroOriginCoverage.lean'
      - 'Loam/Core/OpeningSupport.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/ZeroOriginQuantity.lean'
      - 'Loam/Tests/RoleFlowReview.lean'
      - 'Loam/Tests/MultimeasureSpendReview.lean'
      - 'Loam/Tests/RoleBalanceReview.lean'
      - 'Loam/Tests/RoleBalanceAnswerability.lean'
      - 'Loam/Tests/CurrentBalanceReview.lean'
      - 'Loam/Tests/HistoricalBalanceReview.lean'
      - 'Loam/Tests/OpeningPositionReview.lean'
      - 'Loam/Tests/CurrentQuantityAnchor.lean'
      - 'Loam/Tests/CurrentQuantityPresence.lean'
      - 'Loam/Tests/CurrentQuantityAnchorCli.lean'
      - 'tools/loam'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/accounting-projection-basis.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Review/RoleFlowReview.lean'
      - 'Loam/Review/RoleBalanceReview.lean'
      - 'Loam/Review/RoleBalanceAnswerability.lean'
      - 'Loam/Cli/ExplainCli.lean'
      - 'Loam/Review/CurrentBalanceReview.lean'
      - 'Loam/Review/TransactionsFlowReview.lean'
      - 'Loam/Review/MultimeasureSpendReview.lean'
      - 'Loam/Review/BalanceReview.lean'
      - 'Loam/Review/HistoricalBalanceReview.lean'
      - 'Loam/Review/OpeningPositionReview.lean'
      - 'Loam/Core/BoundedHistorySupport.lean'
      - 'Loam/Application/CurrentQuantityAnchor.lean'
      - 'Loam/Application/CurrentQuantityPresence.lean'
      - 'Loam/Publisher/CurrentQuantityAnchorPublisher.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/CurrentQuantityAnchorCli.lean'
      - 'Loam/Persistence/AccountingRolePersistence.lean'
      - 'Loam/Persistence/OpeningSupportPersistence.lean'
      - 'Loam/Persistence/CurrentQuantityAnchorPersistence.lean'
      - 'Loam/Persistence/BoundedHistorySupportPersistence.lean'
      - 'Loam/Persistence/CurrentQuantityPresencePersistence.lean'
      - 'Loam/Persistence/NormalizedActualPersistence.lean'
      - 'Loam/Core/AccountingRole.lean'
      - 'Loam/Core/ZeroOriginCoverage.lean'
      - 'Loam/Core/OpeningSupport.lean'
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Application/ZeroOriginQuantity.lean'
      - 'Loam/Tests/RoleFlowReview.lean'
      - 'Loam/Tests/MultimeasureSpendReview.lean'
      - 'Loam/Tests/RoleBalanceReview.lean'
      - 'Loam/Tests/RoleBalanceAnswerability.lean'
      - 'Loam/Tests/CurrentBalanceReview.lean'
      - 'Loam/Tests/HistoricalBalanceReview.lean'
      - 'Loam/Tests/OpeningPositionReview.lean'
      - 'Loam/Tests/CurrentQuantityAnchor.lean'
      - 'Loam/Tests/CurrentQuantityPresence.lean'
      - 'Loam/Tests/CurrentQuantityAnchorCli.lean'
      - 'tools/loam'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/accounting-projection-basis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-projection-basis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Qualify shared role flow and balance composition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build accounting projection basis
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Review.RoleFlowReview Loam.Review.CurrentBalanceReview Loam.Review.HistoricalBalanceReview Loam.Review.OpeningPositionReview Loam.Review.RoleBalanceReview Loam.Review.RoleBalanceAnswerability Loam.Cli.ExplainCli Loam.Review.MultimeasureSpendReview Loam.Publisher.CurrentQuantityAnchorPublisher Loam.Application.CurrentQuantityPresence Loam.Persistence.CurrentQuantityPresencePersistence Loam.Cli
      - name: Check practical wrapper syntax
        run: bash -n tools/loam
      - name: Qualify role-aware flow composition
        run: lake env lean --run Loam/Tests/RoleFlowReview.lean
      - name: Qualify neutral current balance composition
        run: lake env lean --run Loam/Tests/CurrentBalanceReview.lean
      - name: Qualify role-aware balance composition
        run: lake env lean --run Loam/Tests/RoleBalanceReview.lean
      - name: Qualify shared balance answerability explanation
        run: lake env lean --run Loam/Tests/RoleBalanceAnswerability.lean
      - name: Qualify bounded historical balance reconstruction
        run: lake env lean --run Loam/Tests/HistoricalBalanceReview.lean
      - name: Qualify derived accounting opening position
        run: lake env lean --run Loam/Tests/OpeningPositionReview.lean
      - name: Qualify Measure-neutral spending window
        run: lake env lean --run Loam/Tests/MultimeasureSpendReview.lean
      - name: Qualify current quantity anchor composition
        run: lake env lean --run Loam/Tests/CurrentQuantityAnchor.lean
      - name: Qualify current quantity presence composition
        run: lake env lean --run Loam/Tests/CurrentQuantityPresence.lean
      - name: Qualify current quantity anchor CLI boundary
        run: lake env lean --run Loam/Tests/CurrentQuantityAnchorCli.lean
