      - 'Loam/Tests/HouseholdOpeningSupportAdapter.lean'
      - 'Loam/Tests/HouseholdCurrentSupportAuthority.lean'
      - 'Loam/Tests/HistoricalBalanceReview.lean'
      - 'Loam/Tests/OpeningPositionReview.lean'
      - 'Loam/Tests/CurrentQuantityAnchor.lean'
      - 'Loam/Tests/Support.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'Loam/Tests/CurrentQuantityPresence.lean'
      - 'Loam/Tests/CurrentQuantityAnchorCli.lean'
      - 'tools/loam'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - '.github/workflows/accounting-projection-basis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-projection-basis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Qualify shared role flow and balance composition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build accounting projection basis
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Authority.OpeningSupportAuthority Loam.Authority.CurrentSupportAuthority Loam.Review.RoleFlowReview Loam.Review.CurrentBalanceReview Loam.Review.HistoricalBalanceReview Loam.Review.OpeningPositionReview Loam.Review.RoleBalanceReview Loam.Review.RoleBalanceAnswerability Loam.Cli.ExplainCli Loam.Review.MultimeasureSpendReview Loam.Publisher.CurrentQuantityAnchorPublisher Loam.Application.CurrentQuantityPresence Loam.Persistence.CurrentQuantityPresencePersistence Loam.Tests.Support Loam.Cli
      - name: Check practical wrapper syntax
        run: bash -n tools/loam
      - name: Run package test driver
        run: lake test -- accounting
