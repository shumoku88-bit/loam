name: Lean Application

on:
  pull_request:
    paths:
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  push:
    paths:
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lean application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build application, umbrella, observer, and Movement publisher
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Loam.Application Loam Loam.MovementPublisher loamHouseholdObservation
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Qualify sparse Movement publication
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/sparse-movement"
          lake env lean --run Loam/Tests/SparseMovementPublication.lean "$fixture"
