name: Lean Application

on:
  pull_request:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Persistence/HouseholdImagePersistence.lean'
      - 'Loam/Authority/HouseholdAuthority.lean'
      - 'Loam/Tests/HouseholdAuthority.lean'
      - 'Loam/Tests/HouseholdImagePersistence.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - 'Loam/Tests/IncrementalDailyDelta.lean'
      - 'Loam/Tests/IncrementalCorrectedFrontier.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Application/ExchangeAdmission.lean'
      - 'Loam/Publisher/ExchangePublisher.lean'
      - 'Loam/Publisher/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/HouseholdObservation.lean'
      - 'Loam/Cli/ActualObservationCli.lean'
      - 'Loam/Tests/ActualObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  push:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Persistence/HouseholdImagePersistence.lean'
      - 'Loam/Authority/HouseholdAuthority.lean'
      - 'Loam/Tests/HouseholdAuthority.lean'
      - 'Loam/Tests/HouseholdImagePersistence.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - 'Loam/Tests/IncrementalDailyDelta.lean'
      - 'Loam/Tests/IncrementalCorrectedFrontier.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Application/ExchangeAdmission.lean'
      - 'Loam/Publisher/ExchangePublisher.lean'
      - 'Loam/Publisher/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/HouseholdObservation.lean'
      - 'Loam/Cli/ActualObservationCli.lean'
      - 'Loam/Tests/ActualObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lean application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build application, umbrella, observer, and Movement publisher
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Application Loam Loam.Cli.ActualObservationCli Loam.Publisher.MovementPublisher Loam.Application.ExchangeAdmission Loam.Publisher.ExchangePublisher Loam.Publisher.OriginalAmountMovementPublisher Loam.HouseholdCommand loam Loam.Tests.ActualWorldFixture

      - name: Run application package test group
        run: lake test -- application

      - name: Prove incremental daily delta law
        run: |
          lake build Loam.Tests.IncrementalDailyDelta
          lake env lean Loam/Tests/IncrementalDailyDelta.lean
          lake env lean Loam/Tests/IncrementalCorrectedFrontier.lean

      - name: Qualify HOBS1 cycle funding diagnostics
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/hobs1-funding"
          lake env lean --run Loam/Tests/CycleBudgetReview.lean "$fixture"
          printf 'food-plan\t2026-08-15\t1\tcash\tfood\n' > "$fixture/config/scheduled-coverage.tsv"
          output="$fixture/current.hobs1"
          .lake/build/bin/loam household-observation \
            "$fixture" 2026-08-14 2026-10-15 2026-09-08 > "$output"
          # Synthetic fixture only: expose the exact HOBS1 rows on assertion
          # failure, not just grep's silent exit status.
          assert_hobs1_line() {
            local file="$1" expected="$2"
            if ! grep -Fqx "$expected" "$file"; then
              echo "::error::HOBS1 missing exact expected line: $(printf %q "$expected")" >&2
              echo "::group::Synthetic HOBS1 actual rows" >&2
              cat "$file" >&2
              echo "::endgroup::" >&2
              return 1
            fi
          }
          assert_hobs1_line "$output" "$(printf 'HOBS1\tmeta\tfunding_observed_at\t2026-09-08')"
          assert_hobs1_line "$output" "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tjpy\t0')"
          assert_hobs1_line "$output" "$(printf 'HOBS1\tscalar\tfunding\tremaining_assigned\tjpy\t100')"
          assert_hobs1_line "$output" "$(printf 'HOBS1\tscalar\tfunding\tresidual_before_unresolved\tjpy\t-100')"
          assert_hobs1_line "$output" "$(printf 'HOBS1\tdiagnostic\tcurrent-coverage\tfood\tjpy\t100\t0\t0\t100\t100')"
          assert_hobs1_line "$output" "$(printf 'HOBS1\tdiagnostic\tscheduled-plan\tfood-plan\t2026-08-15\t1\t2026-10')"
          # scheduled-cell includes BOTH explicit occurrence days and completion days.
          # Even when absent, each independently emits '-'.
          assert_hobs1_line "$output" "$(printf 'HOBS1\tdiagnostic\tscheduled-cell\tfood-plan\t2026-10\texpected\t0\t-\t-')"
          assert_hobs1_line <(tail -n 1 "$output") "$(printf 'HOBS1\tmeta\tstatus\tcomplete')"
          printf 'cash\tusd\n' > "$fixture/config/cycle-funding.tsv"
          usd_output="$fixture/current-usd.hobs1"
          LOAM_MEASURE=usd .lake/build/bin/loam household-observation \
            "$fixture" 2026-08-14 2026-10-15 2026-09-08 > "$usd_output"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tbudget\tfood\tusd\t40\t0\t40')"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tcapacity\tpurpose\tfood\tusd\t40')"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tusd\t250')"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tscalar\tfunding\tremaining_assigned\tusd\t40')"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tscalar\tfunding\tresidual_before_unresolved\tusd\t210')"
          assert_hobs1_line "$usd_output" "$(printf 'HOBS1\tdiagnostic\tcurrent-coverage\tfood\tusd\t40\t0\t0\t40\t40')"
          ! grep -F "$(printf 'HOBS1\tbudget\tfood\tjpy')" "$usd_output"
          ! grep -F "$(printf 'HOBS1\tcapacity\tpurpose\tfood\tjpy')" "$usd_output"
          ! grep -F "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tjpy')" "$usd_output"
          assert_hobs1_line <(tail -n 1 "$usd_output") "$(printf 'HOBS1\tmeta\tstatus\tcomplete')"
