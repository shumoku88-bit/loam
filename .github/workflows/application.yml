name: Lean Application

on:
  pull_request:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/ExchangeAdmission.lean'
      - 'Loam/ExchangePublisher.lean'
      - 'Loam/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  push:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/MovementPublisher.lean'
      - 'Loam/ExchangeAdmission.lean'
      - 'Loam/ExchangePublisher.lean'
      - 'Loam/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli/HouseholdObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lean application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build application, umbrella, observer, and Movement publisher
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Application Loam Loam.MovementPublisher Loam.ExchangeAdmission Loam.ExchangePublisher Loam.OriginalAmountMovementPublisher Loam.HouseholdCommand loamHouseholdObservation Loam.Tests.ActualWorldFixture

      - name: Qualify household path composition
        run: lake env lean --run Loam/Tests/HouseholdPaths.lean

      - name: Qualify sparse Movement publication
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/sparse-movement"
          lake env lean --run Loam/Tests/SparseMovementPublication.lean "$fixture"

      - name: Qualify atomic multimeasure recording publication
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/multimeasure-recording"
          lake env lean --run Loam/Tests/MultimeasureRecordingPublishers.lean "$fixture"
