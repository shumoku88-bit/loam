name: Lean Application

on:
  pull_request:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Application/ExchangeAdmission.lean'
      - 'Loam/Publisher/ExchangePublisher.lean'
      - 'Loam/Publisher/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/HouseholdObservation.lean'
      - 'Loam/Cli/ActualObservationCli.lean'
      - 'Loam/Tests/ActualObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  push:
    paths:
      - 'Loam/HouseholdPaths.lean'
      - 'Loam/Tests/HouseholdPaths.lean'
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Application/**'
      - 'Loam/Application.lean'
      - 'Loam/Publisher/MovementPublisher.lean'
      - 'Loam/Application/ExchangeAdmission.lean'
      - 'Loam/Publisher/ExchangePublisher.lean'
      - 'Loam/Publisher/OriginalAmountMovementPublisher.lean'
      - 'Loam/HouseholdCommand.lean'
      - 'Loam/Tests/MultimeasureRecordingPublishers.lean'
      - 'Loam/Tests/SparseMovementPublication.lean'
      - 'Loam/Cli.lean'
      - 'Loam/Cli/HouseholdObservation.lean'
      - 'Loam/Cli/ActualObservationCli.lean'
      - 'Loam/Tests/ActualObservationCli.lean'
      - 'Loam.lean'
      - 'lean-toolchain'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - 'lakefile.lean'
      - '.github/workflows/application.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Lean application boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build application, umbrella, observer, and Movement publisher
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Application Loam Loam.Cli.ActualObservationCli Loam.Publisher.MovementPublisher Loam.Application.ExchangeAdmission Loam.Publisher.ExchangePublisher Loam.Publisher.OriginalAmountMovementPublisher Loam.HouseholdCommand loam Loam.Tests.ActualWorldFixture

      - name: Run application package test group
        run: lake test -- application

      - name: Qualify HOBS1 cycle funding diagnostics
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)/hobs1-funding"
          lake env lean --run Loam/Tests/CycleBudgetReview.lean "$fixture"
          printf 'food-plan\t2026-08-15\t1\tcash\tfood\n' > "$fixture/config/scheduled-coverage.tsv"
          output="$fixture/current.hobs1"
          .lake/build/bin/loam household-observation \
            "$fixture" 2026-08-14 2026-10-15 2026-09-08 > "$output"
          grep -Fqx "$(printf 'HOBS1\tmeta\tfunding_observed_at\t2026-09-08')" "$output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tjpy\t0')" "$output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tremaining_assigned\tjpy\t100')" "$output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tresidual_before_unresolved\tjpy\t-100')" "$output"
          grep -Fqx "$(printf 'HOBS1\tdiagnostic\tcurrent-coverage\tfood\tjpy\t100\t0\t0\t100\t100')" "$output"
          grep -Fqx "$(printf 'HOBS1\tdiagnostic\tscheduled-plan\tfood-plan\t2026-08-15\t1\t2026-10')" "$output"
          grep -Fqx "$(printf 'HOBS1\tdiagnostic\tscheduled-cell\tfood-plan\t2026-10\texpected\t0\t-')" "$output"
          grep -Fqx "$(printf 'HOBS1\tmeta\tstatus\tcomplete')" <(tail -n 1 "$output")
          printf 'cash\tusd\n' > "$fixture/config/cycle-funding.tsv"
          usd_output="$fixture/current-usd.hobs1"
          LOAM_MEASURE=usd .lake/build/bin/loam household-observation \
            "$fixture" 2026-08-14 2026-10-15 2026-09-08 > "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tbudget\tfood\tusd\t40\t0\t40')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tcapacity\tpurpose\tfood\tusd\t40')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tusd\t250')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tremaining_assigned\tusd\t40')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tscalar\tfunding\tresidual_before_unresolved\tusd\t210')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tdiagnostic\tcurrent-coverage\tfood\tusd\t40\t0\t0\t40\t40')" "$usd_output"
          ! grep -F "$(printf 'HOBS1\tbudget\tfood\tjpy')" "$usd_output"
          ! grep -F "$(printf 'HOBS1\tcapacity\tpurpose\tfood\tjpy')" "$usd_output"
          ! grep -F "$(printf 'HOBS1\tscalar\tfunding\tbudgetable_backing\tjpy')" "$usd_output"
          grep -Fqx "$(printf 'HOBS1\tmeta\tstatus\tcomplete')" <(tail -n 1 "$usd_output")
