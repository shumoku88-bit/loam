name: Scheduled Lifecycle Qualifications

on:
  pull_request:
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Publisher/ScheduledCreationPublisher.lean'
      - 'Loam/Publisher/ScheduledReplacementPublisher.lean'
      - 'Loam/Publisher/ScheduledTerminalPublisher.lean'
      - 'Loam/Review/ScheduledReview.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/MovementAdmission.lean'
      - 'Loam/Application/MovementWorldAdapter.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/MovementWorldLoader.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledLifecyclePersistence.lean'
      - 'Loam/Tests/ScheduledCreationPublisher.lean'
      - 'Loam/Tests/ScheduledReplacementPublisher.lean'
      - 'Loam/Tests/ScheduledTerminalPublisher.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/scheduled-lifecycle.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  push:
    branches:
      - main
      - feat/tui
    paths:
      - '.github/actions/lean-build/**'
      - 'Loam/Tests/ActualWorldFixture.lean'
      - 'Loam/Publisher/ScheduledCreationPublisher.lean'
      - 'Loam/Publisher/ScheduledReplacementPublisher.lean'
      - 'Loam/Publisher/ScheduledTerminalPublisher.lean'
      - 'Loam/Review/ScheduledReview.lean'
      - 'Loam/Authority/ActualAuthority.lean'
      - 'Loam/Application/ScheduledInspection.lean'
      - 'Loam/Application/MovementAdmission.lean'
      - 'Loam/Application/MovementWorldAdapter.lean'
      - 'Loam/Application/ActualValidityFrontier.lean'
      - 'Loam/MovementWorldLoader.lean'
      - 'Loam/Persistence/ScheduledLifecyclePersistence.lean'
      - 'Loam/Persistence/ScheduledPersistence.lean'
      - 'Loam/Tests/ScheduledLifecyclePersistence.lean'
      - 'Loam/Tests/ScheduledCreationPublisher.lean'
      - 'Loam/Tests/ScheduledReplacementPublisher.lean'
      - 'Loam/Tests/ScheduledTerminalPublisher.lean'
      - 'tests/TestDriver.lean'
      - 'tools/test-product'
      - '.github/workflows/scheduled-lifecycle.yml'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify Scheduled lifecycle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Lean and build shared Scheduled lifecycle dependencies
        uses: ./.github/actions/lean-build
        with:
          build-args: Loam.Persistence.ScheduledLifecyclePersistence Loam.Publisher.ScheduledCreationPublisher Loam.Publisher.ScheduledReplacementPublisher Loam.Publisher.ScheduledTerminalPublisher Loam.Review.ScheduledReview Loam.Review.ActualReview Loam.Tests.ActualWorldFixture Loam.MovementWorldLoader

      - name: Run Scheduled lifecycle package test group
        run: lake test -- scheduled-lifecycle
