name: Observation 081

on:
  pull_request:
    paths:
      - 'model/081_formal_result_reuse_context.als'
      - 'experiments/081_formal_result_reuse_context.md'
      - '.github/workflows/formal-result-reuse-observation.yml'
  push:
    branches:
      - 'experiment/081-formal-result-reuse-context'
      - main
    paths:
      - 'model/081_formal_result_reuse_context.als'
      - 'experiments/081_formal_result_reuse_context.md'
      - '.github/workflows/formal-result-reuse-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse-context:
    name: Retained result and later-use context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Alloy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/alloy.tar.gz \
            https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/alloy-6.2.0-linux-amd64.tar.gz
          mkdir -p /tmp/alloy
          tar -xzf /tmp/alloy.tar.gz -C /tmp/alloy
          ALLOY_JAR="$(find /tmp/alloy -type f -name 'org.alloytools.alloy.dist.jar' -print -quit)"
          test -n "$ALLOY_JAR"
          printf 'ALLOY_JAR=%s\n' "$ALLOY_JAR" >> "$GITHUB_ENV"
          java -jar "$ALLOY_JAR" version

      - name: Run Observation 081 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alloy-output
          java -jar "$ALLOY_JAR" exec -f -s sat4j \
            -o /tmp/alloy-output \
            model/081_formal_result_reuse_context.als

      - name: Require applicability boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/alloy-output/receipt.json').read_text())
          commands = receipt['commands']

          expected_sat = {
              'currentPracticalBoundary': True,
              'RetainedKnowledgeAloneDeterminesReuse': True,
              'RetainedKnowledgeAndShapeDetermineReuse': False,
          }

          wrong = []
          for name, want_sat in expected_sat.items():
              solutions = commands.get(name, {}).get('solution', [])
              is_sat = bool(solutions)
              label = 'SAT' if is_sat else 'UNSAT'
              print(f'{name}: {label}')
              if is_sat != want_sat:
                  wrong.append((name, label, want_sat))

          if wrong:
              raise SystemExit(f'unexpected Observation 081 receipt: {wrong}')
          PY

      - name: Record narrow interpretation
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Observation 081 receipt
          currentPracticalBoundary: SAT
            meaning: one retained knowledge bundle can support zero/single correction reuse while multiple corrections remain unsupported
          RetainedKnowledgeAloneDeterminesReuse: SAT counterexample
            meaning: retained prior knowledge alone does not determine later applicability
          RetainedKnowledgeAndShapeDetermineReuse: UNSAT counterexample in this model
            meaning: the modeled later correction shape restores the narrow decision, without claiming a universal reuse schema
          EOF
