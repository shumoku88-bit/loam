name: Normalized Actual Wire

on:
  push:
    branches:
      - experiment/normalized-actual-wire
  pull_request:
    paths:
      - 'tools/normalized_actual.py'
      - 'tools/test_normalized_actual.py'
      - '.github/workflows/normalized-actual-wire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: Normalized Actual synthetic qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run normalized Actual semantic and publication checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_normalized_actual.py
          python3 -m py_compile tools/normalized_actual.py tools/test_normalized_actual.py
