name: MGA-010 Record session extraction

on:
  push:
    branches:
      - audit/mga-010-record-session
    paths:
      - '.github/workflows/mga-010-record-session-once.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Record terminal session boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli_path = Path('Loam/Tui/Cli.lean')
          cli = cli_path.read_text()

          import_anchor = 'import Loam.Tui.Record\n'
          session_import = 'import Loam.Tui.RecordSession\n'
          if session_import not in cli:
              if import_anchor not in cli:
                  raise SystemExit('Record import anchor not found')
              cli = cli.replace(import_anchor, import_anchor + session_import, 1)

          start_marker = '''/-- A Record session emits one explicit publication intent at most.
          The caller reloads canonical evidence and chooses the presentation destination. -/
          partial def recordLoop'''
          end_marker = '''/-- A Correction session emits one target-bound replacement intent at most.'''
          start = cli.find(start_marker)
          if start < 0:
              raise SystemExit('recordLoop start marker not found')
          end = cli.find(end_marker, start)
          if end < 0:
              raise SystemExit('recordLoop end marker not found')
          cli = cli[:start] + cli[end:]

          old_call = 'recordLoop bounds root world known editor editorFrame'
          call_count = cli.count(old_call)
          if call_count == 0:
              raise SystemExit('no production recordLoop call sites found')
          cli = cli.replace(
              old_call,
              'Loam.Tui.RecordSession.run bounds root world known editor editorFrame'
          )
          if 'recordLoop' in cli:
              raise SystemExit('residual recordLoop reference remains in Tui.Cli')
          cli_path.write_text(cli)

          session = '''import Loam.HouseholdCommand
          import Loam.Tui.Kernel
          import Loam.Tui.Record
          import Loam.Tui.Runtime
          import Loam.Tui.Terminal

          namespace Loam.Tui.RecordSession

          open Loam.Tui.Kernel
          open Loam.Tui.Runtime

          set_option autoImplicit false

          /-!
          # Record terminal session

          `Record` owns presentation state, validation, and local transition logic.
          This module owns the terminal/effect shell for one Record editor session:
          read one key at a time, redraw the editor, and delegate the single durable
          publication intent to `HouseholdCommand.record`.

          It owns no household authority. The caller remains responsible for loading
          the selected world before the session and reloading canonical evidence after
          a successful publication.
          -/

          /-- Run one Record editor session and return its human-facing completion notice. -/
          partial def run
              (bounds : Bounds) (root : System.FilePath)
              (world : Loam.MovementAdmission.World) (known : List String)
              (state : Loam.Tui.Record.State) (frame : CompiledWidget) : IO String := do
            let step := Loam.Tui.Record.update world known state (← Loam.Tui.Terminal.readKey)
            if step.cancel then return "Record cancelled."
            match step.publish with
            | some draft =>
                match ← Loam.HouseholdCommand.record root draft with
                | .ok eventId => return "Recorded " ++ eventId.token ++ "."
                | .error message =>
                    let next := { step.state with mode := Loam.Tui.Record.Mode.editing, notice := message }
                    let nextFrame := compileWidget (Loam.Tui.Record.view known next)
                    Loam.Tui.Terminal.emitDirtyDiff bounds 0 0 frame nextFrame
                    run bounds root world known next nextFrame
            | none =>
                let nextFrame := compileWidget (Loam.Tui.Record.view known step.state)
                Loam.Tui.Terminal.emitDirtyDiff bounds 0 0 frame nextFrame
                run bounds root world known step.state nextFrame

          end Loam.Tui.RecordSession
          '''
          # Remove YAML indentation intentionally embedded above.
          import textwrap
          Path('Loam/Tui/RecordSession.lean').write_text(textwrap.dedent(session))

          ledger_path = Path('docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md')
          ledger = ledger_path.read_text()
          heading = '## MGA-010 — `Loam.Tui.RecordSession` focused extraction'
          if heading not in ledger:
              ledger += '''

          ## MGA-010 — `Loam.Tui.RecordSession` focused extraction

          Classification: **SPLIT_CANDIDATE — IMPLEMENTATION EXPERIMENT**

          MGA-009 found that `Loam.Tui.Cli` mixes root navigation/orchestration with
          several object-local terminal editor loops. `Record` is the first narrow
          experiment because neighboring TUI features already demonstrate a stable
          presentation-module / terminal-session seam.

          This slice moves only the Record key-read/redraw/publication loop into
          `Loam.Tui.RecordSession`. `Loam.Tui.Record` continues to own editor state,
          validation, transitions, and view; `HouseholdCommand.record` continues to own
          the production write entrance; `Tui.Cli` continues to load/reload canonical
          evidence and choose the destination surface.

          The experiment earns a KEEP/SPLIT verdict only if focused Production TUI and
          compression qualification pass and the resulting dependency direction remains
          `Cli -> RecordSession -> Record + HouseholdCommand`, without introducing a
          second semantic or authority boundary.
          '''
              ledger_path.write_text(textwrap.dedent(ledger))

          print(f'replaced {call_count} Record session call site(s)')
          PY

          git rm .github/workflows/mga-010-record-session-once.yml
          git diff --check
          test -s Loam/Tui/RecordSession.lean
          grep -q 'import Loam.Tui.RecordSession' Loam/Tui/Cli.lean
          ! grep -q 'partial def recordLoop' Loam/Tui/Cli.lean

      - name: Commit focused extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loam/Tui/Cli.lean Loam/Tui/RecordSession.lean docs/research/MODULE_GRANULARITY_AUDIT_LEDGER.md .github/workflows/mga-010-record-session-once.yml
          git commit -m 'refactor(tui): extract Record terminal session boundary'
          git push
