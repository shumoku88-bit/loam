name: Non-household Core probe

on:
  pull_request:
    paths:
      - 'Loam/Examples/PhysicalInventory.lean'
      - 'Loam/Examples/ScientificObservation.lean'
      - 'Loam/Examples/ScientificFutureContext.lean'
      - 'Loam/Examples/DocumentProvenanceBoundary.lean'
      - 'Loam/Examples/DocumentProvenanceFutureContext.lean'
      - 'Loam/Examples/PersonalSemanticMemory.lean'
      - 'Loam/Examples/PersonalSemanticMemoryPersistence.lean'
      - 'Loam/Cli/PersonalMemoryCli.lean'
      - '.github/workflows/non-household-core-probe.yml'
      - 'Loam/Core/Quantity.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  non-household-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check non-household Core probes
        run: |
          lake env lean Loam/Examples/PhysicalInventory.lean
          lake env lean Loam/Examples/ScientificObservation.lean
          lake env lean Loam/Examples/ScientificFutureContext.lean
          lake env lean Loam/Examples/DocumentProvenanceBoundary.lean
          lake env lean Loam/Examples/DocumentProvenanceFutureContext.lean
          lake env lean Loam/Examples/PersonalSemanticMemory.lean
          lake build Loam.Examples.PersonalSemanticMemory
          lake env lean Loam/Examples/PersonalSemanticMemoryPersistence.lean
          lake build loamMemory

          unset LOAM_MEMORY_FILE
          if missing_env_output="$(lake exe loamMemory init 2>&1)"; then
            echo "init unexpectedly succeeded without a memory path" >&2
            exit 1
          fi
          echo "$missing_env_output" | grep -F "LOAM_MEMORY_FILE is not set"

          memory_file="$(mktemp)"
          rm "$memory_file"
          export LOAM_MEMORY_FILE="$memory_file"
          lake exe loamMemory init
          lake exe loamMemory remember memory:editor "editor preference: nvim"
          test "$(lake exe loamMemory recall memory:editor)" = "editor preference: nvim"
          lake exe loamMemory correct memory:editor memory:editor-2 "editor preference: nvim; configuration may evolve"
          test "$(lake exe loamMemory recall memory:editor)" = "editor preference: nvim"
          test "$(lake exe loamMemory recall memory:editor-2)" = "editor preference: nvim; configuration may evolve"
          if lake exe loamMemory remember memory:editor "overwrite attempt"; then
            echo "duplicate remember unexpectedly succeeded" >&2
            exit 1
          fi

          explicit_file="$(mktemp)"
          rm "$explicit_file"
          lake exe loamMemory init "$explicit_file"
          lake exe loamMemory remember "$explicit_file" memory:explicit "explicit path wins"
          test "$(lake exe loamMemory recall "$explicit_file" memory:explicit)" = "explicit path wins"
          if lake exe loamMemory recall memory:explicit; then
            echo "explicit-path fact leaked into LOAM_MEMORY_FILE target" >&2
            exit 1
          fi
