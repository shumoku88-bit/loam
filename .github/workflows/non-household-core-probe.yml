name: Non-household Core probe

on:
  pull_request:
    paths:
      - 'Loam/Examples/PhysicalInventory.lean'
      - 'Loam/Examples/ScientificObservation.lean'
      - 'Loam/Examples/DocumentProvenanceBoundary.lean'
      - 'Loam/Examples/PersonalSemanticMemory.lean'
      - 'Loam/Examples/PersonalSemanticMemoryPersistence.lean'
      - 'Loam/Cli/PersonalMemoryCli.lean'
      - '.github/workflows/non-household-core-probe.yml'
      - 'Loam/Core/Quantity.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:

jobs:
  non-household-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true
      - name: Check non-household Core probes
        run: |
          lake env lean Loam/Examples/PhysicalInventory.lean
          lake env lean Loam/Examples/ScientificObservation.lean
          lake env lean Loam/Examples/DocumentProvenanceBoundary.lean
          lake env lean Loam/Examples/PersonalSemanticMemory.lean
          lake build Loam.Examples.PersonalSemanticMemory
          lake env lean Loam/Examples/PersonalSemanticMemoryPersistence.lean
          lake build loamMemory
          memory_file="$(mktemp)"
          rm "$memory_file"
          lake exe loamMemory -- init "$memory_file"
          lake exe loamMemory -- remember "$memory_file" memory:editor "editor preference: nvim"
          test "$(lake exe loamMemory -- recall "$memory_file" memory:editor)" = "editor preference: nvim"
          lake exe loamMemory -- correct "$memory_file" memory:editor memory:editor-2 "editor preference: nvim; configuration may evolve"
          test "$(lake exe loamMemory -- recall "$memory_file" memory:editor)" = "editor preference: nvim"
          test "$(lake exe loamMemory -- recall "$memory_file" memory:editor-2)" = "editor preference: nvim; configuration may evolve"
          if lake exe loamMemory -- remember "$memory_file" memory:editor "overwrite attempt"; then
            echo "duplicate remember unexpectedly succeeded" >&2
            exit 1
          fi
