name: Structural S008

on:
  pull_request:
    paths:
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Observations/StructuralS008.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/structural_s008_correction_chain_length.md'
      - '.github/workflows/structural-s008-correction-chain-length.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'experiment/structural-s008-correction-chain-length'
      - main
    paths:
      - 'Loam/Application/CorrectionFrontier.lean'
      - 'Loam/Observations/StructuralS008.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/EventCorrectionMemory.lean'
      - 'Loam/Core/EventCorrection.lean'
      - 'Loam/Core/EventMemory.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/structural_s008_correction_chain_length.md'
      - '.github/workflows/structural-s008-correction-chain-length.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correction-chain-length:
    name: Lean structural S008 correction-chain length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check structural S008
        run: lake build Loam.Observations.StructuralS008
