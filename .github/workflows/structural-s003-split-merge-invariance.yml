name: Structural S003

on:
  pull_request:
    paths:
      - 'Loam/Observations/StructuralS003.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/structural_s003_split_merge_invariance.md'
      - '.github/workflows/structural-s003-split-merge-invariance.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  push:
    branches:
      - 'chore/structural-s003-namespace'
      - main
    paths:
      - 'Loam/Observations/StructuralS003.lean'
      - 'Loam/Observations.lean'
      - 'Loam/Core/Event.lean'
      - 'Loam/Core/Effect.lean'
      - 'Loam/Core/Measure.lean'
      - 'Loam/Core/Quantity.lean'
      - 'experiments/structural_s003_split_merge_invariance.md'
      - '.github/workflows/structural-s003-split-merge-invariance.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-s003:
    name: Lean structural S003 split / merge invariance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          axiom-audit: false
          use-github-cache: true

      - name: Check structural S003
        run: lake build Loam.Observations.StructuralS003
