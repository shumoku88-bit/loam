name: Build LOAM Lean surface
description: Apply the shared Lean build-only qualification settings

inputs:
  build-args:
    description: Lean build target arguments
    required: true

runs:
  using: composite
  steps:
    - name: Restore shared Lean build cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .lake
        key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
        restore-keys: |
          lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

    - uses: leanprover/lean-action@v1
      with:
        auto-config: false
        build: true
        build-args: ${{ inputs.build-args }}
        test: false
        lint: false
        use-mathlib-cache: false
        leanchecker: false
        axiom-audit: false
        use-github-cache: false
